.rx-ind-b.one{columns:1}

/* =====================================================================
   PAUTA (pa-) e CAPTURA (cp-) · etapa 3 e 4a
   ===================================================================== */

/* ---------- PAUTA ---------- */
.pa-g{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1180px){.pa-g{grid-template-columns:minmax(0,1fr) 272px}}
.pa-main{min-width:0}
.pa-side{position:sticky;top:14px;display:flex;flex-direction:column;gap:14px;min-width:0}

.pa-tb{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;min-height:26px}
.pa-tb h3{font-size:14px}
.pa-tb .s{font-size:12px;color:var(--ink3)}
.pa-tb .sp{flex:1}
.pa-lnk,.cp-lnk{font-size:12px;font-weight:600;color:var(--ia);white-space:nowrap;padding:2px 0}
.pa-lnk:hover,.cp-lnk:hover{text-decoration:underline}
.pa-vs{width:1px;height:16px;background:var(--line)}

/* bloco */
.pa-blk{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;transition:box-shadow .14s,border-color .14s}
.pa-blk:hover{box-shadow:var(--sh2)}
.pa-blk:focus-within{border-color:#C9D3EA}
.pa-blk.pa-sig::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--green2);border-radius:var(--r) 0 0 var(--r)}
.pa-bh{display:flex;align-items:flex-start;gap:10px;padding:11px 10px 10px 14px}
.pa-blk:not(.fech) .pa-bh{border-bottom:1px solid var(--line2)}
.pa-num{flex:0 0 24px;height:24px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.pa-btw{flex:1;min-width:0}
.ed-ta.pa-bt{font-family:var(--f-head);font-weight:700;font-size:14px;line-height:1.3;color:var(--navy);letter-spacing:-.005em}
.pa-bm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:4px}
.pa-bm>span:not(.tag)+span::before{content:"·";margin-right:8px;color:var(--line)}
.pa-bm-f{display:inline-flex;align-items:center;gap:4px;color:var(--ia)}
.pa-min{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;font-size:11.5px;color:var(--ink3);margin-top:1px;padding:2px 6px 2px 7px;border-radius:6px;background:var(--surf2);border:1px solid var(--line2)}
.pa-min svg{color:var(--ink3)}
.pa-min input.ed-n{width:50px;padding:2px 4px 2px 6px}
.pa-ba{display:flex;gap:1px;flex:0 0 auto;opacity:.5;transition:opacity .12s}
.pa-blk:hover .pa-ba,.pa-ba:focus-within{opacity:1}
.pa-tgl{flex:0 0 26px}
.pa-tgl svg{transition:transform .18s}
.pa-blk.fech .pa-tgl svg{transform:rotate(-90deg)}
.pa-bb{padding:10px 14px 12px 48px}
.pa-blk.fech .pa-bb{display:none}
.ed-ta.pa-ctx{font-size:12.5px;line-height:1.5;color:var(--ink2)}
.ed-ta.pa-ctx:placeholder-shown{font-style:italic}

/* perguntas */
.pa-ql{list-style:none;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.pa-q{position:relative;display:flex;gap:8px;align-items:flex-start;padding:8px 4px 8px 10px;background:var(--surf2);border:1px solid var(--line2);border-radius:var(--r2);transition:background .12s,border-color .12s}
.pa-q:hover{border-color:var(--line)}
.pa-q:focus-within{background:var(--surf);border-color:#C9D3EA}
.pa-q.nw{animation:pa-hl 1.8s ease}
@keyframes pa-hl{0%,35%{background:var(--ialt);border-color:#C9D3EA}100%{background:var(--surf2)}}
.pa-qn{flex:0 0 28px;font-size:11px;font-weight:700;color:var(--ia2);margin-top:3px}
.pa-qb{flex:1;min-width:0}
.ed-ta.pa-qt{font-size:13px;line-height:1.45;color:var(--ink)}
.pa-qm{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pa-qm:empty{display:none}
/* excluir: único botão dentro da linha · mover: na margem à esquerda, ao passar o mouse */
.pa-q .ib.pa-qx{opacity:0;transition:opacity .12s;margin-top:-2px}
.pa-q:hover .ib.pa-qx,.pa-q:focus-within .ib.pa-qx{opacity:1}
.pa-mv{position:absolute;left:-31px;top:0;bottom:0;width:31px;padding:5px 7px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;pointer-events:none;transition:opacity .12s}
.pa-q:hover .pa-mv,.pa-q:focus-within .pa-mv{opacity:1;pointer-events:auto}
.pa-mv .ib{width:22px;height:16px;flex:0 0 16px;border-radius:4px}
.pa-mv .ib:disabled{opacity:.25}
.pa-ed,.pa-mine{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--ink3);padding:2px 0}
.pa-ed svg,.pa-mine svg{width:11px;height:11px}
.pa-ed button{font-size:10.5px;font-weight:600;color:var(--ia);text-decoration:underline;text-underline-offset:2px}
.pa-mine{color:var(--gold-ink)}
.pa-q0{font-size:12px;color:var(--ink3);padding:10px 0 2px;font-style:italic}
.pa-bf{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pa-bf .btn svg{width:12px;height:12px}
.pa-addb{width:100%;border-style:dashed;color:var(--ink2);background:transparent}
.pa-addb:hover{background:var(--surf);border-color:var(--green2);color:var(--green)}
.pa-emp-ic,.cp-emp-ic{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--ialt);color:var(--ia)}

/* resumo */
.pa-kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.pa-kp>div{background:var(--surf2);border:1px solid var(--line2);border-radius:var(--r2);padding:8px 10px}
.pa-kp b{display:block;font-family:var(--f-head);font-size:20px;font-weight:700;line-height:1.1;color:var(--ink);white-space:nowrap}
.pa-kp b small{font-size:12px;font-weight:700;color:var(--ink3)}
.pa-kp .over b small{color:var(--amber)}
.pa-kp span{font-size:11px;color:var(--ink3)}
.pa-kp .over{background:var(--amberlt);border-color:#EEDCBC}
.pa-kp .over b{color:var(--amber)}
.pa-lb{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.pa-rl{margin-bottom:14px}
.pa-rt{display:grid;grid-template-columns:38px 14px minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px dashed var(--line2)}
.pa-rt .h{color:var(--ink3);font-size:11.5px}
.pa-rt .n{color:var(--ia2);font-weight:700;font-size:10.5px;text-align:center}
.pa-rt .t{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa-rt .t i{color:var(--ink3)}
.pa-rt .m{color:var(--ink3);font-size:11px;white-space:nowrap}
.pa-rt.fim{border-bottom:0;font-weight:600}
.pa-rt.fim .h,.pa-rt.fim .t{color:var(--ink)}
.pa-rt .m.over{color:var(--amber);font-weight:600}
.pa-warn{font-size:11.5px;color:#7A4A06;background:var(--amberlt);border:1px solid #EEDCBC;border-radius:var(--r2);padding:7px 10px;margin:-6px 0 14px;line-height:1.4}
.pa-hs{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--ink2)}
.pa-hs>div{display:flex;align-items:center;gap:8px}
.pa-hs b{color:var(--ink)}
.pa-fi{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;flex:0 0 20px;color:var(--ia);background:var(--ialt);border:1px solid #C9D3EA}
.pa-fi.m{color:#7A4A06;background:var(--amberlt);border-color:#EEDCBC}
.pa-hs0{font-size:12px;color:var(--ink3)}

/* nota do copiloto */
.pa-nt{border-color:#C9D3EA}
.pa-nt .card-h{background:linear-gradient(180deg,var(--ialt),var(--surf));border-radius:var(--r) var(--r) 0 0}
.pa-ntl>.pa-nti+.pa-nti,.pa-ntl>.pa-nti+.pa-ntm:not(:empty){margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.pa-nti p{font-size:12.5px;line-height:1.55;color:var(--ink2);margin-bottom:8px}
.pa-nti p b{color:var(--ink)}

/* desfazer no toast */
.pa-undo{margin-left:10px;color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* ---------- CAPTURA ---------- */
.cp-g{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:1180px){.cp-g{grid-template-columns:minmax(0,1fr) 300px}}
.cp-notes{min-width:0;container:cpnotes/inline-size}
.cp-side{position:sticky;top:14px;display:flex;flex-direction:column;gap:14px;min-width:0}

.cp-tb{gap:10px}
.cp-tb .sp{flex:1}
.cp-prog{display:inline-flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3);white-space:nowrap}
.cp-prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.cp-bar{width:96px;display:inline-block}
.cp-bar i{background:var(--gold)}
.cp-demo{color:var(--gold-ink);background:var(--goldlt);border-color:#E4DCC2}
.cp-demo:hover{background:#EFE9D7;border-color:var(--gold)}
.cp-demo svg{width:12px;height:12px}

.cp-bl{padding:0 16px}
.cp-acc>.acc-h{gap:10px;padding:11px 0}
.cp-num{flex:0 0 22px;height:22px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.cp-bt{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-bt i{color:var(--ink3);font-weight:400}
.cp-cnt{flex:0 0 auto;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink3);background:var(--surf2);border:1px solid var(--line2);border-radius:20px;padding:0 8px;line-height:18px}
.cp-cnt.on{color:var(--gold-ink);background:var(--goldlt);border-color:#E4DCC2}
.cp-cnt.all{color:var(--green-ink);background:var(--greenlt);border-color:#BEE0D6}
.cp-bmin{flex:0 0 auto;font-size:11px;color:var(--ink3);min-width:42px;text-align:right}
.cp-acc>.acc-b{padding:0 0 10px}
.cp-q{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 4px;padding:9px 0}
.cp-q+.cp-q{border-top:1px dashed var(--line2)}
.cp-qn{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ia2);height:19px}
.cp-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid #C5CED6;flex:0 0 7px;transition:all .15s}
.cp-q.has .cp-dot{background:var(--gold);border-color:var(--gold)}
.cp-qc{min-width:0}
.cp-qt{font-size:12.5px;line-height:1.45;color:var(--ink2);margin-bottom:6px}
.ed-ta.cp-ta{font-size:12.5px;line-height:1.45;padding:6px 9px;min-height:32px}
.ed-ta.cp-ta:placeholder-shown{background:var(--surf2)}
.ed-ta.cp-ta:focus{background:var(--surf)}
.cp-q.has .ed-ta.cp-ta{border-color:#E4DCC2;background:var(--surf)}
.cp-q.has .ed-ta.cp-ta:focus{border-color:var(--ia);background:var(--surf)}
.cp-q0{font-size:12px;color:var(--ink3);font-style:italic;padding:6px 0 4px 44px}

.cp-gr{padding:12px 16px 14px;border-top:1px solid var(--line2)}
.cp-gr-h{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.cp-gr-h b{font-size:12.5px;color:var(--ink)}
.cp-gr-h span{font-size:11.5px;color:var(--ink3)}
.cp-ft{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line2);background:var(--surf2);border-radius:0 0 var(--r) var(--r)}
.cp-ft .sp{flex:1}
.cp-ft .btn svg{width:13px;height:13px}
.cp-mu{font-size:12px;color:var(--ink3)}
.cp-sv-ok{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green-ink)}
.cp-sv-no{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--amber)}
.cp-sv-no i{width:7px;height:7px;border-radius:50%;background:var(--amber)}

/* gravação */
.cp-drop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:18px 14px 16px;border:1.5px dashed #C5CED6;border-radius:var(--r);background:var(--surf2);transition:border-color .15s,background .15s}
.cp-drop.on{border-color:var(--green2);background:var(--greenlt)}
.cp-drop-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--surf);border:1px solid var(--line);color:var(--green);margin-bottom:6px}
.cp-drop b{font-size:13px;color:var(--ink)}
.cp-drop>span:not(.cp-drop-ic){font-size:11.5px;color:var(--ink3)}
.cp-drop-b{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.cp-file{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 10px;border:1px solid #BEE0D6;background:var(--greenlt);border-radius:var(--r2)}
.cp-file-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:7px;background:var(--surf);color:var(--green);flex:0 0 32px;border:1px solid #BEE0D6}
.cp-file-t{flex:1;min-width:0}
.cp-file-t b{display:block;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-file-t>span{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cp-cons{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.45;color:var(--ink2);margin-top:11px}
.cp-cons svg{flex:0 0 auto;color:var(--green-ink);width:13px;height:13px;margin-top:1px}
.cp-fut{display:flex;gap:8px;align-items:center;font-size:11px;line-height:1.4;color:var(--ink3);margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.cp-fut .tag{flex:0 0 auto}

/* processamento */
.cp-in{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
.cp-ir{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.cp-ir .ck{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;flex:0 0 18px;border:1.5px solid #C5CED6;color:#fff}
.cp-ir .ck svg{width:11px;height:11px}
.cp-ir.ok .ck{background:var(--green2);border-color:var(--green2)}
.cp-ir .lb{font-weight:600;color:var(--ink);flex:0 0 auto}
.cp-ir .v{flex:1;min-width:0;text-align:right;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-full{width:100%}
.cp-hint{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:8px;line-height:1.4}
.cp-steps{margin:2px 0 12px}
.cp-steps:empty{display:none}
.cp-steps .prc{padding:8px 0}
.cp-steps .prc .st{flex:0 0 20px;height:20px}
.cp-steps .prc .st svg{width:11px;height:11px}
.cp-steps .prc .st .spin{width:9px;height:9px;flex-basis:9px;border-width:1.5px}
.cp-steps .prc b{font-size:12px}
.cp-steps .prc span{font-size:11px}
.cp-ok{margin:0 0 12px;padding:10px 12px;border-radius:var(--r2);background:var(--greenlt);border:1px solid #BEE0D6}
.cp-ok[hidden]{display:none}
.cp-ok-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--green-ink);margin-bottom:6px}
.cp-ok-h svg{width:13px;height:13px}
.cp-ok-r{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:3px 0;min-width:0}
.cp-ok-r span{color:var(--ink2);flex:0 0 auto}
.cp-ok-r b{flex:1;min-width:0;text-align:right;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-dirty{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;border-radius:var(--r2);background:var(--amberlt);border:1px solid #EEDCBC;font-size:11.5px;color:#7A4A06}
.cp-dirty[hidden]{display:none}
.cp-mu2{font-size:11px;color:var(--ink3);margin-top:9px;text-align:center;line-height:1.4}

/* cartão de anotações estreito (1280 com menu aberto): barra de progresso some para a toolbar caber numa linha */
@container cpnotes (max-width:700px){.cp-bar,.cp-pg-g{display:none}}

/* tela baixa: a coluna lateral rola junto, para nada ficar escondido abaixo da dobra */
@media(max-height:860px){.pa-side,.cp-side{position:static}}

.pa-lbs{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink3);margin-left:4px;font-size:10.5px}

/* =====================================================================
   4b · CONVERSA REGISTRADA (rn-) e 5 · DIAGNÓSTICO E FCA (fc-)
   ===================================================================== */

/* ---------- compartilhado: barra de ação fixa no rodapé ---------- */
.rn-bar{position:sticky;bottom:14px;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;
  padding:10px 12px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2)}
.rn-bar-m{flex:1;min-width:220px;font-size:12.5px;color:var(--ink2)}
.rn-bar-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.rn-bar .btn-ai.solid{padding:8px 14px}
.rn-eic{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--ialt);color:var(--ia)}
.rn-none{padding:22px 10px;text-align:center;font-size:12.5px;color:var(--ink3)}
.rn-undo{margin-left:8px;color:var(--surf);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.rn-hint{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);white-space:nowrap}
.rn-n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--line2);color:var(--ink3);font-size:10.5px;font-variant-numeric:tabular-nums;text-align:center}
.seg button.on .rn-n{background:var(--greenlt);color:var(--green-ink)}
.rn-card+.rn-card{margin-top:16px}
.rn-card .card-h .sub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn-lock{display:flex;gap:10px;align-items:center;padding:10px 13px;margin-bottom:14px;border-radius:var(--r2);background:var(--greenlt);border:1px solid color-mix(in srgb,var(--green2) 28%,var(--surf));font-size:12.5px;color:var(--ink2)}
.rn-lock svg{color:var(--green-ink);flex:0 0 auto}
@keyframes rnflash{0%,35%{background:var(--ialt);box-shadow:0 0 0 6px var(--ialt)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.rn-flash{animation:rnflash 1.8s ease;border-radius:6px}

/* ---------- 4b · cabeçalho da transcrição ---------- */
.rn-meta{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--ink2)}
.rn-meta>span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.rn-meta svg{color:var(--ink3);flex:0 0 auto}
.rn-meta b{color:var(--ink);font-weight:600}
.rn-mr{color:var(--ink3)}

/* linha do tempo: quem falou + compromissos + anotações */
.rn-tl{padding:10px 16px 6px;border-bottom:1px solid var(--line2);background:var(--surf2)}
.rn-tl-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.rn-tl-t{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-right:auto}
.rn-lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);white-space:nowrap}
.rn-lg i{display:inline-block;width:12px;height:6px;border-radius:2px}
.rn-lg i.rg{background:var(--green2)} .rn-lg i.ag{background:var(--blue);opacity:.7}
.rn-lg i.d{width:8px;height:8px;border-radius:2px;transform:rotate(45deg)}
.rn-lg i.d.fca{background:var(--green)} .rn-lg i.d.reg{background:color-mix(in srgb,var(--ink3) 55%,var(--surf))}
.rn-lg i.c{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.rn-tl-r{position:relative;height:14px;margin:0 6px}
.rn-tl-b{position:relative;height:10px;margin:2px 6px;border-radius:3px;background:var(--line2);overflow:hidden}
.rn-sp{position:absolute;top:0;bottom:0;padding:0;box-shadow:inset -1px 0 0 var(--surf);cursor:pointer}
.rn-sp.rg{background:var(--green2);opacity:.8} .rn-sp.ag{background:var(--blue);opacity:.55}
.rn-sp:hover{opacity:1}
.rn-mk{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:2px;transform:rotate(45deg);border:1.5px solid var(--surf);box-shadow:0 1px 2px rgba(12,30,44,.3);padding:0;cursor:pointer;transition:transform .12s}
.rn-mk.fca{background:var(--green)} .rn-mk.reg{background:color-mix(in srgb,var(--ink3) 55%,var(--surf))}
.rn-mk.an{border-radius:50%;transform:none;background:var(--gold)}
.rn-mk:hover{transform:rotate(45deg) scale(1.35);z-index:2} .rn-mk.an:hover{transform:scale(1.35)}
.rn-tl-x{position:relative;height:14px;margin:2px 6px 0;font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.rn-tl-x span{position:absolute;top:0;transform:translateX(-50%)}
.rn-tl-x span:first-child{transform:none}
.rn-tl-x span.end{transform:translateX(-100%);font-weight:600;color:var(--ink2)}

/* transcrição */
.rn-trs{position:relative;max-height:470px;overflow-y:auto;padding:6px 16px 10px;scroll-behavior:smooth}
.rn-trs .msg{animation:none;padding:8px 6px;margin:0 -6px}
.rn-msg .who{min-height:22px}
.rn-trs .msg.hl .tx{background:var(--greenlt);border-left-color:var(--green2)}
.rn-msg .tx mark{background:color-mix(in srgb,var(--gold) 40%,var(--surf));color:inherit;border-radius:2px;padding:0 1px}
.rn-fa{margin-left:auto;opacity:0;transition:opacity .12s}
.rn-fa .ib{width:22px;height:22px;flex-basis:22px}
.rn-msg:hover .rn-fa,.rn-fa:focus-within{opacity:1}
.rn-edt{font-size:10px;font-weight:600;color:var(--gold-ink);background:var(--goldlt);padding:0 6px;border-radius:4px}
.rn-fx{margin-top:2px;font-size:13px;line-height:1.55}
.rn-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.rn-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid color-mix(in srgb,var(--green2) 28%,var(--surf));background:var(--greenlt);color:var(--green-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn-chip.reg{border-color:var(--line);background:var(--surf2);color:var(--ink2)}
.rn-chip:hover{border-color:var(--green2)}
/* anotação do regional encaixada */
.rn-note{align-items:flex-start;margin-right:4px}
.rn-nb{flex:1;min-width:0}
.rn-note .nh{text-transform:none;letter-spacing:0;font-weight:400;font-size:11px;min-width:0}
.rn-nk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.rn-nq{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold-ink)}
.rn-nt{margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums;color:var(--gold-ink);font-weight:600}
.rn-note .ed-ta{font-size:12.5px;color:var(--ink);line-height:1.45}
.rn-note .ed-ta:hover{background:rgba(255,255,255,.7)}
.rn-ntx{font-size:12.5px;color:var(--ink);line-height:1.45}
.rn-note>.ib{flex:0 0 22px;width:22px;height:22px;opacity:0;margin-top:-2px}
.rn-note:hover>.ib,.rn-note>.ib:focus{opacity:1}
.rn-ol .note-b{margin-left:0}

/* ---------- 4b · candidatos a FCA e registros ---------- */
.rn-its{padding:14px 16px 16px}
.rn-it{border:1px solid var(--line);border-left:3px solid var(--green2);border-radius:var(--r);background:var(--surf);margin-bottom:10px;transition:box-shadow .14s}
.rn-it:hover{box-shadow:var(--sh)}
.rn-it.reg{border-left-color:color-mix(in srgb,var(--ink3) 40%,var(--surf));background:linear-gradient(180deg,var(--surf2),var(--surf) 60px)}
.rn-it-h{display:flex;align-items:center;gap:10px;padding:11px 14px 4px;flex-wrap:wrap}
.rn-ty{flex:0 0 auto}
.rn-tm{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ia);padding:2px 7px;border-radius:4px;background:var(--ialt);font-variant-numeric:tabular-nums}
.rn-tm:hover{background:color-mix(in srgb,var(--ia) 13%,var(--surf))}
.rn-tm svg{width:11px;height:11px}
.rn-new{font-size:11px;font-weight:600;color:var(--gold-ink);background:var(--goldlt);padding:2px 7px;border-radius:4px;white-space:nowrap}
.rn-tema{flex:1;min-width:180px;font-family:var(--f-head);font-size:14px;font-weight:700;color:var(--ink)}
.rn-tema .ed-in{font-weight:700;font-family:var(--f-head);font-size:14px}
.rn-chg{font-size:10.5px;font-weight:600;color:var(--gold-ink);border:1px dashed var(--gold);padding:1px 7px;border-radius:20px;white-space:nowrap}
.rn-pd{font-size:10.5px;font-weight:600;color:var(--amber);background:var(--amberlt);padding:1px 7px;border-radius:20px;white-space:nowrap}
.rn-sw{white-space:nowrap}
.rn-sw svg{width:12px;height:12px}
.rn-it-b{display:grid;grid-template-columns:minmax(0,1fr) 200px 150px;gap:12px;padding:6px 14px 10px;align-items:start}
@media(max-width:1180px){.rn-it-b{grid-template-columns:minmax(0,1fr) 170px 128px}}
@media(max-width:980px){.rn-it-b{grid-template-columns:1fr 1fr}.rn-it-b .rn-fx{grid-column:1/-1}}
.rn-f{display:block;min-width:0}
.rn-f>span:first-child{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.rn-f .ed-box{font-size:13px;padding:6px 9px}
.rn-f textarea.ed-box{line-height:1.5;min-height:58px}
.rn-f .rn-req:placeholder-shown{border-style:dashed;border-color:color-mix(in srgb,var(--amber) 40%,var(--surf));background:var(--amberlt)}
.rn-ro{display:block;font-size:13px;color:var(--ink);font-weight:500;line-height:1.5}
.rn-it .acc.rn-why{margin:0 14px;border-top:1px dashed var(--line2);border-bottom:0}
.acc.rn-why>.acc-h{padding:8px 0;font-size:11.5px;font-weight:600;color:var(--ia);gap:6px}
.rn-why>.acc-h svg:first-child{color:var(--ia)}
.acc.rn-why>.acc-b{padding:0 0 12px}
.rn-rz{font-size:12px;line-height:1.5;color:var(--ink2);background:var(--surf2);border:1px solid var(--line2);border-radius:var(--r2);padding:8px 10px}
.rn-rz b{color:var(--ink)}
.rn-add,.fc-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border:1.5px dashed var(--line);border-radius:var(--r);font-size:12.5px;font-weight:600;color:var(--green-ink);background:transparent}
.rn-add:hover,.fc-add:hover{border-color:var(--green2);background:var(--greenlt)}

/* =====================================================================
   5 · DIAGNÓSTICO E FCA
   ===================================================================== */
.fc-st{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 12px;margin:-4px 0 14px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.fc-st .st-line{min-width:0;flex:0 1 auto}
.fc-st .sp{flex:1}
.fc-id{font-size:12px;font-weight:700;color:var(--green-ink);background:var(--greenlt);padding:2px 8px;border-radius:4px;white-space:nowrap}
.fc-nc{color:var(--amber)!important}
.fc-ver{display:inline-flex;align-items:center;gap:8px}
.fc-ver>span{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.fc-as{display:flex;align-items:center;gap:9px;padding:9px 13px;margin-bottom:14px;border-radius:var(--r2);background:var(--bluelt);border:1px solid color-mix(in srgb,var(--ia) 20%,var(--surf));font-size:12.5px;color:var(--ink2)}
.fc-as svg{color:var(--blue);flex:0 0 auto}
.fc-ainote,.rn-ainote{text-align:center;margin-top:10px}

/* menu exportar */
.fc-exp{position:relative}
.fc-exp .btn svg:last-child{margin-left:-2px;opacity:.7}
.fc-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);min-width:170px;z-index:60;background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh2);padding:4px}
.fc-exp.open .fc-menu{display:block;animation:fadein .14s ease}
.fc-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:4px;font-size:12.5px;text-align:left;color:var(--ink)}
.fc-menu button:hover{background:var(--surf2)}
.fc-menu svg{color:var(--ink3)}

/* 1 · compromissos aprovados */
.fc-comp{margin-bottom:14px}
.fc-comp .card-h{padding:11px 16px}
.fc-comp-b{padding:0 16px 4px}
.fc-lnk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ia);white-space:nowrap;padding:3px 6px;border-radius:4px}
.fc-lnk:hover{background:var(--ialt)}
.acc.fc-c>.acc-h{gap:10px;padding:9px 0;flex-wrap:nowrap}
.fc-ct{flex:0 0 42px;font-size:11px;font-weight:600;color:var(--ia)}
.fc-cn{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-cm{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.fc-cm i{display:inline-block;width:1px;height:11px;background:var(--line);margin:0 3px}
.fc-cm svg{width:12px;height:12px}
.fc-cc{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ia);background:var(--ialt);padding:1px 6px;border-radius:10px}
.fc-cc svg{width:11px;height:11px}
.acc.fc-c>.acc-b{padding:0 0 12px 52px}
.fc-ctx{font-size:12.5px;line-height:1.5;color:var(--ink2);margin-bottom:8px}
.fc-cl{margin:2px 0 8px 16px;font-size:12px;color:var(--ink2);line-height:1.5}
.fc-rz{font-size:11.5px;line-height:1.45;color:var(--ink3);background:var(--surf2);border:1px solid var(--line2);border-radius:5px;padding:7px 9px}
.fc-rz b{color:var(--ink2)}
.fc-cact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.fc-cact .btn svg{width:12px;height:12px}
.acc.fc-reg>.acc-h{padding:9px 0;color:var(--ink3);font-size:12.5px}
.fc-regh{display:inline-flex;align-items:center;gap:8px;min-width:0}
.fc-regh svg{color:var(--ink3);flex:0 0 auto}
.fc-regh b{color:var(--ink)}
.acc.fc-reg>.acc-b{padding:0 0 12px 52px}
.fc-ri{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:4px 12px;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12px;align-items:baseline}
.fc-ri:last-child{border-bottom:0}
.fc-ri b{color:var(--ink);font-weight:600}
.fc-ri span{color:var(--ink2);line-height:1.45}
.fc-ri em{font-style:normal;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--amber);background:var(--amberlt);padding:1px 7px;border-radius:10px;white-space:nowrap}
.fc-ri em svg{width:11px;height:11px}
@media(max-width:1080px){.fc-ri{grid-template-columns:minmax(0,1fr) auto}.fc-ri span{grid-column:1/-1}}
.fc-dirty{display:flex;gap:9px;align-items:center;padding:9px 16px;background:var(--amberlt);border-bottom:1px solid color-mix(in srgb,var(--amber) 22%,var(--surf));font-size:12px;color:var(--amber)}
.fc-dirty svg{color:var(--amber);flex:0 0 auto}
.fc-none{padding:14px 0;font-size:12.5px;color:var(--ink3)}

/* 2 · FCA estruturado */
.fc-main .card-h .sub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-dx{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line2);background:var(--surf2)}
.fc-dxl{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:10px 6px;border-left:1px solid var(--line2);text-align:center}
.fc-dxi{flex:1;min-width:0;padding:10px 14px;border-right:1px solid var(--line2)}
.fc-dxi:last-child{border-right:0}
.fc-dxi span{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-dxi b{display:block;font-family:var(--f-head);font-size:16px;font-weight:700;color:var(--ink);line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.fc-dxi small{display:block;font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-body{padding:14px 16px 16px}
.fc-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.fc-blk{min-width:0}
.fc-sh{display:flex;align-items:center;gap:8px;margin:0 0 6px;min-height:24px}
.fc-sh .sp{flex:1}
.fc-body>.fc-sh{margin-top:18px}
.fc-lb{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:inline-flex;align-items:center;gap:6px}
.fc-cnt{display:inline-block;padding:0 6px;border-radius:9px;background:var(--line2);color:var(--ink2);letter-spacing:0}
.fc-body textarea.ed-box{font-size:13px;line-height:1.55;padding:8px 10px}
.fc-ro{font-size:13px;line-height:1.55;color:var(--ink);white-space:pre-wrap}
.fc-ro i{color:var(--amber);font-style:normal;font-weight:600;font-size:12px}
.fc-nt{display:flex;gap:6px;align-items:flex-start;margin-top:7px;font-size:11.5px;color:var(--gold-ink);line-height:1.45}
.fc-nt svg{flex:0 0 auto;margin-top:1px}
.fc-nt button{color:var(--ia);font-weight:600;font-variant-numeric:tabular-nums;text-decoration:underline;text-underline-offset:2px}
.fc-pd{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--amber);letter-spacing:0;text-transform:none}
.fc-pd svg{width:12px;height:12px}
.fc-pdt{color:var(--amber);font-weight:600}

/* tabela de ações */
.fc-tw{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.fc-t{table-layout:fixed}
.fc-t th{padding:8px 10px}
.fc-t td{padding:8px 10px;vertical-align:top}
.fc-t tbody tr:hover{background:transparent}
.fc-t tr.fc-hot>td{background:color-mix(in srgb,var(--goldlt) 55%,var(--surf))}
.fc-t tr.fc-hot>td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.fc-t .ed-box{font-size:12.5px;padding:5px 8px;line-height:1.45}
.fc-t textarea.ed-box{min-height:32px}
.fc-t .fc-req:placeholder-shown{border-style:dashed;border-color:color-mix(in srgb,var(--amber) 40%,var(--surf));background:var(--amberlt)}
.fc-t .fc-ro{font-size:12.5px;line-height:1.45;display:block;padding-top:2px}
.fc-n{color:var(--ink3);font-size:11.5px;font-weight:600;padding-top:13px!important}
.fc-src{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px;font-size:10.5px;color:var(--ink3)}
.fc-src svg{width:10px;height:10px}
.fc-aj{margin-left:6px;font-weight:600;color:var(--gold-ink);background:var(--goldlt);padding:0 6px;border-radius:4px}
.fc-ac{text-align:right;white-space:nowrap}
.fc-ac .ib,.fc-ac .cmt-btn{vertical-align:middle}
.fc-trow>td{padding-top:0!important;background:color-mix(in srgb,var(--goldlt) 55%,var(--surf))}
.fc-trow .cmt{margin-top:0;border-top:0;padding-top:2px}
.fc-add{margin-top:10px;padding:8px}
.fc-add.sm{width:auto;display:inline-flex;padding:6px 12px;margin-top:4px}

/* meta e indicador */
.fc-meta{row-gap:12px}
.fc-f{display:block;min-width:0}
.fc-f>span:first-child{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.fc-f .ed-box{font-size:13px;padding:7px 10px}
.fc-ind{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:34px}
.fc-ind .sel select{max-width:240px;font-size:13px;padding:6px 26px 6px 10px}
.fc-spk{display:inline-flex;padding:3px 6px;border:1px solid var(--line2);border-radius:5px;background:var(--surf2)}
.fc-iv{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.fc-iv b{color:var(--ink)}
.fc-pz .ed-box{max-width:180px}

/* comentários */
.fc-cmt{margin-top:10px}
.fc-cmt .cmt-i .bx{min-width:0}
.fc-cmt .cmt-i .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fc-cmt .cmt-i .who span{margin-left:0}
.fc-tg{font-size:9.5px}
.fc-res .bx{opacity:.7}
.fc-cin{align-items:flex-start}
.fc-avi{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--surf);background:var(--blue)}
.fc-avi.rg{background:var(--green)}
.fc-cin textarea{font-size:12.5px;padding:6px 9px}
.fc-cin-b{display:flex;flex-direction:column;gap:5px}
.fc-sh .cmt-btn svg,.fc-ac .cmt-btn svg,.fc-cact .cmt-btn svg,.fc-sm .cmt-btn svg{width:13px;height:13px}

/* 3 · síntese recolhível */
.acc.fc-acc{margin-top:14px;border-radius:var(--r);box-shadow:var(--sh)}
.fc-acc>.acc-h{padding:13px 16px;gap:10px}
.fc-acc-t{font-family:var(--f-head);font-weight:700;font-size:13.5px;color:var(--navy)}
.fc-acc-s{font-size:11.5px;color:var(--ink3)}
.fc-acc-h{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ia)}
.fc-acc-h+.chev{margin-left:0}
.fc-acc .fc-acc-h .o{display:none}
.fc-acc.open .fc-acc-h .o{display:inline} .fc-acc.open .fc-acc-h .c{display:none}
.fc-acc>.acc-b{padding:12px 16px 16px}
.fc-acc .fc-lb{display:flex;margin:14px 0 6px}
.fc-sm{gap:6px 16px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.fc-sm .sp{flex:1}
.fc-dl{border:1px solid var(--line2);border-radius:var(--r2)}
.fc-d{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--line2)}
.fc-d:last-child{border-bottom:0}
.fc-dt{flex:0 0 96px;font-size:11.5px;color:var(--ia);padding-top:1px}
.fc-dt .ed-in{font-size:11.5px;color:var(--ia);font-weight:600}
.fc-dx2{flex:1;min-width:0;font-size:13px;line-height:1.5;color:var(--ink)}
.fc-d>.ib{opacity:.55}
.fc-d:hover>.ib{opacity:1}

/* modal de publicação */
.fc-mb{font-size:13px;line-height:1.55;color:var(--ink2)}
.fc-mb p+*{margin-top:12px}
.fc-ms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fc-ms div{padding:10px 12px;background:var(--surf2);border:1px solid var(--line2);border-radius:var(--r2)}
.fc-ms span,.fc-mm span{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.fc-ms b{font-family:var(--f-head);font-size:18px;color:var(--ink)}
.fc-mm{margin-top:10px;padding:10px 12px;border-left:3px solid var(--green2);background:var(--greenlt);border-radius:0 6px 6px 0;color:var(--ink)}
.fc-pw{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:9px 12px;border-radius:var(--r2);background:var(--amberlt);border:1px solid color-mix(in srgb,var(--amber) 22%,var(--surf));color:var(--amber);font-size:12.5px}
.fc-pw svg{color:var(--amber);flex:0 0 auto;margin-top:2px}
.fc-mn{font-size:12px;color:var(--ink3);margin-top:12px}

/* origem da ação: horário clicável abre o trecho da conversa */
.fc-tb{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ia);padding:0 5px;border-radius:4px;background:var(--ialt);font-variant-numeric:tabular-nums}
.fc-tb:hover{background:color-mix(in srgb,var(--ia) 13%,var(--surf))}
.fc-tb svg{width:10px;height:10px}
.fc-src>span{min-width:0}

/* ideias da transcrição (recolhidas) */
.acc.fc-ies{margin-top:10px;border:1px dashed color-mix(in srgb,var(--ia) 20%,var(--surf));border-radius:var(--r2);background:color-mix(in srgb,var(--ialt) 40%,var(--surf))}
.acc.fc-ies>.acc-h{padding:8px 12px;gap:10px}
.acc.fc-ies>.acc-h:hover{background:var(--ialt)}
.acc.fc-ies>.acc-b{padding:0 12px 6px}
.fc-ie-h{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);min-width:0}
.fc-ie-h svg{color:var(--ia);flex:0 0 auto}
.fc-ie-h b{color:var(--ink)}
.fc-ie{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px dashed var(--line2)}
.fc-ie .fc-tb{margin-top:2px;flex:0 0 auto}
.fc-ie-b{flex:1;min-width:0;font-size:12.5px;line-height:1.45;color:var(--ink)}
.fc-ie-b q{display:block;font-style:italic;color:var(--ink3);font-size:12px;margin-bottom:2px}
.fc-ie-a{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.fc-ie-a .btn svg{width:12px;height:12px}

/* drawer do trecho da conversa */
.dw .fc-dwm{animation:none;padding:9px 8px;margin:0 -8px;border-radius:6px}
.dw .fc-dwm.on{background:var(--ialt)}
.dw .fc-dwm.on .tx{color:var(--ink)}
.dw .fc-dwn{margin:2px 0 8px 40px}

/* =====================================================================
   54 · ACOMPANHAMENTO (pl-), RESULTADO (rs-) e VISÕES EXTRAS (ex-)
   ===================================================================== */

/* ---------- comum ---------- */
.pl-mut,.ex-mut{color:var(--ink3);font-size:11.5px}
.pl-snap{display:inline-flex;align-items:center;gap:7px;padding:5px 9px 5px 10px;border-radius:20px;background:var(--goldlt);
  border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);font-size:12px;color:var(--ink2);white-space:nowrap}
.pl-snap svg{color:var(--gold-ink);flex:0 0 auto}
.pl-snap b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- alerta de prazo ---------- */
.pl-alert{border:1px solid color-mix(in srgb,var(--red) 28%,transparent);background:var(--redlt);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.pl-alert-h{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;color:var(--red);font-size:12.5px;flex-wrap:wrap}
.pl-alert-h b{color:var(--red)}
.pl-alert-h span{color:var(--ink3);font-size:11.5px}
.pl-alert-r{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;
  padding:8px 14px;border-top:1px solid color-mix(in srgb,var(--red) 14%,transparent);background:color-mix(in srgb,var(--surf) 55%,transparent);font-size:12.5px}
.pl-alert-r:hover{background:var(--surf)}
.pl-alert-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl-alert-r .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.pl-alert-r .tx b{color:var(--ink)}
.pl-alert-r .q{color:var(--ink3);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pl-alert-f{padding:8px 14px 10px;border-top:1px solid color-mix(in srgb,var(--red) 14%,transparent);font-size:11.5px;color:var(--red)}

/* ---------- tabela de ações ---------- */
.pl-acoes{overflow:hidden}
.pl-hd,.pl-row{display:grid;grid-template-columns:22px minmax(0,1fr) 112px 56px 66px 124px 108px;gap:12px;align-items:center;padding:0 16px}
.pl-hd{padding-top:8px;padding-bottom:8px;background:var(--surf2);border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:700;white-space:nowrap}
.pl-hd .r,.pl-p,.pl-o{text-align:right}
.pl-row{padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .12s}
.pl-row:last-child{border-bottom:0}
.pl-row:hover{background:var(--surf2)}
.pl-row:focus-visible{outline:2px solid var(--ia);outline-offset:-2px;border-radius:0}
.pl-ck{width:20px;height:20px;border-radius:5px;border:1.5px solid #C5CED6;display:grid;place-items:center;color:#fff;background:var(--surf);transition:all .14s}
.pl-ck:hover{border-color:var(--green2)}
.pl-ck.on{background:var(--green2);border-color:var(--green2)}
.pl-ck svg{width:13px;height:13px}
.pl-a{min-width:0}
.pl-a .tt{display:flex;gap:8px;font-size:13px;font-weight:500;line-height:1.4;color:var(--ink)}
.pl-num{flex:0 0 18px;height:18px;border-radius:4px;background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink3);margin-top:1px}
.pl-row.done .tt>span:last-child{text-decoration:line-through;color:var(--ink3)}
.pl-a .mt{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:5px 0 0 26px;font-size:11px;color:var(--ink3)}
.pl-meta{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-a .evd svg{width:11px;height:11px;flex:0 0 auto}
.pl-a .evd{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-a .cmt-btn{padding:1px 4px}
.pl-q{font-size:12px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.pl-p{font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.pl-p s{font-size:10.5px;color:var(--ink3)}
.pl-o{font-size:12px;color:var(--ink2)}
.pl-v{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.pl-v .tag svg{width:10px;height:10px}
.pl-x{display:flex;align-items:center;gap:8px}
.pl-x .bar{flex:1}
.pl-x .mono{font-size:11px;color:var(--ink2);width:30px;text-align:right}

/* ---------- gráfico e metas ---------- */
.pl-g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;margin-top:14px}
.pl-lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--ink3)}
.pl-lg span{display:inline-flex;align-items:center;gap:6px}
.pl-lg .ln{display:inline-block;width:16px;height:0;border-top:2px solid var(--green2)}
.pl-lg .ln.pj{border-top:2px dashed var(--ia)}
.pl-lg .ln.fc{border-top:2px dashed var(--gold)}

.rs-v.ia .rs-vi{color:var(--ia)}
.rs-lk{margin-top:5px;font-size:12px;font-weight:600;color:var(--green-ink);padding:0}

/* ---------- liderança ---------- */

.ex-cr b{display:block;font-size:12.5px;color:var(--ink)}
.ex-cr span{font-size:11.5px;color:var(--ink3)}
.ex-min{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:11px 13px;background:var(--surf2);border-radius:var(--r2);border:1px solid var(--line2)}

.ex-min .bd b{font-size:12.5px;display:block;color:var(--ink)}
.ex-min .bd span{font-size:11.5px;color:var(--ink3)}
.ex-de{font-size:12px;color:var(--ink3)}
.ex-cv{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.5}

.ex-cv.wn{color:var(--amber)}
.ex-cv.wn b{color:var(--amber)}

.ex-an{font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.45}

.ex-wc>div{min-width:0}
.wc-c .n.ex-sm{font-size:9.5px}
.ex-wf{font-size:11.5px;color:var(--ink3);margin-top:12px;line-height:1.5}
.ex-bc{font-size:10.5px;font-weight:700;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}

.ex-bl:not(:first-child){margin-top:14px}
.ex-bs{margin-bottom:9px;cursor:pointer}

.ex-bh span:not(.tag){font-size:11px;color:var(--ink3)}
.ex-bp{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:11px 13px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);
  background:var(--amberlt);font-size:12.5px;color:var(--ink2);line-height:1.5}
.ex-bp:hover{border-color:var(--amber)}
.ex-bp-i{flex:0 0 28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surf);color:var(--amber)}
.ex-bp-t{flex:1;min-width:0}
.ex-bp-t b{color:var(--ink)}
.ex-bp-a{font-size:12px;font-weight:600;color:var(--amber);white-space:nowrap}

.pl-rbar{height:7px;margin-top:2px}


/* =========================================================================
   v8 · organização por agência
   ========================================================================= */
/* --- barra lateral: visão geral + agências por regional --- */
.cyc::before{display:none}
.nav-scroll{padding-top:8px}
.nav-x{padding-left:18px}
.nav-ag{padding:5px 14px 5px 20px;font-size:12.5px;gap:10px}
.nav-ag .ag-d{flex:0 0 8px;height:8px;border-radius:50%;font-size:0;overflow:hidden;background:var(--side-mut2)}
.ag-d.critico{background:#E0675C}.ag-d.atencao{background:#E0A43A}.ag-d.oportunidade{background:#8FA9E0}.ag-d.ok{background:#4FC49B}
.nav-ag .ag-p{flex:0 0 7px;height:7px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 0 3px rgba(185,165,87,.25)}
.app.collapsed .nav-ag{padding:3px 0}
.app.collapsed .nav-ag .ag-d{flex:0 0 30px;height:30px;font-size:10px;font-weight:700;letter-spacing:.02em;display:grid;place-items:center;
  background:var(--side-n);color:var(--side-n-ink);border:2px solid var(--side-mut2)}
.app.collapsed .nav-ag .ag-d.critico{border-color:#E0675C}.app.collapsed .nav-ag .ag-d.atencao{border-color:#E0A43A}
.app.collapsed .nav-ag .ag-d.oportunidade{border-color:#8FA9E0}.app.collapsed .nav-ag .ag-d.ok{border-color:#4FC49B}
.app.collapsed .nav-ag.on .ag-d{background:var(--gold-hi);color:var(--side-2)}
.app.collapsed .nav-ag .ag-p{position:absolute;top:2px;left:calc(50% + 9px)}
.app.collapsed .nav-x{padding-left:0}
.ctx-ff{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}

/* --- faixas de cor da Unicred (atingimento contra o orçado ou a meta) --- */
.fx{display:inline-block;padding:1px 7px;border-radius:4px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;line-height:18px}
.fx.fx-neg{background:#F2C9C4;color:#8A2219}.fx.fx-low{background:#F7D9BF;color:#8A4A0E}
.fx.fx-mid{background:#F6E9B4;color:#6B5A12}.fx.fx-hi{background:#CDEBD9;color:#0F6B45}
.fx-sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.fx-sw.fx-neg{background:#E7A49C}.fx-sw.fx-low{background:#F0BC8E}.fx-sw.fx-mid{background:#EBD77F}.fx-sw.fx-hi{background:#8FD3AE}
.gv-ix{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.gv-ix.ruim{color:var(--red)}.gv-ix.atencao{color:var(--amber)}
.gv-ix-sw{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.gv-ix-sw.ruim{background:var(--red)}.gv-ix-sw.atencao{background:var(--amber)}

/* --- visão geral --- */
.gv-fb .gv-st{gap:6px}
.gv-fb .gv-st::before{content:"";width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.gv-st.critico::before{background:var(--red)}.gv-st.atencao::before{background:var(--amber)}.gv-st.oportunidade::before{background:var(--ia)}.gv-st.ok::before{background:var(--green2)}
.gv-main{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr)}
@media(max-width:1180px){.gv-main{grid-template-columns:minmax(0,1fr)}}
.gv-tw{overflow-x:auto}
.gv-t{width:100%;border-collapse:collapse;font-size:12.5px}
.gv-t th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--line2);line-height:1.25;vertical-align:bottom;background:var(--surf2)}
.gv-t th.on{color:var(--navy)}
.gv-t th.on::after{content:" ▾"}
.gv-t td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.gv-t tbody tr{cursor:pointer;transition:background .12s}
.gv-t tbody tr:hover{background:var(--surf2)}
.gv-t tbody tr:focus-visible{outline:2px solid var(--ia);outline-offset:-2px}
.gv-ag{display:flex;align-items:center;gap:9px;min-width:200px}
.gv-ag .ag-d{flex:0 0 9px;height:9px;border-radius:50%}
.gv-ag .ag-d.critico{background:var(--red)}.gv-ag .ag-d.atencao{background:var(--amber)}.gv-ag .ag-d.oportunidade{background:var(--ia)}.gv-ag .ag-d.ok{background:var(--green2)}
.gv-n{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.gv-n b{font-size:13px;color:var(--ink)}
.gv-n small{font-size:11px;color:var(--ink3);white-space:nowrap}
.gv-n em{color:var(--gold-ink);font-style:normal;font-weight:600}
.gv-c{white-space:nowrap}
.gv-c small{display:block;font-size:10.5px;font-family:var(--f-num);margin-top:1px}
.gv-c small.dn,.gv-pg .dn,.ag-km .dn,.dre .dn,.dre-x .dn{color:var(--red)}
.gv-c small.up,.ag-km .up,.dre .up,.dre-x .up{color:var(--green-ink)}
.gv-sc{display:flex;align-items:center;gap:7px}
.gv-sc b{min-width:20px;text-align:right}
.gv-sc i{width:30px;height:5px;border-radius:3px;background:var(--line2);position:relative;overflow:hidden}
.gv-sc i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c);border-radius:3px}
.gv-fc{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);font-weight:600;position:relative}
.gv-fc i{width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:2px}
.gv-pg{font-size:12px;line-height:1.3;min-width:170px}
.gv-pg b{display:block;font-weight:600;color:var(--ink2)}
.gv-pg span{font-family:var(--f-num);font-size:11.5px}
.mut{color:var(--ink3)}
.gv-lg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line2);font-size:11px;color:var(--ink3)}
.gv-lg .sp{flex:1}

/* --- página da agência: cabeçalho, próximo passo e abas --- */
.ag-h{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.ag-ht{flex:1;min-width:260px}
.ag-ht h2{font-size:24px;line-height:1.1}
.ag-km{display:flex;gap:8px;flex-wrap:wrap}
.ag-km>div{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:7px 12px;min-width:112px;display:flex;flex-direction:column;gap:2px}
.ag-km span{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.02em}
.ag-km b{font-family:var(--f-head);font-size:17px;line-height:1.2}
.ag-km small{font-size:10.5px;color:var(--ink3);font-family:var(--f-num)}
.ag-nx{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:var(--r);margin-bottom:14px;font-size:12.5px;color:var(--ink2);border:1px solid}
.ag-nx>svg{flex:0 0 auto}
.ag-nx>div:first-of-type{flex:1;min-width:0}
.ag-nx b{color:var(--ink)}
.ag-nxb{display:flex;gap:8px;flex-wrap:wrap}
.ag-nx.ia{background:var(--ialt);border-color:#CBD5EA}.ag-nx.ia>svg{color:var(--ia)}
.ag-nx.prep{background:var(--goldlt);border-color:#E4DCC2}.ag-nx.prep>svg{color:var(--gold-ink)}
.ag-nx.dup{background:var(--amberlt);border-color:#EED7B0}.ag-nx.dup>svg{color:var(--amber)}
.ag-nx.ok{background:var(--greenlt);border-color:#C7E3DA}.ag-nx.ok>svg{color:var(--green-ink)}
.ag-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.ag-tabs button{padding:9px 16px 10px;font-size:13.5px;font-weight:600;color:var(--ink3);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.ag-tabs button:hover{color:var(--ink)}
.ag-tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.ag-tabs .n{font-size:10.5px;background:#EDF1F3;color:var(--ink2);padding:0 6px;border-radius:10px;line-height:17px}
.ag-tabs button.on .n{background:var(--greenlt);color:var(--green-ink)}
.ag-tabs .ag-p{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.ag-back{font-size:12px;color:var(--navy);font-weight:600;padding:4px 0}
.ag-back:hover{text-decoration:underline}
.sub-h{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.sub-h h3{font-size:15px}
.sub-h .sp{flex:1}
.ag-sec{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}
.ag-sec h4{font-size:14px;color:var(--navy)}
.ag-sec span{font-size:11.5px;color:var(--ink3)}

/* --- Raio X --- */
.ag-g1{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);margin-bottom:14px;align-items:start}
@media(max-width:1100px){.ag-g1{grid-template-columns:1fr}}
p.ag-frase{font-size:14px;line-height:1.55;color:var(--ink);font-weight:500;margin-bottom:12px;padding-left:12px;border-left:3px solid var(--gold)}
.ag-dp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.ag-dp{grid-template-columns:1fr}}
.ag-dl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.ag-dl.ok{color:var(--green-ink)}.ag-dl.at{color:var(--red)}
.ag-dp ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.ag-dp li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line2)}
.ag-dp li b{font-weight:600;text-align:right}
.ag-dp li b.up{color:var(--green-ink)}.ag-dp li b.dn{color:var(--red)}
.dre{margin-bottom:14px}
.dre-hd,.dre .acc-h,.dre-tot{display:grid;grid-template-columns:minmax(200px,1.6fr) 104px 104px 104px 70px minmax(120px,1fr) 22px;gap:10px;align-items:center}
.dre-hd{padding:8px 16px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;background:var(--surf2);border-bottom:1px solid var(--line2)}
.dre-hd span:nth-child(n+2):nth-child(-n+5){text-align:right}
.dre .acc{border:0;border-bottom:1px solid var(--line2);border-radius:0;margin:0;box-shadow:none}
.dre .acc-h{padding:9px 16px;width:100%;text-align:left;font-size:13px}
.dre .acc-h:hover{background:var(--surf2)}
.dre .acc.neg .dre-n{font-weight:600}
.dre-v,.dre-g,.dre-p{text-align:right}
.dre-b{position:relative;height:8px;display:block}
.dre-b::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.dre-b i{position:absolute;top:0;height:8px;border-radius:2px}
.dre-b i.neg{right:50%;background:#E7A49C}.dre-b i.pos{left:50%;background:#8FD3AE}
.dre .acc .chev{justify-self:end}
.dre-x{padding:4px 16px 14px 28px;background:var(--surf2)}
.dre-x p{font-size:12.5px;color:var(--ink2);margin:6px 0 8px}
.dre-x table{width:100%;border-collapse:collapse;font-size:12.5px}
.dre-x td{padding:5px 8px;border-top:1px solid var(--line2)}
.dre-x td:nth-child(n+2){text-align:right;white-space:nowrap}
.dre-tot{padding:11px 16px;font-weight:700;font-size:13.5px;background:var(--surf2);border-radius:0 0 var(--r) var(--r)}
.dre-tot .dre-b{height:auto}
.dre-tot .dre-b::before{display:none}
@media(max-width:900px){.dre-hd,.dre .acc-h,.dre-tot{grid-template-columns:minmax(150px,1fr) 90px 90px 22px}.dre-hd span:nth-child(n+4):nth-child(-n+6),.dre-g,.dre-p,.dre-b{display:none}}
.ag-mt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media(max-width:1100px){.ag-mt{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ag-pd{border-radius:var(--r2);padding:8px 10px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent}
.ag-pd span{font-size:11px;font-weight:600}
.ag-pd b{font-size:16px;font-family:var(--f-head)}
.ag-pd.fx-neg{background:#F8E1DE;color:#8A2219;border-color:#EFC3BD}.ag-pd.fx-low{background:#FBEBDD;color:#8A4A0E;border-color:#F2D2B4}
.ag-pd.fx-mid{background:#FBF4D8;color:#6B5A12;border-color:#EFE2A6}.ag-pd.fx-hi{background:#E3F4EA;color:#0F6B45;border-color:#BFE3CF}

/* --- FCAs e conversas: listas --- */
.ag-fl{display:flex;flex-direction:column}
.ag-fl>.ag-fr{display:grid;grid-template-columns:minmax(0,1fr) 150px 140px 120px;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.ag-fl>.ag-fr:last-child{border-bottom:0}
.ag-fl>button.ag-fr:hover{background:var(--surf2)}
.ag-fl>.ag-fr.ro{cursor:default}
.ag-fl>.ag-fr.rasc{background:var(--goldlt)}
.ag-fi{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.ag-fi .id{font-size:11px;color:var(--ink3)}
.ag-fi b{font-weight:600;color:var(--ink)}
.ag-fe{display:flex;align-items:center;gap:7px;font-size:11.5px}
.ag-fe .bar{flex:1}
.ag-fp{font-size:11.5px;color:var(--ink3)}
@media(max-width:900px){.ag-fl>.ag-fr{grid-template-columns:1fr}}
.ag-cv{display:flex;align-items:center;gap:16px;padding:12px 14px;border:1px solid #E4DCC2;background:var(--goldlt);border-radius:var(--r2);cursor:pointer}
.ag-cv.done{border-color:#C7E3DA;background:var(--greenlt)}
.ag-cv>div{flex:1;display:flex;flex-direction:column;gap:2px}
.ag-cv>div span{font-size:12px;color:var(--ink2)}
.ag-mini{display:flex;gap:4px}
.ag-mini i{width:26px;height:5px;border-radius:3px;background:var(--line)}
.ag-mini i.ok{background:var(--green2)}.ag-mini i.on{background:var(--gold)}
.ag-dup{display:flex;align-items:center;gap:11px;padding:10px 14px;margin-bottom:14px;border-radius:var(--r2);background:var(--amberlt);border:1px solid #EED7B0;font-size:12.5px;color:var(--ink2)}
.ag-dup>div{flex:1;display:flex;flex-direction:column;gap:2px}
.ag-dup b{color:var(--ink)}
.ag-dup>svg{color:var(--amber)}

/* --- conversa: passos --- */
.cv-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.cv-t{display:flex;flex-direction:column;line-height:1.25;margin-right:auto}
.cv-t b{font-size:14px;color:var(--ink)}
.cv-t span{font-size:11.5px;color:var(--ink3)}
.cv-st{display:flex;list-style:none;gap:4px;align-items:center}
.cv-st li{display:flex;align-items:center}
.cv-st li+li::before{content:"";width:18px;height:1px;background:var(--line);margin-right:4px}
.cv-st button{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:20px;border:1px solid var(--line);background:var(--surf);font-size:12.5px;font-weight:600;color:var(--ink2)}
.cv-st button:hover{border-color:var(--green2)}
.cv-st .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#EDF1F3;font-size:11px}
.cv-st button.ok .n{background:var(--greenlt);color:var(--green-ink)}
.cv-st button.on{background:var(--green);border-color:var(--green);color:#fff}
.cv-st button.on .n{background:var(--gold-hi);color:var(--side-2)}
.cv-io{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:8px 12px;background:var(--surf);border:1px dashed var(--line);border-radius:var(--r2);margin-bottom:14px}
.cv-io em{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-right:6px}
.cv-io i{font-style:normal;color:var(--gold)}

/* --- FCA aberto: abas internas --- */
.ag-fd{margin-bottom:12px}
.ag-fdh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.ag-fdh .mono{font-size:11.5px;color:var(--ink3)}
.ag-fdh .mut{font-size:11.5px}
.ag-ftabs{display:flex;align-items:center;gap:6px;padding:4px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r2)}
.ag-ftabs button{padding:6px 14px;border-radius:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.ag-ftabs button.on{background:var(--green);color:#fff}
.ag-ftabs .sp{flex:1}
.ag-ftabs .mut{font-size:11.5px;padding-right:8px}

/* --- FCA no formato Fato · Causa · Ação --- */
.fc-dx{flex-wrap:wrap}
.fc-dx .fc-dxi b{font-family:var(--f-head);font-size:15px;color:var(--ink)}
.fc-dx .fc-dxi span{font-size:11px;color:var(--ink3)}
.fc-hz{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-left:auto;font-size:11.5px}
.fc-hz span{color:var(--ink3)}
.fc-hz b{color:var(--ink);font-weight:600;margin-right:8px}
.fc-chk{display:flex;align-items:flex-start;gap:9px;padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--line2)}
.fc-chk.ok{background:var(--greenlt);color:var(--green-ink)}
.fc-chk.warn{background:var(--amberlt);color:var(--ink2)}
.fc-chk.warn>svg{color:var(--amber);flex:0 0 auto;margin-top:2px}
.fc-chk ul{margin:4px 0 0 16px;display:flex;flex-direction:column;gap:2px}
.fc-fato{border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.fc-fh{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--goldlt);border-bottom:1px solid #E4DCC2}
.fc-fn{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:0 0 auto}
.fc-fh .ed-in.fc-ft,.fc-fh .fc-ro{font-family:var(--f-head);font-weight:700;font-size:14px;color:var(--gold-ink);text-transform:uppercase;letter-spacing:.03em;background:transparent;max-width:420px}
.fc-fh .sp{flex:1}
.fc-fx{padding:10px 12px;border-bottom:1px solid var(--line2)}
.fc-fx .fc-lb{display:block;margin-bottom:4px}
.fc-t2{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.fc-t2 th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:left;padding:7px 10px;background:var(--surf2);border-bottom:1px solid var(--line2)}
.fc-t2 td{vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line2)}
.fc-t2 tr:last-child td{border-bottom:0}
.fc-t2 td+td{border-left:1px solid var(--line2)}
.fc-acs{display:flex;flex-direction:column;gap:8px}
.fc-t2 td.fc-acs{display:table-cell}
.fc-a2{display:flex;gap:8px;align-items:flex-start;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.fc-a2:last-of-type{border-bottom:0}
.fc-a2 .fc-n{flex:0 0 18px;font-size:11px;color:var(--ink3);padding-top:6px}
.fc-ab{flex:1;min-width:0}
.fc-am{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.fc-am label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink3)}
.fc-am label .ed-in{width:118px;padding:3px 6px;font-size:12px}
.fc-am label.mt{flex:1;min-width:160px}
.fc-am label.mt .ed-in{width:100%}
.fc-am label>span{flex:0 0 auto}
.fc-a2 .fc-ac{display:flex;flex-direction:column;gap:2px}
.fc-add.sm{margin-top:4px;font-size:11.5px}
.fc-stc{text-align:left}
.fc-sts{font:inherit;font-size:12px;font-weight:700;border-radius:20px;padding:3px 8px;border:1px solid transparent;cursor:pointer;max-width:100%}
.fc-sts.t-gd{border-color:#E4DCC2}.fc-sts.t-bl{border-color:#C9D5EC}.fc-sts.t-amb{border-color:#EED7B0}
.fc-w{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--amber);font-weight:600;margin-top:4px}
.fc-w svg{width:12px;height:12px}
.fc-pw.ok{background:var(--greenlt);color:var(--green-ink)}
@media(max-width:1100px){.fc-t2,.fc-t2 tbody,.fc-t2 tr,.fc-t2 td{display:block;width:100%}.fc-t2 thead{display:none}.fc-t2 td+td{border-left:0}}

/* --- abertura: fluxo com entradas e saídas --- */
.mod.v8-mod{width:min(1080px,calc(100vw - 32px));max-width:none}
.v8-fl{display:flex;align-items:stretch;gap:6px;margin:12px 0 10px}
.v8-st{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surf)}
.v8-h{display:flex;align-items:center;gap:8px}
.v8-h .ic{width:28px;height:28px;border-radius:50%;background:var(--greenlt);color:var(--green-ink);display:grid;place-items:center;flex:0 0 auto}
.v8-h b{font-size:13.5px;color:var(--navy);font-family:var(--f-head)}
.v8-st p{font-size:12px;color:var(--ink2);line-height:1.45;flex:1}
.v8-io{font-size:11.5px;color:var(--ink2);line-height:1.4;padding:6px 8px;background:var(--surf2);border-radius:5px}
.v8-io span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-bottom:2px}
.v8-io.sai{background:var(--greenlt)}
.v8-io.sai span{color:var(--green-ink)}
.v8-ar{align-self:center;color:var(--gold);font-weight:700}
@media(max-width:860px){.v8-fl{flex-direction:column}.v8-ar{transform:rotate(90deg)}}

.gv-ord{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.gv-n small .dn{color:var(--red);font-family:var(--f-num)}
.fc-dx .fc-dxi span{white-space:normal;overflow:visible;text-overflow:clip}
.rx-ctx{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--ink3)}
.rx-ctx button{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:var(--surf);font-size:11.5px;font-weight:600;color:var(--ink2)}
.rx-ctx button:hover{border-color:var(--gold);color:var(--gold-ink)}
.rx-ctx button svg{width:11px;height:11px}

/* =========================================================================
   v9 · versão enxuta: menos colunas, menos texto, uma coluna onde der
   ========================================================================= */
/* visão geral: 4 números e ordenação pelo cabeçalho */
.rd-kp.gv-kp{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1180px){.rd-kp.gv-kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gv-t th.gv-so{cursor:pointer;user-select:none;transition:color .12s}
.gv-t th.gv-so:hover{color:var(--navy)}
.gv-fb .seg{flex:0 0 auto}

/* agência: lista de FCAs e de conversas com menos colunas */
.ag-fl>.ag-fr.ro{grid-template-columns:minmax(0,1fr) 110px auto}
.ag-fl>.ag-fr.cvh{grid-template-columns:minmax(0,1fr) minmax(0,300px) 90px}
.ag-none{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px}
.lnk.ag-demo{font-size:12px;font-weight:600;color:var(--ia);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@media(max-width:900px){.ag-fl>.ag-fr.ro,.ag-fl>.ag-fr.cvh{grid-template-columns:1fr}}

/* pauta em uma coluna */
.pa-uni{max-width:none}
.sub-h .ph-a{display:flex;align-items:center;gap:12px}

/* compromissos: transcrição mais baixa, embaixo */
.rn-cands{margin-bottom:14px}
.rn-trs{max-height:380px}

/* FCA: objetivo, indicador e prazo numa linha */
.fc-meta{grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 180px}
@media(max-width:1100px){.fc-meta{grid-template-columns:1fr}}

/* acompanhamento sem a coluna "aberta há" */
.pl-hd,.pl-row{grid-template-columns:22px minmax(0,1fr) 112px 56px 124px 108px}

/* abertura mais estreita */
.mod.v8-mod{width:min(960px,calc(100vw - 32px))}

/* Raio X: espaço entre o problema e o DRE; FCA: respiro antes do objetivo */
.ag-body>.ag-pb{margin-bottom:14px}
.fc-sp{height:18px}

/* =========================================================================
   v10 · painel sem barra lateral: topo verde com logo, caminho e seletor de agência
   ========================================================================= */
.top{
  height:64px;flex:0 0 64px;gap:16px;padding:0 22px;
  background:linear-gradient(90deg,var(--side) 0%,var(--side-2) 100%);border-bottom:0;
  box-shadow:0 2px 10px rgba(0,40,28,.18);
}
.top-logo{flex:0 0 auto;background:#fff;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center}
.top-logo img{display:block;height:24px;width:auto}
.top-prod{display:flex;flex-direction:column;line-height:1.2;padding-right:16px;border-right:1px solid var(--side-line);white-space:nowrap}
.top-prod b{font-family:var(--f-head);font-size:13px;color:#fff;font-weight:700}
.top-prod span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-mut);font-weight:600}

/* caminho */
.crumb{gap:6px;min-width:0}
.cr-on{font-family:var(--f-head);font-size:15px;font-weight:700;color:#fff;white-space:nowrap}
.cr-lk{background:none;border:0;padding:6px 8px;margin-left:-8px;border-radius:6px;color:var(--side-ink);font:600 12.5px var(--f-body);cursor:pointer;white-space:nowrap}
.cr-lk:hover{color:#fff;background:rgba(255,255,255,.08)}
.cr-sep{color:var(--side-mut2);font-size:15px}
.cr-ag{display:flex;align-items:center;gap:8px;min-width:0;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 10px 6px 11px;color:#fff;cursor:pointer;transition:background .12s}
.cr-ag:hover,.cr-ag[aria-expanded="true"]{background:rgba(255,255,255,.18)}
.cr-ag b{font-family:var(--f-head);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-ag svg{flex:0 0 auto;opacity:.85}
.cr-ag0{margin-left:10px;font:600 12.5px var(--f-body)}
.cr-ag .ag-d,.agp-i .ag-d{flex:0 0 9px;width:9px;height:9px;border-radius:50%;display:inline-block}

/* contexto e assinatura no topo verde */
.top .ctx{background:rgba(255,255,255,.95);border-color:transparent}
.top-pb{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-mut);font-weight:600;white-space:nowrap;padding-left:14px;border-left:1px solid var(--side-line)}
.top-pb img{height:14px;opacity:.95}

/* lista de agências */
.agp{position:fixed;z-index:60;width:360px;max-height:min(560px,calc(100vh - 90px));display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh3);overflow:hidden;animation:agpIn .14s ease-out}

.agp-l{overflow-y:auto;padding:4px 6px 8px}
.agp-g{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink3);padding:10px 8px 4px}
.agp-i{display:grid;grid-template-columns:9px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:7px 8px;cursor:pointer;font:inherit;color:var(--ink)}
.agp-i:hover{background:var(--surf2)}
.agp-i.on{background:var(--greenlt)}
.agp-n{display:flex;flex-direction:column;min-width:0}
.agp-n b{font-size:13px;font-weight:600;color:var(--navy)}
.agp-n small{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agp-n em{font-style:normal;color:var(--gold-ink);font-weight:600}
.agp-i .fx{font-size:11px}
.agp-0{padding:16px 10px;font-size:12.5px;color:var(--ink3)}
.agp-f{padding:8px 14px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--ink3);background:var(--surf2)}

/* área útil maior sem a barra */
.wrap{max-width:1480px}

.crumb{flex:0 1 auto}
.cr-ag{flex:0 0 auto}
.cr-ag b{max-width:280px}
@media(max-width:1320px){.top-pb{display:none}}
@media(max-width:1180px){.top-prod{display:none}}
@media(max-width:1100px){.top-user{display:none}}
@media(max-width:720px){.top{gap:10px;padding:0 12px}.top .ctx{display:none}.cr-lk span{font-size:0}.cr-lk span::before{content:"←";font-size:14px}}

/* =========================================================================
   v11 · ⓘ fora do card, aviso do registro e página única do FCA publicado
   ========================================================================= */
/* ⓘ: o texto abre no balão único (.itip), preso à tela */
.info .tip,.info:hover .tip,.info:focus .tip{display:none!important}
.itip{position:fixed;z-index:300;width:300px;max-width:calc(100vw - 24px);pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .1s,transform .1s;
  background:var(--ink);color:#E8ECF4;font:400 11.5px/1.5 var(--f-body);text-align:left;white-space:normal;padding:10px 12px;border-radius:8px;box-shadow:var(--sh2)}
.itip.show{opacity:1;transform:none}
.itip b{display:block;color:#fff;font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 2px}
.itip b:first-child{margin-top:0}

/* registro: aviso de que a tela é usada durante a reunião */
.cp-use{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;margin-bottom:14px;border-radius:var(--r);background:var(--greenlt);border:1px solid #CFE6DF;color:var(--green-ink)}
.cp-use>svg{flex:0 0 auto;margin-top:1px}
.cp-use div{display:flex;flex-direction:column;gap:2px}
.cp-use div>b{font-family:var(--f-head);font-size:14px;color:var(--green)}
.cp-use span{font-size:12.5px;line-height:1.5;color:var(--ink2)}
.cp-use span b{color:var(--ink)}

/* página do FCA */
.fp-h{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.fp-ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fp-ht .ag-back{align-self:flex-start}
.fp-tt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fp-tt h3{font-size:19px}
.fp-id{font-size:12px;color:var(--ink3)}
.fp-mt{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3)}
.fp-ha{display:flex;align-items:center;gap:10px;padding-top:24px}
.fp-dt{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fp-obj{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 16px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 24px}
.fp-obj p{font-size:13px;line-height:1.5;color:var(--ink)}
.fp-gaps{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.fp-gaps .fp-lb{width:100%}
.fp-gap{display:inline-flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--ink2);background:var(--surf2);border:1px solid var(--line2);border-radius:6px;padding:4px 8px}
.fp-gap b{color:var(--red);font-size:12px}
.fp-lb{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-bottom:3px}
.fp-kp{margin-bottom:14px}

.fp-cb{margin-bottom:14px}
.fp-hd,.fp-a{display:grid;grid-template-columns:22px minmax(0,1fr) 130px 52px 128px 104px;gap:12px;align-items:center;padding:0 16px}
.fp-hd{padding-top:8px;padding-bottom:8px;background:var(--surf2);border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink3)}
.fp-body{padding:0}
.fp-f+.fp-f{border-top:6px solid var(--canvas)}
.fp-fh{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.fp-fh b{font-family:var(--f-head);font-size:13.5px;color:var(--gold-ink);text-transform:uppercase;letter-spacing:.03em}
.fp-fx{padding:0 16px 10px 48px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.fp-c{border-top:1px solid var(--line2)}
.fp-ch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:16px;align-items:start;padding:10px 16px 10px 48px;background:var(--surf2)}
.fp-ch p{font-size:12.5px;line-height:1.45;color:var(--ink)}
.fp-a{padding-top:10px;padding-bottom:10px;border-top:1px solid var(--line2);cursor:pointer;transition:background .12s}

.fp-a.late{box-shadow:inset 3px 0 0 var(--red)}
.fp-at{font-size:13px;font-weight:600;color:var(--ink);line-height:1.4;display:flex;gap:8px}
.fp-n{flex:0 0 auto;font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px;height:17px;line-height:16px;margin-top:1px}
.fp-am{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:5px 0 0 31px;font-size:11.5px;color:var(--ink3)}
.fp-am b{color:var(--ink2);font-weight:600}
.fp-ev{background:none;border:0;padding:0;font:600 11.5px var(--f-body);color:var(--ia);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.fp-ev svg{width:12px;height:12px}
.fp-q{font-size:12.5px;color:var(--ink2)}
.fp-p{font-size:12.5px;color:var(--ink)}
.fp-s{font-size:11.5px}
.fp-x{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2)}
.fp-x .bar{flex:1}
.fp-0{padding:10px 16px 10px 48px;font-size:12px}
.fp-g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.fp-dwa{font-size:13.5px;line-height:1.5;color:var(--ink);font-weight:600}
@media(max-width:1100px){.fp-hd{display:none}.fp-a{grid-template-columns:22px minmax(0,1fr) 120px 90px}.fp-q,.fp-p{display:none}.fp-g2,.fp-obj{grid-template-columns:1fr}}

/* =========================================================================
   v12 · Raio X completo, painel de dados na conversa e raio X pós-FCA
   ========================================================================= */
/* barra fixa do Raio X: atalhos e filtros */
.rx-nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 -24px 14px;padding:10px 24px;background:rgba(239,243,242,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}

.rx-at button:hover{background:var(--surf);border-color:var(--line);color:var(--navy)}
.rx-fl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rx-fll{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink3)}

.rx-sec{scroll-margin-top:64px;margin-bottom:14px}

/* resumo */
.rx-kpr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.rx-kpr>div{background:var(--surf2);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.rx-kpr span{font-size:10.5px;color:var(--ink3);font-weight:600}
.rx-kpr b{font-family:var(--f-head);font-size:18px;color:var(--ink)}
.rx-kpr small{font-size:11px;color:var(--ink3)}
.rx-kpr .dn{color:var(--red)}.rx-kpr .up{color:var(--green-ink)}

/* DRE do PFC */
.dre-grp{display:grid;grid-template-columns:minmax(200px,1.6fr) 104px 104px 104px 70px minmax(120px,1fr) 22px;gap:10px;align-items:center;padding:8px 16px;background:#FAFBFC;border-bottom:1px solid var(--line2);font-weight:700;font-size:12.5px;color:var(--navy)}
.dre-grp .dre-n{text-transform:uppercase;letter-spacing:.04em;font-size:11px}
