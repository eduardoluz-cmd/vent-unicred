  const n={captacao:'Cobertura captação/crédito',risco:'Inadimplência >90d',credito:'Carteira de crédito'}[s.tema];
  return n?indicadoresDe(s.ag).find(i=>i.n===n):null;
}
function rd_decBox(s,sit,d){
  if(sit==='pend') return `<div class="rd-none">Sem decisão. Se fizer sentido conversar com a agência, prepare a conversa; se não, descarte com o motivo. Para só observar, não precisa fazer nada.</div>`;
  if(rd_isCaso(s)) return `<div class="rd-dbox"><span class="rd-stt prep">${ICON.play}<span>Caso ativo · próxima etapa: ${rd_ETAPA[rd_proxEtapa(s.ag)]}</span></span><span>As etapas 2 a 5 estão trabalhando sobre este caso.</span></div>`;
  if(sit==='prep') return `<div class="rd-dbox"><span class="rd-stt">${ICON.check}<span>Em preparação</span></span><span>Iniciada ${d&&d.quando||'hoje'}. O que já foi feito fica salvo; retome quando quiser.</span></div>`;
  return `<div class="rd-dbox"><span class="rd-stt desc">${ICON.x}<span>Descartado</span></span><span>Motivo: ${esc(d.motivo||'—')} · registrado ${d.quando||'hoje'} no histórico do sinal.</span></div>`;
}
function rd_sigDw(id,mode){
  const s=SIGX[id]; if(!s) return;
  const a=AGX[s.ag], sit=rd_sit(s), d=DEC[id], q=rd_quad(s), sg=rd_sug(s), fc=rd_fcasDe(s.ag), ind=rd_indDe(s);
  if(mode==='desc'){rd_ST.descMot=rd_MOTIVOS[0];rd_ST.descObs='';}
  const dec=mode==='desc'?`<div class="rd-descd">
      <label class="sel"><span>Motivo</span><select onchange="rd_ST.descMot=this.value">${rd_MOTIVOS.map(m=>`<option>${m}</option>`).join('')}</select></label>
      <textarea class="ed-ta ed-box" rows="2" placeholder="Detalhe (opcional)" oninput="autoGrow(this);rd_ST.descObs=this.value"></textarea></div>`:rd_decBox(s,sit,d);
  const body=`
    <div class="rd-dwk"><span class="mono">${s.id}</span><span>Região ${a.r}</span><span>detectado ${s.quando}</span><span>${TEMAS[s.tema]}</span><span>carteira ${s.carteira}</span></div>
    <div class="rd-dwt">${s.t}</div>
    <div class="rd-dsc">
      <div class="n" style="color:${rd_scCol(s.st)}">${s.sc}</div>
      <div class="tx"><b>Score · ${rd_QD[q]}</b><span>Combina o valor em jogo (${rd_rs(s.risco)}, ${s.riscoLb}) e o prazo do próximo marco (${s.prazo} dias, ${s.prazoLb}).</span></div>
    </div>
    <p class="rd-dwp">${s.m}</p>
    <div class="dw-sec"><div class="dw-lb">Evidências</div><table class="rd-evt"><tbody>${s.ev.map(e=>`<tr><td>${e[0]}</td><td class="mono">${e[1]}</td></tr>`).join('')}</tbody></table></div>
    ${ind?`<div class="dw-sec"><div class="dw-lb">${ind.n} · 12 meses</div><div class="rd-chart">${indChart(ind,{h:160,w:480})}</div></div>`:''}
    <div class="dw-sec"><div class="dw-lb">FCAs em aberto em ${esc(a.n)}</div>${fc.length?fc.map(rd_fcaCard).join(''):`<div class="rd-none">Nenhum FCA em aberto nesta agência.</div>`}</div>
    ${sit==='pend'?`<div class="dw-sec"><div class="dw-lb">Sugestão do copiloto ${IA_TAG}</div><div class="rd-sbox"><b>${rd_SUG_LB[sg.f].replace(/^./,c=>c.toUpperCase())}</b> · ${sg.tx}</div></div>`:''}
    <div class="dw-sec"><div class="dw-lb">Decisão</div>${dec}</div>`;
  let foot;
  if(mode==='desc') foot=`<button class="btn" onclick="rd_sigDw('${id}')">Cancelar</button><button class="btn rd-btn-del" onclick="rd_descOk('${id}')">Descartar sinal</button>`;
  else if(sit==='pend') foot=`<button class="btn" onclick="rd_sigDw('${id}','desc')">Descartar</button><button class="btn btn-p" onclick="rd_prep('${s.ag}','${id}')">Preparar conversa →</button>`;
  else if(rd_isCaso(s)) foot=`<button class="btn btn-p" onclick="closeDrawer();rd_continuar()">Continuar preparação →</button>`;
  else if(sit==='prep') foot=`<button class="btn" style="margin-right:auto" onclick="rd_desfazer('${id}')">Desfazer decisão</button><button class="btn btn-p" onclick="rd_iniciar('${id}')">Retomar preparação →</button>`;
  else foot=`<button class="btn" onclick="rd_desfazer('${id}')">Desfazer decisão</button>`;
  openDrawer(`${esc(a.n)} · ${s.id}`,body,foot,{w:540,pre:`<span class="tag ${STTG[s.st]}">${STLB[s.st]}</span>`});
  if(mode==='desc') setTimeout(()=>{const b=document.querySelector('#dw .dw-b'),sl=document.querySelector('#dw .rd-descd select');if(b)b.scrollTop=b.scrollHeight;if(sl)sl.focus({preventScroll:true});},40);
}

function rd_agDw(id){
  const a=AGX[id]; if(!a) return;
  const sigs=SINAIS.filter(s=>s.ag===id).sort((x,y)=>y.sc-x.sc), fc=rd_fcasDe(id), isC=CASO.ag===id;
  const cobC=a.cob<1.0?'var(--red)':a.cob<1.05?'var(--amber)':'var(--ink)', inC=a.inad>3?'var(--red)':a.inad>2.7?'var(--amber)':'var(--ink)';
  const body=`
    <div class="rd-dwk"><span>Região ${a.r}</span><span>gerente ${esc(a.ger)}</span><span>${a.coop.toLocaleString('pt-BR')} cooperados</span><span>${{pequena:'carteira até R$ 50 mi',media:'carteira de R$ 50 a 150 mi',grande:'carteira acima de R$ 150 mi'}[PORTE(a.cre)]}</span></div>
    <div class="rd-dwm c4">
      <div><span class="k">Captação</span><b>${BRL(a.cap)} mi</b></div>
      <div><span class="k">Crédito</span><b>${BRL(a.cre)} mi</b></div>
      <div><span class="k">Cobertura</span><b style="color:${cobC}">${nf(a.cob,2)}</b><span>piso 1,05</span></div>
      <div><span class="k">Inadimplência</span><b style="color:${inC}">${nf(a.inad,2)}%</b><span>teto 3,00%</span></div>
    </div>
    <div class="dw-sec"><div class="dw-lb">FCAs em aberto (${fc.length})</div>${fc.length?fc.map(rd_fcaCard).join(''):`<div class="rd-none">Nenhum FCA em aberto nesta agência.</div>`}</div>
    <div class="dw-sec"><div class="dw-lb">Sinais (${sigs.length})</div>${sigs.length?sigs.map(s=>{const sit=rd_sit(s);return `<button type="button" class="rd-srow ${s.st}" onclick="rd_sigDw('${s.id}')">
        <span class="tag ${STTG[s.st]}">${STLB[s.st]}</span><span class="tx"><b>${s.t}</b><span>${s.id} · ${s.quando} · score ${s.sc}</span></span><span class="tag ${sit==='pend'?'t-gy':sit==='prep'?'rd-tprep':'t-gd'}">${rd_SIT[sit]}</span></button>`;}).join(''):`<div class="rd-none">Nenhum sinal ativo. Você ainda pode preparar uma conversa de rotina.</div>`}</div>`;
  const top=sigs.find(s=>rd_sit(s)!=='desc');
  const foot=isC?`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn btn-p" onclick="closeDrawer();rd_continuar()">Continuar preparação →</button>`
    :`<button class="btn" onclick="closeDrawer()">Fechar</button><button class="btn btn-p" onclick="rd_prep('${id}',${top?`'${top.id}'`:'null'})">Preparar conversa →</button>`;
  openDrawer(`Agência ${esc(a.n)}`,body,foot,{w:520,pre:`<span class="tag ${STTG[a.st]}">${STLB[a.st]}</span>`});
}

/* ---------- Preparar conversa: confirmar o caso e disparar o fluxo ---------- */
function rd_prep(ag,sig){
  const sigs=sig?[sig]:SINAIS.filter(s=>s.ag===ag&&rd_sit(s)!=='desc').map(s=>s.id);
  rd_PREP={ag,sigs};
  rd_prepDraw();
}
function rd_prepSig(id,on){if(!rd_PREP)return;const l=rd_PREP.sigs.filter(x=>x!==id);rd_PREP.sigs=on?[...l,id]:l;}
function rd_prepDraw(){
  const P=rd_PREP, a=AGX[P.ag], isC=CASO.ag===P.ag;
  const sigs=SINAIS.filter(s=>s.ag===P.ag&&(rd_sit(s)!=='desc'||P.sigs.includes(s.id)));
  const fc=rd_fcasDe(P.ag);
  const body=`
    <div class="rd-pa">
      <div class="nm"><b>${esc(a.n)}</b><span>Região ${a.r} · gerente ${esc(a.ger)} · ${a.coop.toLocaleString('pt-BR')} cooperados</span></div>
      <span class="tag ${STTG[a.st]}">${STLB[a.st]}</span>
    </div>
    <div class="dw-sec"><div class="dw-lb">FCAs em aberto na agência</div>${fc.length?`${fc.map(rd_fcaCard).join('')}<div class="rd-fcnote">${ICON.eye}<span>Veja se o tema já não está sendo tratado. Se estiver, a conversa pode revisar esse FCA em vez de abrir outro.</span></div>`:`<div class="rd-none">Nenhum FCA em aberto: o caso começa do zero.</div>`}</div>
    <div class="dw-sec"><div class="dw-lb">Sinais da conversa</div>
      ${sigs.length?sigs.map(s=>`<label class="rd-sigck"><input type="checkbox" ${P.sigs.includes(s.id)?'checked':''} onchange="rd_prepSig('${s.id}',this.checked)"><span class="tx"><b>${s.t}</b><span>${s.id} · score ${s.sc}</span></span><span class="tag ${STTG[s.st]}">${STLB[s.st]}</span></label>`).join('')
        :`<div class="rd-none">Sem sinal ativo: a conversa entra como conversa de rotina.</div>`}
    </div>
    <div class="dw-sec"><div class="dw-lb">O que acontece ao confirmar</div>
      <ul class="rd-what">
        <li>${ICON.play}<span>${esc(a.n)} vira o <b>caso ativo</b>: radiografia, pauta, captura, conversa registrada e FCA trabalham sobre ele.</span></li>
        <li>${ICON.check}<span>A decisão fica registrada no sinal (em preparação).</span></li>
        ${!isC?`<li>${ICON.clock}<span>O caso atual (${esc(casoAg().n)}) continua salvo, com o que já foi feito. Você retoma pela fila.</span></li>`:''}
      </ul></div>`;
  const foot=`<button class="btn" onclick="closeDrawer()">Cancelar</button>
    <button class="btn btn-p" onclick="rd_prepOk()">${isC?'Continuar preparação →':'Iniciar preparação →'}</button>`;
  openDrawer(`Preparar conversa · ${esc(a.n)}`,body,foot,{w:540,pre:`<span class="rd-dwic">${ICON.play}</span>`});
}
function rd_prepOk(){
  const P=rd_PREP; if(!P) return;
  const a=AGX[P.ag];
  P.sigs.forEach(s=>{if(!DEC[s]||DEC[s].tipo==='descartar')DEC[s]={tipo:'preparar',quando:'hoje '+rd_AGORA};});
  setCaso({ag:P.ag,sig:P.sigs[0]||null});
  rd_PREP=null; rd_ST.desc=null;
  closeDrawer();
  go(rd_proxEtapa(P.ag));
  toast(`${a.n} em preparação`,'📍');
}

</script>
<script>
/* ---- 20_radiografia.js ---- */
/* =========================================================================
   2 · RADIOGRAFIA DA AGÊNCIA · prefixo rx
   Roda sobre o caso ativo (CASO.ag). Gráficos do topo, indicadores com
   drill-down de 12 meses
   (funcionalidade a validar) e, no fim, a pré-pauta: leitura do regional,
   sugestão da IA (só ao clicar) e confirmação que gera as perguntas da Pauta.
   ========================================================================= */

/* estado do módulo (por agência quando faz sentido) */
const rx_S = {
  filtro:'todos',      /* indicadores: 'todos' | 'desvio' | 'meta' */
  per:12, tema:'', q:'',   /* filtros da etapa 2: período (meses), tema do indicador, busca */
  pp:{},               /* ag -> {ref, leitura, editado}: ligado à pré-pauta atual (ws().prepauta) */
  pos:{},              /* ag -> {ref, alt}: ligado à pauta atual (ws().pauta); alt = pré-pauta mudou depois das perguntas */
  undo:null            /* último bloco apagado (para desfazer) */
};

/* marcos de FCAs anteriores da unidade nos gráficos dos indicadores (i = índice em MESES) */
const rx_MARCOS = {
  PEL:{
    'Inadimplência >90d':[{i:8, t:'FCA-2026-0091'}],
    'Produtos por cooperado':[{i:5, t:'FCA-2025-0233'}]
  }
};

/* hipóteses genéricas por tema do sinal (agências sem análise detalhada na demonstração) */
const rx_HIP_TEMA = {
  captacao:{t:'Saída de captação concentrada em poucos cooperados', p:'Verificar se a queda vem de poucos cooperados ou de vencimentos sem renovação.'},
  risco:{t:'Inadimplência concentrada em um segmento da carteira', p:'Verificar se o vencido se concentra em um produto, safra ou grupo de cooperados.'},
  relacionamento:{t:'Abordagem de produtos abaixo do padrão da rede', p:'Verificar se falta oferta ativa ou se a base tem perfil diferente do esperado.'},
  credito:{t:'Demanda sazonal sem oferta ativa', p:'Verificar se a agência antecipou a oferta para a janela sazonal.'},
  resultado:{t:'Renegociação de taxas pressionando a margem', p:'Verificar quem aprovou as renegociações e com qual critério.'}
};

const rx_ST = {
  ruim:{c:'t-red', lb:'fora da meta'},
  atenc:{c:'t-amb', lb:'atenção'},
  bom:{c:'t-grn', lb:'acima da meta'},
  ok:{c:'t-gy', lb:'dentro da meta'}
};

/* indicador do próprio sinal, para agências cujo sinal não aparece nos indicadores genéricos
   (valores das evidências do sinal; série de 12 meses sintética da demonstração) */
const rx_EXTRA = {
  RGD:{n:'PF novos sem produto', d:'admitidos no trimestre', fim:58, var:0.41, ref:31, refLb:'rede', bom:'baixo', st:'ruim'},
  BAG:{n:'PF sem seguro', d:'% dos cooperados PF', fim:62, var:0.04, ref:38, refLb:'rede', bom:'baixo', st:'atenc'}
};
const rx_INDC = {};
function rx_inds(ag){
  if(rx_INDC[ag]) return rx_INDC[ag];
  const base=indicadoresDe(ag), x=rx_EXTRA[ag];
  if(!x) return (rx_INDC[ag]=base);
  const sp=serieSint(x.fim,x.var,ag+'rx').map(v=>+(+v).toFixed(1));
  const ind={n:x.n, d:x.d, v:nf(x.fim,0)+'%', dl:+(sp[11]-sp[8]).toFixed(1), st:x.st, sp,
    meta:`${x.refLb} ${nf(x.ref,0)}%`, metaV:x.ref, refLb:x.refLb, dec:0, un:'%', bom:x.bom, rxSinal:true};
  return (rx_INDC[ag]=[ind,...base]);
}
/* indicador aberto por padrão: o do sinal do caso; senão o primeiro crítico fora dos gráficos do topo */
function rx_foco(ag,inds){
  const s=casoSig(), tema=s&&s.ag===ag?s.tema:null;
  const porTema={risco:'Inadimplência >90d',credito:'Carteira de crédito'}[tema];
  const cands=[
    inds.find(i=>i.rxSinal),
    porTema&&inds.find(i=>i.n===porTema&&(i.st==='ruim'||i.st==='atenc')),
    inds.find(i=>i.st==='ruim'&&i.n!=='Cobertura captação/crédito'),
    inds.find(i=>i.st==='ruim')
  ];
  const f=cands.find(Boolean);
  return f?inds.indexOf(f):-1;
}
/* primeira letra minúscula, sem mexer em siglas (PF, PJ, RDC) */
function rx_lc(s){s=String(s||'');return /^[A-ZÀ-Ú]{2}/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);}

/* ---------------- formatação ---------------- */
function rx_w(){return ws(CASO.ag);}
function rx_sg(v,d){const r=+(+v).toFixed(d);return (r>0?'+':r<0?'−':'')+nf(Math.abs(r),d);}
function rx_fmt(ind,v){const n=nf(v,ind.dec);return ind.un==='R$ mi'?`R$ ${n} mi`:ind.un==='%'?`${n}%`:n;}
function rx_mes(i){i+=rx_off();return `${MESES[i]}/${i<7?'25':'26'}`;}
/* ---------- filtros da etapa 2 ---------- */
const rx_TEMAS={captacao:'Captação e funding',credito:'Crédito e risco',relac:'Relacionamento',result:'Resultado'};
const rx_TEMA_IND={'Captação total':'captacao','Cobertura captação/crédito':'captacao','Concentração top-10 PJ':'captacao','Carteira de crédito':'credito','Inadimplência >90d':'credito','Cooperados ativos':'relac','Produtos por cooperado':'relac','NPS da agência':'relac','Margem de contribuição':'result','Receita de serviços':'result'};
function rx_off(){return 12-rx_S.per;}
function rx_L(){return MESES.slice(rx_off());}
function rx_corta(inds){const o=rx_off();return o?inds.map(i=>({...i,sp:i.sp.slice(o)})):inds;}
function rx_temaDe(ind){return rx_TEMA_IND[ind.n]||(/inadimpl|crédito|risco/i.test(ind.n)?'credito':/capta|cobertura/i.test(ind.n)?'captacao':/margem|receita/i.test(ind.n)?'result':'relac');}
function rx_okFil(ind){
  const q=String(rx_S.q||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const nm=ind.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const desv=ind.st==='ruim'||ind.st==='atenc';
  return (!rx_S.tema||rx_temaDe(ind)===rx_S.tema)&&(rx_S.filtro==='todos'||(rx_S.filtro==='desvio'?desv:!desv))&&(!q||nm.includes(q));
}
function rx_nFil(){return [rx_S.per!==12,rx_S.tema,rx_S.filtro!=='todos',String(rx_S.q||'').trim()].filter(Boolean).length;}
function rx_per(v){rx_S.per=+v;redraw();}
function rx_tema(v){rx_S.tema=v;redraw();}
let rx_qT=null;
function rx_q(v){rx_S.q=v;clearTimeout(rx_qT);rx_qT=setTimeout(()=>{redraw();const i=document.querySelector('#rxSrch input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);}
function rx_limpar(){rx_S.per=12;rx_S.tema='';rx_S.filtro='todos';rx_S.q='';redraw();}
function rx_fbar(inds){
  const n=inds.filter(rx_okFil).length;
  return `<div class="fbar rx-fb"><div class="fbar-r">
    <span id="rxSrch">${searchCtl('Buscar indicador','rx_q',rx_S.q)}</span>
    <span class="rx-flb">Período</span>${seg([['3','3 meses'],['6','6 meses'],['12','12 meses']],String(rx_S.per),'rx_per')}
    ${selCtl([['','Todos os temas'],...Object.entries(rx_TEMAS)],rx_S.tema,'rx_tema','Tema')}
    <span class="rx-flb">Situação</span>${seg([['todos','Todos'],['desvio','Em desvio'],['meta','Dentro da meta']],rx_S.filtro,'rx_filtro')}
    <span class="sp"></span>
    <span class="fcount"><b>${n}</b> de ${inds.length} indicadores</span>${rx_nFil()?`<button type="button" class="lnk" onclick="rx_limpar()">Limpar filtros</button>`:''}
  </div></div>`;
}
function rx_ind(inds,n){return inds.find(i=>i.n===n);}
function rx_dl(ind){return ind.un==='%'?rx_sg(ind.dl,1)+' p.p.':rx_sg(ind.dl,1)+'%';}
/* distância até a meta, o piso ou o teto */
function rx_dist(ind){
  const cur=ind.sp[ind.sp.length-1], d=cur-ind.metaV;
  /* mesmo rótulo que o indChart usa na linha de referência */
  const lb=ind.refLb||(ind.bom==='baixo'?'teto':/piso/.test(ind.d||'')?'piso':'meta');
  const bom=ind.bom==='baixo'?d<=0:d>=0;
  const art=lb==='meta'||lb==='rede'?'da':'do';
  const abs=ind.un==='%'?nf(Math.abs(d),ind.dec)+' p.p.':rx_fmt(ind,Math.abs(d));
  const r=+d.toFixed(ind.dec);
  const val=(r>0?'+':r<0?'−':'')+abs;
  const tx=ind.bom==='baixo'?(bom?(lb==='teto'?'dentro do teto':`abaixo ${art} ${lb}`):`acima ${art} ${lb}`):(bom?`acima ${art} ${lb}`:`abaixo ${art} ${lb}`);
  return {lb,art,bom,val,tx};
}
function rx_sub(ind){
  const ds=rx_dist(ind), p=[];
  if(!/piso|teto/.test(ind.d)) p.push(ind.d);
  p.push(ds.lb==='meta'?`meta ${ind.meta}`:`${ds.lb} ${rx_fmt(ind,ind.metaV)}`);
  return p.join(' · ');
}
function rx_emp(t,d){return `<div class="rx-emp"><b>${t}</b><span>${d}</span></div>`;}

/* ---------------- topo: dois gráficos ---------------- */
function rx_topo(inds){
  const cob=rx_ind(inds,'Cobertura captação/crédito'), cap=rx_ind(inds,'Captação total'), cre=rx_ind(inds,'Carteira de crédito');
  const sp=cob.sp, last=sp[sp.length-1], abaixo=last<cob.metaV;
  const d3=[sp.length-3,sp.length-2,sp.length-1].filter(i=>i>=1).map(i=>`${rx_L()[i]} <b>${rx_sg(sp[i]-sp[i-1],2)}</b>`);
  const dec=Math.max(...cap.sp,...cre.sp)<50?1:0;
  const gap=cre.sp[cre.sp.length-1]-cap.sp[cap.sp.length-1];
  return `<div class="grid g2 rx-top">
    <div class="card">
      <div class="card-h"><h3>Cobertura captação/crédito</h3><span class="sub">${rx_S.per} meses</span><div class="rx-sp"></div>${INFO({oque:'Quanto da carteira de crédito da agência é coberto pela captação.',como:'Captação total dividida pela carteira de crédito, no fechamento de cada mês. A linha tracejada é o piso interno de 1,05.'})}</div>
      <div class="card-b">
        ${lineChart([{d:sp,c:abaixo?'#A8322A':'#018B6A',fill:true}],rx_L(),{ref:cob.metaV,refLb:'piso',dec:2,h:190,w:480})}
        <div class="rx-fx">
          <span>Hoje <b class="${abaixo?'dn':''}">${nf(last,2)}</b></span>
          <span>Há ${rx_S.per} meses <b>${nf(sp[0],2)}</b></span>
          <span class="rx-m3">Mês a mês: ${d3.join('<i>·</i>')}</span>
        </div>
      </div>
    </div>
    <div class="card">

function rx_prepauta(ag,inds){

              ...ab.map(f=>`${f.id} · em aberto · ${f.exec}% executado`)];
  const res=p?`
    <div class="rx-pb ${w.pauta?(rx_pos(ag).alt?'warn':'ok'):''}" id="rxPos">${rx_posHtml(ag)}</div>
    ${(w.resumo||'').trim()||!rx_pp(ag).editado?`<div class="rx-rs">
      <div class="rx-lb">${IA_TAG}<span>Resumo dos indicadores</span><span class="rx-lbs">editável</span></div>
      ${edTa(w.resumo,'rx_resumo(this.value)',{cls:'rx-rst',rows:2,attr:'aria-label="Resumo dos indicadores"'})}
    </div>`:''}
    <div class="rx-blw">
      <div class="rx-blh"><h4>Blocos da conversa</h4><span class="rx-tot mono" id="rxTot">${rx_totTxt()}</span><div class="rx-sp"></div>
        <button class="btn btn-s" type="button" onclick="rx_add()">${ICON.plus}Adicionar bloco</button></div>
      ${p.length?p.map((b,i)=>rx_bloco(b,i,p.length)).join(''):rx_emp('Nenhum bloco na pré-pauta','Adicione um bloco ou peça uma nova sugestão à IA.')}
    </div>
    <div class="rx-ppf">
      <span class="ai-note">${ICON.spark}Na Pauta, a IA gera as perguntas de cada bloco. Você edita lá.</span><div class="rx-sp"></div>
      ${aiBtn(w.pauta?'Confirmar e gerar as perguntas de novo':'Confirmar pré-pauta e gerar perguntas','rx_confirmar(this)','solid')}
    </div>`
  :`<div class="rx-ph">
      <span class="rx-phi">${ICON.spark}</span>
      <b>Os blocos sugeridos aparecem aqui</b>
      <span>Você edita, reordena, apaga ou cria blocos antes de confirmar.</span>
      <button class="rx-lnk" type="button" onclick="rx_semIA()">ou montar os blocos sem IA</button>
    </div>`;
  return `<div class="card rx-pp" id="rxPre">
    <div class="card-h"><h3>Pré-pauta</h3><span class="sub">sua leitura conduz a sugestão da IA</span><span id="rxSt">${rx_stTag(ag)}</span><div class="rx-sp"></div>
      ${INFO({oque:'Os blocos da conversa, antes das perguntas.',como:'Você escreve a sua leitura dos dados. A IA sugere os blocos a partir da radiografia, dos FCAs anteriores da unidade e da sua leitura. Você edita, reordena, apaga ou cria blocos e confirma: aí a IA gera as perguntas na Pauta.'})}</div>
    <div class="rx-ppg">
      <div class="rx-ppl">
        <div class="rx-lb"><label for="rxLeit">Sua leitura dos dados</label><button type="button" class="rx-lnk" onclick="rx_exemplo()">usar exemplo</button></div>
        ${edTa(w.leitura,'rx_leit(this.value)',{cls:'ed-box rx-leit',rows:5,ph:`O que você enxerga nesses números? O que quer entender com ${AGX[ag].ger.split(' ')[0]}?`,attr:'id="rxLeit"'})}
        <div class="rx-nudge" id="rxNudge"${(w.leitura||'').trim()?' hidden':''}>${ICON.spark}<span>A IA usa a sua leitura para conduzir a sugestão.</span></div>
      </div>
      <div class="rx-base">
        <div class="rx-bt-t">Base da sugestão</div>
        <div class="rx-bi"><span class="ck">${ICON.check}</span><div><b>Radiografia</b><small>${inds.length} indicadores · ${rx_inds(ag).filter(i=>i.st==='ruim'||i.st==='atenc').length} em desvio</small></div></div>
        <div class="rx-bi"><span class="ck ${fcas.length?'':'off'}">${fcas.length?ICON.check:'–'}</span><div><b>${hist.length||!ab.length?'FCAs anteriores da unidade':'FCAs da unidade'}</b>${fcas.length?fcas.map(f=>`<small class="mono">${f}</small>`).join(''):'<small>nenhum registrado</small>'}</div></div>
        <div class="rx-bi" id="rxLeitSt">${rx_leitSt(ag)}</div>
        ${aiBtn(p&&!rx_pp(ag).manual?'Sugerir de novo':'Sugerir pré-pauta com IA','rx_sugerir(this)')}
      </div>
    </div>
    ${res}
  </div>`;
}

function rx_next(w){
  if(w.pauta) return nextBtn('pauta','Pauta da conversa');
  return `<div class="rx-snr"><button class="rx-lnk" type="button" onclick="rx_irPre()">Confirme a pré-pauta para gerar as perguntas</button><button class="btn btn-p" type="button" disabled>Pauta da conversa →</button></div>`;
}

/* ---------------- tela ---------------- */
RENDER.radiografia=()=>{
  const ag=CASO.ag, a=casoAg(), w=ws(ag), inds=rx_inds(ag);
  const acoes=`<button class="btn btn-s" type="button" onclick="go('radar')">Trocar caso</button>
    <button class="btn btn-s" type="button" onclick="rx_irPre()">${ICON.down}Ir para a pré-pauta</button>`;
  return `
  ${casoHead('Agência '+a.n,acoes)}
  ${rx_fbar(inds)}
  ${rx_topo(rx_corta(inds))}
  <div class="rx-mid">${rx_indicadores(ag,rx_corta(inds))}</div>
  ${rx_prepauta(ag,inds)}
  ${stepnav(prevBtn('radar'),rx_next(w))}`;
};
/* a altura dos campos de texto ao mudar a largura (menu recolhido) já é tratada pelo core (growAll) */

</script>
<script>
/* ---- 30_pauta.js ---- */
/* ======================= 3 · PAUTA DA CONVERSA =======================
   As perguntas chegam da pré-pauta confirmada na radiografia (ws().pauta).
   O regional edita tudo: texto das perguntas e dos blocos, ordem, tempo por
   bloco, inclusão e exclusão. A IA só roda por botão (gerar, sugerir).
   Bandeira: pergunta que já apareceu em FCA (outra agência ou reincidência);
   some quando o texto é editado (flagDe compara q.tx com q.orig).          */
const pa_fech={};      // blocos recolhidos: id → true
let pa_focus=null;     // 'q:<id>' ou 'b:<id>': campo que recebe foco depois do redraw
let pa_novo=null;      // pergunta recém-sugerida pela IA (destaque rápido)
let pa_desf=null;      // último item removido, para desfazer pelo toast

/* perguntas que a IA sugere por bloco (botão "Sugerir pergunta") */
const pa_SUG={
  abertura:['O que mudou na agência desde a nossa última conversa?','Que número da agência mais te preocupa hoje, e por quê?'],
  fechamento:['Quem fica responsável por cada ponto e até quando?','Quando voltamos a conversar sobre esses pontos?'],
  extra:['Que apoio da regional faria diferença neste ponto?','Qual número você acompanharia toda semana para saber se está melhorando?','Quem na equipe é o melhor dono para este tema?']
};
/* histórico de perguntas genéricas nas agências sem conversa de exemplo (Pelotas usa PERG_HIST) */
const pa_MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function pa_flagGen(q){
  const ag=CASO.ag;if(ag==='PEL'||!q||q.tx!==q.orig)return null;
  if(q.orig==='O que já foi tentado e qual foi o resultado?'){
    const fa=FCAS_ABERTOS.find(f=>f.ag===ag);if(!fa)return null;
    const d=dataBR(fa.aberto);
    return {tipo:'mesma',fca:fa.id,ag:AGX[ag].n,quando:d?pa_MES[d.getMonth()]+'/'+d.getFullYear():fa.aberto,emAberto:true,
      original:`O que já foi feito para tratar ${pa_min_(fa.tema)}?`,desfecho:`virou o plano em execução · ${fa.exec}% executado`};
  }
  if(q.orig==='Do que a agência precisa para virar esse número nos próximos 60 dias?'){
    const rg=ag==='RGD';
    return {tipo:'outra',fca:rg?'FCA-2025-0187':'FCA-2025-0212',ag:rg?'Vacaria':'Rio Grande',quando:rg?'out/2025':'mar/2025',
      original:'Do que a agência precisa para voltar ao indicador nos próximos 60 dias?',desfecho:'virou ação com responsável e prazo'};
  }
  return null;
}
/* bandeira da pergunta: some quando o texto é editado (q.tx diferente de q.orig) */
function pa_flag(q){return flagDe(q)||pa_flagGen(q);}

/* ---------- utilitários ---------- */
function pa_P(){return ws().pauta||[];}
function pa_bl(id){return pa_P().find(b=>b.id===id);}
function pa_q(bid,qid){const b=pa_bl(bid);return b?b.qs.find(q=>q.id===qid):null;}
function pa_renum(){pa_P().forEach((b,i)=>b.n=i+1);}
function pa_minOf(hm){const m=String(hm||'14:00').match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):840;}
function pa_hm(t){t=((t%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function pa_tot(){return pa_P().reduce((s,b)=>s+(+b.min||0),0);}
function pa_ib(ic,on,t,cls,dis){return ib(ic,on,t,cls||'',{disabled:dis});}
/* minúsculas sem estragar siglas (PF, PJ, RDC) */
function pa_min_(t){return String(t||'').split(' ').map(w=>/^[A-ZÀ-Ú]{2,}$/.test(w)?w:w.toLowerCase()).join(' ');}
function pa_cheia(q){return !!String(q.tx||'').trim();}
/* palavras de uma pergunta, para não sugerir uma quase igual à que já existe */
function pa_pal(t){return new Set(String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3));}
function pa_parecida(a,b){const A=pa_pal(a),B=pa_pal(b);if(!A.size||!B.size)return false;let n=0;A.forEach(w=>{if(B.has(w))n++;});return n/(A.size+B.size-n)>=0.5;}

/* ---------- marcações da pergunta: bandeira, editada, sua ---------- */
function pa_meta(b,q){
  const f=pa_flag(q);
  if(f)return flagChip(f);
  if(q.orig&&q.tx!==q.orig){
    const h=pa_flag({tx:q.orig,orig:q.orig});
    return `<span class="pa-ed">${ICON.edit}<span>${h?'Editada · sem o histórico de FCA':'Editada'}</span><button type="button" onclick="pa_qUndo('${b.id}','${q.id}')">desfazer</button></span>`;
  }
  if(!q.orig)return `<span class="pa-mine">${ICON.user}<span>Sua pergunta</span></span>`;
  return '';
}
function pa_bmeta(b){
  const og=b.origem||'padrão';
  const tg=og.startsWith('sinal')?`<span class="tag t-tl">${esc(og)}</span>`
    :og==='seu'?'<span class="tag t-gd">seu bloco</span>':`<span class="tag t-gy">${esc(og)}</span>`;
  const n=b.qs.filter(pa_cheia).length,f=b.qs.filter(q=>pa_flag(q)).length;
  return `${tg}<span>${n} pergunta${n===1?'':'s'}</span>${f?`<span class="pa-bm-f">${ICON.flag}${f} com histórico em FCA</span>`:''}`;
}

/* ---------- edição (sem redraw enquanto digita) ---------- */
function pa_qTx(bid,qid,v){
  const b=pa_bl(bid),q=pa_q(bid,qid);if(!q)return;
  q.tx=v;
  const el=document.getElementById('paf_'+qid);if(el)el.innerHTML=pa_meta(b,q);
  const bm=document.getElementById('pabm_'+bid);if(bm)bm.innerHTML=pa_bmeta(b);
  pa_res();pa_ntLive();
}
function pa_bT(bid,v){const b=pa_bl(bid);if(!b)return;b.t=v;pa_res();}
function pa_bC(bid,v){const b=pa_bl(bid);if(b)b.ctx=v;}
function pa_min(bid,v){
  const b=pa_bl(bid);if(!b)return;
  const n=parseInt(v,10);b.min=isNaN(n)?0:Math.max(0,Math.min(180,n));
  pa_res();
}
function pa_minBlur(bid,el){const b=pa_bl(bid);if(b&&String(el.value)!==String(b.min))el.value=b.min;}
function pa_kT(e,el){if(e.key==='Enter'){e.preventDefault();el.blur();}}
function pa_kQ(e,bid,qid){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();pa_qAdd(bid,qid);}}

/* ---------- ações explícitas (com redraw) ---------- */
function pa_qUndo(bid,qid){const q=pa_q(bid,qid);if(!q)return;q.tx=q.orig;redraw();toast('Texto original da pergunta restaurado','↺');}
function pa_qAdd(bid,after){
  const b=pa_bl(bid);if(!b)return;
  const q={id:uid('q'),tx:'',orig:''};
  const i=after?b.qs.findIndex(x=>x.id===after)+1:b.qs.length;
  b.qs.splice(i,0,q);pa_fech[bid]=false;pa_focus='q:'+q.id;redraw();
}
function pa_qDel(bid,qid){
  const b=pa_bl(bid);if(!b)return;
  const i=b.qs.findIndex(q=>q.id===qid);if(i<0)return;
  const [q]=b.qs.splice(i,1);pa_desf={t:'q',bid,i,q};redraw();
  toast(`Pergunta removida <button type="button" class="pa-undo" onclick="pa_undo()">Desfazer</button>`,ICON.trash);
}
function pa_qMv(bid,qid,d){
  const b=pa_bl(bid);if(!b)return;
  const i=b.qs.findIndex(q=>q.id===qid),j=i+d;if(i<0||j<0||j>=b.qs.length)return;
  [b.qs[i],b.qs[j]]=[b.qs[j],b.qs[i]];redraw();
}
function pa_bMv(bid,d){
  const P=pa_P(),i=P.findIndex(b=>b.id===bid),j=i+d;if(i<0||j<0||j>=P.length)return;
  [P[i],P[j]]=[P[j],P[i]];pa_renum();redraw();
}
function pa_bDel(bid){
  const P=pa_P(),i=P.findIndex(b=>b.id===bid);if(i<0)return;
  const [b]=P.splice(i,1);pa_renum();pa_desf={t:'b',i,b};redraw();
  toast(`Bloco removido <button type="button" class="pa-undo" onclick="pa_undo()">Desfazer</button>`,ICON.trash);
}
function pa_bAdd(){
  const P=pa_P();
  const b={id:uid('b'),k:null,n:0,t:'',ctx:'',min:10,origem:'seu',qs:[{id:uid('q'),tx:'',orig:''}]};
  const fi=P.findIndex(x=>x.k==='fechamento');
  P.splice(fi>=0?fi:P.length,0,b);pa_renum();pa_focus='b:'+b.id;redraw();
}
function pa_undo(){
  const d=pa_desf;if(!d)return;pa_desf=null;
  if(d.t==='q'){const b=pa_bl(d.bid);if(b)b.qs.splice(Math.min(d.i,b.qs.length),0,d.q);}
  else{const P=pa_P();P.splice(Math.min(d.i,P.length),0,d.b);pa_renum();}
  redraw();toast('Restaurado','↺');
}
function pa_tg(bid){
  pa_fech[bid]=!pa_fech[bid];
  const el=document.getElementById('pab_'+bid);
  if(el){el.classList.toggle('fech',!!pa_fech[bid]);
    const t=el.querySelector('.pa-tgl');if(t){t.setAttribute('aria-expanded',String(!pa_fech[bid]));t.title=pa_fech[bid]?'Expandir bloco':'Recolher bloco';}
    if(!pa_fech[bid])el.querySelectorAll('.ed-ta').forEach(autoGrow);}
  const a=document.getElementById('pa_tga');if(a)a.textContent=pa_P().some(b=>pa_fech[b.id])?'Expandir todos':'Recolher todos';
}
function pa_tgAll(){const P=pa_P(),algum=P.some(b=>pa_fech[b.id]);P.forEach(b=>pa_fech[b.id]=!algum);redraw();}

/* ---------- IA por botão ---------- */
function pa_gerar(btn){
  aiRun(btn,()=>{const ag=CASO.ag;if(!ws(ag).prepauta)sugerirPrePauta(ag);gerarPauta(ag);redraw();toast('Perguntas geradas a partir da pré-pauta',ICON.spark);},1400,'Gerando perguntas…');
}
function pa_sug(btn,bid){
  aiRun(btn,()=>{
    const b=pa_bl(bid);if(!b){redraw();return;}
    const tem=[];pa_P().forEach(x=>x.qs.forEach(q=>{if(pa_cheia(q))tem.push(q.tx.trim());}));
    const base=b.k==='abertura'||b.k==='fechamento'?pa_SUG[b.k]:perguntasPadrao(b).slice(1);
    const cand=[...base,...pa_SUG.extra].find(t=>!tem.some(x=>x===t||pa_parecida(x,t)));
    if(!cand){redraw();toast('Sem novas sugestões para este bloco',ICON.spark);return;}
    const q={id:uid('q'),tx:cand,orig:cand};b.qs.push(q);pa_novo=q.id;pa_fech[bid]=false;
    redraw();toast('Pergunta sugerida adicionada ao bloco '+(pa_P().indexOf(b)+1),ICON.spark);
  },900,'Sugerindo…');
}
function pa_share(){toast('Pauta enviada para '+esc(casoAg().ger),ICON.share);}
function pa_export(){toast('Pauta exportada em PDF',ICON.export);}

/* ---------- resumo (atualiza ao vivo, sem campos dentro) ---------- */
function pa_resHtml(){
  const P=pa_P(),tot=pa_tot(),nq=P.reduce((s,b)=>s+b.qs.filter(pa_cheia).length,0);
  const ini=0;let t=0;
  const rows=P.map((b,i)=>{const r=`<div class="pa-rt"><span class="h mono">${ini+t}'</span><span class="n mono">${i+1}</span><span class="t" title="${esc(b.t)}">${b.t.trim()?esc(b.t):'<i>Bloco sem título</i>'}</span><span class="m mono">${+b.min||0} min</span></div>`;t+=(+b.min||0);return r;}).join('');
  const fim=ini+tot;
  return `<div class="pa-kp">
      <div><b class="mono">${P.length}</b><span>blocos</span></div>
      <div><b class="mono">${nq}</b><span>perguntas</span></div>
      <div><b class="mono">${tot}<small> min</small></b><span>duração</span></div>
    </div>
    <div class="pa-lb">Roteiro <span class="pa-lbs">minuto de início de cada bloco</span></div>
    <div class="pa-rl">${rows}
      <div class="pa-rt fim"><span class="h mono">${fim}'</span><span class="n"></span><span class="t">Duração total</span><span></span></div>
    </div>
`;
}
function pa_res(){const el=document.getElementById('pa_res');if(el)el.innerHTML=pa_resHtml();}

/* ---------- nota do copiloto ---------- */
function pa_nti(it){return `<div class="pa-nti"><p>${it.tx}</p>${why(it.ev,'ver base desta nota')}</div>`;}
/* perguntas com reincidência nesta agência (a linha da nota acompanha a edição das perguntas) */
function pa_ms(){const ms=[];pa_P().forEach(b=>b.qs.forEach(q=>{const f=pa_flag(q);if(f&&f.tipo==='mesma')ms.push(f);}));return ms;}
function pa_ntRei(ms){
  if(!ms.length)return '';
  const f=ms[0],n=ms.length;
  const tx=f.emAberto
    ?`${n===1?'Uma pergunta retoma':n+' perguntas retomam'} o <b>${esc(f.fca)}</b> (${esc(f.quando)}), ainda em execução. Vale perguntar o que mudou desde então antes de propor ação nova.`
    :`${n===1?'Uma pergunta repete':n+' perguntas repetem'} um tema do <b>${esc(f.fca)}</b> (${esc(f.quando)}), que ${esc(f.desfecho.split(' · ')[0])}. Desta vez, vale fechar com responsável e prazo.`;
  return pa_nti({tx,ev:[['FCA anterior',esc(f.fca+' · '+f.quando)],['Desfecho',esc(f.desfecho)]]});
}
function pa_ntLive(){
  const el=document.getElementById('pa_ntm');if(!el)return;
  const ms=pa_ms(),k=ms.map(f=>f.fca).join('|');
  if(el.dataset.k!==k){el.dataset.k=k;el.innerHTML=pa_ntRei(ms);}
}
function pa_nota(){
  const ag=CASO.ag,its=[],ms=pa_ms();
  if(ag==='PEL')its.push({tx:'Na visita de <b>11/04</b> a conversa foi sobre crédito rural e a cobertura não entrou na pauta, embora já estivesse em queda havia dois meses. Vale abrir reconhecendo isso, em vez de tratar o tema como novidade.',
    ev:[['Menções a captação na visita de 11/04','0'],['Cobertura captação/crédito em abril','1,09'],['FCA aberto sobre captação na ocasião','nenhum']]});
  const fa=FCAS_ABERTOS.find(f=>f.ag===ag);
  if(fa)its.push({tx:`O <b>${fa.id}</b> (${esc(pa_min_(fa.tema))}) segue em aberto, com ${fa.exec}% executado${fa.atraso?` e ${fa.atraso} ${fa.atraso===1?'ação':'ações'} em atraso`:''}. Vale retomar o andamento antes de abrir o tema novo.`,
    ev:[['Execução do plano',fa.exec+'%'],['Ações em atraso',String(fa.atraso)],['Prazo final',fa.prazo]]});
  if(!its.length){const s=casoSig();
    its.push({tx:'A unidade não tem FCA em aberto. Se a conversa gerar ações, combine no fechamento quem cuida de cada uma e até quando.',
      ev:[['FCAs em aberto na unidade','nenhum'],['Sinal que motivou a conversa',s?s.id:'—']]});}
  return `<div class="card pa-nt">
    <div class="card-h"><h3>Nota do copiloto</h3>${IA_TAG}<div style="flex:1"></div>${INFO('Observações do copiloto a partir das conversas e dos FCAs anteriores da unidade. Abra "ver base desta nota" para ver as evidências.')}</div>
    <div class="card-b pa-ntl">${its.map(pa_nti).join('')}<div class="pa-ntm" id="pa_ntm" data-k="${esc(ms.map(f=>f.fca).join('|'))}">${pa_ntRei(ms)}</div></div>
  </div>`;
}

/* ---------- blocos e perguntas ---------- */
function pa_qRow(b,q,j,bi){
  const last=j===b.qs.length-1,num=`${bi+1}.${j+1}`;
  /* mover fica na margem à esquerda (aparece ao passar o mouse) para não tirar largura do texto */
  return `<li class="pa-q ${q.id===pa_novo?'nw':''}">
    <div class="pa-mv">
      ${pa_ib(icon('up',12),`pa_qMv('${b.id}','${q.id}',-1)`,'Mover pergunta para cima','',j===0)}
      ${pa_ib(icon('down',12),`pa_qMv('${b.id}','${q.id}',1)`,'Mover pergunta para baixo','',last)}
    </div>
    <span class="pa-qn mono">${num}</span>
    <div class="pa-qb">
      ${edTa(q.tx,`pa_qTx('${b.id}','${q.id}',this.value)`,{cls:'pa-qt',rows:1,ph:'Escreva a pergunta…',attr:`data-q="${q.id}" aria-label="Pergunta ${num}" onkeydown="pa_kQ(event,'${b.id}','${q.id}')"`})}
      <div class="pa-qm" id="paf_${q.id}">${pa_meta(b,q)}</div>
    </div>
    ${pa_ib('trash',`pa_qDel('${b.id}','${q.id}')`,'Excluir pergunta','del pa-qx')}
  </li>`;
}
function pa_blk(b,i,P){
  const fech=!!pa_fech[b.id],sig=(b.origem||'').startsWith('sinal');
  return `<section class="pa-blk ${fech?'fech':''} ${sig?'pa-sig':''}" id="pab_${b.id}">
    <div class="pa-bh">
      <span class="pa-num mono">${i+1}</span>
      <div class="pa-btw">
        ${edTa(b.t,`pa_bT('${b.id}',this.value)`,{cls:'pa-bt',rows:1,ph:'Título do bloco',attr:`data-b="${b.id}" aria-label="Título do bloco ${i+1}" onkeydown="pa_kT(event,this)"`})}
        <div class="pa-bm" id="pabm_${b.id}">${pa_bmeta(b)}</div>
      </div>
      <label class="pa-min" title="Tempo do bloco, em minutos">${ICON.clock}<input type="number" class="ed-n" min="0" max="180" step="1" value="${+b.min||0}" aria-label="Minutos do bloco ${i+1}" oninput="pa_min('${b.id}',this.value)" onblur="pa_minBlur('${b.id}',this)"><span>min</span></label>
      <div class="pa-ba">
        ${pa_ib('up',`pa_bMv('${b.id}',-1)`,'Mover bloco para cima','',i===0)}
        ${pa_ib('down',`pa_bMv('${b.id}',1)`,'Mover bloco para baixo','',i===P.length-1)}
        ${pa_ib('trash',`pa_bDel('${b.id}')`,'Excluir bloco','del')}
      </div>
      <button type="button" class="ib pa-tgl" title="${fech?'Expandir bloco':'Recolher bloco'}" aria-expanded="${!fech}" onclick="pa_tg('${b.id}')">${ICON.chev}</button>
    </div>
    <div class="pa-bb">
      ${edTa(b.ctx||'',`pa_bC('${b.id}',this.value)`,{cls:'pa-ctx',rows:1,ph:'Contexto do bloco (opcional)',attr:`aria-label="Contexto do bloco ${i+1}"`})}
      ${b.qs.length?`<ol class="pa-ql">${b.qs.map((q,j)=>pa_qRow(b,q,j,i)).join('')}</ol>`:'<div class="pa-q0">Nenhuma pergunta neste bloco.</div>'}
      <div class="pa-bf">
        <button type="button" class="btn btn-xs" onclick="pa_qAdd('${b.id}')">${ICON.plus}<span>Adicionar pergunta</span></button>
      </div>
    </div>
  </section>`;
}

/* ---------- tela ---------- */
RENDER.pauta=()=>{
  const w=ws(),P=w.pauta||[];
  if(!P.length){
    const txt=w.prepauta?'A pré-pauta já está pronta na radiografia. Gere as perguntas para começar a editar.'
      :'A pauta nasce da pré-pauta, no fim da radiografia, a partir da sua leitura dos dados. Se preferir, gere agora com a pré-pauta sugerida pelo copiloto.';
    return `${casoHead('Pauta da conversa')}
      ${emptyState(`<span class="pa-emp-ic">${icon('note',26)}</span>`,'Ainda não há perguntas para esta conversa',txt,
        aiBtn('Gerar perguntas a partir da pré-pauta sugerida','pa_gerar(this)','solid')+`<button type="button" class="btn" onclick="go('radiografia')">← Voltar para a radiografia</button>`)}`;
  }
  const acoes=`<button type="button" class="btn btn-s" onclick="pa_share()">${ICON.share}<span>Compartilhar com a agência</span></button>
    <button type="button" class="btn btn-s" onclick="pa_export()">${ICON.export}<span>Exportar</span></button>`;
  const algum=P.some(b=>pa_fech[b.id]);
  return `${casoHead('Pauta da conversa',acoes)}
  <div class="pa-g">
    <div class="pa-main">
      <div class="pa-tb">
        <h3>Blocos e perguntas</h3>
        <span class="s">geradas a partir da pré-pauta · tudo editável</span>
        <span class="sp"></span>
        <button type="button" class="pa-lnk" onclick="go('radiografia')">Rever pré-pauta</button>
        <span class="pa-vs"></span>
        <button type="button" class="pa-lnk" id="pa_tga" onclick="pa_tgAll()">${algum?'Expandir todos':'Recolher todos'}</button>
        ${INFO({oque:'As perguntas que a IA gerou a partir da pré-pauta confirmada na radiografia. Você edita o texto, a ordem, o tempo de cada bloco e pode incluir ou excluir perguntas e blocos.',
          como:'A bandeira mostra que a pergunta já apareceu em um FCA: azul para outra agência, âmbar para reincidência nesta agência. Se você editar o texto, a bandeira some, porque a pergunta deixa de ser a mesma.',
          obs:'Enter cria uma nova pergunta logo abaixo. Shift + Enter quebra a linha.'})}
      </div>
      ${P.map((b,i)=>pa_blk(b,i,P)).join('')}
      <button type="button" class="btn pa-addb" onclick="pa_bAdd()">${ICON.plus}<span>Adicionar bloco</span></button>
    </div>
    <aside class="pa-side">
      <div class="card">
        <div class="card-h"><h3>Resumo da pauta</h3><div style="flex:1"></div>${INFO({oque:'Quantos blocos e perguntas a pauta tem e o roteiro com o minuto em que cada bloco começa.',como:'A duração é a soma dos tempos que você definiu em cada bloco.'})}</div>
        <div class="card-b" id="pa_res">${pa_resHtml()}</div>
      </div>
      ${pa_nota()}
    </aside>
  </div>
  ${stepnav(prevBtn('radiografia'),nextBtn('captura','Ir para a captura'))}`;
};
/* a altura dos campos ao recolher o menu é reajustada pelo core (ResizeObserver em #view) */
AFTER.pauta=()=>{
  if(pa_focus){
    const [k,id]=pa_focus.split(':');pa_focus=null;
    const el=document.querySelector(k==='b'?`[data-b="${id}"]`:`[data-q="${id}"]`);
    if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'center',behavior:'smooth'});}
  }
  pa_novo=null;
};

</script>
<script>
/* ---- 40_captura.js ---- */
/* ======================= 4a · CAPTURA DA CONVERSA =======================
   Só o upload da gravação (Teams e gravação no app ficam para uma próxima
   fase) e as anotações do regional em cada pergunta da pauta, feitas durante
   a reunião. "Processar" é um botão de IA: transcreve, encaixa as anotações
   na transcrição e extrai candidatos a FCA para a conversa registrada.     */
const cp_run={};       // processamento em andamento por agência: ag → passo (0..3)
const cp_sujo={};      // mudanças depois do processamento: ag → true
let cp_tmr=null;

/* anotações de exemplo para agências sem conversa gravada de exemplo */
const cp_GEN={
  abertura:['Leitura do período alinhada com os números; reconhece o tema principal.'],
  tema:['Atribui o desvio a uma mudança recente na equipe; não tinha visão consolidada do número.',null,'Pediu a lista dos casos prioritários e acompanhamento quinzenal com a regional.'],
  fechamento:['Combinado tratar o tema em FCA, com revisão em 30 dias.']
};
const cp_GERAL_GEN='Pediu para receber o alerta do radar junto com a regional, antes da próxima conversa.';

/* ---------- utilitários ---------- */
function cp_P(){return ws().pauta||[];}
function cp_qs(b){return b.qs.filter(q=>(q.tx||'').trim());}
function cp_tem(v){return !!String(v||'').trim();}
function cp_cont(){
  const w=ws();let n=0,t=0;
  cp_P().forEach(b=>cp_qs(b).forEach(q=>{t++;if(cp_tem(w.notas[q.id]))n++;}));
  return {n,t,g:cp_tem(w.notaGeral)};
}
function cp_pode(){const w=ws(),c=cp_cont();return !!w.audio||c.n>0||c.g;}
function cp_tam(b){return b>=1048576?nf(b/1048576,1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}
function cp_dur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0');}
function cp_marcaSujo(){if(ws().processado)cp_sujo[CASO.ag]=true;const d=document.getElementById('cp_dirty');if(d&&cp_sujo[CASO.ag])d.hidden=false;}

/* ---------- gravação: upload ---------- */
function cp_pick(){const i=document.getElementById('cp_fi');if(i)i.click();}
function cp_fileSel(inp){const f=inp.files&&inp.files[0];if(f)cp_setFile(f);inp.value='';}
function cp_dov(e){e.preventDefault();e.currentTarget.classList.add('on');}
function cp_dlv(e){e.currentTarget.classList.remove('on');}
function cp_drp(e){e.preventDefault();e.currentTarget.classList.remove('on');const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)cp_setFile(f);}
function cp_setFile(f){
  const ok=/^(audio|video)\//.test(f.type||'')||/\.(mp3|m4a|wav|mp4|aac|ogg|oga|webm|mov|wma|flac)$/i.test(f.name||'');
  if(!ok){toast('Formato não suportado. Envie um arquivo de áudio ou vídeo.','!');return;}
  const w=ws(),ag=CASO.ag;
  w.audio={nome:f.name,tam:cp_tam(f.size||0),dur:'…',real:true};
  cp_marcaSujo();redraw();toast('Arquivo anexado: '+esc(f.name),ICON.upload);
  /* lê a duração do arquivo no próprio navegador (nada é enviado) */
  try{
    const url=URL.createObjectURL(f),m=document.createElement(/^video\//.test(f.type)?'video':'audio');
    m.preload='metadata';
    const fim=d=>{const a=ws(ag).audio;if(a&&a.nome===f.name){a.dur=d;const el=document.getElementById('cp_dur');if(el&&CASO.ag===ag)el.textContent=d;}URL.revokeObjectURL(url);};
    m.onloadedmetadata=()=>fim(isFinite(m.duration)&&m.duration>0?cp_dur(m.duration):'duração indisponível');
    m.onerror=()=>fim('duração indisponível');
    m.src=url;
  }catch(e){const a=ws(ag).audio;if(a)a.dur='duração indisponível';}
}
function cp_ex(){ws().audio=audioExemplo();cp_marcaSujo();redraw();toast('Áudio de exemplo anexado',ICON.upload);}
function cp_rm(){ws().audio=null;cp_marcaSujo();redraw();toast('Arquivo removido',ICON.trash);}

/* ---------- anotações (sem redraw enquanto digita) ---------- */
function cp_nota(bid,qid,v){
  const w=ws();w.notas[qid]=v;w.notasSalvas=false;
  const r=document.getElementById('cpq_'+qid);if(r)r.classList.toggle('has',cp_tem(v));
  cp_marcaSujo();cp_live(bid);
}
function cp_geral(v){const w=ws();w.notaGeral=v;w.notasSalvas=false;cp_marcaSujo();cp_live();}
function cp_cntHtml(b){const w=ws(),qs=cp_qs(b),n=qs.filter(q=>cp_tem(w.notas[q.id])).length;return {n,t:qs.length};}
function cp_live(bid){
  const b=bid&&cp_P().find(x=>x.id===bid);
  if(b){const c=cp_cntHtml(b),el=document.getElementById('cpc_'+bid);
    if(el){el.textContent=`${c.n}/${c.t}`;el.className='cp-cnt'+(c.n?(c.n===c.t?' all':' on'):'');}}
  const c=cp_cont(),pode=cp_pode();
  const set=(id,h)=>{const el=document.getElementById(id);if(el)el.innerHTML=h;};
  set('cp_prog',cp_progHtml(c));set('cp_sv',cp_svHtml());set('cp_inp',cp_inHtml());
  const bt=document.getElementById('cp_go');if(bt&&!bt.classList.contains('is-loading'))bt.disabled=!pode||cp_run[CASO.ag]!=null;
  const h=document.getElementById('cp_hint');if(h)h.style.display=pode?'none':'';
}
function cp_salvar(){
  const w=ws(),c=cp_cont();
  if(!c.n&&!c.g){toast('Ainda não há anotações para salvar','!');return;}
  w.notasSalvas=true;cp_live();toast('Anotações salvas',ICON.check);
}
function cp_tgAll(){const P=cp_P(),todos=P.every(b=>ACC['cp_'+b.id]);P.forEach(b=>ACC['cp_'+b.id]=!todos);redraw();}
function cp_exemplo(){
  const w=ws(),pel=DEMO_OK();let n=0;
  cp_P().forEach(b=>cp_qs(b).forEach((q,j)=>{
    if(cp_tem(w.notas[q.id]))return;
    let tx=null;
    if(pel){const ex=NOTAS_EX[q.orig];if(ex&&q.tx===q.orig)tx=ex.tx;}
    else{const k=b.k==='abertura'||b.k==='fechamento'?b.k:'tema';tx=(cp_GEN[k]||[])[j]||null;}
    if(tx){w.notas[q.id]=tx;n++;ACC['cp_'+b.id]=true;}
  }));
  if(!cp_tem(w.notaGeral)){w.notaGeral=pel?NOTA_GERAL_EX.tx:cp_GERAL_GEN;n++;}
  w.notasSalvas=false;
  if(n)cp_marcaSujo();
  redraw();toast(n?`${n} anotaç${n===1?'ão':'ões'} de exemplo preenchida${n===1?'':'s'}`:'As perguntas de exemplo já têm anotações',ICON.note);
}

/* ---------- processamento (IA por botão) ---------- */
function cp_passos(){
  const w=ws(),c=cp_cont(),a=w.audio,n=c.n+(c.g?1:0),pel=DEMO_OK();
  const nf_=COMPROMISSOS.filter(x=>x.tipo==='fca').length;
  return [
    ['Envio',a?`${esc(a.nome)} · ${esc(a.tam)}`:'sem áudio · só as anotações'],
    ['Transcrição',a?(pel&&!a.real?`${esc(a.dur)} de conversa · 2 vozes identificadas`:`${esc(a.dur)} de conversa`):'sem áudio para transcrever'],
    ['Encaixe das anotações na transcrição',!n?'nenhuma anotação':a?`${n} anotaç${n===1?'ão':'ões'} no momento da fala`:`${n} anotaç${n===1?'ão':'ões'} por pergunta · sem transcrição`],
    ['Extração de candidatos a FCA',pel?`${COMPROMISSOS.length} candidatos · ${nf_} para FCA e ${COMPROMISSOS.length-nf_} registros`:'candidatos prontos para revisão']
  ];
}
/* depois de processar: resumo curto do resultado (as etapas aparecem só durante o processamento) */
function cp_okHtml(){
  const w=ws(),c=cp_cont(),a=w.audio,n=c.n+(c.g?1:0),pel=DEMO_OK();
  const nf_=COMPROMISSOS.filter(x=>x.tipo==='fca').length;
  const rows=[
    ['Transcrição',a?(pel&&!a.real?`${esc(a.dur)} · 2 vozes`:esc(a.dur)):'sem áudio'],
    ['Anotações',!n?'nenhuma':a?`${n} encaixada${n===1?'':'s'} na fala`:`${n} por pergunta`],
    ['Candidatos a FCA',pel?`${COMPROMISSOS.length} itens · ${nf_} para FCA`:'a revisar']
  ];
  return `<div class="cp-ok-h">${ICON.check}<span>Conversa processada</span></div>
    ${rows.map(([l,v])=>`<div class="cp-ok-r"><span>${l}</span><b>${v}</b></div>`).join('')}`;
}
function cp_stepsHtml(p){
  return cp_passos().map(([t,d],i)=>{
    const s=i<p?'':i===p?'run':'wait';
    return `<div class="prc ${s}"><span class="st">${i<p?ICON.check:i===p?'<span class="spin"></span>':''}</span><div><b>${t}</b><span>${i<p?d:i===p?'em andamento…':'na fila'}</span></div></div>`;
  }).join('');
}
function cp_proc(btn){
  const ag=CASO.ag,w=ws();
  if(cp_run[ag]!=null)return;
  if(!cp_pode()){toast('Envie o áudio ou faça ao menos uma anotação para processar','!');return;}
  w.notasSalvas=true;cp_run[ag]=0;
  const st=document.getElementById('cp_steps');if(st)st.innerHTML=cp_stepsHtml(0);
  const sv=document.getElementById('cp_sv');if(sv)sv.innerHTML=cp_svHtml();
  const d=document.getElementById('cp_dirty');if(d)d.hidden=true;
  const ok=document.getElementById('cp_ok');if(ok)ok.hidden=true;
  clearInterval(cp_tmr);
  cp_tmr=setInterval(()=>{
    if(cp_run[ag]==null){clearInterval(cp_tmr);return;}
    cp_run[ag]=Math.min(cp_run[ag]+1,3);
    if(ATUAL==='captura'&&CASO.ag===ag){const el=document.getElementById('cp_steps');if(el)el.innerHTML=cp_stepsHtml(cp_run[ag]);}
  },700);
  aiRun(btn,()=>{
    clearInterval(cp_tmr);delete cp_run[ag];
    processarConversa(ag);cp_sujo[ag]=false;
    if(ATUAL==='captura')redraw();
    toast('Conversa processada · pronta para revisão',ICON.check);
  },2900,'Processando…');
}
function cp_gerar(btn){
  aiRun(btn,()=>{const ag=CASO.ag;if(!ws(ag).prepauta)sugerirPrePauta(ag);gerarPauta(ag);redraw();toast('Pauta gerada a partir da pré-pauta',ICON.spark);},1400,'Gerando pauta…');
}

/* ---------- pedaços da tela ---------- */
function cp_progHtml(c){
  const p=c.t?Math.round(c.n/c.t*100):0;
  return `<span><b>${c.n}</b> de ${c.t} perguntas anotadas${c.g?'<span class="cp-pg-g"> · anotação geral</span>':''}</span><span class="bar cp-bar"><i style="width:${p}%"></i></span>`;
}
function cp_svHtml(){
  const w=ws(),c=cp_cont();
  if(!c.n&&!c.g)return '<span class="cp-mu">Nenhuma anotação ainda</span>';
  return w.notasSalvas?`<span class="cp-sv-ok">${ICON.check}<span>Anotações salvas</span></span>`:'<span class="cp-sv-no"><i></i>Alterações não salvas</span>';
}
function cp_inHtml(){
  const w=ws(),c=cp_cont(),a=w.audio;
  const row=(ok,lb,v,id)=>`<div class="cp-ir ${ok?'ok':''}"><span class="ck">${ok?ICON.check:''}</span><span class="lb">${lb}</span><span class="v"${id?` id="${id}"`:''} title="${ok?v:''}">${v}</span></div>`;
  return row(!!a,'Áudio',a?esc(a.nome):'não enviado')
    +row(c.n||c.g,'Anotações',c.n||c.g?`${c.n} de ${c.t} perguntas${c.g?' + gerais':''}`:'nenhuma');
}
function cp_bloco(b,i){
  const w=ws(),qs=cp_qs(b),c=cp_cntHtml(b);
  const head=`<span class="cp-num mono">${i+1}</span><span class="cp-bt">${b.t.trim()?esc(b.t):'<i>Bloco sem título</i>'}</span>
    <span class="cp-cnt${c.n?(c.n===c.t?' all':' on'):''}" id="cpc_${b.id}" title="perguntas anotadas">${c.n}/${c.t}</span><span class="cp-bmin mono">${+b.min||0} min</span>`;
  const body=qs.length?qs.map((q,j)=>`
    <div class="cp-q ${cp_tem(w.notas[q.id])?'has':''}" id="cpq_${q.id}">
      <span class="cp-qn mono"><i class="cp-dot"></i>${i+1}.${j+1}</span>
      <div class="cp-qc">
        <div class="cp-qt">${esc(q.tx)}</div>
        ${edTa(w.notas[q.id]||'',`cp_nota('${b.id}','${q.id}',this.value)`,{cls:'ed-box cp-ta',rows:1,ph:'Anotar a resposta…',attr:`aria-label="Anotação da pergunta ${i+1}.${j+1}"`})}
      </div>
    </div>`).join(''):'<div class="cp-q0">Este bloco não tem perguntas. Use as anotações gerais.</div>';
  return acc('cp_'+b.id,head,body,{open:i===0||c.n>0,cls:'flat cp-acc'});
}
function cp_upCard(){
  const a=ws().audio;
  const fi='<input type="file" id="cp_fi" accept="audio/*,video/*" hidden onchange="cp_fileSel(this)">';
  const corpo=a?`<div class="cp-file">
        <span class="cp-file-ic">${icon('file',16)}</span>
        <div class="cp-file-t"><b title="${esc(a.nome)}">${esc(a.nome)}</b><span><span id="cp_dur">${esc(a.dur||'…')}</span> · ${esc(a.tam||'')}</span></div>
        ${ib('upload','cp_pick()','Trocar arquivo')}${ib('trash','cp_rm()','Remover arquivo','del')}
      </div>${fi}`
    :`<div class="cp-drop" ondragover="cp_dov(event)" ondragleave="cp_dlv(event)" ondrop="cp_drp(event)">
        <span class="cp-drop-ic">${icon('upload',18)}</span>
        <b>Arraste o arquivo de áudio ou vídeo</b>
        <span>mp3, m4a, wav ou mp4 · até 4 horas</span>
        <div class="cp-drop-b"><button type="button" class="btn btn-s" onclick="cp_pick()">Escolher arquivo</button><button type="button" class="cp-lnk" onclick="cp_ex()">Usar áudio de exemplo</button></div>
      </div>${fi}`;
  return `<div class="card">
    <div class="card-h"><h3>Gravação</h3><span class="sub">opcional</span><div style="flex:1"></div>${INFO({oque:'O arquivo de áudio ou vídeo da conversa, gravado no celular, no Teams ou em qualquer outro aparelho.',como:'Ao processar, o copiloto transcreve a conversa, separa as vozes e encaixa as suas anotações no momento em que cada assunto foi falado.'})}</div>
    <div class="card-b">
      ${corpo}
      <div class="cp-cons">${ICON.lock}<span>Ao enviar, você confirma que os participantes consentiram com a gravação.</span></div>
      <div class="cp-fut"><span class="tag t-gy">Próxima fase</span><span>Integração com o Teams e gravação direto pelo app.</span></div>
    </div>
  </div>`;
}
function cp_procCard(){
  const w=ws(),ag=CASO.ag,run=cp_run[ag]!=null,feito=w.processado&&!run,pode=cp_pode();
  let corpo=`<div class="cp-in" id="cp_inp">${cp_inHtml()}</div>`;
  if(feito){
    corpo+=`<div class="cp-ok" id="cp_ok">${cp_okHtml()}</div><div class="cp-steps" id="cp_steps"></div>
      <button type="button" class="btn btn-p cp-full" onclick="go('reuniao')">Ver conversa registrada →</button>
      <div class="cp-dirty" id="cp_dirty"${cp_sujo[ag]?'':' hidden'}><span>Há mudanças desde o último processamento.</span>${aiBtn('Processar novamente','cp_proc(this)','btn-xs')}</div>
      ${DEMO_OK()?'':'<div class="cp-mu2">Na demonstração, a conversa gravada de exemplo é a de Pelotas.</div>'}`;
  }else{
    corpo+=(run?'<button type="button" class="btn btn-ai solid cp-full is-loading" id="cp_go" disabled><span class="spin"></span><span>Processando…</span></button>'
      :aiBtn('Processar áudio e anotações','cp_proc(this)','solid cp-full',{id:'cp_go',disabled:!pode}))
      +`<div class="cp-hint" id="cp_hint"${pode||run?' style="display:none"':''}>Envie o áudio ou faça ao menos uma anotação para processar.</div>
      <div class="cp-steps" id="cp_steps">${run?cp_stepsHtml(cp_run[ag]):''}</div>`;
  }
  return `<div class="card cp-pc">
    <div class="card-h"><h3>Processamento</h3>${IA_TAG}<div style="flex:1"></div>${INFO({oque:'Transforma o áudio e as anotações na conversa registrada: transcrição, anotações encaixadas na fala e candidatos a FCA para você revisar.',como:'Só roda quando você clica. Precisa de pelo menos o áudio ou uma anotação. As anotações são salvas antes de processar.',obs:'Processar de novo atualiza a transcrição e as anotações encaixadas. Os candidatos a FCA que você já revisou na conversa registrada são mantidos.'})}</div>
    <div class="card-b">${corpo}</div>
  </div>`;
}

/* ---------- tela ---------- */
RENDER.captura=()=>{
  const w=ws(),P=cp_P();
  if(!P.length){
    return `${casoHead('Captura da conversa')}
      ${emptyState(`<span class="cp-emp-ic">${icon('note',26)}</span>`,'Ainda não há pauta para esta conversa',
        'As anotações ficam organizadas pelas perguntas da pauta. Gere a pauta a partir da pré-pauta sugerida ou volte à radiografia para escrever a sua leitura antes.',
        aiBtn('Gerar pauta a partir da pré-pauta sugerida','cp_gerar(this)','solid')
        +`<button type="button" class="btn" onclick="go('radiografia')">Ir para a radiografia</button>`)}
      ${stepnav(prevBtn('pauta'),'')}`;
  }
  const c=cp_cont(),nq=P.reduce((s,b)=>s+cp_qs(b).length,0);
  const blocos=P.map(cp_bloco).join('');   /* acc() define o estado inicial de cada bloco */
  const todosAb=P.every(b=>ACC['cp_'+b.id]);
  return `${casoHead('Captura da conversa')}
  <div class="cp-g">
    <div class="card cp-notes">
      <div class="card-h"><h3>Anotações por pergunta</h3><span class="sub">${P.length} blocos · ${nq} perguntas</span><div style="flex:1"></div>
        ${INFO({oque:'A pauta da conversa, bloco a bloco, com um campo de anotação em cada pergunta. Use durante a reunião para registrar o que foi respondido.',como:'Na conversa registrada, as anotações são somadas à transcrição, cada uma no momento da fala em que se encaixa.',obs:'Salve sempre que quiser. Ao processar, as anotações são salvas automaticamente.'})}</div>
      <div class="tbar cp-tb">
        <span class="cp-prog" id="cp_prog">${cp_progHtml(c)}</span>
        <span class="sp"></span>
        <button type="button" class="cp-lnk" onclick="cp_tgAll()">${todosAb?'Recolher todos':'Expandir todos'}</button>
        <button type="button" class="btn btn-xs cp-demo" onclick="cp_exemplo()">${ICON.eye}<span>Preencher com anotações de exemplo</span></button>
      </div>
      <div class="cp-bl">${blocos}</div>
      <div class="cp-gr">
        <div class="cp-gr-h"><b>Anotações gerais</b><span>o que não se encaixa em nenhuma pergunta</span></div>
        ${edTa(w.notaGeral||'','cp_geral(this.value)',{cls:'ed-box cp-ta',rows:2,ph:'Anotar…',attr:'aria-label="Anotações gerais"'})}
      </div>
      <div class="cp-ft"><span id="cp_sv">${cp_svHtml()}</span><span class="sp"></span>
        <button type="button" class="btn btn-p btn-s" onclick="cp_salvar()">${ICON.check}<span>Salvar anotações</span></button></div>
    </div>
    <aside class="cp-side">${cp_upCard()}${cp_procCard()}</aside>
  </div>
  ${stepnav(prevBtn('pauta'),'')}`;
};

</script>
<script>
/* ---- 45_reuniao.js ---- */
/* =========================================================================
   4b · CONVERSA REGISTRADA · prefixo rn_
   Raio X pós-captura: o regional revisa a transcrição, as anotações dele
   encaixadas no momento em que foram feitas e os candidatos a FCA, que são
   todos editáveis. A IA só roda no clique em "Gerar diagnóstico e FCA".
   ========================================================================= */
const rn_S={fil:'tudo',q:'',ifil:'todos',edF:null,undo:null};
const rn_IC={
  mic:_sv('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',26),
  note:_sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',26)
};

/* ---------- utilidades ---------- */
function rn_seg(t){const m=String(t||'').match(/(\d+):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;}
function rn_dur(){return rn_seg(AUDIO_EX.dur)||434;}
/* índice da fala cujo horário bate ou vem logo antes de t */
function rn_idxAte(t){const s=rn_seg(t);let k=0;if(s==null)return k;FALAS.forEach((f,i)=>{if(rn_seg(f.t)<=s)k=i;});return k;}
function rn_corta(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1).trimEnd()+'…':s;}
function rn_ok(v){v=String(v==null?'':v).trim();return !!v&&v!=='—';}
function rn_limpa(v){return rn_ok(v)?v:'';}
function rn_item(id){return (ws().itens||[]).find(c=>c.id===id);}
function rn_tipo0(c){const o=c._orig&&COMPROMISSOS.find(x=>x.id===c._orig);return o?o.tipo:null;}
function rn_ini(n){return String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function rn_falas(w){const ed=w.rn_falas||{};return FALAS.map((f,i)=>({...f,i,x:ed[i]!=null?ed[i]:f.x,ed:ed[i]!=null}));}
/* anotações do regional com o id da pergunta (para editar no lugar). Mesma regra de notasAncoradas() */
function rn_notas(w){
  const out=[];
  (w.pauta||[]).forEach(b=>b.qs.forEach(q=>{const tx=w.notas[q.id];if(String(tx||'').trim())out.push({id:q.id,tx,q:q.tx,bloco:b.t,t:ancoraDe(q,b)});}));
  if(String(w.notaGeral||'').trim())out.push({id:'_geral',tx:w.notaGeral,q:null,bloco:'Anotação geral',t:NOTA_GERAL_EX.t});
  return out;
}
function rn_participantes(){const v={};FALAS.forEach(f=>{if(!v[f.w])v[f.w]=f.r;});return Object.entries(v).map(([n,r])=>({n,r}));}
function rn_pessoas(){const a=casoAg();return [...new Set(['Marcelo Brião',a.ger].concat(DEMO_OK()?['Juliana','Diego']:[]))];}
function rn_mark(x,q){
  const e=esc(x);if(!q)return e;
  const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp(qe,'gi'),m=>`<mark>${m}</mark>`);
}
/* algo mudou nos itens depois que o FCA foi gerado: avisa que precisa gerar de novo */
function rn_mudou(){
  const w=ws();
  if(w.fca&&!w.publicado&&!w.rn_dirty){w.rn_dirty=true;const b=$('#rnBar');if(b)b.outerHTML=rn_barHTML();}
}

/* ---------- linha do tempo da conversa (quem falou, compromissos, anotações) ---------- */
function rn_tlHTML(w){
  const D=rn_dur(), its=w.itens||[], N=rn_notas(w), pct=t=>Math.min(100,Math.max(0,(rn_seg(t)||0)/D*100));
  const bands=FALAS.map((f,i)=>{const a=rn_seg(f.t),b=i<FALAS.length-1?rn_seg(FALAS[i+1].t):D;
    return `<button type="button" class="rn-sp ${f.r==='Regional'?'rg':'ag'}" style="left:${(a/D*100).toFixed(2)}%;width:${((b-a)/D*100).toFixed(2)}%" title="${esc(f.w)} · ${f.t}" aria-label="Ir para ${f.t}" onclick="rn_irFala(${i})"></button>`;}).join('');
  const mks=its.filter(c=>c.tempo).map(c=>`<button type="button" class="rn-mk ${c.tipo==='fca'?'fca':'reg'}" style="left:${pct(c.tempo).toFixed(2)}%" title="${c.tempo} · ${c.tipo==='fca'?'Candidato a FCA':'Registro'}: ${esc(c.tema)}" aria-label="Ir para o item ${esc(c.tema)}" onclick="rn_irItem('${c.id}')"></button>`).join('');
  const nts=N.map(n=>`<button type="button" class="rn-mk an" style="left:${pct(n.t).toFixed(2)}%" title="${n.t} · Sua anotação: ${esc(rn_corta(n.tx,80))}" aria-label="Ir para a anotação de ${n.t}" onclick="rn_irTempo('${n.t}')"></button>`).join('');
  let ax='';for(let m=0;m*60<D;m++){if(m>0&&(D-m*60)/D<0.07)continue;ax+=`<span style="left:${(m*60/D*100).toFixed(2)}%">${String(m).padStart(2,'0')}:00</span>`;}
  ax+=`<span class="end" style="left:100%">${AUDIO_EX.dur}</span>`;
  const p=rn_participantes();
  return `<div class="rn-tl">
    <div class="rn-tl-h"><span class="rn-tl-t">Linha do tempo</span>
      <span class="rn-lg"><i class="rg"></i>${esc(p[0]?p[0].n:'Regional')}</span>
      <span class="rn-lg"><i class="ag"></i>${esc(p[1]?p[1].n:'Gerente')}</span>
      <span class="rn-lg"><i class="d fca"></i>Candidato a FCA</span>
      <span class="rn-lg"><i class="d reg"></i>Registro</span>
      <span class="rn-lg"><i class="c"></i>Sua anotação</span></div>
    <div class="rn-tl-r">${mks}</div>
    <div class="rn-tl-b">${bands}</div>
    <div class="rn-tl-r an">${nts}</div>
    <div class="rn-tl-x">${ax}</div>
  </div>`;
}

/* ---------- transcrição com as anotações encaixadas ---------- */
function rn_trsHTML(){
  const w=ws(), F=rn_falas(w), N=rn_notas(w), its=w.itens||[];
  const nAt={},iAt={};
  N.forEach(n=>{const k=rn_idxAte(n.t);(nAt[k]=nAt[k]||[]).push(n);});
  its.forEach(c=>{if(c.tempo){const k=rn_idxAte(c.tempo);(iAt[k]=iAt[k]||[]).push(c);}});
  const q=rn_S.q.trim().toLowerCase();
  const rows=F.filter(f=>{
    if(rn_S.fil==='comp'&&!(f.hl||iAt[f.i]))return false;
    if(rn_S.fil==='notas'&&!nAt[f.i])return false;
    if(q&&!(f.x.toLowerCase().includes(q)||f.w.toLowerCase().includes(q)||(nAt[f.i]||[]).some(n=>String(n.tx).toLowerCase().includes(q))))return false;
    return true;
  });
  if(!rows.length)return `<div class="rn-none">${rn_S.fil==='notas'&&!N.length?'Nenhuma anotação sua nesta conversa.':'Nenhum trecho com esse filtro.'}</div>`;
  /* "Trechos com compromisso" mostra só as falas e os candidatos; as anotações ficam em "Minhas anotações" */
  return rows.map(f=>rn_falaHTML(f,iAt[f.i]||[],rn_S.fil==='comp'?[]:(nAt[f.i]||[]),q)).join('');
}
function rn_falaHTML(f,its,ns,q){
  const lock=!!ws().publicado, ed=rn_S.edF===f.i&&!lock;
  const tx=ed?edTa(f.x,'',{rows:2,cls:'ed-box rn-fx',attr:`onblur="rn_salvaFala(${f.i},this.value)" aria-label="Corrigir a transcrição"`})
             :`<div class="tx">${rn_mark(f.x,q)}</div>`;
  return `<div class="msg rn-msg ${f.hl?'hl':''}" id="rnF${f.i}">
    <span class="av" style="background:${f.c}">${rn_ini(f.w)}</span>
    <div class="bd"><div class="who">${esc(f.w)} <span class="tag t-gy">${esc(f.r)}</span><span class="t">${f.t}</span>${f.ed?'<span class="rn-edt">corrigido por você</span>':''}
      ${lock||ed?'':`<span class="rn-fa">${ib('edit',`rn_editFala(${f.i})`,'Corrigir a transcrição deste trecho')}</span>`}</div>
      ${tx}
      ${its.length?`<div class="rn-chips">${its.map(c=>`<button type="button" class="rn-chip ${c.tipo==='fca'?'':'reg'}" onclick="rn_irItem('${c.id}')">${c.tipo==='fca'?'Candidato a FCA':'Registro'} · ${esc(rn_corta(c.tema||'sem tema',48))} ↓</button>`).join('')}</div>`:''}
    </div></div>
    ${ns.map(rn_notaHTML).join('')}`;
}
function rn_notaHTML(n){
  const lock=!!ws().publicado;
  const onde=n.q?`na pergunta “${esc(rn_corta(n.q,78))}”`:'anotação geral';
  return `<div class="note-b rn-note">${ICON.note}<div class="rn-nb"><div class="nh"><span class="rn-nk">Sua anotação</span><span class="rn-nq" title="${esc(n.q||'')}">· ${onde}</span><span class="rn-nt">${n.t}</span></div>
    ${lock?`<div class="rn-ntx">${esc(n.tx)}</div>`:edTa(n.tx,`rn_setNota('${n.id}',this.value)`,{rows:1,cls:'rn-ntx',attr:'aria-label="Editar anotação"'})}</div>
    ${lock?'':ib('trash',`rn_delNota('${n.id}')`,'Excluir anotação','del')}</div>`;
}
function rn_refreshTrs(){
  const box=$('#rnTrs');if(!box)return;
  box.innerHTML=rn_trsHTML();box.querySelectorAll('.ed-ta').forEach(autoGrow);
  const sg=$('#rnSeg');if(sg)sg.innerHTML=rn_segHTML();
}
function rn_segHTML(){
  const w=ws(), its=w.itens||[], F=FALAS, iT=new Set(its.filter(c=>c.tempo).map(c=>rn_idxAte(c.tempo)));
  const nComp=F.filter((f,i)=>f.hl||iT.has(i)).length, nN=rn_notas(w).length;
  return seg([['tudo',`Tudo <span class="rn-n">${F.length}</span>`],['comp',`Trechos com compromisso <span class="rn-n">${nComp}</span>`],['notas',`Minhas anotações <span class="rn-n">${nN}</span>`]],rn_S.fil,'rn_fil');
}

/* ---------- candidatos a FCA e registros (editáveis) ---------- */
function rn_itemHTML(c,lock){
  const fca=c.tipo==='fca', t0=rn_tipo0(c), mudou=t0&&t0!==c.tipo;
  const pend=fca&&(!rn_ok(c.quem)||!rn_ok(c.prazo));
  const f=(lb,k,ph,cls='')=>`<label class="rn-f ${cls}"><span>${lb}</span>${lock?`<b class="rn-ro">${esc(rn_limpa(c[k])||'—')}</b>`:edIn(rn_limpa(c[k]),`rn_set('${c.id}','${k}',this.value)`,{ph,cls:'ed-box'+(fca?' rn-req':''),attr:k==='quem'?'list="rnPessoas"':''})}</label>`;
  return `<div class="rn-it ${fca?'fca':'reg'}" id="rnI_${c.id}">
    <div class="rn-it-h">
      <span class="tag ${fca?'t-grn':'t-gy'} rn-ty">${fca?'Vira FCA':'Registro'}</span>
      ${c.tempo?`<button type="button" class="rn-tm" onclick="rn_irTempo('${c.tempo}')" title="Ver o trecho na transcrição">${ICON.clock}${c.tempo}</button>`:'<span class="rn-new">adicionado por você</span>'}
      <div class="rn-tema">${lock?`<b>${esc(c.tema||'Sem tema')}</b>`:edIn(c.tema,`rn_set('${c.id}','tema',this.value)`,{ph:'Tema do item',cls:'rn-tema-in',attr:'aria-label="Tema"'})}</div>
      ${mudou?`<span class="rn-chg" title="O copiloto tinha proposto ${t0==='fca'?'FCA':'registro'}">alterado por você</span>`:''}
      ${pend&&!lock?'<span class="rn-pd">falta responsável ou prazo</span>':''}
      ${lock?'':`<button type="button" class="btn btn-xs rn-sw" onclick="rn_tipo('${c.id}')">${fca?ICON.down+'Rebaixar a registro':ICON.up+'Promover a FCA'}</button>${ib('trash',`rn_del('${c.id}')`,'Excluir item','del')}`}
    </div>
    <div class="rn-it-b">
      <label class="rn-f rn-fx"><span>O que foi combinado</span>${lock?`<div class="rn-ro">${esc(c.tx)}</div>`:edTa(c.tx,`rn_set('${c.id}','tx',this.value)`,{rows:2,ph:'Descreva o compromisso ou o registro',cls:'ed-box'})}</label>
      ${f('Responsável','quem',fca?'a definir':'—')}
      ${f('Prazo','prazo',fca?'dd/mm/aaaa':'—')}
    </div>
    ${c.rz?acc('rnZ_'+c.id,`${ICON.spark}<span>Por que o copiloto propõe</span>`,`<div class="rn-rz">${c.rz}</div>`,{cls:'flat rn-why'}):''}
  </div>`;
}

/* ---------- barra de ação (fixa no rodapé) ---------- */
function rn_barHTML(){
  const w=ws(), its=w.itens||[], nF=its.filter(i=>i.tipo==='fca').length, nR=its.length-nF;
  let mid,right;
  if(w.publicado){
    mid=`<span class="sdot" style="background:var(--green2)"></span><span><b>FCA publicado</b> em ${esc(w.publicadoEm||'')} · visível para a agência</span>`;
    right=`<button class="btn btn-p" onclick="go('fca')">Abrir diagnóstico e FCA →</button>`;
  }else if(w.fca&&!w.rn_dirty){
    mid=`<span class="sdot" style="background:var(--gold)"></span><span><b>Rascunho do FCA gerado</b> com ${nF} compromisso${nF===1?'':'s'}</span>`;
    right=`<button class="btn btn-p" onclick="go('fca')">Abrir diagnóstico e FCA →</button>`;
  }else if(w.fca){
    mid=`<span class="sdot" style="background:var(--amber)"></span><span><b>Itens alterados</b> depois de gerar o FCA · <b>${nF}</b> viram FCA · <b>${nR}</b> registros</span>`;
    right=`<button class="btn" onclick="go('fca')">Abrir sem gerar de novo</button><span class="ai-note">${ICON.spark}A IA só roda no clique</span>${aiBtn('Gerar de novo','rn_gerar(this)','solid')}`;
  }else{
    mid=`<span><b>${nF}</b> vira${nF===1?'':'m'} FCA · <b>${nR}</b> fica${nR===1?'':'m'} como registro</span>`;
    right=`<span class="ai-note">${ICON.spark}A IA só roda quando você clicar</span>${aiBtn('Gerar diagnóstico e FCA','rn_gerar(this)','solid')}`;
  }
  return `<div class="rn-bar" id="rnBar">${prevBtn('captura')}<div class="rn-bar-m st-line">${mid}</div><div class="rn-bar-a">${right}</div></div>`;
}

/* ---------- estados vazios ---------- */
function rn_vazioHTML(w){
  const nN=rn_notas(w).length, temA=!!w.audio;
  const d=temA?`Áudio <strong>${esc(w.audio.nome)}</strong> recebido${nN?` com ${nN} anotaç${nN===1?'ão sua':'ões suas'}`:''}. Processe para ver a transcrição com as anotações encaixadas e os candidatos a FCA.`
              :'Suba o áudio da conversa na Captura. A IA transcreve, encaixa cada anotação sua no momento em que foi feita e propõe o que vira FCA.';
  return emptyState(`<span class="rn-eic">${rn_IC.mic}</span>`,'A conversa ainda não foi processada',d,
    `<button class="btn" onclick="go('captura')">← Ir para a Captura</button>${aiBtn(temA?'Processar conversa':'Processar com o áudio de exemplo','rn_processar(this)','solid')}`)
    +`<div class="rn-ainote"><span class="ai-note">${ICON.spark}A IA só roda quando você clicar</span></div>`;
}
function rn_outraHTML(w,a){
  const N=rn_notas(w);
  const lista=N.length?`<div class="card rn-card" style="margin-top:16px"><div class="card-h"><h3>Suas anotações da captura</h3><span class="tag t-gd">${N.length}</span><div style="flex:1"></div>${INFO('As anotações que você fez na Captura ficam guardadas no caso. Quando houver a gravação da conversa, a IA encaixa cada uma no momento em que foi feita.')}</div>
    <div class="card-b rn-ol">${N.map(n=>`<div class="note-b rn-note">${ICON.note}<div class="rn-nb"><div class="nh"><span class="rn-nk">${esc(n.bloco)}</span>${n.q?`<span class="rn-nq">· ${esc(rn_corta(n.q,90))}</span>`:''}</div><div class="rn-ntx">${esc(n.tx)}</div></div></div>`).join('')}</div></div>`:'';
  return emptyState(`<span class="rn-eic">${rn_IC.mic}</span>`,`Sem gravação de exemplo para ${esc(a.n)}`,
    'A transcrição, as suas anotações encaixadas e os candidatos a FCA aparecem aqui quando a gravação desta conversa for processada.',
    `<button class="btn" onclick="go('captura')">← Ir para a Captura</button>`)+lista;
}

/* =========================================================================
   RENDER
   ========================================================================= */
RENDER.reuniao=()=>{
  const w=ws(), a=casoAg(), head=casoHead('Conversa registrada');
  if(!DEMO_OK())return head+bannerDemo()+rn_outraHTML(w,a);
  if(!w.processado)return head+rn_vazioHTML(w);
  const its=w.itens||[], lock=!!w.publicado, N=rn_notas(w), P=rn_participantes();
  const nF=its.filter(i=>i.tipo==='fca').length, nR=its.length-nF;
  const vis=its.filter(c=>rn_S.ifil==='todos'||(rn_S.ifil==='fca'?c.tipo==='fca':c.tipo!=='fca'));
  return `${head}
  ${lock?`<div class="rn-lock">${ICON.lock}<div><b>FCA publicado em ${esc(w.publicadoEm||'')}.</b> Os itens desta conversa ficaram travados. Prazos e metas agora são ajustados no próprio FCA.</div></div>`:''}

  <div class="card rn-card">
    <div class="card-h"><h3>Transcrição e anotações</h3><span class="sub">revise o que a IA transcreveu e onde encaixou suas anotações</span><div style="flex:1"></div>
      ${INFO({oque:'Raio X da conversa depois da captura: a transcrição do áudio, com as anotações que você fez em cada pergunta encaixadas no momento em que foram feitas.',como:'Trechos destacados em verde são os que a IA leu como compromisso; em dourado, as suas anotações. Clique no lápis de um trecho para corrigir a transcrição.',obs:'Nada aqui é criado sem a sua revisão.'})}</div>
    <div class="rn-meta">
      <span>${ICON.clock}<b>${AUDIO_EX.dur}</b> de conversa</span>
      <span>${ICON.user}<b>${P.length} participantes:</b> ${P.map(p=>`${esc(p.n)} <span class="rn-mr">(${esc(p.r==='Regional'?'regional':'gerente da agência')})</span>`).join(' e ')}</span>
      <span>${ICON.note}<b>${N.length}</b> anotaç${N.length===1?'ão sua encaixada':'ões suas encaixadas'}</span>
      <span>${ICON.file}${esc((w.audio&&w.audio.nome)||AUDIO_EX.nome)}</span>
    </div>
    ${rn_tlHTML(w)}
    <div class="tbar"><span id="rnSeg">${rn_segHTML()}</span>${searchCtl('Buscar na transcrição','rn_q',rn_S.q)}<div style="flex:1"></div>${lock?'':`<span class="rn-hint">${ICON.edit}passe o mouse num trecho para corrigir</span>`}</div>

  </div>

  <div class="card rn-card rn-cands">
    <div class="card-h"><h3>Candidatos a FCA e registros</h3><span class="sub">capturados na conversa · o copiloto propõe, você decide</span><div style="flex:1"></div>
      ${INFO({oque:'O que a IA identificou como compromisso (candidato a FCA) ou como registro para a memória da unidade.',como:'Vira FCA o que tem valor em risco relevante, ligação com indicador em desvio, responsável e prazo. Abra "Por que o copiloto propõe" em cada item para ver o critério.',obs:'Edite o texto, o responsável e o prazo, troque o tipo, exclua ou adicione itens. O FCA só é gerado quando você clicar em "Gerar diagnóstico e FCA".'})}</div>
    <div class="tbar">${seg([['todos',`Todos <span class="rn-n">${its.length}</span>`],['fca',`Viram FCA <span class="rn-n">${nF}</span>`],['reg',`Registros <span class="rn-n">${nR}</span>`]],rn_S.ifil,'rn_ifil')}
      <div style="flex:1"></div><span class="rn-hint">${lock?ICON.lock+'travado após a publicação':ICON.edit+'edite direto nos campos'}</span></div>
    <div class="card-b rn-its">
      ${vis.length?vis.map(c=>rn_itemHTML(c,lock)).join(''):`<div class="rn-none">${its.length?'Nenhum item neste filtro.':'Nenhum candidato nesta conversa. Adicione um item se algo ficou combinado.'}</div>`}
      ${lock?'':`<button type="button" class="rn-add" onclick="rn_add()">${ICON.plus}Adicionar item</button>`}
