    </div>
    <div class="pa-lb">Roteiro <span class="pa-lbs">minuto de início de cada bloco</span></div>
    <div class="pa-rl">${rows}
      <div class="pa-rt fim"><span class="h mono">${fim}'</span><span class="n"></span><span class="t">Duração total</span><span></span></div>
    </div>
`;
}
function pa_res(){const el=document.getElementById('pa_res');if(el)el.innerHTML=pa_resHtml();}

/* ---------- nota do copiloto ---------- */
function pa_nti(it){return `<div class="pa-nti"><p>${it.tx}</p>${why(it.ev,'ver base desta nota')}</div>`;}
/* perguntas com reincidência nesta agência (a linha da nota acompanha a edição das perguntas) */
function pa_ms(){const ms=[];pa_P().forEach(b=>b.qs.forEach(q=>{const f=pa_flag(q);if(f&&f.tipo==='mesma')ms.push(f);}));return ms;}
function pa_ntRei(ms){
  if(!ms.length)return '';
  const f=ms[0],n=ms.length;
  const tx=f.emAberto
    ?`${n===1?'Uma pergunta retoma':n+' perguntas retomam'} o <b>${esc(f.fca)}</b> (${esc(f.quando)}), ainda em execução. Vale perguntar o que mudou desde então antes de propor ação nova.`
    :`${n===1?'Uma pergunta repete':n+' perguntas repetem'} um tema do <b>${esc(f.fca)}</b> (${esc(f.quando)}), que ${esc(f.desfecho.split(' · ')[0])}. Desta vez, vale fechar com responsável e prazo.`;
  return pa_nti({tx,ev:[['FCA anterior',esc(f.fca+' · '+f.quando)],['Desfecho',esc(f.desfecho)]]});
}
function pa_ntLive(){
  const el=document.getElementById('pa_ntm');if(!el)return;
  const ms=pa_ms(),k=ms.map(f=>f.fca).join('|');
  if(el.dataset.k!==k){el.dataset.k=k;el.innerHTML=pa_ntRei(ms);}
}
function pa_nota(){
  const ag=CASO.ag,its=[],ms=pa_ms();
  if(ag==='PEL')its.push({tx:'Na visita de <b>11/04</b> a conversa foi sobre crédito rural e a relação captação/crédito não entrou na pauta, embora já estivesse em queda havia dois meses. Vale abrir reconhecendo isso, em vez de tratar o tema como novidade.',
    ev:[['Menções a captação na visita de 11/04','0'],['Captação ÷ crédito em abril','1,09'],['FCA aberto sobre captação na ocasião','nenhum']]});
  const fa=FCAS_ABERTOS.find(f=>f.ag===ag);
  if(fa)its.push({tx:`O <b>${fa.id}</b> (${esc(pa_min_(fa.tema))}) segue em aberto, com ${fa.exec}% executado${fa.atraso?` e ${fa.atraso} ${fa.atraso===1?'ação':'ações'} em atraso`:''}. Vale retomar o andamento antes de abrir o tema novo.`,
    ev:[['Execução do plano',fa.exec+'%'],['Ações em atraso',String(fa.atraso)],['Prazo final',fa.prazo]]});
  if(!its.length){const s=casoSig();
    its.push({tx:'A unidade não tem FCA em aberto. Se a conversa gerar ações, combine no fechamento quem cuida de cada uma e até quando.',
      ev:[['FCAs em aberto na unidade','nenhum'],['Sinal que motivou a conversa',s?s.id:'—']]});}
  return `<div class="card pa-nt">
    <div class="card-h"><h3>Nota do copiloto</h3>${IA_TAG}<div style="flex:1"></div>${INFO('Observações do copiloto a partir das conversas e dos FCAs anteriores da unidade. Abra "ver base desta nota" para ver as evidências.')}</div>
    <div class="card-b pa-ntl">${its.map(pa_nti).join('')}<div class="pa-ntm" id="pa_ntm" data-k="${esc(ms.map(f=>f.fca).join('|'))}">${pa_ntRei(ms)}</div></div>
  </div>`;
}

/* ---------- blocos e perguntas ---------- */
function pa_qRow(b,q,j,bi){
  const last=j===b.qs.length-1,num=`${bi+1}.${j+1}`;
  /* mover fica na margem à esquerda (aparece ao passar o mouse) para não tirar largura do texto */
  return `<li class="pa-q ${q.id===pa_novo?'nw':''}">
    <div class="pa-mv">
      ${pa_ib(icon('up',12),`pa_qMv('${b.id}','${q.id}',-1)`,'Mover pergunta para cima','',j===0)}
      ${pa_ib(icon('down',12),`pa_qMv('${b.id}','${q.id}',1)`,'Mover pergunta para baixo','',last)}
    </div>
    <span class="pa-qn mono">${num}</span>
    <div class="pa-qb">
      ${edTa(q.tx,`pa_qTx('${b.id}','${q.id}',this.value)`,{cls:'pa-qt',rows:1,ph:'Escreva a pergunta…',attr:`data-q="${q.id}" aria-label="Pergunta ${num}" onkeydown="pa_kQ(event,'${b.id}','${q.id}')"`})}
      <div class="pa-qm" id="paf_${q.id}">${pa_meta(b,q)}</div>
    </div>
    ${pa_ib('trash',`pa_qDel('${b.id}','${q.id}')`,'Excluir pergunta','del pa-qx')}
  </li>`;
}
function pa_blk(b,i,P){
  const fech=!!pa_fech[b.id],sig=(b.origem||'').startsWith('sinal');
  return `<section class="pa-blk ${fech?'fech':''} ${sig?'pa-sig':''}" id="pab_${b.id}">
    <div class="pa-bh">
      <span class="pa-num mono">${i+1}</span>
      <div class="pa-btw">
        ${edTa(b.t,`pa_bT('${b.id}',this.value)`,{cls:'pa-bt',rows:1,ph:'Título do bloco',attr:`data-b="${b.id}" aria-label="Título do bloco ${i+1}" onkeydown="pa_kT(event,this)"`})}
        <div class="pa-bm" id="pabm_${b.id}">${pa_bmeta(b)}</div>
      </div>
      <div class="pa-ba">
        ${pa_ib('up',`pa_bMv('${b.id}',-1)`,'Mover bloco para cima','',i===0)}
        ${pa_ib('down',`pa_bMv('${b.id}',1)`,'Mover bloco para baixo','',i===P.length-1)}
        ${pa_ib('trash',`pa_bDel('${b.id}')`,'Excluir bloco','del')}
      </div>
      <button type="button" class="ib pa-tgl" title="${fech?'Expandir bloco':'Recolher bloco'}" aria-expanded="${!fech}" onclick="pa_tg('${b.id}')">${ICON.chev}</button>
    </div>
    <div class="pa-bb">
      ${b.qs.length?`<ol class="pa-ql">${b.qs.map((q,j)=>pa_qRow(b,q,j,i)).join('')}</ol>`:'<div class="pa-q0">Nenhuma pergunta neste bloco.</div>'}
      <div class="pa-bf">
        <button type="button" class="btn btn-xs" onclick="pa_qAdd('${b.id}')">${ICON.plus}<span>Adicionar pergunta</span></button>
      </div>
    </div>
  </section>`;
}

/* ---------- tela ---------- */
RENDER.pauta=()=>{
  const w=ws(),P=w.pauta||[];
  if(!P.length){
    const txt=w.prepauta?'A pré-pauta já está pronta. Gere as perguntas para começar a editar.'
      :'A pauta nasce da pré-pauta, a partir da sua leitura dos dados. Se preferir, gere agora com a pré-pauta sugerida pelo copiloto.';
    return `${casoHead('Pauta da conversa')}
      ${emptyState(`<span class="pa-emp-ic">${icon('note',26)}</span>`,'Ainda não há perguntas para esta conversa',txt,
        aiBtn('Gerar perguntas a partir da pré-pauta sugerida','pa_gerar(this)','solid')+`<button type="button" class="btn" onclick="go('radiografia')">← Voltar para o Raio X</button>`)}`;
  }
  const acoes=`<button type="button" class="pa-lnk" onclick="go('radiografia')">Rever pré-pauta</button>
    <button type="button" class="btn btn-s" onclick="pa_export()">${ICON.export}<span>Exportar</span></button>
    ${INFO({oque:'As perguntas que a IA gerou a partir da pré-pauta confirmada. Você edita o texto e a ordem, e pode incluir ou excluir perguntas e blocos.',
      como:'A IA parte dos blocos da pré-pauta, do Raio X e do histórico de FCAs da agência.',
      obs:'Enter cria uma nova pergunta logo abaixo. Shift + Enter quebra a linha.'})}`;
  return `${casoHead('Pauta da conversa',acoes)}
  <div class="pa-main pa-uni">
    ${P.map((b,i)=>pa_blk(b,i,P)).join('')}
    <button type="button" class="btn pa-addb" onclick="pa_bAdd()">${ICON.plus}<span>Adicionar bloco</span></button>
  </div>
  ${stepnav(prevBtn('radiografia'),nextBtn('captura','Ir para a captura'))}`;
};
/* a altura dos campos ao recolher o menu é reajustada pelo core (ResizeObserver em #view) */
AFTER.pauta=()=>{
  if(pa_focus){
    const [k,id]=pa_focus.split(':');pa_focus=null;
    const el=document.querySelector(k==='b'?`[data-b="${id}"]`:`[data-q="${id}"]`);
    if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'center',behavior:'smooth'});}
  }
  pa_novo=null;
};

</script>
<script>
/* ---- 40_captura.js ---- */
/* ======================= 4a · CAPTURA DA CONVERSA =======================
   Só o upload da gravação (Teams e gravação no app ficam para uma próxima
   fase) e as anotações do regional em cada pergunta da pauta, feitas durante
   a reunião. "Processar" é um botão de IA: transcreve, encaixa as anotações
   na transcrição e extrai candidatos a FCA para a conversa registrada.     */
const cp_run={};       // processamento em andamento por agência: ag → passo (0..3)
const cp_sujo={};      // mudanças depois do processamento: ag → true
let cp_tmr=null;

/* anotações de exemplo para agências sem conversa gravada de exemplo */
const cp_GEN={
  abertura:['Leitura do período alinhada com os números; reconhece o tema principal.'],
  tema:['Atribui o desvio a uma mudança recente na equipe; não tinha visão consolidada do número.',null,'Pediu a lista dos casos prioritários e acompanhamento quinzenal com a regional.'],
  fechamento:['Combinado tratar o tema em FCA, com revisão em 30 dias.']
};
const cp_GERAL_GEN='Pediu para receber o alerta do copiloto junto com a regional, antes da próxima conversa.';

/* ---------- utilitários ---------- */
function cp_P(){return ws().pauta||[];}
function cp_qs(b){return b.qs.filter(q=>(q.tx||'').trim());}
function cp_tem(v){return !!String(v||'').trim();}
function cp_cont(){
  const w=ws();let n=0,t=0;
  cp_P().forEach(b=>cp_qs(b).forEach(q=>{t++;if(cp_tem(w.notas[q.id]))n++;}));
  return {n,t,g:cp_tem(w.notaGeral)};
}
function cp_pode(){const w=ws(),c=cp_cont();return !!w.audio||c.n>0||c.g;}
function cp_tam(b){return b>=1048576?nf(b/1048576,1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}
function cp_dur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0');}
function cp_marcaSujo(){if(ws().processado)cp_sujo[CASO.ag]=true;const d=document.getElementById('cp_dirty');if(d&&cp_sujo[CASO.ag])d.hidden=false;}

/* ---------- gravação: upload ---------- */
function cp_pick(){const i=document.getElementById('cp_fi');if(i)i.click();}
function cp_fileSel(inp){const f=inp.files&&inp.files[0];if(f)cp_setFile(f);inp.value='';}
function cp_dov(e){e.preventDefault();e.currentTarget.classList.add('on');}
function cp_dlv(e){e.currentTarget.classList.remove('on');}
function cp_drp(e){e.preventDefault();e.currentTarget.classList.remove('on');const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)cp_setFile(f);}
function cp_setFile(f){
  const ok=/^(audio|video)\//.test(f.type||'')||/\.(mp3|m4a|wav|mp4|aac|ogg|oga|webm|mov|wma|flac|txt|docx|vtt|srt)$/i.test(f.name||'');
  if(!ok){toast('Formato não suportado. Envie áudio, vídeo ou a transcrição (txt, docx, vtt).','!');return;}
  const w=ws(),ag=CASO.ag;
  w.audio={nome:f.name,tam:cp_tam(f.size||0),dur:'…',real:true};
  cp_marcaSujo();redraw();toast('Arquivo anexado: '+esc(f.name),ICON.upload);
  /* lê a duração do arquivo no próprio navegador (nada é enviado) */
  try{
    const url=URL.createObjectURL(f),m=document.createElement(/^video\//.test(f.type)?'video':'audio');
    m.preload='metadata';
    const fim=d=>{const a=ws(ag).audio;if(a&&a.nome===f.name){a.dur=d;const el=document.getElementById('cp_dur');if(el&&CASO.ag===ag)el.textContent=d;}URL.revokeObjectURL(url);};
    m.onloadedmetadata=()=>fim(isFinite(m.duration)&&m.duration>0?cp_dur(m.duration):'duração indisponível');
    m.onerror=()=>fim('duração indisponível');
    m.src=url;
  }catch(e){const a=ws(ag).audio;if(a)a.dur='duração indisponível';}
}
function cp_ex(){ws().audio=audioExemplo();cp_marcaSujo();redraw();toast('Áudio de exemplo anexado',ICON.upload);}
function cp_rm(){ws().audio=null;cp_marcaSujo();redraw();toast('Arquivo removido',ICON.trash);}

/* ---------- anotações (sem redraw enquanto digita) ---------- */
function cp_nota(bid,qid,v){
  const w=ws();w.notas[qid]=v;w.notasSalvas=false;
  const r=document.getElementById('cpq_'+qid);if(r)r.classList.toggle('has',cp_tem(v));
  cp_marcaSujo();cp_live(bid);
}
function cp_geral(v){const w=ws();w.notaGeral=v;w.notasSalvas=false;cp_marcaSujo();cp_live();}
function cp_cntHtml(b){const w=ws(),qs=cp_qs(b),n=qs.filter(q=>cp_tem(w.notas[q.id])).length;return {n,t:qs.length};}
function cp_live(bid){
  const b=bid&&cp_P().find(x=>x.id===bid);
  if(b){const c=cp_cntHtml(b),el=document.getElementById('cpc_'+bid);
    if(el){el.textContent=`${c.n}/${c.t}`;el.className='cp-cnt'+(c.n?(c.n===c.t?' all':' on'):'');}}
  const c=cp_cont(),pode=cp_pode();
  const set=(id,h)=>{const el=document.getElementById(id);if(el)el.innerHTML=h;};
  set('cp_prog',cp_progHtml(c));set('cp_sv',cp_svHtml());set('cp_inp',cp_inHtml());
  const bt=document.getElementById('cp_go');if(bt&&!bt.classList.contains('is-loading'))bt.disabled=!pode||cp_run[CASO.ag]!=null;
  const h=document.getElementById('cp_hint');if(h)h.style.display=pode?'none':'';
}
function cp_salvar(){
  const w=ws(),c=cp_cont();
  if(!c.n&&!c.g){toast('Ainda não há anotações para salvar','!');return;}
  w.notasSalvas=true;cp_live();toast('Anotações salvas',ICON.check);
}
function cp_tgAll(){const P=cp_P(),todos=P.every(b=>ACC['cp_'+b.id]);P.forEach(b=>ACC['cp_'+b.id]=!todos);redraw();}
function cp_exemplo(){
  const w=ws(),pel=DEMO_OK();let n=0;
  cp_P().forEach(b=>cp_qs(b).forEach((q,j)=>{
    if(cp_tem(w.notas[q.id]))return;
    let tx=null;
    if(pel){const ex=NOTAS_EX[q.orig];if(ex&&q.tx===q.orig)tx=ex.tx;}
    else{const k=b.k==='abertura'||b.k==='fechamento'?b.k:'tema';tx=(cp_GEN[k]||[])[j]||null;}
    if(tx){w.notas[q.id]=tx;n++;ACC['cp_'+b.id]=true;}
  }));
  if(!cp_tem(w.notaGeral)){w.notaGeral=pel?NOTA_GERAL_EX.tx:cp_GERAL_GEN;n++;}
  w.notasSalvas=false;
  if(n)cp_marcaSujo();
  redraw();toast(n?`${n} anotaç${n===1?'ão':'ões'} de exemplo preenchida${n===1?'':'s'}`:'As perguntas de exemplo já têm anotações',ICON.note);
}

/* ---------- processamento (IA por botão) ---------- */
function cp_passos(){
  const w=ws(),c=cp_cont(),a=w.audio,n=c.n+(c.g?1:0),pel=DEMO_OK();
  const nf_=COMPROMISSOS.filter(x=>x.tipo==='fca').length;
  return [
    ['Envio',a?`${esc(a.nome)} · ${esc(a.tam)}`:'sem áudio · só as anotações'],
    ['Transcrição',a?(pel&&!a.real?`${esc(a.dur)} de conversa · 2 vozes identificadas`:`${esc(a.dur)} de conversa`):'sem áudio para transcrever'],
    ['Encaixe das anotações na transcrição',!n?'nenhuma anotação':a?`${n} anotaç${n===1?'ão':'ões'} no momento da fala`:`${n} anotaç${n===1?'ão':'ões'} por pergunta · sem transcrição`],
    ['Extração de candidatos a FCA',pel?`${COMPROMISSOS.length} candidatos · ${nf_} para FCA e ${COMPROMISSOS.length-nf_} registros`:'candidatos prontos para revisão']
  ];
}
/* depois de processar: resumo curto do resultado (as etapas aparecem só durante o processamento) */
function cp_okHtml(){
  const w=ws(),c=cp_cont(),a=w.audio,n=c.n+(c.g?1:0),pel=DEMO_OK();
  const nf_=COMPROMISSOS.filter(x=>x.tipo==='fca').length;
  const rows=[
    ['Transcrição',a?(pel&&!a.real?`${esc(a.dur)} · 2 vozes`:esc(a.dur)):'sem áudio'],
    ['Anotações',!n?'nenhuma':a?`${n} encaixada${n===1?'':'s'} na fala`:`${n} por pergunta`],
    ['Candidatos a FCA',pel?`${COMPROMISSOS.length} itens · ${nf_} para FCA`:'a revisar']
  ];
  return `<div class="cp-ok-h">${ICON.check}<span>Conversa processada</span></div>
    ${rows.map(([l,v])=>`<div class="cp-ok-r"><span>${l}</span><b>${v}</b></div>`).join('')}`;
}
function cp_stepsHtml(p){
  return cp_passos().map(([t,d],i)=>{
    const s=i<p?'':i===p?'run':'wait';
    return `<div class="prc ${s}"><span class="st">${i<p?ICON.check:i===p?'<span class="spin"></span>':''}</span><div><b>${t}</b><span>${i<p?d:i===p?'em andamento…':'na fila'}</span></div></div>`;
  }).join('');
}
function cp_proc(btn){
  const ag=CASO.ag,w=ws();
  if(cp_run[ag]!=null)return;
  if(!cp_pode()){toast('Envie o áudio ou faça ao menos uma anotação para processar','!');return;}
  w.notasSalvas=true;cp_run[ag]=0;
  const st=document.getElementById('cp_steps');if(st)st.innerHTML=cp_stepsHtml(0);
  const sv=document.getElementById('cp_sv');if(sv)sv.innerHTML=cp_svHtml();
  const d=document.getElementById('cp_dirty');if(d)d.hidden=true;
  const ok=document.getElementById('cp_ok');if(ok)ok.hidden=true;
  clearInterval(cp_tmr);
  cp_tmr=setInterval(()=>{
    if(cp_run[ag]==null){clearInterval(cp_tmr);return;}
    cp_run[ag]=Math.min(cp_run[ag]+1,3);
    if(SUB==='captura'&&CASO.ag===ag){const el=document.getElementById('cp_steps');if(el)el.innerHTML=cp_stepsHtml(cp_run[ag]);}
  },700);
  aiRun(btn,()=>{
    clearInterval(cp_tmr);delete cp_run[ag];
    processarConversa(ag);cp_sujo[ag]=false;
    if(SUB==='captura')redraw();
    toast('Conversa processada · pronta para revisão',ICON.check);
  },2900,'Processando…');
}
function cp_gerar(btn){
  aiRun(btn,()=>{const ag=CASO.ag;if(!ws(ag).prepauta)sugerirPrePauta(ag);gerarPauta(ag);redraw();toast('Pauta gerada a partir da pré-pauta',ICON.spark);},1400,'Gerando pauta…');
}

/* ---------- pedaços da tela ---------- */
function cp_progHtml(c){
  const p=c.t?Math.round(c.n/c.t*100):0;
  return `<span><b>${c.n}</b> de ${c.t} perguntas anotadas${c.g?'<span class="cp-pg-g"> · anotação geral</span>':''}</span><span class="bar cp-bar"><i style="width:${p}%"></i></span>`;
}
function cp_svHtml(){
  const w=ws(),c=cp_cont();
  if(!c.n&&!c.g)return '<span class="cp-mu">Nenhuma anotação ainda</span>';
  return w.notasSalvas?`<span class="cp-sv-ok">${ICON.check}<span>Anotações salvas</span></span>`:'<span class="cp-sv-no"><i></i>Alterações não salvas</span>';
}
function cp_inHtml(){
  const w=ws(),c=cp_cont(),a=w.audio;
  const row=(ok,lb,v,id)=>`<div class="cp-ir ${ok?'ok':''}"><span class="ck">${ok?ICON.check:''}</span><span class="lb">${lb}</span><span class="v"${id?` id="${id}"`:''} title="${ok?v:''}">${v}</span></div>`;
  return row(!!a,'Áudio',a?esc(a.nome):'não enviado')
    +row(c.n||c.g,'Anotações',c.n||c.g?`${c.n} de ${c.t} perguntas${c.g?' + gerais':''}`:'nenhuma');
}
function cp_bloco(b,i){
  const w=ws(),qs=cp_qs(b),c=cp_cntHtml(b);
  const head=`<span class="cp-num mono">${i+1}</span><span class="cp-bt">${b.t.trim()?esc(b.t):'<i>Bloco sem título</i>'}</span>
    <span class="cp-cnt${c.n?(c.n===c.t?' all':' on'):''}" id="cpc_${b.id}" title="perguntas anotadas">${c.n}/${c.t}</span>`;
  const body=qs.length?qs.map((q,j)=>`
    <div class="cp-q ${cp_tem(w.notas[q.id])?'has':''}" id="cpq_${q.id}">
      <span class="cp-qn mono"><i class="cp-dot"></i>${i+1}.${j+1}</span>
      <div class="cp-qc">
        <div class="cp-qt">${esc(q.tx)}</div>
        ${edTa(w.notas[q.id]||'',`cp_nota('${b.id}','${q.id}',this.value)`,{cls:'ed-box cp-ta',rows:1,ph:'Anotar a resposta…',attr:`aria-label="Anotação da pergunta ${i+1}.${j+1}"`})}
      </div>
    </div>`).join(''):'<div class="cp-q0">Este bloco não tem perguntas. Use as anotações gerais.</div>';
  return acc('cp_'+b.id,head,body,{open:i===0||c.n>0,cls:'flat cp-acc'});
}
function cp_upCard(){
  const a=ws().audio;
  const fi='<input type="file" id="cp_fi" accept="audio/*,video/*,.txt,.docx,.vtt,.srt" hidden onchange="cp_fileSel(this)">';
  const corpo=a?`<div class="cp-file">
        <span class="cp-file-ic">${icon('file',16)}</span>
        <div class="cp-file-t"><b title="${esc(a.nome)}">${esc(a.nome)}</b><span><span id="cp_dur">${esc(a.dur||'…')}</span> · ${esc(a.tam||'')}</span></div>
        ${ib('upload','cp_pick()','Trocar arquivo')}${ib('trash','cp_rm()','Remover arquivo','del')}
      </div>${fi}`
    :`<div class="cp-drop" ondragover="cp_dov(event)" ondragleave="cp_dlv(event)" ondrop="cp_drp(event)">
        <span class="cp-drop-ic">${icon('upload',18)}</span>
        <b>Arraste a gravação ou a transcrição</b>
        <span>áudio, vídeo, txt, docx ou vtt</span>
        <div class="cp-drop-b"><button type="button" class="btn btn-s" onclick="cp_pick()">Escolher arquivo</button><button type="button" class="cp-lnk" onclick="cp_ex()">Usar áudio de exemplo</button></div>
      </div>${fi}`;
  return `<div class="card">
    <div class="card-h"><h3>Gravação ou transcrição</h3><span class="sub">opcional</span><div style="flex:1"></div>${INFO({oque:'O áudio ou vídeo da conversa (celular, Teams ou outro aparelho) ou a transcrição que o Teams já gera (txt, docx, vtt). Vale para visita presencial ou reunião remota.',como:'Ao processar, o copiloto transcreve a conversa, separa as vozes e encaixa as suas anotações no momento em que cada assunto foi falado.'})}</div>
    <div class="card-b">
      ${corpo}
      <div class="cp-cons">${ICON.lock}<span>Ao enviar, você confirma que os participantes consentiram com a gravação.</span></div>
    </div>
  </div>`;
}
function cp_procCard(){
  const w=ws(),ag=CASO.ag,run=cp_run[ag]!=null,feito=w.processado&&!run,pode=cp_pode();
  let corpo='';
  if(feito){
    corpo+=`<div class="cp-ok" id="cp_ok">${cp_okHtml()}</div><div class="cp-steps" id="cp_steps"></div>
      <button type="button" class="btn btn-p cp-full" onclick="go('reuniao')">Ver os compromissos →</button>
      <div class="cp-dirty" id="cp_dirty"${cp_sujo[ag]?'':' hidden'}><span>Há mudanças desde o último processamento.</span>${aiBtn('Processar novamente','cp_proc(this)','btn-xs')}</div>
`;
  }else{
    corpo+=(run?'<button type="button" class="btn btn-ai solid cp-full is-loading" id="cp_go" disabled><span class="spin"></span><span>Processando…</span></button>'
      :aiBtn('Processar a conversa','cp_proc(this)','solid cp-full',{id:'cp_go',disabled:!pode}))
      +`<div class="cp-hint" id="cp_hint"${pode||run?' style="display:none"':''}>Envie o arquivo ou anote ao menos uma resposta.</div>
      <div class="cp-steps" id="cp_steps">${run?cp_stepsHtml(cp_run[ag]):''}</div>`;
  }
  return `<div class="card cp-pc">
    <div class="card-h"><h3>Processamento</h3>${IA_TAG}<div style="flex:1"></div>${INFO({oque:'Transforma o áudio e as anotações na conversa registrada: transcrição, anotações encaixadas na fala e candidatos a FCA para você revisar.',como:'Só roda quando você clica. Precisa de pelo menos o áudio ou uma anotação. As anotações são salvas antes de processar.',obs:'Processar de novo atualiza a transcrição e as anotações encaixadas. Os candidatos a FCA que você já revisou na conversa registrada são mantidos.'})}</div>
    <div class="card-b">${corpo}</div>
  </div>`;
}

/* ---------- tela ---------- */
RENDER.captura=()=>{
  const w=ws(),P=cp_P();
  if(!P.length){
    return `${casoHead('Registro da conversa')}
      ${emptyState(`<span class="cp-emp-ic">${icon('note',26)}</span>`,'Ainda não há pauta para esta conversa',
        'As anotações ficam organizadas pelas perguntas da pauta. Gere a pauta a partir da pré-pauta sugerida ou volte à pauta para escrever a sua leitura antes.',
        aiBtn('Gerar pauta a partir da pré-pauta sugerida','cp_gerar(this)','solid')
        +`<button type="button" class="btn" onclick="go('radiografia')">Ir para a radiografia</button>`)}
      ${stepnav(prevBtn('pauta'),'')}`;
  }
  const c=cp_cont(),nq=P.reduce((s,b)=>s+cp_qs(b).length,0);
  const blocos=P.map(cp_bloco).join('');   /* acc() define o estado inicial de cada bloco */
  const todosAb=P.every(b=>ACC['cp_'+b.id]);
  return `${casoHead('Registro da conversa')}
  <div class="cp-use">${icon('comment',18)}<div><b>Pronto para a reunião com ${esc(casoAg().ger)}?</b><span>Use esta tela durante a conversa: anote a resposta de cada pergunta. Se a reunião foi gravada ou o Teams gerou a transcrição, anexe o arquivo ao lado. No fim, clique em <b>Processar a conversa</b>.</span></div></div>
  <div class="cp-g">
    <div class="card cp-notes">
      <div class="card-h"><h3>Anotações por pergunta</h3><div style="flex:1"></div>
        ${INFO({oque:'A pauta da conversa, bloco a bloco, com um campo de anotação em cada pergunta. Use durante a reunião para registrar o que foi respondido.',como:'Na conversa registrada, as anotações são somadas à transcrição, cada uma no momento da fala em que se encaixa.',obs:'Salve sempre que quiser. Ao processar, as anotações são salvas automaticamente.'})}</div>
      <div class="tbar cp-tb">
        <span class="cp-prog" id="cp_prog">${cp_progHtml(c)}</span>
        <span class="sp"></span>
        <button type="button" class="cp-lnk" onclick="cp_exemplo()">preencher exemplo</button>
      </div>
      <div class="cp-bl">${blocos}</div>
      <div class="cp-gr">
        <div class="cp-gr-h"><b>Anotações gerais</b></div>
        ${edTa(w.notaGeral||'','cp_geral(this.value)',{cls:'ed-box cp-ta',rows:2,ph:'Anotar…',attr:'aria-label="Anotações gerais"'})}
      </div>
      <div class="cp-ft"><span id="cp_sv">${cp_svHtml()}</span><span class="sp"></span>
        <button type="button" class="btn btn-p btn-s" onclick="cp_salvar()">${ICON.check}<span>Salvar anotações</span></button></div>
    </div>
    <aside class="cp-side">${cp_upCard()}${cp_procCard()}</aside>
  </div>
  ${stepnav(prevBtn('pauta'),'')}`;
};

</script>
<script>
/* ---- 45_reuniao.js ---- */
/* =========================================================================
   4b · CONVERSA REGISTRADA · prefixo rn_
   Raio X pós-captura: o regional revisa a transcrição, as anotações dele
   encaixadas no momento em que foram feitas e os candidatos a FCA, que são
   todos editáveis. A IA só roda no clique em "Gerar diagnóstico e FCA".
   ========================================================================= */
const rn_S={fil:'tudo',q:'',ifil:'todos',edF:null,undo:null};
const rn_IC={
  mic:_sv('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',26),
  note:_sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',26)
};

/* ---------- utilidades ---------- */
function rn_seg(t){const m=String(t||'').match(/(\d+):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;}
function rn_dur(){return rn_seg(AUDIO_EX.dur)||434;}
/* índice da fala cujo horário bate ou vem logo antes de t */
function rn_idxAte(t){const s=rn_seg(t);let k=0;if(s==null)return k;FALAS.forEach((f,i)=>{if(rn_seg(f.t)<=s)k=i;});return k;}
function rn_corta(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1).trimEnd()+'…':s;}
function rn_ok(v){v=String(v==null?'':v).trim();return !!v&&v!=='—';}
function rn_limpa(v){return rn_ok(v)?v:'';}
function rn_item(id){return (ws().itens||[]).find(c=>c.id===id);}
function rn_tipo0(c){const o=c._orig&&COMPROMISSOS.find(x=>x.id===c._orig);return o?o.tipo:null;}
function rn_ini(n){return String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function rn_falas(w){const ed=w.rn_falas||{};return FALAS.map((f,i)=>({...f,i,x:ed[i]!=null?ed[i]:f.x,ed:ed[i]!=null}));}
/* anotações do regional com o id da pergunta (para editar no lugar). Mesma regra de notasAncoradas() */
function rn_notas(w){
  const out=[];
  (w.pauta||[]).forEach(b=>b.qs.forEach(q=>{const tx=w.notas[q.id];if(String(tx||'').trim())out.push({id:q.id,tx,q:q.tx,bloco:b.t,t:ancoraDe(q,b)});}));
  if(String(w.notaGeral||'').trim())out.push({id:'_geral',tx:w.notaGeral,q:null,bloco:'Anotação geral',t:NOTA_GERAL_EX.t});
  return out;
}
function rn_participantes(){const v={};FALAS.forEach(f=>{if(!v[f.w])v[f.w]=f.r;});return Object.entries(v).map(([n,r])=>({n,r}));}
function rn_pessoas(){const a=casoAg();return [...new Set(['Marcelo Brião',a.ger].concat(DEMO_OK()?['Juliana','Diego']:[]))];}
function rn_mark(x,q){
  const e=esc(x);if(!q)return e;
  const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp(qe,'gi'),m=>`<mark>${m}</mark>`);
}
/* algo mudou nos itens depois que o FCA foi gerado: avisa que precisa gerar de novo */
function rn_mudou(){
  const w=ws();
  if(w.fca&&!w.publicado&&!w.rn_dirty){w.rn_dirty=true;const b=$('#rnBar');if(b)b.outerHTML=rn_barHTML();}
}

/* ---------- linha do tempo da conversa (quem falou, compromissos, anotações) ---------- */
function rn_tlHTML(w){
  const D=rn_dur(), its=w.itens||[], N=rn_notas(w), pct=t=>Math.min(100,Math.max(0,(rn_seg(t)||0)/D*100));
  const bands=FALAS.map((f,i)=>{const a=rn_seg(f.t),b=i<FALAS.length-1?rn_seg(FALAS[i+1].t):D;
    return `<button type="button" class="rn-sp ${f.r==='Regional'?'rg':'ag'}" style="left:${(a/D*100).toFixed(2)}%;width:${((b-a)/D*100).toFixed(2)}%" title="${esc(f.w)} · ${f.t}" aria-label="Ir para ${f.t}" onclick="rn_irFala(${i})"></button>`;}).join('');
  const mks=its.filter(c=>c.tempo).map(c=>`<button type="button" class="rn-mk ${c.tipo==='fca'?'fca':'reg'}" style="left:${pct(c.tempo).toFixed(2)}%" title="${c.tempo} · ${c.tipo==='fca'?'Candidato a FCA':'Registro'}: ${esc(c.tema)}" aria-label="Ir para o item ${esc(c.tema)}" onclick="rn_irItem('${c.id}')"></button>`).join('');
  const nts=N.map(n=>`<button type="button" class="rn-mk an" style="left:${pct(n.t).toFixed(2)}%" title="${n.t} · Sua anotação: ${esc(rn_corta(n.tx,80))}" aria-label="Ir para a anotação de ${n.t}" onclick="rn_irTempo('${n.t}')"></button>`).join('');
  let ax='';for(let m=0;m*60<D;m++){if(m>0&&(D-m*60)/D<0.07)continue;ax+=`<span style="left:${(m*60/D*100).toFixed(2)}%">${String(m).padStart(2,'0')}:00</span>`;}
  ax+=`<span class="end" style="left:100%">${AUDIO_EX.dur}</span>`;
  const p=rn_participantes();
  return `<div class="rn-tl">
    <div class="rn-tl-h"><span class="rn-tl-t">Linha do tempo</span>
      <span class="rn-lg"><i class="rg"></i>${esc(p[0]?p[0].n:'Regional')}</span>
      <span class="rn-lg"><i class="ag"></i>${esc(p[1]?p[1].n:'Gerente')}</span>
      <span class="rn-lg"><i class="d fca"></i>Candidato a FCA</span>
      <span class="rn-lg"><i class="d reg"></i>Registro</span>
      <span class="rn-lg"><i class="c"></i>Sua anotação</span></div>
    <div class="rn-tl-r">${mks}</div>
    <div class="rn-tl-b">${bands}</div>
    <div class="rn-tl-r an">${nts}</div>
    <div class="rn-tl-x">${ax}</div>
  </div>`;
}

/* ---------- transcrição com as anotações encaixadas ---------- */
function rn_trsHTML(){
  const w=ws(), F=rn_falas(w), N=rn_notas(w), its=w.itens||[];
  const nAt={},iAt={};
  N.forEach(n=>{const k=rn_idxAte(n.t);(nAt[k]=nAt[k]||[]).push(n);});
  its.forEach(c=>{if(c.tempo){const k=rn_idxAte(c.tempo);(iAt[k]=iAt[k]||[]).push(c);}});
  const q=rn_S.q.trim().toLowerCase();
  const rows=F.filter(f=>{
    if(rn_S.fil==='comp'&&!(f.hl||iAt[f.i]))return false;
    if(rn_S.fil==='notas'&&!nAt[f.i])return false;
    if(q&&!(f.x.toLowerCase().includes(q)||f.w.toLowerCase().includes(q)||(nAt[f.i]||[]).some(n=>String(n.tx).toLowerCase().includes(q))))return false;
    return true;
  });
  if(!rows.length)return `<div class="rn-none">${rn_S.fil==='notas'&&!N.length?'Nenhuma anotação sua nesta conversa.':'Nenhum trecho com esse filtro.'}</div>`;
  /* "Trechos com compromisso" mostra só as falas e os candidatos; as anotações ficam em "Minhas anotações" */
  return rows.map(f=>rn_falaHTML(f,iAt[f.i]||[],rn_S.fil==='comp'?[]:(nAt[f.i]||[]),q)).join('');
}
function rn_falaHTML(f,its,ns,q){
  const lock=!!ws().publicado, ed=rn_S.edF===f.i&&!lock;
  const tx=ed?edTa(f.x,'',{rows:2,cls:'ed-box rn-fx',attr:`onblur="rn_salvaFala(${f.i},this.value)" aria-label="Corrigir a transcrição"`})
             :`<div class="tx">${rn_mark(f.x,q)}</div>`;
  return `<div class="msg rn-msg ${f.hl?'hl':''}" id="rnF${f.i}">
    <span class="av" style="background:${f.c}">${rn_ini(f.w)}</span>
    <div class="bd"><div class="who">${esc(f.w)} <span class="tag t-gy">${esc(f.r)}</span><span class="t">${f.t}</span>${f.ed?'<span class="rn-edt">corrigido por você</span>':''}
      ${lock||ed?'':`<span class="rn-fa">${ib('edit',`rn_editFala(${f.i})`,'Corrigir a transcrição deste trecho')}</span>`}</div>
      ${tx}
      ${its.length?`<div class="rn-chips">${its.map(c=>`<button type="button" class="rn-chip ${c.tipo==='fca'?'':'reg'}" onclick="rn_irItem('${c.id}')">${c.tipo==='fca'?'Candidato a FCA':'Registro'} · ${esc(rn_corta(c.tema||'sem tema',48))} ↓</button>`).join('')}</div>`:''}
    </div></div>
    ${ns.map(rn_notaHTML).join('')}`;
}
function rn_notaHTML(n){
  const lock=!!ws().publicado;
  const onde=n.q?`na pergunta “${esc(rn_corta(n.q,78))}”`:'anotação geral';
  return `<div class="note-b rn-note">${ICON.note}<div class="rn-nb"><div class="nh"><span class="rn-nk">Sua anotação</span><span class="rn-nq" title="${esc(n.q||'')}">· ${onde}</span><span class="rn-nt">${n.t}</span></div>
    ${lock?`<div class="rn-ntx">${esc(n.tx)}</div>`:edTa(n.tx,`rn_setNota('${n.id}',this.value)`,{rows:1,cls:'rn-ntx',attr:'aria-label="Editar anotação"'})}</div>
    ${lock?'':ib('trash',`rn_delNota('${n.id}')`,'Excluir anotação','del')}</div>`;
}
function rn_refreshTrs(){
  const box=$('#rnTrs');if(!box)return;
  box.innerHTML=rn_trsHTML();box.querySelectorAll('.ed-ta').forEach(autoGrow);
  const sg=$('#rnSeg');if(sg)sg.innerHTML=rn_segHTML();
}
function rn_segHTML(){
  const w=ws(), its=w.itens||[], F=FALAS, iT=new Set(its.filter(c=>c.tempo).map(c=>rn_idxAte(c.tempo)));
  const nComp=F.filter((f,i)=>f.hl||iT.has(i)).length, nN=rn_notas(w).length;
  return seg([['tudo',`Tudo <span class="rn-n">${F.length}</span>`],['comp',`Trechos com compromisso <span class="rn-n">${nComp}</span>`],['notas',`Minhas anotações <span class="rn-n">${nN}</span>`]],rn_S.fil,'rn_fil');
}

/* ---------- candidatos a FCA e registros (editáveis) ---------- */
function rn_itemHTML(c,lock){
  const fca=c.tipo==='fca', t0=rn_tipo0(c), mudou=t0&&t0!==c.tipo;
  const pend=fca&&(!rn_ok(c.quem)||!rn_ok(c.prazo));
  const f=(lb,k,ph,cls='')=>`<label class="rn-f ${cls}"><span>${lb}</span>${lock?`<b class="rn-ro">${esc(rn_limpa(c[k])||'—')}</b>`:edIn(rn_limpa(c[k]),`rn_set('${c.id}','${k}',this.value)`,{ph,cls:'ed-box'+(fca?' rn-req':''),attr:k==='quem'?'list="rnPessoas"':''})}</label>`;
  return `<div class="rn-it ${fca?'fca':'reg'}" id="rnI_${c.id}">
    <div class="rn-it-h">
      <span class="tag ${fca?'t-grn':'t-gy'} rn-ty">${fca?'Vira FCA':'Registro'}</span>
      ${c.tempo?`<button type="button" class="rn-tm" onclick="rn_irTempo('${c.tempo}')" title="Ver o trecho na transcrição">${ICON.clock}${c.tempo}</button>`:'<span class="rn-new">adicionado por você</span>'}
      <div class="rn-tema">${lock?`<b>${esc(c.tema||'Sem tema')}</b>`:edIn(c.tema,`rn_set('${c.id}','tema',this.value)`,{ph:'Tema do item',cls:'rn-tema-in',attr:'aria-label="Tema"'})}</div>
      ${mudou?`<span class="rn-chg" title="O copiloto tinha proposto ${t0==='fca'?'FCA':'registro'}">alterado por você</span>`:''}
      ${pend&&!lock?'<span class="rn-pd">falta responsável ou prazo</span>':''}
      ${lock?'':`<button type="button" class="btn btn-xs rn-sw" onclick="rn_tipo('${c.id}')">${fca?ICON.down+'Rebaixar a registro':ICON.up+'Promover a FCA'}</button>${ib('trash',`rn_del('${c.id}')`,'Excluir item','del')}`}
    </div>
    <div class="rn-it-b">
      <label class="rn-f rn-fx"><span>O que foi combinado</span>${lock?`<div class="rn-ro">${esc(c.tx)}</div>`:edTa(c.tx,`rn_set('${c.id}','tx',this.value)`,{rows:2,ph:'Descreva o compromisso ou o registro',cls:'ed-box'})}</label>
      ${f('Responsável','quem',fca?'a definir':'—')}
      ${f('Prazo','prazo',fca?'dd/mm/aaaa':'—')}
    </div>
  </div>`;
}

/* ---------- barra de ação (fixa no rodapé) ---------- */
function rn_barHTML(){
  const w=ws(), its=w.itens||[], nF=its.filter(i=>i.tipo==='fca').length, nR=its.length-nF;
  let mid,right;
  if(w.publicado){
    mid=`<span class="sdot" style="background:var(--green2)"></span><span><b>FCA publicado</b> em ${esc(w.publicadoEm||'')} · visível para a agência</span>`;
    right=`<button class="btn btn-p" onclick="go('fca')">Abrir o FCA →</button>`;
  }else if(w.fca&&!w.rn_dirty){
    mid=`<span class="sdot" style="background:var(--gold)"></span><span><b>Rascunho do FCA gerado</b> com ${nF} compromisso${nF===1?'':'s'}</span>`;
    right=`<button class="btn btn-p" onclick="go('fca')">Abrir o FCA →</button>`;
  }else if(w.fca){
    mid=`<span class="sdot" style="background:var(--amber)"></span><span><b>Itens alterados</b> depois de gerar o FCA · <b>${nF}</b> viram FCA · <b>${nR}</b> registros</span>`;
    right=`<button class="btn" onclick="go('fca')">Abrir sem gerar de novo</button>${aiBtn('Gerar de novo','rn_gerar(this)','solid')}`;
  }else{
    mid=`<span><b>${nF}</b> vira${nF===1?'':'m'} FCA · <b>${nR}</b> fica${nR===1?'':'m'} como registro</span>`;

  return `<div class="rn-bar" id="rnBar">${prevBtn('captura')}<div class="rn-bar-m st-line">${mid}</div><div class="rn-bar-a">${right}</div></div>`;

/* ---------- estados vazios ---------- */
function rn_vazioHTML(w){
  const nN=rn_notas(w).length, temA=!!w.audio;
  const d=temA?`Áudio <strong>${esc(w.audio.nome)}</strong> recebido${nN?` com ${nN} anotaç${nN===1?'ão sua':'ões suas'}`:''}. Processe para ver a transcrição com as anotações encaixadas e os candidatos a FCA.`
              :'Suba o áudio da conversa na Captura. A IA transcreve, encaixa cada anotação sua no momento em que foi feita e propõe o que vira FCA.';
  return emptyState(`<span class="rn-eic">${rn_IC.mic}</span>`,'A conversa ainda não foi processada',d,
    `<button class="btn" onclick="go('captura')">← Ir para a Captura</button>${aiBtn(temA?'Processar conversa':'Processar com o áudio de exemplo','rn_processar(this)','solid')}`)
    ;
}
function rn_outraHTML(w,a){
  const N=rn_notas(w);
  const lista=N.length?`<div class="card rn-card" style="margin-top:16px"><div class="card-h"><h3>Suas anotações da captura</h3><span class="tag t-gd">${N.length}</span><div style="flex:1"></div>${INFO('As anotações que você fez na Captura ficam guardadas no caso. Quando houver a gravação da conversa, a IA encaixa cada uma no momento em que foi feita.')}</div>
    <div class="card-b rn-ol">${N.map(n=>`<div class="note-b rn-note">${ICON.note}<div class="rn-nb"><div class="nh"><span class="rn-nk">${esc(n.bloco)}</span>${n.q?`<span class="rn-nq">· ${esc(rn_corta(n.q,90))}</span>`:''}</div><div class="rn-ntx">${esc(n.tx)}</div></div></div>`).join('')}</div></div>`:'';
  return emptyState(`<span class="rn-eic">${rn_IC.mic}</span>`,`Sem gravação de exemplo para ${esc(a.n)}`,
    'A transcrição, as suas anotações encaixadas e os candidatos a FCA aparecem aqui quando a gravação desta conversa for processada.',
    `<button class="btn" onclick="go('captura')">← Ir para a Captura</button>`)+lista;
}

/* =========================================================================
   RENDER
   ========================================================================= */
RENDER.reuniao=()=>{
  const w=ws(), a=casoAg(), head=casoHead('Compromissos da conversa');
  if(!DEMO_OK())return head+bannerDemo()+rn_outraHTML(w,a);
  if(!w.processado)return head+rn_vazioHTML(w);
  const its=w.itens||[], lock=!!w.publicado, N=rn_notas(w), P=rn_participantes();
  const nF=its.filter(i=>i.tipo==='fca').length, nR=its.length-nF;
  const vis=its.filter(c=>rn_S.ifil==='todos'||(rn_S.ifil==='fca'?c.tipo==='fca':c.tipo!=='fca'));
  return `${head}
  ${lock?`<div class="rn-lock">${ICON.lock}<div><b>FCA publicado em ${esc(w.publicadoEm||'')}.</b> Os itens desta conversa ficaram travados. Prazos e metas agora são ajustados no próprio FCA.</div></div>`:''}

  <div class="card rn-card rn-cands">
    <div class="card-h"><h3>O que foi combinado</h3><span class="sub">${nF} vira${nF===1?'':'m'} FCA · ${nR} fica${nR===1?'':'m'} como registro</span><div style="flex:1"></div>
      ${INFO({oque:'O que a IA identificou na conversa como compromisso (vira FCA) ou como registro para a memória da agência.',como:'Edite o texto, o responsável e o prazo, troque o tipo, exclua ou adicione itens. O horário leva ao trecho da transcrição.',obs:'O FCA só é gerado quando você clicar em Gerar o FCA.'})}</div>
    <div class="card-b rn-its">
      ${its.length?its.map(c=>rn_itemHTML(c,lock)).join(''):`<div class="rn-none">Nenhum compromisso nesta conversa. Adicione um item se algo ficou combinado.</div>`}
      ${lock?'':`<button type="button" class="rn-add" onclick="rn_add()">${ICON.plus}Adicionar item</button>`}
    </div>
  </div>

  <div class="card rn-card">
    <div class="card-h"><h3>Transcrição</h3><span class="sub">${AUDIO_EX.dur} · ${P.map(p=>esc(p.n)).join(' e ')}</span><div style="flex:1"></div>
      ${INFO({oque:'A transcrição da conversa, com as suas anotações encaixadas no momento em que cada assunto foi falado.',como:'Em verde, os trechos que viraram compromisso; em dourado, as suas anotações. Passe o mouse num trecho para corrigir a transcrição.'})}</div>
    <div class="rn-trs" id="rnTrs">${rn_trsHTML()}</div>
  </div>
  <datalist id="rnPessoas">${rn_pessoas().map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
  ${rn_barHTML()}`;
};
NAVBADGE.reuniao=()=>{const w=WS[CASO.ag];return w&&w.processado&&!w.fca&&DEMO_OK()?(w.itens||[]).length:0;};

/* =========================================================================
   AÇÕES
   ========================================================================= */
/* filtros da transcrição: atualiza só a lista, sem roubar o foco da busca */
function rn_fil(v){rn_S.fil=v;rn_refreshTrs();const b=$('#rnTrs');if(b)b.scrollTop=0;}
function rn_q(v){rn_S.q=v;rn_refreshTrs();}
function rn_ifil(v){rn_S.ifil=v;redraw();}

/* corrigir a transcrição de um trecho */
function rn_editFala(i){rn_S.edF=i;rn_refreshTrs();const t=document.querySelector('#rnF'+i+' textarea');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}}
function rn_salvaFala(i,v){
  const w=ws();w.rn_falas=w.rn_falas||{};const orig=FALAS[i].x;v=String(v).trim();
  const antes=w.rn_falas[i]!=null?w.rn_falas[i]:orig;
  if(!v||v===orig)delete w.rn_falas[i];else w.rn_falas[i]=v;
  rn_S.edF=null;rn_refreshTrs();
  if(v&&v!==antes)toast('Trecho corrigido na transcrição','✎');
}
/* anotações do regional */
function rn_setNota(id,v){const w=ws();if(id==='_geral')w.notaGeral=v;else w.notas[id]=v;}
function rn_delNota(id){
  const w=ws();const ant=id==='_geral'?w.notaGeral:w.notas[id];
  rn_S.undo={nota:id,tx:ant};
  if(id==='_geral')w.notaGeral='';else w.notas[id]='';
  redraw();toast(`Anotação excluída <button class="rn-undo" onclick="rn_desfazer()">Desfazer</button>`,'🗑');
}

/* candidatos */
function rn_set(id,k,v){const c=rn_item(id);if(!c)return;c[k]=v;rn_mudou();}
function rn_tipo(id){
  const c=rn_item(id);if(!c)return;
  c.tipo=c.tipo==='fca'?'nota':'fca';rn_mudou();redraw();
  toast(c.tipo==='fca'?'Promovido a FCA: vai virar ação com responsável, prazo e meta':'Rebaixado a registro: fica na memória da unidade, sem plano de ação','✎');
}
function rn_del(id){
  const w=ws(),i=(w.itens||[]).findIndex(c=>c.id===id);if(i<0)return;
  rn_S.undo={item:w.itens[i],i};w.itens.splice(i,1);rn_mudou();redraw();
  toast(`Item excluído <button class="rn-undo" onclick="rn_desfazer()">Desfazer</button>`,'🗑');
}
function rn_desfazer(){
  const u=rn_S.undo,w=ws();if(!u)return;
  if(u.item){w.itens.splice(Math.min(u.i,w.itens.length),0,u.item);}
  else if(u.nota){if(u.nota==='_geral')w.notaGeral=u.tx;else w.notas[u.nota]=u.tx;}
  rn_S.undo=null;redraw();toast('Desfeito','↺');
}
function rn_add(){
  const w=ws();w.itens=w.itens||[];
  const c={id:uid('c'),tipo:'fca',tema:'',tx:'',quem:'',prazo:'',tempo:null,rz:''};
  w.itens.push(c);rn_S.ifil='todos';rn_mudou();redraw();
  setTimeout(()=>{const el=document.querySelector('#rnI_'+c.id+' .rn-tema-in');if(el){el.scrollIntoView({block:'center'});el.focus();}},40);
}

/* navegação entre transcrição e itens */
function rn_flash(el){if(!el)return;el.classList.remove('rn-flash');void el.offsetWidth;el.classList.add('rn-flash');setTimeout(()=>el.classList.remove('rn-flash'),1800);}
function rn_irFala(i){
  let el=document.getElementById('rnF'+i);
  if(!el){rn_S.fil='tudo';rn_S.q='';const s=document.querySelector('.rn-card .srch input');if(s)s.value='';rn_refreshTrs();el=document.getElementById('rnF'+i);}
  const box=$('#rnTrs');if(!el||!box)return;
  const card=box.closest('.card'),r=card.getBoundingClientRect();
  if(r.top<70||r.top>window.innerHeight*0.5)card.scrollIntoView({behavior:'smooth',block:'start'});
  box.scrollTo({top:Math.max(0,el.offsetTop-12),behavior:'smooth'});
  rn_flash(el);
}
function rn_irTempo(t){rn_irFala(rn_idxAte(t));}
function rn_irItem(id){
  let el=document.getElementById('rnI_'+id);
  if(!el){rn_S.ifil='todos';redraw();el=document.getElementById('rnI_'+id);}
  if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});rn_flash(el);
}

/* processar (só para a demonstração, quando a captura ainda não foi processada) */
function rn_processar(btn){
  aiRun(btn,()=>{const w=ws();if(!w.audio)w.audio=audioExemplo();processarConversa();rn_S.fil='tudo';rn_S.ifil='todos';redraw();
    toast('Conversa processada: revise a transcrição e os candidatos','✓');},1600,'Transcrevendo e encaixando…');
}
/* gerar o diagnóstico e o FCA a partir dos itens revisados (único ponto de chamada de IA desta tela) */
function rn_gerar(btn){
  const w=ws(), aprov=(w.itens||[]).filter(i=>i.tipo==='fca');
  if(!aprov.length){toast('Promova ao menos um item a FCA antes de gerar','⚠');return;}
  const vazio=aprov.find(i=>!String(i.tx||'').trim());
  if(vazio){toast('Há um item de FCA sem texto. Preencha ou exclua antes de gerar','⚠');rn_irItem(vazio.id);return;}
  if(w.fca&&!w.publicado){fc_regen('rn');return;}
  aiRun(btn,()=>{fc_gerar();go('fca');toast('Rascunho do FCA gerado: revise, edite e publique','✓');},1500,'Consolidando com IA…');
}

</script>
<script>
/* ---- 50_fca.js ---- */
/* =========================================================================
   5 · DIAGNÓSTICO E FCA · prefixo fc_
   Consolida os compromissos aprovados na conversa registrada em um FCA
   global (fato, causa, ações, meta). Uma única publicação. Depois de publicado, a gerente
   da agência lê e comenta; o regional ajusta prazo e meta a partir dos comentários.
   ========================================================================= */
const fc_S={ver:'regional',open:null,kind:null,draft:''};
const fc_REG='Marcelo Brião';
/* de qual compromisso da conversa nasce cada ação do FCA de exemplo (índice em FCA.acoes) */
const fc_SRC=['C1','C1','C1','C2','C3'];
/* ideias que a IA tirou da transcrição e que ainda não viraram ação (só na conversa de exemplo de Pelotas Lobo) */
const fc_IDEIAS=[
  {k:'i1',t:'04:31',fala:'Se a gente tivesse ligado antes do vencimento, os três teriam renovado.',
   a:'Recontatar os três cooperados PJ que não renovaram (grupo Delta e mais dois) com proposta de retorno das aplicações',q:'Fernanda Rocha'},
  {k:'i2',t:'05:53',fala:'Um deles já tinha comentado que a obra atrasou de qualquer jeito.',
   a:'Confirmar com o cooperado o novo cronograma da obra antes de propor a reprogramação da operação de junho',q:'Fernanda Rocha'}
];
const fc_IC={
  doc:_sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',26),
  lock:_sv('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',26),
  mic:_sv('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',26),
  warn:_sv('<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/>'),
  arch:_sv('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>')
};

/* ---------- utilidades ---------- */
function fc_ok(v){v=String(v==null?'':v).trim();return !!v&&v!=='—'&&v!=='a definir';}
function fc_ini(n){return String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function fc_ag(){return fc_S.ver==='agencia';}
/* quem pode editar o quê: antes de publicar o regional edita tudo; depois, só prazo e meta ('pub'); a agência só lê */
/* depois de publicado, o FCA fica só para leitura (a execução é acompanhada na página do FCA) */
function fc_ed(kind){const w=ws();return !fc_ag()&&!w.publicado;}
function fc_in(val,on,o,kind){return fc_ed(kind)?edIn(val,on,o):`<span class="fc-ro ${o&&o.cls&&o.cls.includes('mono')?'mono':''}">${fc_ok(val)?esc(val):'<i>a definir</i>'}</span>`;}
function fc_ta(val,on,o,kind){return fc_ed(kind)?edTa(val,on,o):`<div class="fc-ro">${fc_ok(val)?esc(val):'<i>a definir</i>'}</div>`;}
function fc_pend(w){return (w.fca?w.fca.acoes:[]).filter(a=>!fc_ok(a.q)||!fc_ok(a.p)||!fc_ok(a.meta));}
function fc_coms(sec){return (ws().coment||[]).filter(c=>c.sec===sec);}
function fc_pendCom(w){return (w.coment||[]).filter(c=>c.papel!=='Gerente regional'&&!c.res).length;}
/* data proposta num comentário: a última citada ("até 25/05 … Proponho 27/05" → 27/05/2026) */
function fc_data(tx){const ms=[...String(tx||'').matchAll(/(\d{2})\/(\d{2})(?:\/(\d{4}))?/g)];const m=ms[ms.length-1];return m?`${m[1]}/${m[2]}/${m[3]||'2026'}`:null;}
/* "R$ 2,81 mi sem sinalização…" → valor "R$ 2,81 mi" + complemento */
function fc_val(s){
  s=String(s||'');const m=s.match(/^([−\-+]?(?:R\$\s?)?[\d.,]+(?:\s?(?:mi|mil|%|p\.p\.|σ))?)\s*(.*)$/);
  if(!m)return [s,''];
  return [m[1],m[2].replace(/^\(|\)$/g,'').replace(/\s*\(/g,' · ').replace(/\)/g,'').trim()];
}
/* comentários de ação usam 'acao-<índice em w.fca.acoes>', o mesmo formato do core (COMENT_SEED) e do acompanhamento */
function fc_secA(i){return 'acao-'+i;}
function fc_acaoDe(w,sec){const m=/^acao-(\d+)$/.exec(sec||'');return m&&w.fca?w.fca.acoes[+m[1]]:null;}
function fc_norm(w){(w.coment||[]).forEach(c=>{if(!c.id)c.id=uid('m');});}
function fc_marca(){const w=ws();if(!w.fc_edit){w.fc_edit=true;const el=$('#fcStTxt');if(el)el.innerHTML=fc_stTxt(w);}}

/* gera o FCA (gerarFCA do core) e alinha as ações com o que o regional decidiu na conversa registrada */
function fc_gerar(){
  const w=ws();gerarFCA();fc_tag(w);
  w.rn_dirty=false;w.fc_edit=false;w.fc_ideias={};fc_S.open=null;
  return w.fca;
}
/* liga cada ação ao compromisso de origem e aplica as decisões da conversa registrada.
   Roda uma vez por FCA gerado (também quando o FCA veio direto de gerarFCA()). */
function fc_tag(w){
  const f=w.fca;if(!f||f._tag)return;
  const its=w.itens||[], n0=FCA.acoes.length;
  const porOrig=Object.fromEntries(its.filter(i=>i._orig).map(i=>[i._orig,i]));
  const base=f.acoes.slice(0,n0), extra=f.acoes.slice(n0);
  base.forEach((a,k)=>{const it=porOrig[fc_SRC[k]];a.src=it?it.id:null;a._k=k;
    const o=COMPROMISSOS.find(x=>x.id===fc_SRC[k]);
    if(it&&o){ /* edições do regional no item seguem para a ação correspondente */
      if(fc_ok(it.quem)&&it.quem!==o.quem&&a.q===o.quem)a.q=it.quem;
      if(fc_ok(it.prazo)&&it.prazo!==o.prazo&&a.p===o.prazo)a.p=it.prazo;
      if(fc_SRC.filter(s=>s===o.id).length===1&&it.tx!==o.tx&&String(it.tx||'').trim())a.a=it.tx;
    }});
  /* item rebaixado ou excluído: a ação sai do FCA */
  let acoes=base.filter(a=>{const it=its.find(i=>i.id===a.src);return it&&it.tipo==='fca';});
  /* registro promovido a FCA vira ação */
  its.filter(i=>i.tipo==='fca'&&i._orig&&!fc_SRC.includes(i._orig)).forEach(i=>acoes.push({id:uid('a'),a:i.tx,q:i.quem,p:i.prazo,meta:'',st:'aberta',prog:0,ev:[],src:i.id}));
  /* itens criados pelo regional (o core já os adiciona ao fim) */
  const novos=its.filter(i=>i.tipo==='fca'&&!i._orig);
  extra.forEach((a,k)=>{a.src=novos[k]?novos[k].id:null;});
  acoes=acoes.concat(extra);
  acoes.forEach(a=>{['q','p','meta'].forEach(k=>{if(!fc_ok(a[k]))a[k]='';});});
  f.acoes=acoes;f._tag=true;fc_causas(f);
}

/* ---------- comentários (estilo Google Docs) ---------- */
/* sem comentários no FCA (v11) */
function fc_cbtn(sec,compacto){
  return '';
  const n=fc_coms(sec).length;
  if(fc_ag())return `<button type="button" class="cmt-btn" onclick="fc_abre('${sec}')" title="Comentar">${ICON.comment}<span>Comentar</span>${n?`<span class="n">${n}</span>`:''}</button>`;
  return n?`<button type="button" class="cmt-btn" onclick="fc_abre('${sec}')" title="Responder">${ICON.comment}${compacto?'':'<span>Responder</span>'}<span class="n">${n}</span></button>`:'';
}
function fc_cmtHTML(c){
  const rg=c.papel==='Gerente regional';
  let act='';
  if(!fc_ag()&&!rg&&!c.res){
    if(fc_acaoDe(ws(),c.sec)){const d=fc_data(c.tx);if(d)act+=`<button class="btn btn-xs btn-p" onclick="fc_aplicaPrazo('${c.id}','${d}')">${ICON.cal}Usar ${d} como prazo</button>`;}
    if(c.kind==='rebaixar')act+=`<button class="btn btn-xs btn-p" onclick="fc_aceitaRebaixe('${c.id}')">${ICON.down}Aceitar e rebaixar</button><button class="btn btn-xs" onclick="fc_mantem('${c.id}')">Manter como FCA</button>`;
    else act+=`<button class="btn btn-xs" onclick="fc_resolve('${c.id}')">${ICON.check}Resolver</button>`;
  }

/* checagem do método FCA (regra fixa, sem IA): fato com número, causa com ação, ação mensurável, objetivo ligado ao fato */
const fc_NUM=/\d/;
function fc_check(f){
  const L=[];
  (f.fatos||[]).forEach((F,n)=>{
    if(!String(F.fato||'').trim()) L.push({k:'f-'+F.id,curto:'fato vazio',tx:`Fato ${n+1} sem texto`});
    else if(!fc_NUM.test(F.fato)) L.push({k:'f-'+F.id,curto:'fato sem número',tx:`Fato ${n+1} sem número (R$, % ou quantidade)`});
    F.causas.forEach(C=>{
      const acs=f.acoes.filter(a=>a.c===C.id);
      if(!String(C.causa||'').trim()) L.push({k:'c-'+C.id,curto:'causa a definir',tx:`Fato ${n+1}: causa a definir (a causa vem do diagnóstico)`});
      if(!acs.length) L.push({k:'c-'+C.id,curto:'sem ação',tx:`Fato ${n+1}: causa sem ação que a corrija`});
      if(!String(C.melhora||'').trim()||!fc_NUM.test(C.melhora)) L.push({k:'m-'+C.id,curto:'sem alvo',tx:`Fato ${n+1}: "o que melhora" sem alvo com número`});
      acs.forEach(a=>{
        const i=f.acoes.indexOf(a)+1, falta=[!fc_ok(a.q)&&'responsável',!fc_ok(a.p)&&'prazo'].filter(Boolean);
        if(falta.length) L.push({k:'a-'+a.id,curto:'sem '+falta.join(' e '),tx:`Ação ${i} sem ${falta.join(' e ')}`});
        else if(!fc_ok(a.meta)||!fc_NUM.test(a.meta)) L.push({k:'a-'+a.id,curto:'meta sem quantidade',tx:`Ação ${i}: meta sem quantidade`});
      });
    });
  });
  return L;
}
function fc_chkHTML(chk,ag){
  if(ag) return '';
  if(!chk.length) return `<div class="fc-chk ok">${ICON.check}<span><b>Checagem do método FCA:</b> sem pendências.</span></div>`;
  return `<div class="fc-chk warn">${fc_IC.warn}<div><b>Checagem do método FCA: ${chk.length} ponto${chk.length>1?'s':''} a ajustar</b><ul>${chk.slice(0,6).map(c=>`<li>${esc(c.tx)}</li>`).join('')}${chk.length>6?`<li>e mais ${chk.length-6}</li>`:''}</ul></div></div>`;
}
/* garante que toda ação está ligada a uma causa (ações novas vão para uma causa a definir) */
function fc_causas(f){
  if(!f.fatos) f.fatos=clone(FCA.fatos);
  const ids=new Set(f.fatos.flatMap(x=>x.causas.map(c=>c.id)));
  const sem=f.acoes.filter(a=>!ids.has(a.c));
  if(sem.length){
    const F=f.fatos[f.fatos.length-1];
    let cx=F.causas.find(c=>c._nova);
    if(!cx){cx={id:uid('c'),causa:'',impacto:'',melhora:'',st:'novo',_nova:true};F.causas.push(cx);}
    sem.forEach(a=>{a.c=cx.id;});
  }
}
function fc_fato(id){return ws().fca.fatos.find(x=>x.id===id);}
function fc_causa(id){for(const F of ws().fca.fatos){const c=F.causas.find(x=>x.id===id);if(c)return c;}return null;}
function fc_setFt(id,k,v){const F=fc_fato(id);if(F){F[k]=v;fc_marca();fc_chkUpd();}}
function fc_setC(id,k,v){const C=fc_causa(id);if(C){C[k]=v;if(k==='causa')delete C._nova;fc_marca();fc_chkUpd();}}
/* atualiza só o quadro da checagem enquanto a pessoa digita */
function fc_chkUpd(){const el=document.querySelector('.fc-chk');if(!el)return;const t=document.createElement('div');t.innerHTML=fc_chkHTML(fc_check(ws().fca),fc_ag());el.replaceWith(t.firstElementChild||t);}
function fc_addC(fid){const F=fc_fato(fid);if(!F)return;F.causas.push({id:uid('c'),causa:'',impacto:'',melhora:'',st:'novo'});fc_marca();redraw();}
function fc_delC(id){const w=ws();w.fca.fatos.forEach(F=>{const i=F.causas.findIndex(c=>c.id===id);if(i>=0&&F.causas.length>1){const rest=F.causas[i===0?1:0];w.fca.acoes.forEach(a=>{if(a.c===id)a.c=rest.id;});F.causas.splice(i,1);}});fc_marca();redraw();toast('Causa excluída · as ações foram para a outra causa do fato','🗑');}
function fc_addF(){const w=ws();w.fca.fatos.push({id:uid('f'),tema:'',fato:'',causas:[{id:uid('c'),causa:'',impacto:'',melhora:'',st:'novo'}]});fc_marca();redraw();}
function fc_delF(id){const w=ws(),fs=w.fca.fatos;if(fs.length<2)return;const i=fs.findIndex(F=>F.id===id);if(i<0)return;const dst=fs[i===0?1:0].causas[0].id,ids=fs[i].causas.map(c=>c.id);w.fca.acoes.forEach(a=>{if(ids.includes(a.c))a.c=dst;});fs.splice(i,1);fc_marca();redraw();toast('Fato excluído · as ações foram para o outro fato','🗑');}

function fc_ver(v){fc_S.ver=v;fc_S.open=null;fc_S.draft='';redraw();}
/* edição no lugar: grava sem redesenhar a cada tecla */
function fc_setF(k,v){ws().fca[k]=v;fc_marca();}
function fc_setInd(v){ws().fca.indicador=v;fc_marca();redraw();}
function fc_setA(id,k,v){const w=ws(),a=w.fca.acoes.find(x=>x.id===id);if(!a)return;a[k]=v;if(w.publicado&&(k==='p'||k==='meta'))a._aj=true;fc_marca();}

let fc_undo=null;
function fc_delA(id){
  const w=ws(),i=w.fca.acoes.findIndex(x=>x.id===id);if(i<0)return;
  const a=w.fca.acoes[i];if(a._ideia&&w.fc_ideias)delete w.fc_ideias[a._ideia];

}
function fc_addD(){
  const w=ws();w.sintese.decisoes.push({tx:'',t:''});fc_marca();redraw();
  setTimeout(()=>{const els=$$('.fc-dl .ed-ta');const el=els[els.length-1];if(el)el.focus();},40);
}
function fc_delD(i){
  const w=ws();fc_undo={tipo:'dec',v:w.sintese.decisoes[i],i};w.sintese.decisoes.splice(i,1);fc_marca();redraw();
  toast(`Decisão excluída <button class="rn-undo" onclick="fc_desfazer()">Desfazer</button>`,'🗑');
}
function fc_desfazer(){

  const arr=u.tipo==='acao'?w.fca.acoes:w.sintese.decisoes;arr.splice(Math.min(u.i,arr.length),0,u.v);

}
function fc_addIdeia(k){
  const w=ws(),d=fc_IDEIAS.find(x=>x.k===k);if(!d)return;
  w.fc_ideias=w.fc_ideias||{};w.fc_ideias[k]='add';
  w.fca.acoes.push({id:uid('a'),a:d.a,q:d.q||'',p:'',meta:'',st:'aberta',prog:0,ev:[],src:null,_ideia:k,_t:d.t,c:{i1:'c1',i2:'c3'}[k]});
  fc_marca();redraw();toast('Ideia adicionada como ação: defina prazo e meta','✓');
}
function fc_descIdeia(k){const w=ws();w.fc_ideias=w.fc_ideias||{};w.fc_ideias[k]='desc';redraw();toast('Ideia descartada','🗑');}

/* exportar */
function fc_expTg(e){e.stopPropagation();const p=e.currentTarget.parentElement;const o=!p.classList.contains('open');$$('.fc-exp.open').forEach(x=>x.classList.remove('open'));p.classList.toggle('open',o);}
document.addEventListener('click',()=>$$('.fc-exp.open').forEach(x=>x.classList.remove('open')));
function fc_exporta(fmt){const w=ws();toast(`${w.fca.id} exportado em ${fmt}: FCA e compromissos`,'⬇');}

/* gerar / regenerar (a IA só roda no clique) */
function fc_processar(btn){
  aiRun(btn,()=>{const w=ws();if(!w.audio)w.audio=audioExemplo();processarConversa();redraw();toast('Conversa processada: revise os candidatos na conversa registrada','✓');},1600,'Transcrevendo e encaixando…');
}
function fc_gerarBtn(btn){aiRun(btn,()=>{fc_gerar();redraw();toast('Rascunho do FCA gerado: revise, edite e publique','✓');},1500,'Consolidando com IA…');}
function fc_regen(origem){
  const w=ws();
  modal(`<div class="mod-h"><h3>${origem==='rn'?'Gerar de novo o diagnóstico e FCA?':'Regenerar o FCA com IA?'}</h3><button class="x" onclick="closeModal()" aria-label="Fechar">×</button></div>
    <div class="mod-b fc-mb"><p>A IA monta de novo o fato, a causa, as ações e a meta a partir dos compromissos aprovados na conversa registrada.</p>
      ${w.fc_edit?`<div class="fc-pw">${fc_IC.warn}<span>As edições que você fez neste rascunho serão substituídas.</span></div>`:''}</div>
    <div class="mod-f"><button class="btn" onclick="closeModal()">Cancelar</button>${aiBtn(origem==='rn'?'Gerar de novo':'Regenerar',`fc_regenOk(this,'${origem}')`,'solid')}</div>`);
}
function fc_regenOk(btn,origem){
  aiRun(btn,()=>{fc_gerar();closeModal();if(origem==='rn')go('fca');else redraw();toast('FCA gerado de novo com os compromissos atuais','✓');},1400,'Consolidando com IA…');
}

/* publicar: uma única publicação; a partir dela a agência vê */
function fc_publicar(){
  const w=ws(),f=w.fca,pend=fc_pend(w),ger=casoAg().ger,ap=(w.itens||[]).filter(i=>i.tipo==='fca').length;
  modal(`<div class="mod-h"><h3>Publicar ${esc(f.id)}?</h3><button class="x" onclick="closeModal()" aria-label="Fechar">×</button></div>
    <div class="mod-b fc-mb">
      <p>O FCA fica visível para <b>${esc(ger)}</b>, gerente da agência. Depois de publicado, o texto não muda: o acompanhamento é feito marcando as ações e anexando as evidências.</p>
      <div class="fc-ms"><div><span>Fatos</span><b>${(f.fatos||[]).length}</b></div><div><span>Ações</span><b>${f.acoes.length}</b></div><div><span>Prazo final</span><b class="mono">${esc(f.prazoFinal||'a definir')}</b></div></div>
      <div class="fc-mm"><span>Objetivo</span>${esc(f.meta||'a definir')}</div>
      ${w.rn_dirty?`<div class="fc-pw">${fc_IC.warn}<span>Os compromissos mudaram depois deste rascunho. Para incluir as mudanças, cancele e use <b>Gerar de novo</b>.</span></div>`:''}
      ${(()=>{const ck=fc_check(f);return ck.length?`<div class="fc-pw">${fc_IC.warn}<span><b>A checagem do método encontrou ${ck.length} ponto${ck.length>1?'s':''}:</b> ${esc(ck.slice(0,3).map(c=>c.tx).join('; '))}${ck.length>3?'…':''}. Dá para publicar e completar depois.</span></div>`:`<div class="fc-pw ok">${ICON.check}<span>Checagem do método FCA sem pendências.</span></div>`;})()}
    </div>
    <div class="mod-f"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="fc_publicaOk()">${ICON.check}Publicar agora</button></div>`);
}
function fc_publicaOk(){
  const w=ws();publicarFCA();
  /* o comentário semente fala da ação 2 do FCA de exemplo: segue essa ação mesmo que o regional tenha mudado a ordem */
  w.coment=w.coment.filter(c=>{const m=/^acao-(\d+)$/.exec(c.sec);if(!m)return true;
    const ni=w.fca.acoes.findIndex(a=>a._k===+m[1]);if(ni<0)return false;c.sec=fc_secA(ni);return true;});
  fc_norm(w);closeModal();fc_S.ver='regional';fc_S.open=null;redraw();
  toast(`${w.fca.id} publicado: visível para ${casoAg().ger}`,'✓');
}

/* comentários */
function fc_abre(sec,kind){fc_S.open=sec;fc_S.kind=kind||null;fc_S.draft='';
  const m=/^item:(.+)$/.exec(sec);if(m)ACC['fcC_'+m[1]]=true;if(sec==='sintese')ACC.fcSint=true;redraw();}
function fc_cancela(){fc_S.open=null;fc_S.kind=null;fc_S.draft='';redraw();}
function fc_envia(sec){
  const tx=String(fc_S.draft||'').trim();if(!tx){toast('Escreva o comentário antes de enviar','⚠');const t=$('#fcCin');if(t)t.focus();return;}
  const ag=fc_ag(),w=ws();
  w.coment.push({id:uid('m'),sec,kind:fc_S.kind,autor:ag?casoAg().ger:fc_REG,papel:ag?'Gerente da agência':'Gerente regional',quando:'agora',tx});
  const reb=fc_S.kind==='rebaixar';fc_S.open=null;fc_S.kind=null;fc_S.draft='';redraw();
  toast(reb?'Sugestão enviada ao regional':ag?'Comentário enviado ao regional':'Resposta enviada à agência','💬');
}
function fc_resp(c,tx){ws().coment.push({id:uid('m'),sec:c.sec,autor:fc_REG,papel:'Gerente regional',quando:'agora',tx});}
function fc_resolve(id){const c=ws().coment.find(x=>x.id===id);if(!c)return;c.res=true;redraw();toast('Comentário resolvido','✓');}
function fc_aplicaPrazo(id,d){
  const w=ws(),c=w.coment.find(x=>x.id===id);if(!c)return;
  const a=fc_acaoDe(w,c.sec);if(!a)return;
  a.p=d;a._aj=true;c.res=true;fc_resp(c,`Prazo ajustado para ${d}.`);redraw();
  toast(`Prazo ajustado para ${d} · a agência é avisada`,'📅');
}
function fc_aceitaRebaixe(id){
  const w=ws(),c=w.coment.find(x=>x.id===id);if(!c)return;
  const itId=c.sec.slice(5),it=(w.itens||[]).find(x=>x.id===itId);if(!it)return;
  it.tipo='nota';const old=w.fca.acoes.slice(),n=old.filter(a=>a.src===itId).length;
  w.fca.acoes=old.filter(a=>a.src!==itId);c.res=true;
  /* as ações mudaram de posição: os comentários 'acao-<índice>' acompanham a ação; os da ação que saiu vão para o compromisso */
  w.coment.forEach(m=>{const a=fc_acaoDe({fca:{acoes:old}},m.sec);if(!a)return;const ni=w.fca.acoes.indexOf(a);m.sec=ni>=0?fc_secA(ni):c.sec;});
  fc_resp(c,`Rebaixado para registro${n?`: ${n} aç${n===1?'ão saiu':'ões saíram'} do FCA`:''}.`);redraw();
  toast(`“${it.tema}” rebaixado para registro`,'✎');
}
function fc_mantem(id){const c=ws().coment.find(x=>x.id===id);if(!c)return;c.res=true;fc_resp(c,'Mantido como FCA.');redraw();toast('Mantido como FCA','✓');}

</script>
<script>
/* ---- 60_plano.js ---- */
/* =========================================================================
   6 · EXECUÇÃO E ACOMPANHAMENTO  (prefixo pl_)
   Fotografia posterior à reunião: situação em pl_REF, 9 dias depois do FCA.
   Status de cada ação calculado contra pl_REF; ações vêm do FCA publicado
   (ws('PEL').fca, se o regional publicou no fluxo) ou do FCA de exemplo.
   ========================================================================= */
const pl_REF = '27/05/2026';
const pl_REFD = dataBR(pl_REF);
const pl_FCA_DT = '18/05/2026';
const pl_dias  = s=>diasAte(s,pl_REFD);           /* >0: futuro em relação a pl_REF */
const pl_desde = s=>diasDesde(s,pl_REFD);
const pl_d  = s=>String(s||'').slice(0,5);         /* '27/05' */
const pl_dy = s=>{const m=String(s||'').match(/(\d{2}\/\d{2})\/\d{2}(\d{2})/);return m?m[1]+'/'+m[2]:(s||'—');};  /* '27/05/26' */

/* situação de cada ação do FCA de exemplo em 27/05 (pela posição em FCA.acoes) */
const pl_SNAP = [
  {prog:100, feito:'20/05/2026', ev:['lista_vencimentos_PEL_60d.xlsx']},
  {prog:60,  ev:['3 de 5 contatos registrados']},
  {prog:75,  ev:['carteira_redistribuida.pdf']},
  {prog:100, feito:'21/05/2026', ev:['e-mail 19/05 · resposta em 21/05']},
  {prog:25,  ev:[]}
];
/* resposta do regional ao comentário da gerente (ação 2) */
const pl_RESP = {1:[{autor:'Marcelo Brião', papel:'Regional', quando:'19/05 · 10:03', tx:'Combinado. Prazo ajustado para 27/05.', rg:true}]};

/* metas do FCA (resultado esperado): valor na data do FCA, hoje e alvo */
const pl_METAS = [
  {n:'Captação ÷ crédito', fca:0.97,  hoje:0.98,  alvo:1.05,  f:v=>nf(v,2),             lb:'alvo ≥ 1,05'},
  {n:'RDC a vencer sem tratativa', fca:2.81,  hoje:0.94,  alvo:0,     f:v=>'R$ '+nf(v,2)+' mi', lb:'alvo zero'},
  {n:'Carteira de crédito',        fca:219.1, hoje:219.6, alvo:219.1, f:v=>'R$ '+nf(v,1)+' mi', lb:'sem redução', manter:true}
];

/* relação captação/crédito quinzenal antes do FCA: 01/12/2025 … 15/05/2026 (12 pontos) · usada também no resultado */
const pl_COB_ANTES = [1.16,1.15,1.155,1.16,1.145,1.13,1.11,1.09,1.065,1.04,1.005,0.97];
const pl_LB_ANTES  = ['dez','','jan','','fev','','mar','','abr','','mai',''];

/* FCA de longo prazo em uma agência que já tem outro FCA aberto (mostra como diferenciar) */
const pl_FCA_EXTRA = [
  {id:'FCA-2026-0144', ag:'CAM', tema:'Diversificação da carteira rural · plano safra 2026/27', aberto:'22/04/2026', prazo:'31/03/2027', exec:10, acoes:5, atraso:0}
];

const pl_ST = {src:null, acoes:null, fa:'todas', ord:'agencia', fl:'todos', busca:''};

/* ---------- ações ---------- */
function pl_fcaAtual(){const w=ws('PEL');return (w.publicado&&w.fca)?w.fca:FCA;}
function pl_base(){
  const src=pl_fcaAtual().acoes||[], mesmo=src.length===FCA.acoes.length;
  return src.map((a,i)=>{
    let k=FCA.acoes.findIndex(o=>o.a===a.a);
    if(k<0&&mesmo)k=i;
    const s=k>=0?pl_SNAP[k]:null;
    const o={id:uid('pa'),k,src:a.id||null,a:a.a||'',q:a.q||'—',meta:a.meta||'a definir',aberta:a.aberta||pl_FCA_DT,p:a.p||'—',prog:0,ev:[],feito:null,pAnt:null,coment:[]};
    if(s){
      o.prog=s.prog;o.ev=[...s.ev];o.feito=s.feito||null;
      /* prazo ajustado depois do comentário da agência (aqui ou já na tela do FCA) */
      if(s.p&&(a.p===FCA.acoes[k].p||a.p===s.p)){o.p=s.p;o.pAnt=s.pAnt;o.pQuando=s.pQuando;o.pMotivo=s.pMotivo;}
    }
    return o;
  });
}
function pl_acoes(){
  const src=pl_fcaAtual();
  if(pl_ST.src!==src||!pl_ST.acoes){pl_ST.src=src;pl_ST.acoes=pl_base();}
  return pl_ST.acoes;
}
function pl_status(a){
  if(a.prog>=100)return 'concluida';
  const d=pl_dias(a.p);
  if(d==null)return 'noprazo';
  if(d<0)return 'vencida';
  if(d===0)return 'hoje';
  const tot=diasAte(a.p,dataBR(a.aberta)),dec=pl_desde(a.aberta);

  </div>

  <div class="grid pl-g2">
    <div class="card">
      <div class="card-h"><h3>Efeito no indicador</h3><span class="sub">captação ÷ crédito</span><div style="flex:1"></div>

        ${pl_grafico()}

        <div class="pl-read">Desde o FCA: <b>${nf(m0.fca,2)} → ${nf(m0.hoje,2)}</b>. Meta: <b>1,05</b> até ${pl_d(fim)}.</div>

      <div class="card-b" style="padding:4px 16px 10px">
        ${pl_METAS.map(m=>{
          const ok=m.manter?m.hoje>=m.alvo:null,pct=m.manter?0:Math.max(0,Math.min(100,Math.round((m.hoje-m.fca)/(m.alvo-m.fca)*100)));
          return `<div class="pl-mt">
            <div class="pl-mt-n"><b>${m.n}</b><span>${m.lb}</span></div>
            <div class="pl-mt-v mono"><span>${m.f(m.fca)}</span><i>→</i><b>${m.f(m.hoje)}</b></div>
            <div class="pl-mt-b">${m.manter?`<span class="tag ${ok?'t-grn':'t-red'}">${ok?'preservada':'abaixo'}</span>`:`<div class="bar"><i style="width:${pct}%"></i></div><span class="mono">${pct}%</span>`}</div>
          </div>`;}).join('')}
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:14px" id="plCarteira">
    <div class="card-h"><h3>Todos os FCAs abertos</h3><span class="sub">${lst.length} FCAs em ${nAg} agências</span><div style="flex:1"></div>
      ${INFO({oque:'FCAs em aberto na sua carteira. Uma agência pode ter mais de um FCA ao mesmo tempo, com horizontes diferentes.',como:'Horizonte pela duração planejada: curto até 90 d, médio até 180 d, longo acima disso. Execução em verde no ritmo do prazo, âmbar abaixo do ritmo, vermelho vencido.'})}</div>
    <div class="tbar">
      ${seg([['agencia','Por agência'],['prazo','Por prazo']],pl_ST.ord,'pl_ord')}
      <span class="pl-vs"></span>
      ${Object.entries(pl_FL).map(([k,l])=>fchip(`${l} <span class="pl-fc">${pl_filtra(lst,k).length}</span>`,pl_ST.fl===k,`pl_fl('${k}')`)).join('')}
      <div style="flex:1"></div>
      <span class="pl-sw">${searchCtl('Buscar agência, tema ou FCA','pl_busca',pl_ST.busca)}</span>
    </div>
    <div class="card-b pl-tw" id="plFcaT" style="padding:0">${pl_tabela()}</div>
  </div>

  ${stepnav(prevBtn('fca'),nextBtn('resultado'))}`;
};
