  let body;
  if(st==='pauta'){
    if(!w.pauta||NAV.pre){SUB='prepauta';const inds=rx_inds(a.id);body=`${ag_dup(a)}${rx_prepauta(a.id,inds)}${dp_html(a)}${w.pauta?`<div class="stepnav"><span></span><button class="btn btn-p" onclick="NAV.pre=false;redraw()">Voltar para as perguntas →</button></div>`:''}`;}
    else {SUB='pauta';body=RENDER.pauta().replace(/onclick="go\('radiografia'\)">Rever pré-pauta/,'onclick="ag_prePauta()">Rever pré-pauta').replace('Ir para a captura','Ir para o registro');}
  }
  else if(st==='registro'){SUB='captura';body=ag_semNav(RENDER.captura()).replace(/onclick="go\('radiografia'\)">Ir para a radiografia/,`onclick="ag_step('pauta')">Ir para a pauta`)+(w.pauta?dp_html(a):'');}
  else if(st==='revisao'){SUB='reuniao';body=RENDER.reuniao();}
  else {SUB='fca';body=RENDER.fca();}
  return `<div class="cv-h">
      <button type="button" class="ag-back" onclick="ag_convFecha()">← Conversas</button>
      <div class="cv-t"><b>Conversa de 18/05 com ${esc(a.ger)}</b></div>
      ${steps}
    </div>
    ${body}`;
}
/* aviso de FCA já aberto no mesmo tema do sinal (para revisar em vez de duplicar) */
function ag_dup(a){
  const s=casoSig(), id=s&&FCA_DO_SINAL[s.id], f=id&&rd_fcasDe(a.id).find(x=>x.id===id);
  if(!f) return '';
  return `<div class="ag-dup">${ICON.flag}<div><b>Já existe FCA em aberto neste tema: ${f.id}</b><span>${esc(f.tema)} · ${f.exec}% executado. A IA vai sugerir revisar esse FCA (status Intensificar) em vez de abrir outro.</span></div><button class="btn btn-s" type="button" onclick="pl_fcaDw('${f.id}')">Ver o ${f.id}</button></div>`;
}

/* ---------- tela ---------- */
RENDER.agencia=()=>{
  const a=AGX[NAV.ag], R=resumoAg(a.id), w=ws(a.id);
  if(NAV.tab==='fcas'&&NAV.fca&&!(w.publicado&&w.fca&&w.fca.id===NAV.fca)) NAV.fca=null;
  const body=NAV.tab==='fcas'?(NAV.fca?ag_fcaDet(a,w):ag_fcaLista(a,w))
    :NAV.tab==='conversas'?(NAV.conv?ag_conversa(a,w):ag_convLista(a,w))
    :ag_raiox(a,R);
  return `${ag_head(a,R,w)}${ag_tabs(a,w)}<div class="ag-body">${body}</div>`;
};
AFTER.agencia=()=>{
  const m={pauta:'pauta',fca:'fca',plano:'plano',captura:'captura',reuniao:'reuniao',resultado:'resultado'}[SUB];
  if(m&&AFTER[m]) AFTER[m]();
};

</script>
<script>
/* ---- 14_topo.js ---- */
/* =========================================================================
   SELETOR DE AGÊNCIA (v10)
   Sem barra lateral: o topo mostra "Visão geral › agência" e o nome da agência
   abre a lista das 18 para trocar sem voltar ao painel.
   ========================================================================= */
let agp_el=null, agp_q0='';
function agp_lista(q){
  const n=rd_norm(q).trim();
  return ['Sul','Nordeste'].map(r=>{
    const L=AGENCIAS.filter(a=>a.r===r&&(!n||rd_norm(a.n+' '+a.ger).includes(n))).sort((x,y)=>x.n.localeCompare(y.n,'pt-BR'));
    if(!L.length) return '';
    return `<div class="agp-g">Regional ${r}</div>${L.map(a=>{
      const R=resumoAg(a.id), w=WS[a.id], cur=ATUAL==='agencia'&&NAV.ag===a.id;
      const prep=rd_temProg(a.id)&&!(w&&w.publicado);
      return `<button type="button" class="agp-i ${cur?'on':''}" role="option" aria-selected="${cur}" onclick="agp_ir('${a.id}')">
        <span class="ag-d ${a.st}" aria-hidden="true"></span>
        <span class="agp-n"><b>${esc(a.n)}</b><small>${esc(a.ger)}${prep?' · <em>conversa em preparação</em>':''}</small></span>
        <span class="fx ${faixa(R.resPct)}" title="Resultado × orçado">${R.resPct}%</span>
      </button>`;}).join('')}`;
  }).join('')||'<div class="agp-0">Nenhuma agência com esse nome.</div>';
}
function agp_abre(btn){
  if(agp_el){agp_fecha();return;}
  const r=btn.getBoundingClientRect();
  agp_el=document.createElement('div');
  agp_el.className='agp';agp_el.setAttribute('role','listbox');
  agp_el.style.top=(r.bottom+8)+'px';agp_el.style.left=Math.max(12,Math.min(r.left,innerWidth-372))+'px';
  agp_el.innerHTML=`<div class="agp-s">${ICON.search||''}<input id="agpQ" type="search" placeholder="Buscar agência ou gerente" autocomplete="off" oninput="agp_f(this.value)" onkeydown="agp_k(event)"></div>
    <div class="agp-l" id="agpL">${agp_lista('')}</div>
    <div class="agp-f">A cor do ponto é a situação da agência · % = resultado × orçado</div>`;
  document.body.appendChild(agp_el);
  btn.setAttribute('aria-expanded','true');
  setTimeout(()=>{const i=$('#agpQ');if(i)i.focus();const on=agp_el&&agp_el.querySelector('.agp-i.on');if(on)on.scrollIntoView({block:'center'});},20);
}
function agp_fecha(){
  if(!agp_el)return;
  agp_el.remove();agp_el=null;
  const b=$('#crAg');if(b)b.setAttribute('aria-expanded','false');
}
function agp_f(v){const l=$('#agpL');if(l)l.innerHTML=agp_lista(v);}
function agp_k(e){
  if(e.key==='Escape'){agp_fecha();return;}
  if(e.key==='Enter'){const b=agp_el&&agp_el.querySelector('.agp-i');if(b)b.click();}
}
/* trocar de agência mantém a aba (Raio X, FCAs ou Conversas) */
function agp_ir(id){agp_fecha();abrirAgencia(id,ATUAL==='agencia'?NAV.tab:'raiox');}
document.addEventListener('mousedown',e=>{if(agp_el&&!agp_el.contains(e.target)&&!e.target.closest('#crAg'))agp_fecha();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')agp_fecha();});

</script>
<script>
/* ---- 16_tip.js ---- */
/* =========================================================================
   ⓘ (v11): a explicação abre num balão único preso à tela, fora do card,
   para não ser cortada pela borda do card nem sair da janela
   ========================================================================= */
const itip=document.createElement('div');
itip.className='itip';itip.setAttribute('role','tooltip');
document.body.appendChild(itip);
let itip_on=null;
function itipShow(el){
  const t=el.querySelector('.tip');if(!t)return;
  itip_on=el;itip.innerHTML=t.innerHTML;itip.classList.add('show');
  const r=el.getBoundingClientRect(), w=itip.offsetWidth, h=itip.offsetHeight, m=12;
  let left=el.classList.contains('r')?r.left-6:r.right-w+6;
  left=Math.max(m,Math.min(left,innerWidth-w-m));
  let top=r.bottom+8;
  if(top+h>innerHeight-m) top=Math.max(m,r.top-h-8);
  itip.style.left=left+'px';itip.style.top=top+'px';
}
function itipHide(){itip_on=null;itip.classList.remove('show');}
document.addEventListener('mouseover',e=>{
  const i=e.target.closest&&e.target.closest('.info');
  if(i){if(i!==itip_on)itipShow(i);}else if(itip_on)itipHide();
});
document.addEventListener('focusin',e=>{const i=e.target.closest&&e.target.closest('.info');if(i)itipShow(i);});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.info'))itipHide();});
document.addEventListener('scroll',itipHide,true);

</script>
<script>
/* ---- 20_radiografia.js ---- */
/* =========================================================================
   2 · RADIOGRAFIA DA AGÊNCIA · prefixo rx
   Roda sobre o caso ativo (CASO.ag). Gráficos do topo, indicadores com
   drill-down de 12 meses
   (funcionalidade a validar) e, no fim, a pré-pauta: leitura do regional,
   sugestão da IA (só ao clicar) e confirmação que gera as perguntas da Pauta.
   ========================================================================= */

/* estado do módulo (por agência quando faz sentido) */
const rx_S = {
  filtro:'todos',      /* indicadores: 'todos' | 'desvio' | 'meta' */
  per:12, tema:'', q:'',   /* filtros da etapa 2: período (meses), tema do indicador, busca */
  pp:{},               /* ag -> {ref, leitura, editado}: ligado à pré-pauta atual (ws().prepauta) */
  pos:{},              /* ag -> {ref, alt}: ligado à pauta atual (ws().pauta); alt = pré-pauta mudou depois das perguntas */
  undo:null            /* último bloco apagado (para desfazer) */
};

/* marcos de FCAs anteriores da unidade nos gráficos dos indicadores (i = índice em MESES) */
const rx_MARCOS = {
  PEL:{
    'Inadimplência >90d':[{i:8, t:'FCA-2026-0091'}],
    'Produtos por cooperado':[{i:5, t:'FCA-2025-0233'}]
  }
};

/* hipóteses genéricas por tema do sinal (agências sem análise detalhada na demonstração) */
const rx_HIP_TEMA = {
  captacao:{t:'Saída de captação concentrada em poucos cooperados', p:'Verificar se a queda vem de poucos cooperados ou de vencimentos sem renovação.'},
  risco:{t:'Inadimplência concentrada em um segmento da carteira', p:'Verificar se o vencido se concentra em um produto, safra ou grupo de cooperados.'},
  relacionamento:{t:'Abordagem de produtos abaixo do padrão da rede', p:'Verificar se falta oferta ativa ou se a base tem perfil diferente do esperado.'},
  credito:{t:'Demanda sazonal sem oferta ativa', p:'Verificar se a agência antecipou a oferta para a janela sazonal.'},
  resultado:{t:'Renegociação de taxas pressionando a margem', p:'Verificar quem aprovou as renegociações e com qual critério.'}
};

const rx_ST = {
  ruim:{c:'t-red', lb:'fora da meta'},
  atenc:{c:'t-amb', lb:'atenção'},
  bom:{c:'t-grn', lb:'acima da meta'},
  ok:{c:'t-gy', lb:'dentro da meta'}
};

/* indicador do próprio sinal, para agências cujo sinal não aparece nos indicadores genéricos
   (valores das evidências do sinal; série de 12 meses sintética da demonstração) */
const rx_EXTRA = {
  RGD:{n:'PF novos sem produto', d:'admitidos no trimestre', fim:58, var:0.41, ref:31, refLb:'rede', bom:'baixo', st:'ruim'},
  BAG:{n:'PF sem seguro', d:'% dos cooperados PF', fim:62, var:0.04, ref:38, refLb:'rede', bom:'baixo', st:'atenc'}
};
const rx_INDC = {};
function rx_inds(ag){
  if(rx_INDC[ag]) return rx_INDC[ag];
  const base=indicadoresDe(ag), x=rx_EXTRA[ag];
  if(!x) return (rx_INDC[ag]=base);
  const sp=serieSint(x.fim,x.var,ag+'rx').map(v=>+(+v).toFixed(1));
  const ind={n:x.n, d:x.d, v:nf(x.fim,0)+'%', dl:+(sp[11]-sp[8]).toFixed(1), st:x.st, sp,
    meta:`${x.refLb} ${nf(x.ref,0)}%`, metaV:x.ref, refLb:x.refLb, dec:0, un:'%', bom:x.bom, rxSinal:true};
  return (rx_INDC[ag]=[ind,...base]);
}
/* indicador aberto por padrão: o do sinal do caso; senão o primeiro crítico fora dos gráficos do topo */
function rx_foco(ag,inds){
  const s=casoSig(), tema=s&&s.ag===ag?s.tema:null;
  const porTema={risco:'Inadimplência >90d',credito:'Carteira de crédito'}[tema];
  const cands=[
    inds.find(i=>i.rxSinal),
    porTema&&inds.find(i=>i.n===porTema&&(i.st==='ruim'||i.st==='atenc')),
    inds.find(i=>i.st==='ruim'&&i.n!=='Captação ÷ crédito'),
    inds.find(i=>i.st==='ruim')
  ];
  const f=cands.find(Boolean);
  return f?inds.indexOf(f):-1;
}
/* primeira letra minúscula, sem mexer em siglas (PF, PJ, RDC) */
function rx_lc(s){s=String(s||'');return /^[A-ZÀ-Ú]{2}/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);}

/* ---------------- formatação ---------------- */
function rx_w(){return ws(CASO.ag);}
function rx_sg(v,d){const r=+(+v).toFixed(d);return (r>0?'+':r<0?'−':'')+nf(Math.abs(r),d);}
function rx_fmt(ind,v){const n=nf(v,ind.dec);return ind.un==='R$ mi'?`R$ ${n} mi`:ind.un==='%'?`${n}%`:n;}
function rx_mes(i){i+=rx_off();return `${MESES[i]}/${i<7?'25':'26'}`;}
/* ---------- filtros da etapa 2 ---------- */
const rx_TEMAS={captacao:'Captação e funding',credito:'Crédito e risco',relac:'Relacionamento',result:'Resultado'};
const rx_TEMA_IND={'Captação total':'captacao','Captação ÷ crédito':'captacao','Concentração top-10 PJ':'captacao','Carteira de crédito':'credito','Inadimplência >90d':'credito','Cooperados ativos':'relac','Produtos por cooperado':'relac','NPS da agência':'relac','Margem de contribuição':'result','Receita de serviços':'result'};
function rx_off(){return 12-rx_S.per;}
function rx_L(){return MESES.slice(rx_off());}
function rx_corta(inds){const o=rx_off();return o?inds.map(i=>({...i,sp:i.sp.slice(o)})):inds;}
function rx_temaDe(ind){return rx_TEMA_IND[ind.n]||(/inadimpl|crédito|risco/i.test(ind.n)?'credito':/capta|cobertura/i.test(ind.n)?'captacao':/margem|receita/i.test(ind.n)?'result':'relac');}
function rx_okFil(ind){
  const q=String(rx_S.q||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const nm=ind.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const desv=ind.st==='ruim'||ind.st==='atenc';
  return (!rx_S.tema||rx_temaDe(ind)===rx_S.tema)&&(rx_S.filtro==='todos'||(rx_S.filtro==='desvio'?desv:!desv))&&(!q||nm.includes(q));
}
function rx_nFil(){return [rx_S.per!==12,rx_S.tema,rx_S.filtro!=='todos',String(rx_S.q||'').trim()].filter(Boolean).length;}
function rx_per(v){rx_S.per=+v;redraw();}
function rx_tema(v){rx_S.tema=v;redraw();}
let rx_qT=null;
function rx_q(v){rx_S.q=v;clearTimeout(rx_qT);rx_qT=setTimeout(()=>{redraw();const i=document.querySelector('#rxSrch input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);}
function rx_limpar(){rx_S.per=12;rx_S.tema='';rx_S.filtro='todos';rx_S.q='';redraw();}
function rx_fbar(inds){
  const n=inds.filter(rx_okFil).length;
  return `<div class="fbar rx-fb"><div class="fbar-r">
    <span id="rxSrch">${searchCtl('Buscar indicador','rx_q',rx_S.q)}</span>
    <span class="rx-flb">Período</span>${seg([['3','3 meses'],['6','6 meses'],['12','12 meses']],String(rx_S.per),'rx_per')}
    ${selCtl([['','Todos os temas'],...Object.entries(rx_TEMAS)],rx_S.tema,'rx_tema','Tema')}
    <span class="rx-flb">Situação</span>${seg([['todos','Todos'],['desvio','Em desvio'],['meta','Dentro da meta']],rx_S.filtro,'rx_filtro')}
    <span class="sp"></span>
    <span class="fcount"><b>${n}</b> de ${inds.length} indicadores</span>${rx_nFil()?`<button type="button" class="lnk" onclick="rx_limpar()">Limpar filtros</button>`:''}
  </div></div>`;
}
function rx_ind(inds,n){return inds.find(i=>i.n===n);}
function rx_dl(ind){return ind.un==='%'?rx_sg(ind.dl,1)+' p.p.':rx_sg(ind.dl,1)+'%';}
/* distância até a meta, o piso ou o teto */
function rx_dist(ind){
  const cur=ind.sp[ind.sp.length-1], d=cur-ind.metaV;
  /* mesmo rótulo que o indChart usa na linha de referência */
  const lb=ind.refLb||(ind.bom==='baixo'?'teto':/piso/.test(ind.d||'')?'piso':'meta');
  const bom=ind.bom==='baixo'?d<=0:d>=0;
  const art=lb==='meta'||lb==='rede'?'da':'do';
  const abs=ind.un==='%'?nf(Math.abs(d),ind.dec)+' p.p.':rx_fmt(ind,Math.abs(d));
  const r=+d.toFixed(ind.dec);
  const val=(r>0?'+':r<0?'−':'')+abs;
  const tx=ind.bom==='baixo'?(bom?(lb==='teto'?'dentro do teto':`abaixo ${art} ${lb}`):`acima ${art} ${lb}`):(bom?`acima ${art} ${lb}`:`abaixo ${art} ${lb}`);
  return {lb,art,bom,val,tx};
}
function rx_sub(ind){
  const ds=rx_dist(ind), p=[];
  if(!/piso|teto/.test(ind.d)) p.push(ind.d);
  p.push(ds.lb==='meta'?`meta ${ind.meta}`:`${ds.lb} ${rx_fmt(ind,ind.metaV)}`);
  return p.join(' · ');
}
function rx_emp(t,d){return `<div class="rx-emp"><b>${t}</b><span>${d}</span></div>`;}

/* ---------------- topo: dois gráficos ---------------- */
function rx_topo(inds){
  const cob=rx_ind(inds,'Captação ÷ crédito'), cap=rx_ind(inds,'Captação total'), cre=rx_ind(inds,'Carteira de crédito');
  const sp=cob.sp, last=sp[sp.length-1], abaixo=last<cob.metaV;
  const d3=[sp.length-3,sp.length-2,sp.length-1].filter(i=>i>=1).map(i=>`${rx_L()[i]} <b>${rx_sg(sp[i]-sp[i-1],2)}</b>`);
  const dec=Math.max(...cap.sp,...cre.sp)<50?1:0;
  const gap=cre.sp[cre.sp.length-1]-cap.sp[cap.sp.length-1];
  return `<div class="grid g2 rx-top">
    <div class="card">
      <div class="card-h"><h3>Captação ÷ crédito</h3><span class="sub">${rx_S.per} meses</span><div class="rx-sp"></div>${INFO({oque:'Quanto da carteira de crédito da agência é coberto pela captação.',como:'Captação total dividida pela carteira de crédito, no fechamento de cada mês. A linha tracejada é o piso interno de 1,05.'})}</div>
      <div class="card-b">
        ${lineChart([{d:sp,c:abaixo?'#A8322A':'#018B6A',fill:true}],rx_L(),{ref:cob.metaV,refLb:'piso',dec:2,h:190,w:480})}
        <div class="rx-fx">
          <span>Hoje <b class="${abaixo?'dn':''}">${nf(last,2)}</b></span>
          <span>Há ${rx_S.per} meses <b>${nf(sp[0],2)}</b></span>
          <span class="rx-m3">Mês a mês: ${d3.join('<i>·</i>')}</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Captação × crédito</h3><span class="sub">R$ mi · ${rx_S.per} meses</span><div class="rx-sp"></div>${INFO({oque:'As duas curvas que formam a relação captação/crédito.',como:'Saldo médio de captação e saldo da carteira de crédito, mês a mês. Quando o crédito cresce mais rápido que a captação, a relação captação/crédito cai.'})}</div>
      <div class="card-b">
        ${lineChart([{d:cap.sp,c:'#018B6A'},{d:cre.sp,c:'#2E559D'}],rx_L(),{dec,h:190,w:480})}
        <div class="rx-fx">
          <span class="rx-lg"><i class="rx-c1"></i>Captação <b>${cap.v}</b><em class="${cap.dl<0?'dn':'up'}">${rx_dl(cap)}</em></span>
          <span class="rx-lg"><i class="rx-c2"></i>Crédito <b>${cre.v}</b><em class="${cre.dl<0?'dn':'up'}">${rx_dl(cre)}</em></span>
          <span>${gap>0?'Crédito acima da captação':'Captação acima do crédito'} <b>R$ ${nf(Math.abs(gap),1)} mi</b></span>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------------- indicadores com drill-down ---------------- */
function rx_filtro(v){rx_S.filtro=v;redraw();}
function rx_indRow(ag,ind,i,open,marks){
  const st=rx_ST[ind.st]||rx_ST.ok, ds=rx_dist(ind), sp=ind.sp;
  const mn=Math.min(...sp), mx=Math.max(...sp), v0=sp[0], cur=sp[sp.length-1];
  const var12=ind.un==='%'?rx_sg(cur-v0,ind.dec)+' p.p.':rx_sg((cur-v0)/v0*100,1)+'%';
  const hist=(marks||[]).map(m=>(FCAS_HIST[ag]||[]).find(f=>f.id===m.t)).filter(Boolean);
  const head=`<span class="rx-sd ${ind.st}" title="${st.lb}"></span>
    <span class="rx-in"><b>${ind.n}${ind.rxSinal?'<em class="rx-isg">do sinal</em>':''}</b><small>${rx_sub(ind)}</small></span>
    <span class="rx-iv">${ind.v}</span>
    <span class="tag ${st.c} rx-idl">${rx_dl(ind)}</span>`;
  const body=`<div class="rx-ib">
    <div class="rx-ich">${indChart(ind,{w:560,h:170,labels:rx_L(),marks:(marks||[]).map(m=>({...m,i:m.i-rx_off()})).filter(m=>m.i>=0)})}</div>
    <div class="rx-ifx">
      <div><span>Há ${rx_S.per} meses</span><b>${rx_fmt(ind,v0)}</b><small>${rx_mes(0)} · ${var12}</small></div>
      <div><span>Mínimo</span><b>${rx_fmt(ind,mn)}</b><small>${rx_mes(sp.indexOf(mn))}</small></div>
      <div><span>Máximo</span><b>${rx_fmt(ind,mx)}</b><small>${rx_mes(sp.indexOf(mx))}</small></div>
      <div class="${ds.bom?'good':'bad'}"><span>vs. ${ds.lb}</span><b>${ds.val}</b><small>${ds.tx}</small></div>
    </div>
    ${hist.map(f=>`<div class="rx-mk">${ICON.flag}<span><b>${f.id}</b> · ${f.quando} · ${esc(f.tema)} · <em class="${f.ok?'ok':''}">${esc(f.resultado)}</em></span></div>`).join('')}
  </div>`;
  return acc(`rx-i-${ag}-${i}`,head,body,{open,cls:'flat'});
}
function rx_indicadores(ag,inds){
  const desvio=inds.filter(i=>i.st==='ruim'||i.st==='atenc');
  const lista=inds.filter(rx_okFil);

/* resumo escrito dos indicadores para agências sem resumo de exemplo (o do core lista só sinais e FCAs) */
function rx_resumoGen(ag){
  const a=AGX[ag], inds=rx_inds(ag), des=inds.filter(i=>i.st==='ruim'||i.st==='atenc');
  const sigs=SINAIS.filter(s=>s.ag===ag), ab=FCAS_ABERTOS.filter(f=>f.ag===ag), hist=FCAS_HIST[ag]||[];
  let t=des.length?`${a.n} tem ${des.length} indicador${des.length>1?'es':''} fora do esperado: ${des.map(i=>{const d=rx_dist(i);return `${rx_lc(i.n)} em ${i.v} (${d.lb} ${rx_fmt(i,i.metaV)})`;}).join('; ')}.`
    :`${a.n} está com os indicadores principais dentro da meta.`;
  if(sigs.length) t+=` Sina${sigs.length>1?'is':'l'} em aberto: ${sigs.map(s=>rx_lc(s.t)).join('; ')}.`;
  if(ab.length) t+=` FCA em aberto na unidade: ${ab.map(f=>`${f.id} (${rx_lc(f.tema)}, ${f.exec}% executado${f.atraso?`, ${f.atraso} ${f.atraso>1?'ações':'ação'} em atraso`:''})`).join('; ')}.`;

<script>
/* ---- 21_rxdata.js ---- */
/* =========================================================================
   SÉRIES DO RAIO X (v12) · valores fictícios
   Mês a mês de jan/24 a abr/26 (DRE fechado em abril): o DRE na estrutura do
   PFC, os indicadores do painel CORE, as metas comerciais com ritmo diário e a
   inadimplência por faixa. O acumulado jan–abr/26 fecha com dreDe().
   ========================================================================= */
const RX_MES=(()=>{const m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],o=[];
  for(let y=24;y<=26;y++)for(let i=0;i<12;i++){if(y===26&&i>3)break;o.push(m[i]+'/'+y);}return o;})();
const RX_N=RX_MES.length;            /* 28 meses: jan/24 … abr/26 */
const RX_I={jan26:24, abr26:27, dez25:23, mai25:16, jan25:12};
/* atalhos do filtro de período (índices de RX_MES); o padrão é o acumulado do ano, jan–abr/26 */
const RX_PER0={i0:24, i1:27};
const RX_PRE=[['3m','3 meses',25,27],['1a','1 ano',16,27]];
const RX_TRI=[['2T25',15,17],['3T25',18,20],['4T25',21,23],['1T26',24,26],['abr/26',27,27]];
/* fração dos dias úteis do ano já corridos até D-1 (17/05/2026): base do ritmo das metas */
const RX_DU=0.38;

/* estrutura do DRE do PFC: valores com sinal (despesa negativa), como no painel */
const RX_DRE=[
  {g:'Receita', it:[['credito','Operações de crédito'],['centr','Centralização financeira'],['ps','Receitas P&S'],['outras','Outras rendas operacionais']]},
  {g:'Despesa', it:[['captacao','Captação'],['pessoal','Pessoal'],['admin','Administrativas'],['desps','Despesas P&S'],['ubr','Unicred do Brasil'],['deprec','Deprec. e amort.'],['outdesp','Outras despesas']]},
  {t:'op', n:'Resultado operacional'},
  {g:'Outros', it:[['naoop','Não operacional'],['provout','Provisão outras'],['pdd','Provisão empréstimos']]},
  {t:'liq', n:'Resultado líquido'}
];
const RX_NOME={};RX_DRE.forEach(b=>(b.it||[]).forEach(([k,n])=>RX_NOME[k]=n));RX_NOME.op='Resultado operacional';RX_NOME.liq='Resultado líquido';
/* linha do PFC → linha do DRE resumido (cruzamento e "maior desvio") */
const RX_BASE={credito:'credito',centr:'centr',ps:'ps',captacao:'captacao',pdd:'pdd',pessoal:'adm',admin:'adm',desps:'adm',ubr:'adm',deprec:'adm',outdesp:'adm'};
const RX_ADM={pessoal:.72,admin:.10,desps:.075,ubr:.065,deprec:.025,outdesp:.015};

const _rx={};
const rxr=(id,k,amp)=>Math.sin(_seed(id+'|'+k)*1.71)*amp;
/* sazonalidade suave por mês */
const rxSaz=(id,k,i)=>1+0.035*Math.sin(i*0.9+_seed(id+k)%7);

function rxDe(agId){
  if(_rx[agId]) return _rx[agId];
  const a=AGX[agId], d=dreDe(agId), pel=agId==='PEL', M={};
  /* 1) linhas do DRE resumido, mês a mês, com o acumulado jan–abr/26 igual ao dreDe */
  const gro={credito:.08,centr:pel?-.14:.05,ps:.06,captacao:.07,pdd:.05,adm:.06};
  ['credito','centr','ps','captacao','pdd','adm'].forEach(k=>{
    const L=d.linhas[k], o=Array(RX_N), r=Array(RX_N);
    const w=[24,25,26,27].map(i=>rxSaz(agId,k,i)), ws=w.reduce((s,x)=>s+x,0);
    const G=L.r-L.o, forte=Math.abs(G)>L.o*.03;
    const ramp=forte?[.16,.21,.28,.35]:[.25,.25,.25,.25].map((x,j)=>x+rxr(agId,k+j,.04));
    const rs=ramp.reduce((s,x)=>s+x,0);
    [24,25,26,27].forEach((i,j)=>{o[i]=L.o*w[j]/ws;r[i]=o[i]+G*ramp[j]/rs;});
    const base=L.o/4;
    for(let i=0;i<24;i++){
      const anos=(24-i)/12, oi=base/Math.pow(1+gro[k],anos)*rxSaz(agId,k,i);
      o[i]=oi; r[i]=oi*(1+rxr(agId,k+'r'+i,.025)+(k===d.pior&&i>18?-.02:0));
    }
    M[k]={o,r};
  });
  /* 2) despesas administrativas abertas como no PFC; a folha fica fixa (base da cobertura) e
        as outras variam entre si somando o restante. Pelotas Lobo tem a folha escrita à mão */
  const fo=pel?3326/5120:RX_ADM.pessoal, fr=pel?3348/5211:RX_ADM.pessoal, outrosK=['admin','desps','ubr','deprec','outdesp'];
  M.pessoal={o:M.adm.o.map(v=>v*fo), r:M.adm.r.map(v=>v*fr)};
  const shO=outrosK.map(k=>RX_ADM[k]/.28), wsO=shO.reduce((s,x)=>s+x,0);
  const shR=outrosK.map((k,j)=>RX_ADM[k]/.28*(1+rxr(agId,'adm'+k,.06))), wsR=shR.reduce((s,x)=>s+x,0);
  outrosK.forEach((k,j)=>{M[k]={o:M.adm.o.map(v=>v*(1-fo)*shO[j]/wsO), r:M.adm.r.map((v,i)=>v*(1-fr)*shR[j]/wsR*(1+rxr(agId,k+'m'+i,.015)))};});
  /* 3) outras rendas e não operacional, compensados pela provisão outras (o resultado líquido não muda) */
  M.outras={o:M.ps.o.map(v=>v*.05), r:M.ps.o.map((v,i)=>v*.05*(1+rxr(agId,'ou'+i,.18)))};
  M.naoop={o:M.ps.o.map(v=>v*.02), r:M.ps.o.map((v,i)=>v*.02*(1+rxr(agId,'no'+i,.3)))};
  M.provout={o:M.outras.o.map((v,i)=>v+M.naoop.o[i]), r:M.outras.r.map((v,i)=>v+M.naoop.r[i])};

  /* 4) saldos do painel CORE (R$ mi, %, % do CDI) */
  const lin=(fim,taxaAno,i)=>fim/Math.pow(1+taxaAno,(27-i)/12);
  const S={};
  const cap=Array(RX_N), cre=Array(RX_N);
  if(pel){
    SERIE_CAP.forEach((v,j)=>cap[16+j]=v); SERIE_CRE.forEach((v,j)=>cre[16+j]=v);
    for(let i=0;i<16;i++){cap[i]=226.4-(16-i)*0.55+rxr('PEL','c'+i,.9);cre[i]=188.5-(16-i)*1.05+rxr('PEL','k'+i,.8);}
  } else {
    const tc={critico:-.02,atencao:.04,oportunidade:.07,ok:.08}[a.st], tk={critico:.11,atencao:.08,oportunidade:.07,ok:.07}[a.st];
    for(let i=0;i<RX_N;i++){
      cap[i]=lin(a.cap,tc,i)*(1+rxr(agId,'cap'+i,.006))*(a.st==='critico'&&i>=24?1+(27-i)*.012:1);
      cre[i]=lin(a.cre,tk,i)*(1+rxr(agId,'cre'+i,.005));
    }
    cap[27]=a.cap; cre[27]=a.cre;
  }
  S.cap=cap; S.cre=cre; S.caixa=cap.map((v,i)=>v-cre[i]);
  S.coop=cap.map((v,i)=>Math.round(lin(a.coop,.035,i)*(1+rxr(agId,'co'+i,.002))));
  S.capital=cap.map((v,i)=>lin(a.cap*.12,.04,i)*(1+rxr(agId,'ka'+i,.004)));
  S.dav=cap.map((v,i)=>lin(a.cap*.085,.03,i)*(1+rxr(agId,'dv'+i,.05)));
  S.ziin=cap.map((v,i)=>lin(a.cap*.13,.25,i)*(1+rxr(agId,'zi'+i,.01)));
  const i90=a.inad, i1590=pel?1.32:+(a.inad*.5).toFixed(2), i15=pel?.41:+(a.inad*.16).toFixed(2);
  const riseInad=a.st==='critico'||agId==='JAG';
  const curva=(fim,i,amp)=>Math.max(.05,fim*(riseInad?(1-(27-i)*.012):(1+rxr(agId,'iv'+i,.04)))+rxr(agId,'ia'+i,amp));
  S.inad90=cap.map((v,i)=>i===27?i90:curva(i90,i,.05));
  S.inad1590=cap.map((v,i)=>i===27?i1590:i===26&&pel?1.18:curva(i1590,i,.06));
  S.inad15=cap.map((v,i)=>i===27?i15:i===26&&pel?.38:curva(i15,i,.03));
  S.prov=S.inad90.map((v,i)=>v*1.35+.55+S.inad1590[i]*.1);
  S.txcap=cap.map((v,i)=>98.6+(pel?(i-20)*.08:0)+rxr(agId,'tc'+i,.35));
  S.txemp=cap.map((v,i)=>(pel?151.5:157.8+rxr(agId,'te',3))+rxr(agId,'tx'+i,1.6)-(pel&&i>22?(i-22)*.6:0));
  S.spread=S.txemp.map((v,i)=>v-S.txcap[i]);

  /* 5) planejado do PFC para carteira e taxa (crédito e captação) */
  const pk=pel?214.0:a.cre*(1-({critico:-.02,atencao:.01,oportunidade:.02,ok:.0}[a.st])), pc=pel?232.0:a.cap*(1+({critico:.06,atencao:.02,oportunidade:.01,ok:-.01}[a.st]));
  S.crePlan=cre.map((v,i)=>i<24?null:pk*(1-(27-i)*.004));
  S.capPlan=cap.map((v,i)=>i<24?null:pc*(1-(27-i)*.003));

  /* 6) metas comerciais: meta do ano, realizado até D-1 e atingimento por trimestre */
  const MET={credito:[a.cre*.12,'R$ mi',1],coop:[Math.round(a.coop*.08),'',0],dap:[a.cap*.10,'R$ mi',1],ziin:[a.cap*.08,'R$ mi',1],
    cobranca:[a.cre*.45,'R$ mi',1],consorcio:[a.cre*.022,'R$ mi',2],pay:[Math.max(8,Math.round(a.coop/600)),'',0],visa:[Math.round(a.coop/55),'',0],
    vida:[a.coop*.0045,'R$ mil',1],seguros:[a.coop*.009,'R$ mil',1],risco:[a.coop*.0065,'R$ mil',1],prev:[a.cap*.006,'R$ mi',2]};
  const metas=PRODUTOS.map(p=>{
    const [meta,un,dec]=MET[p.k], ritmo=d.icm[p.k];
    const tri=[0,1,2,3].map(q=>Math.round(ritmo*(0.86+0.08*q)+rxr(agId,p.k+'q'+q,14)));
    return {k:p.k, n:p.n, teto:p.teto, meta, un, dec, ritmo, real:meta*RX_DU*ritmo/100, tri};
  });
  _rx[agId]={M,S,metas};
  return _rx[agId];
}

/* ---------- valores por período ---------- */
const rxSum=(arr,i0,i1)=>{let s=0;for(let i=i0;i<=i1;i++)s+=arr[i]||0;return s;};
/* linha com sinal (despesa negativa) no período P = {i0, i1}; aa = mesmo período do ano anterior */
const RX_SINAL={credito:1,centr:1,ps:1,outras:1,naoop:1,captacao:-1,pessoal:-1,admin:-1,desps:-1,ubr:-1,deprec:-1,outdesp:-1,provout:-1,pdd:-1};
function rxLinha(agId,k,P){
  const {M}=rxDe(agId), s=RX_SINAL[k];
  return {o:s*rxSum(M[k].o,P.i0,P.i1), r:s*rxSum(M[k].r,P.i0,P.i1), aa:s*rxSum(M[k].r,P.i0-12,P.i1-12)};
}
function rxDRE(agId,P){
  const L={}; Object.keys(RX_SINAL).forEach(k=>L[k]=rxLinha(agId,k,P));
  const soma=(ks,x)=>ks.reduce((s,k)=>s+L[k][x],0), tot=ks=>({o:soma(ks,'o'),r:soma(ks,'r'),aa:soma(ks,'aa')});
  const rec=['credito','centr','ps','outras'], desp=['captacao','pessoal','admin','desps','ubr','deprec','outdesp'], out=['naoop','provout','pdd'];
  L.Receita=tot(rec); L.Despesa=tot(desp); L.Outros=tot(out); L.op=tot([...rec,...desp]); L.liq=tot([...rec,...desp,...out]);
  const den=x=>L.credito[x]+L.centr[x]+L.ps[x]+L.captacao[x];
  const adm=x=>-(L.pessoal[x]+L.admin[x]+L.desps[x]+L.ubr[x]+L.deprec[x]+L.outdesp[x]);
  L.efic={o:adm('o')/den('o')*100, r:adm('r')/den('r')*100, aa:adm('aa')/den('aa')*100};
  L.cob={o:L.ps.o/-L.pessoal.o*100, r:L.ps.r/-L.pessoal.r*100, aa:L.ps.aa/-L.pessoal.aa*100};
  L.margem={o:L.liq.o/L.Receita.o*100, r:L.liq.r/L.Receita.r*100, aa:L.liq.aa/L.Receita.aa*100};
  return L;
}
/* série mensal com sinal de uma linha (ou total) para o gráfico */
function rxSerie(agId,k){
  const {M}=rxDe(agId);
  if(M[k]){const s=RX_SINAL[k];return {o:M[k].o.map(v=>s*v), r:M[k].r.map(v=>s*v)};}
  const ks={op:['credito','centr','ps','outras','captacao','pessoal','admin','desps','ubr','deprec','outdesp'],
    liq:Object.keys(RX_SINAL), Receita:['credito','centr','ps','outras'], Despesa:['captacao','pessoal','admin','desps','ubr','deprec','outdesp'], Outros:['naoop','provout','pdd']}[k];
  const f=x=>Array.from({length:RX_N},(_,i)=>ks.reduce((s,kk)=>s+RX_SINAL[kk]*M[kk][x][i],0));
  return {o:f('o'), r:f('r')};
}
/* aderência ao orçado por trimestre, na regra de cores do slide de RTR */
function rxAder(agId){
  const {M}=rxDe(agId), rows=[['Receita','Receita'],['Despesa','Despesa'],['Resultado operacional','op'],['Outros','Outros'],['Resultado líquido','liq']];
  const per=(i0,i1)=>{const P={i0,i1},L={};
    const s=(ks,x)=>ks.reduce((t,k)=>t+RX_SINAL[k]*rxSum(M[k][x],i0,i1),0);
    const g={Receita:['credito','centr','ps','outras'],Despesa:['captacao','pessoal','admin','desps','ubr','deprec','outdesp'],Outros:['naoop','provout','pdd']};
    g.op=[...g.Receita,...g.Despesa]; g.liq=[...g.op,...g.Outros];
    Object.entries(g).forEach(([k,ks])=>L[k]={o:s(ks,'o'),r:s(ks,'r')});
    const adm=x=>['pessoal','admin','desps','ubr','deprec','outdesp'].reduce((t,k)=>t+rxSum(M[k][x],i0,i1),0);
    const den=x=>['credito','centr','ps'].reduce((t,k)=>t+rxSum(M[k][x],i0,i1),0)-rxSum(M.captacao[x],i0,i1);
    L.efic={o:adm('o')/den('o'),r:adm('r')/den('r')}; L.cob={o:rxSum(M.ps.o,i0,i1)/rxSum(M.pessoal.o,i0,i1),r:rxSum(M.ps.r,i0,i1)/rxSum(M.pessoal.r,i0,i1)};
    return L;};
  const cols=[...RX_TRI,['jan–abr/26',24,27]].map(([n,i0,i1])=>({n,L:per(i0,i1)}));
  /* atingimento: receita e resultado = realizado ÷ orçado; despesa e eficiência = orçado ÷ realizado (quanto menor, melhor) */
  const at=(L,k)=>{const v=L[k];if(k==='Despesa'||k==='efic')return v.o/v.r*100;if(v.o<0)return (2-v.r/v.o)*100;return v.r/v.o*100;};
  return {cols, rows:[...rows,['Índice de eficiência','efic'],['Índice de cobertura','cob']].map(([n,k])=>({n,k,v:cols.map(c=>at(c.L,k))}))};
}
/* faixa de cor da aderência (slide de RTR: até 97%, 98 a 99%, 100%, 101% ou mais) */
function rxAderCls(v){return v<97.5?'ad-r':v<99.5?'ad-y':v<100.5?'ad-g':'ad-b';}

/* FCAs da agência no eixo do tempo (marcadores dos gráficos) */
function rxFcaMarks(agId,lbFn){
  const out=[], mi={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
  const idx=(mm,yy,dia)=>((+yy-2024)*12+mm)+(dia?Math.min(.9,(dia-1)/30):.5);
  (FCAS_HIST[agId]||[]).forEach(f=>{const m=String(f.quando).match(/([a-zç]{3})\/(\d{4})/i);if(m)out.push({i:idx(mi[m[1].toLowerCase()],m[2]),t:f.id.replace('FCA-','').replace(/^\d{4}-/,'FCA ')});});
  rd_fcasDe(agId).forEach(f=>{const m=String(f.aberto||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m)out.push({i:idx(+m[2]-1,m[3],+m[1]),t:'FCA '+f.id.slice(-4)});});
  return out.filter(m=>m.i<=RX_N-1+.05).sort((x,y)=>x.i-y.i);
}

<script>
/* ---- 22_raiox.js ---- */
/* =========================================================================
   RAIO X DA AGÊNCIA (v13) · uma página com atalhos
   Resumo · DRE (estrutura do PFC) · Trimestres · Indicadores (CORE) ·
   Crédito e captação × planejado · Metas comerciais · Carteira · Oportunidades
   Período de/até (mês a mês, de jan/24 a abr/26), com atalhos de 3 meses e
   1 ano. Tudo é comparado com o orçado. Valores fictícios.
   ========================================================================= */
const RX_V={...RX_PER0};
const RX_SEC=[['rx-resumo','Resumo'],['rx-dre','DRE'],['rx-tri','Trimestres'],['rx-ind','Indicadores'],['rx-cc','Crédito e captação'],['rx-metas','Metas comerciais'],['rx-cart','Carteira'],['rx-opo','Oportunidades']];
const RX_COR={real:'#018B6A', orc:'#003087', aa:'#8A97A8', a2:'#A8322A', a3:'#9A5D08'};
function rxv_P(){const {i0,i1}=RX_V;return {i0,i1,lb:i0===i1?RX_MES[i1]:`${RX_MES[i0]}–${RX_MES[i1]}`};}
const rxv_ano=()=>RX_V.i0===RX_PER0.i0&&RX_V.i1===RX_PER0.i1;
function rxv_de(v){RX_V.i0=+v;if(RX_V.i0>RX_V.i1)RX_V.i1=RX_V.i0;redraw();}
function rxv_ate(v){RX_V.i1=+v;if(RX_V.i1<RX_V.i0)RX_V.i0=RX_V.i1;redraw();}
function rxv_pre(k){const p=RX_PRE.find(x=>x[0]===k);if(!p)return;RX_V.i0=p[2];RX_V.i1=p[3];redraw();}
function rxv_ir(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
const rxv_pct=(r,b)=>b?((r-b)/Math.abs(b))*100:0;
const rxv_win=()=>[Math.min(RX_I.jan25,RX_V.i0),RX_I.abr26];   /* janela dos gráficos: de jan/25 (ou do início do período) a abr/26 */
function rxv_cut(arr){const [a,b]=rxv_win();return arr.slice(a,b+1);}
function rxv_lbs(){return rxv_cut(RX_MES);}
function rxv_band(){const [a]=rxv_win();return [RX_V.i0-a,RX_V.i1-a];}
function rxv_marks(agId){const [a]=rxv_win();return rxFcaMarks(agId).map(m=>({i:m.i-a,t:m.t})).filter(m=>m.i>=-.1);}

/* ---------- barra fixa: atalhos e período ---------- */
function rxv_nav(){
  const opt=c=>RX_MES.map((m,i)=>`<option value="${i}"${i===c?' selected':''}>${m}</option>`).join('');
  const on=p=>p[2]===RX_V.i0&&p[3]===RX_V.i1;
  return `<div class="rx-nav">
    <div class="rx-at">${RX_SEC.map(([id,n])=>`<button type="button" onclick="rxv_ir('${id}')">${n}</button>`).join('')}</div>
    <div class="rx-fl">
      <span class="rx-fll">Período</span>
      <label class="sel rx-sel"><span>De</span><select onchange="rxv_de(this.value)" aria-label="Início do período">${opt(RX_V.i0)}</select></label>
      <label class="sel rx-sel"><span>Até</span><select onchange="rxv_ate(this.value)" aria-label="Fim do período">${opt(RX_V.i1)}</select></label>
      ${RX_PRE.map(p=>`<button type="button" class="rx-pre ${on(p)?'on':''}" aria-pressed="${on(p)}" onclick="rxv_pre('${p[0]}')">${p[1]}</button>`).join('')}
    </div>
  </div>`;
}

const rxv_o=x=>x.o;     /* base de comparação: o orçado */

/* ---------- 1 · resumo ---------- */
function rxv_gaps(agId,L){
  const adm=['pessoal','admin','desps','ubr','deprec','outdesp'], soma=x=>adm.reduce((s,k)=>s+L[k][x],0);
  const it=[['credito','Receita de operações de crédito'],['centr','Centralização financeira'],['ps','Receita de produtos e serviços'],['captacao','Despesa de captação'],['pdd','Provisão de empréstimos']]
    .map(([k,n])=>({k,n,g:L[k].r-rxv_o(L[k])}));
  it.push({k:'adm',n:'Despesas administrativas',g:soma('r')-rxv_o({o:soma('o'),aa:soma('aa')})});

/* ---------- 2 · DRE na estrutura do PFC ---------- */
function rxv_dre(a,R,L){
  const d=R.d, P=rxv_P(), itens=[].concat(...RX_DRE.filter(b=>b.it).map(b=>b.it.map(x=>x[0])));
  const max=Math.max(...itens.map(k=>Math.abs(L[k].r-rxv_o(L[k]))),1);
  const pior=itens.map(k=>({k,g:L[k].r-rxv_o(L[k])})).sort((x,y)=>x.g-y.g)[0];
  const cel=(x,cls='')=>{const b=rxv_o(x),g=x.r-b,pc=rxv_pct(x.r,b);
    return `<span class="dre-v mono">${kBRL(b)}</span><span class="dre-v mono">${kBRL(x.r)}</span><span class="dre-g mono ${g<0?'dn':g>0?'up':''}">${kSig(g)}</span><span class="dre-p mono ${g<0?'dn':g>0?'up':''}">${pct1(pc)}</span>`;};
  const XK={credito:'credito',centr:'centr',ps:'ps',captacao:'captacao',pdd:'pdd',pessoal:'adm'};
  const linha=k=>{
    const x=L[k], g=x.r-rxv_o(x), id=`rxd-${a.id}-${k}`, X=XK[k]?ag_x(a,XK[k],d):null;
    const head=`<span class="dre-n">${esc(RX_NOME[k])}</span>${cel(x)}<span class="dre-b"><i class="${g<0?'neg':'pos'}" style="width:${(Math.abs(g)/max*50).toFixed(1)}%"></i></span>`;
    if(!X) return `<div class="dre-r0${g<0?' neg':''}">${head}<span></span></div>`;
    if(ACC[id]===undefined)ACC[id]=pior&&pior.k===k&&pior.g<0;
    /* linhas do cruzamento nas mesmas colunas do DRE: referência (orçado ou planejado) · realizado · variação */
    const ref=t=>String(t||'').replace(/\s*(orçad[oa]|planejad[oa])$/,'');
    const body=`<div class="dre-x dre-xg">${rxv_ano()?'':`<div class="rx-ct">Cruzamento no acumulado ${DRE_PER}</div>`}<p>${esc(X.l)}</p>
      ${X.t.map(r=>`<div class="dre-xr"><span class="dre-n">${esc(r[0])}</span><span class="dre-v mono mut">${esc(ref(r[2]))}</span><span class="dre-v mono"><b>${esc(r[1])}</b></span><span class="dre-g mono ${r[4]<0?'dn':r[4]>0?'up':''}">${esc(r[3])}</span><span></span><span></span><span></span></div>`).join('')}</div>`;
    return acc(id,head,body,{cls:'dre-r'+(g<0?' neg':'')});
  };
  const tot=(n,x,cls)=>`<div class="dre-tot ${cls||''}"><span class="dre-n">${n}</span>${cel(x)}<span class="dre-b">${cls==='liq'?`<span class="fx ${faixa(Math.round(x.r/x.o*100))}">${Math.round(x.r/x.o*100)}% do orçado</span>`:''}</span><span></span></div>`;
  const grp=(n,x)=>`<div class="dre-grp"><span class="dre-n">${n}</span>${cel(x)}<span></span><span></span></div>`;
  const corpo=RX_DRE.map(b=>b.t?tot(b.n,L[b.t],b.t):grp(b.g,L[b.g])+b.it.map(([k])=>linha(k)).join('')).join('');
  return `<section class="card dre rx-sec" id="rx-dre">
    <div class="card-h"><h3>DRE · orçado × realizado</h3><span class="sub">${P.lb} · estrutura do PFC · clique numa linha para ver o cruzamento</span><div style="flex:1"></div>
      ${INFO({oque:'O ponto de partida do FCA: onde o resultado da agência se afasta do orçado.',como:'Valores com sinal, como no PFC: despesa e provisão aparecem negativas. Variação = efeito no resultado. As linhas com seta abrem o cruzamento que explica o gap: volume × preço no crédito, caixa e liquidez na centralização, produto a produto em P&S, volume × custo na captação, faixas de atraso nas provisões e a folha no pessoal.',obs:'Alguns indicadores precisam ser lidos juntos (ciclo financeiro): mais captação pode aumentar a despesa e também a centralização.'})}</div>
    <div class="dre-hd"><span>Linha</span><span>Orçado</span><span>Realizado</span><span>Variação</span><span>%</span><span></span><span></span></div>
    ${corpo}
  </section>`;
}

/* ---------- 8 · oportunidades: quanto volta ao resultado se cada linha voltar ao orçado ---------- */
function rxv_opo(a,L){

}

<script>
/* ---- 24_xchart.js ---- */
/* =========================================================================
   GRÁFICO DO RAIO X (v12)
   xChart(id, séries, rótulos, {h, w, dec, un, band:[i0,i1], marks:[{i,t}], ref, refLb})
   · legenda clicável: esconde e mostra a série (o estado fica guardado por gráfico)
   · marks: linha vertical na data de cada FCA, para ver o efeito
   · band: faixa do período escolhido no filtro
   séries: {n, d:[valor|null], c, dash, fill, wd}
   ========================================================================= */
const XC_OFF={};
function xcTog(id,k){
  const s=XC_OFF[id]||(XC_OFF[id]=new Set());
  s.has(k)?s.delete(k):s.add(k);
  const el=document.getElementById('xc-'+id);
  if(el){el.classList.toggle('off'+k,s.has(k));const b=el.querySelector(`[data-k="${k}"]`);if(b)b.setAttribute('aria-pressed',String(!s.has(k)));}
}
function xChart(id,series,labels,o={}){
  const W=o.w||640,H=o.h||200,PL=o.pl||46,PR=14,PT=(o.marks&&o.marks.length)?24:12,PB=24,iw=W-PL-PR,ih=H-PT-PB,n=labels.length;
  const vals=[].concat(...series.map(s=>s.d)).filter(v=>v!=null&&isFinite(v)); if(o.ref!=null)vals.push(o.ref);
  let mn=o.min!=null?o.min:Math.min(...vals), mx=o.max!=null?o.max:Math.max(...vals);
  const pad=(mx-mn)*.12||Math.abs(mx)*.06||1; mn-=pad; mx+=pad;
  const X=i=>PL+(n>1?i/(n-1):.5)*iw, Y=v=>PT+ih-((v-mn)/(mx-mn))*ih, dec=o.dec!=null?o.dec:1;
  const fmt=v=>nf(v,dec)+(o.un?' '+o.un:'');
  let g='';
  if(o.band){const x0=X(o.band[0])-(o.band[0]===o.band[1]?iw/(n-1)/2:0), x1=X(o.band[1])+(o.band[0]===o.band[1]?iw/(n-1)/2:0);
    g+=`<rect x="${Math.max(PL,x0).toFixed(1)}" y="${PT}" width="${(Math.min(W-PR,x1)-Math.max(PL,x0)).toFixed(1)}" height="${ih}" fill="#E6F3F0" opacity=".7"/>`;}
  for(let i=0;i<=4;i++){const y=PT+ih*i/4,v=mx-(mx-mn)*i/4;
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#E8ECEF"/><text x="${PL-7}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#5C6A80" font-family="${F_NUM}">${nf(v,Math.abs(mx-mn)<5?Math.max(dec,1):dec)}</text>`;}
  const step=Math.ceil(n/(o.nlb||9));
  labels.forEach((l,i)=>{if(i%step&&i!==n-1)return;g+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="#5C6A80" font-family="${F_NUM}">${l}</text>`;});
  if(o.ref!=null)g+=`<line x1="${PL}" y1="${Y(o.ref)}" x2="${W-PR}" y2="${Y(o.ref)}" stroke="#A8322A" stroke-width="1.2" stroke-dasharray="5 3"/><text x="${PL+4}" y="${Y(o.ref)-5}" font-size="9.5" font-weight="600" fill="#A8322A" font-family="${F_NUM}">${o.refLb||''} ${fmt(o.ref)}</text>`;
  (o.marks||[]).forEach(m=>{const x=X(m.i);g+=`<g class="xm"><line x1="${x}" y1="${PT-6}" x2="${x}" y2="${PT+ih}" stroke="#A79450" stroke-width="1.4" stroke-dasharray="3 3"/><text x="${x}" y="${PT-10}" text-anchor="${x>W-70?'end':x<70?'start':'middle'}" font-size="9.5" font-weight="700" fill="#76672B" font-family="${F_NUM}">${m.t}</text></g>`;});
  series.forEach((s,k)=>{
    const pts=s.d.map((v,i)=>v==null||!isFinite(v)?null:[X(i),Y(v),v,i]);
    let seg=[],segs=[];pts.forEach(p=>{if(p)seg.push(p);else if(seg.length){segs.push(seg);seg=[];}});if(seg.length)segs.push(seg);
    let h='';
    segs.forEach(sg=>{const p=sg.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
      if(s.fill)h+=`<polygon points="${sg[0][0].toFixed(1)},${PT+ih} ${p} ${sg[sg.length-1][0].toFixed(1)},${PT+ih}" fill="${s.c}" opacity=".08"/>`;
      h+=`<polyline points="${p}" fill="none" stroke="${s.c}" stroke-width="${s.wd||2}" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="5 4"':''}/>`;});
    const last=pts.filter(Boolean).pop();
    pts.forEach(p=>{if(!p)return;const lst=p===last;
      h+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${lst?3.4:n>14?1.6:2.2}" fill="#fff" stroke="${s.c}" stroke-width="1.6"><title>${esc(s.n)} · ${labels[p[3]]}: ${fmt(p[2])}</title></circle>`;});
    g+=`<g class="xs xs${k}">${h}</g>`;
  });
  const off=XC_OFF[id]||new Set();
  const leg=series.length>1||o.legend?`<div class="xc-lg">${series.map((s,k)=>`<button type="button" data-k="${k}" aria-pressed="${!off.has(k)}" onclick="xcTog('${id}',${k})" title="Mostrar ou esconder"><i style="--c:${s.c}" class="${s.dash?'d':''}"></i>${esc(s.n)}</button>`).join('')}${(o.marks&&o.marks.length)?'<span class="xc-fm"><i></i>data do FCA</span>':''}</div>`
    :(o.marks&&o.marks.length?'<div class="xc-lg"><span class="xc-fm"><i></i>data do FCA</span></div>':'');
  return `<div class="xc ${[...off].map(k=>'off'+k).join(' ')}" id="xc-${id}"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">${g}</svg>${leg}</div>`;
}
/* rótulos curtos dos meses do Raio X */
const RX_LB=()=>RX_MES.map(m=>m.replace('/','/'));
/* semicírculo das metas (velocímetro): pct de 0 a 100 da meta do ano */
function xGauge(pct,cor){
  const p=Math.max(0,Math.min(100,pct||0)), r=34, cx=42, cy=40, a0=Math.PI, a1=Math.PI*(1-p/100);
  const pt=a=>[cx+r*Math.cos(a), cy-r*Math.sin(a)];
  const [x0,y0]=pt(a0),[x1,y1]=pt(a1),[xe,ye]=pt(0);
  return `<svg viewBox="0 0 84 46" class="xg"><path d="M${x0},${y0} A${r},${r} 0 0 1 ${xe},${ye}" fill="none" stroke="#EAEEF1" stroke-width="9" stroke-linecap="round"/>${p>0?`<path d="M${x0},${y0} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}" fill="none" stroke="${cor}" stroke-width="9" stroke-linecap="round"/>`:''}</svg>`;
}

<script>
/* ---- 30_pauta.js ---- */
/* ======================= 3 · PAUTA DA CONVERSA =======================
   As perguntas chegam da pré-pauta confirmada na radiografia (ws().pauta).
   O regional edita tudo: texto das perguntas e dos blocos, ordem, tempo por
   bloco, inclusão e exclusão. A IA só roda por botão (gerar, sugerir).
   Bandeira: pergunta que já apareceu em FCA (outra agência ou reincidência);
   some quando o texto é editado (flagDe compara q.tx com q.orig).          */
const pa_fech={};      // blocos recolhidos: id → true
let pa_focus=null;     // 'q:<id>' ou 'b:<id>': campo que recebe foco depois do redraw
let pa_novo=null;      // pergunta recém-sugerida pela IA (destaque rápido)
let pa_desf=null;      // último item removido, para desfazer pelo toast

/* perguntas que a IA sugere por bloco (botão "Sugerir pergunta") */
const pa_SUG={
  abertura:['O que mudou na agência desde a nossa última conversa?','Que número da agência mais te preocupa hoje, e por quê?'],
  fechamento:['Quem fica responsável por cada ponto e até quando?','Quando voltamos a conversar sobre esses pontos?'],
  extra:['Que apoio da regional faria diferença neste ponto?','Qual número você acompanharia toda semana para saber se está melhorando?','Quem na equipe é o melhor dono para este tema?']
};
/* histórico de perguntas genéricas nas agências sem conversa de exemplo (Pelotas Lobo usa PERG_HIST) */
const pa_MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function pa_flagGen(q){
  const ag=CASO.ag;if(ag==='PEL'||!q||q.tx!==q.orig)return null;
  if(q.orig==='O que já foi tentado e qual foi o resultado?'){
    const fa=FCAS_ABERTOS.find(f=>f.ag===ag);if(!fa)return null;
    const d=dataBR(fa.aberto);
    return {tipo:'mesma',fca:fa.id,ag:AGX[ag].n,quando:d?pa_MES[d.getMonth()]+'/'+d.getFullYear():fa.aberto,emAberto:true,
      original:`O que já foi feito para tratar ${pa_min_(fa.tema)}?`,desfecho:`virou o plano em execução · ${fa.exec}% executado`};
  }
  if(q.orig==='Do que a agência precisa para virar esse número nos próximos 60 dias?'){
    const rg=ag==='RGD';
    return {tipo:'outra',fca:rg?'FCA-2025-0187':'FCA-2025-0212',ag:rg?'Vacaria':'Rio Grande',quando:rg?'out/2025':'mar/2025',
      original:'Do que a agência precisa para voltar ao indicador nos próximos 60 dias?',desfecho:'virou ação com responsável e prazo'};
  }
  return null;
}
/* bandeira da pergunta: some quando o texto é editado (q.tx diferente de q.orig) */
function pa_flag(q){return flagDe(q)||pa_flagGen(q);}

/* ---------- utilitários ---------- */
function pa_P(){return ws().pauta||[];}
function pa_bl(id){return pa_P().find(b=>b.id===id);}
function pa_q(bid,qid){const b=pa_bl(bid);return b?b.qs.find(q=>q.id===qid):null;}
function pa_renum(){pa_P().forEach((b,i)=>b.n=i+1);}
function pa_minOf(hm){const m=String(hm||'14:00').match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):840;}
function pa_hm(t){t=((t%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function pa_tot(){return pa_P().reduce((s,b)=>s+(+b.min||0),0);}
function pa_ib(ic,on,t,cls,dis){return ib(ic,on,t,cls||'',{disabled:dis});}
/* minúsculas sem estragar siglas (PF, PJ, RDC) */
function pa_min_(t){return String(t||'').split(' ').map(w=>/^[A-ZÀ-Ú]{2,}$/.test(w)?w:w.toLowerCase()).join(' ');}
function pa_cheia(q){return !!String(q.tx||'').trim();}
/* palavras de uma pergunta, para não sugerir uma quase igual à que já existe */
function pa_pal(t){return new Set(String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3));}
function pa_parecida(a,b){const A=pa_pal(a),B=pa_pal(b);if(!A.size||!B.size)return false;let n=0;A.forEach(w=>{if(B.has(w))n++;});return n/(A.size+B.size-n)>=0.5;}

/* ---------- marcações da pergunta: bandeira, editada, sua ---------- */
/* sem a bandeirinha de "já perguntada" (v12): comparar perguntas parecidas exige IA e fica para depois */
function pa_meta(b,q){
  if(q.orig&&q.tx!==q.orig){
    return `<span class="pa-ed">${ICON.edit}<span>Editada</span><button type="button" onclick="pa_qUndo('${b.id}','${q.id}')">desfazer</button></span>`;
  }
  if(!q.orig)return `<span class="pa-mine">${ICON.user}<span>Sua pergunta</span></span>`;
  return '';
}
function pa_bmeta(b){
  const og=b.origem||'padrão';
  const tg=og.startsWith('sinal')?`<span class="tag t-tl">${esc(og)}</span>`
    :og==='seu'?'<span class="tag t-gd">seu bloco</span>':`<span class="tag t-gy">${esc(og)}</span>`;
  const n=b.qs.filter(pa_cheia).length,f=b.qs.filter(q=>pa_flag(q)).length;
  return tg;
}

/* ---------- edição (sem redraw enquanto digita) ---------- */
function pa_qTx(bid,qid,v){
  const b=pa_bl(bid),q=pa_q(bid,qid);if(!q)return;
  q.tx=v;
  const el=document.getElementById('paf_'+qid);if(el)el.innerHTML=pa_meta(b,q);
  const bm=document.getElementById('pabm_'+bid);if(bm)bm.innerHTML=pa_bmeta(b);
  pa_res();pa_ntLive();
}
function pa_bT(bid,v){const b=pa_bl(bid);if(!b)return;b.t=v;pa_res();}
function pa_bC(bid,v){const b=pa_bl(bid);if(b)b.ctx=v;}
function pa_min(bid,v){
  const b=pa_bl(bid);if(!b)return;
  const n=parseInt(v,10);b.min=isNaN(n)?0:Math.max(0,Math.min(180,n));
  pa_res();
}
function pa_minBlur(bid,el){const b=pa_bl(bid);if(b&&String(el.value)!==String(b.min))el.value=b.min;}
function pa_kT(e,el){if(e.key==='Enter'){e.preventDefault();el.blur();}}
function pa_kQ(e,bid,qid){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();pa_qAdd(bid,qid);}}

/* ---------- ações explícitas (com redraw) ---------- */
function pa_qUndo(bid,qid){const q=pa_q(bid,qid);if(!q)return;q.tx=q.orig;redraw();toast('Texto original da pergunta restaurado','↺');}
function pa_qAdd(bid,after){
  const b=pa_bl(bid);if(!b)return;
  const q={id:uid('q'),tx:'',orig:''};
  const i=after?b.qs.findIndex(x=>x.id===after)+1:b.qs.length;
  b.qs.splice(i,0,q);pa_fech[bid]=false;pa_focus='q:'+q.id;redraw();
}
function pa_qDel(bid,qid){
  const b=pa_bl(bid);if(!b)return;
  const i=b.qs.findIndex(q=>q.id===qid);if(i<0)return;
  const [q]=b.qs.splice(i,1);pa_desf={t:'q',bid,i,q};redraw();
  toast(`Pergunta removida <button type="button" class="pa-undo" onclick="pa_undo()">Desfazer</button>`,ICON.trash);
}
function pa_qMv(bid,qid,d){
  const b=pa_bl(bid);if(!b)return;
  const i=b.qs.findIndex(q=>q.id===qid),j=i+d;if(i<0||j<0||j>=b.qs.length)return;
  [b.qs[i],b.qs[j]]=[b.qs[j],b.qs[i]];redraw();
}
function pa_bMv(bid,d){
  const P=pa_P(),i=P.findIndex(b=>b.id===bid),j=i+d;if(i<0||j<0||j>=P.length)return;
  [P[i],P[j]]=[P[j],P[i]];pa_renum();redraw();
}
function pa_bDel(bid){
  const P=pa_P(),i=P.findIndex(b=>b.id===bid);if(i<0)return;
  const [b]=P.splice(i,1);pa_renum();pa_desf={t:'b',i,b};redraw();
  toast(`Bloco removido <button type="button" class="pa-undo" onclick="pa_undo()">Desfazer</button>`,ICON.trash);
}
function pa_bAdd(){
  const P=pa_P();
  const b={id:uid('b'),k:null,n:0,t:'',ctx:'',min:10,origem:'seu',qs:[{id:uid('q'),tx:'',orig:''}]};
  const fi=P.findIndex(x=>x.k==='fechamento');
  P.splice(fi>=0?fi:P.length,0,b);pa_renum();pa_focus='b:'+b.id;redraw();
}
function pa_undo(){
  const d=pa_desf;if(!d)return;pa_desf=null;
  if(d.t==='q'){const b=pa_bl(d.bid);if(b)b.qs.splice(Math.min(d.i,b.qs.length),0,d.q);}
  else{const P=pa_P();P.splice(Math.min(d.i,P.length),0,d.b);pa_renum();}
  redraw();toast('Restaurado','↺');
}
function pa_tg(bid){
  pa_fech[bid]=!pa_fech[bid];
  const el=document.getElementById('pab_'+bid);
  if(el){el.classList.toggle('fech',!!pa_fech[bid]);
    const t=el.querySelector('.pa-tgl');if(t){t.setAttribute('aria-expanded',String(!pa_fech[bid]));t.title=pa_fech[bid]?'Expandir bloco':'Recolher bloco';}
    if(!pa_fech[bid])el.querySelectorAll('.ed-ta').forEach(autoGrow);}
  const a=document.getElementById('pa_tga');if(a)a.textContent=pa_P().some(b=>pa_fech[b.id])?'Expandir todos':'Recolher todos';
}
function pa_tgAll(){const P=pa_P(),algum=P.some(b=>pa_fech[b.id]);P.forEach(b=>pa_fech[b.id]=!algum);redraw();}

/* ---------- IA por botão ---------- */
function pa_gerar(btn){
  aiRun(btn,()=>{const ag=CASO.ag;if(!ws(ag).prepauta)sugerirPrePauta(ag);gerarPauta(ag);redraw();toast('Perguntas geradas a partir da pré-pauta',ICON.spark);},1400,'Gerando perguntas…');
}
function pa_sug(btn,bid){
  aiRun(btn,()=>{
    const b=pa_bl(bid);if(!b){redraw();return;}
    const tem=[];pa_P().forEach(x=>x.qs.forEach(q=>{if(pa_cheia(q))tem.push(q.tx.trim());}));
    const base=b.k==='abertura'||b.k==='fechamento'?pa_SUG[b.k]:perguntasPadrao(b).slice(1);
    const cand=[...base,...pa_SUG.extra].find(t=>!tem.some(x=>x===t||pa_parecida(x,t)));
    if(!cand){redraw();toast('Sem novas sugestões para este bloco',ICON.spark);return;}
    const q={id:uid('q'),tx:cand,orig:cand};b.qs.push(q);pa_novo=q.id;pa_fech[bid]=false;
    redraw();toast('Pergunta sugerida adicionada ao bloco '+(pa_P().indexOf(b)+1),ICON.spark);
  },900,'Sugerindo…');
}
function pa_share(){toast('Pauta enviada para '+esc(casoAg().ger),ICON.share);}
function pa_export(){toast('Pauta exportada em PDF',ICON.export);}

/* ---------- resumo (atualiza ao vivo, sem campos dentro) ---------- */
function pa_resHtml(){
  const P=pa_P(),tot=pa_tot(),nq=P.reduce((s,b)=>s+b.qs.filter(pa_cheia).length,0);
  const ini=0;let t=0;
  const rows=P.map((b,i)=>{const r=`<div class="pa-rt"><span class="h mono">${ini+t}'</span><span class="n mono">${i+1}</span><span class="t" title="${esc(b.t)}">${b.t.trim()?esc(b.t):'<i>Bloco sem título</i>'}</span><span class="m mono">${+b.min||0} min</span></div>`;t+=(+b.min||0);return r;}).join('');
  const fim=ini+tot;
  return `<div class="pa-kp">
      <div><b class="mono">${P.length}</b><span>blocos</span></div>
      <div><b class="mono">${nq}</b><span>perguntas</span></div>
