NAVBADGE.reuniao=()=>{const w=WS[CASO.ag];return w&&w.processado&&!w.fca&&DEMO_OK()?(w.itens||[]).length:0;};

/* =========================================================================
   AÇÕES
   ========================================================================= */
/* filtros da transcrição: atualiza só a lista, sem roubar o foco da busca */
function rn_fil(v){rn_S.fil=v;rn_refreshTrs();const b=$('#rnTrs');if(b)b.scrollTop=0;}
function rn_q(v){rn_S.q=v;rn_refreshTrs();}
function rn_ifil(v){rn_S.ifil=v;redraw();}

/* corrigir a transcrição de um trecho */
function rn_editFala(i){rn_S.edF=i;rn_refreshTrs();const t=document.querySelector('#rnF'+i+' textarea');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}}
function rn_salvaFala(i,v){
  const w=ws();w.rn_falas=w.rn_falas||{};const orig=FALAS[i].x;v=String(v).trim();
  const antes=w.rn_falas[i]!=null?w.rn_falas[i]:orig;
  if(!v||v===orig)delete w.rn_falas[i];else w.rn_falas[i]=v;
  rn_S.edF=null;rn_refreshTrs();
  if(v&&v!==antes)toast('Trecho corrigido na transcrição','✎');
}
/* anotações do regional */
function rn_setNota(id,v){const w=ws();if(id==='_geral')w.notaGeral=v;else w.notas[id]=v;}
function rn_delNota(id){
  const w=ws();const ant=id==='_geral'?w.notaGeral:w.notas[id];
  rn_S.undo={nota:id,tx:ant};
  if(id==='_geral')w.notaGeral='';else w.notas[id]='';
  redraw();toast(`Anotação excluída <button class="rn-undo" onclick="rn_desfazer()">Desfazer</button>`,'🗑');
}

/* candidatos */
function rn_set(id,k,v){const c=rn_item(id);if(!c)return;c[k]=v;rn_mudou();}
function rn_tipo(id){
  const c=rn_item(id);if(!c)return;
  c.tipo=c.tipo==='fca'?'nota':'fca';rn_mudou();redraw();
  toast(c.tipo==='fca'?'Promovido a FCA: vai virar ação com responsável, prazo e meta':'Rebaixado a registro: fica na memória da unidade, sem plano de ação','✎');
}
function rn_del(id){
  const w=ws(),i=(w.itens||[]).findIndex(c=>c.id===id);if(i<0)return;
  rn_S.undo={item:w.itens[i],i};w.itens.splice(i,1);rn_mudou();redraw();
  toast(`Item excluído <button class="rn-undo" onclick="rn_desfazer()">Desfazer</button>`,'🗑');
}
function rn_desfazer(){
  const u=rn_S.undo,w=ws();if(!u)return;
  if(u.item){w.itens.splice(Math.min(u.i,w.itens.length),0,u.item);}
  else if(u.nota){if(u.nota==='_geral')w.notaGeral=u.tx;else w.notas[u.nota]=u.tx;}
  rn_S.undo=null;redraw();toast('Desfeito','↺');
}
function rn_add(){
  const w=ws();w.itens=w.itens||[];
  const c={id:uid('c'),tipo:'fca',tema:'',tx:'',quem:'',prazo:'',tempo:null,rz:''};
  w.itens.push(c);rn_S.ifil='todos';rn_mudou();redraw();
  setTimeout(()=>{const el=document.querySelector('#rnI_'+c.id+' .rn-tema-in');if(el){el.scrollIntoView({block:'center'});el.focus();}},40);
}

/* navegação entre transcrição e itens */
function rn_flash(el){if(!el)return;el.classList.remove('rn-flash');void el.offsetWidth;el.classList.add('rn-flash');setTimeout(()=>el.classList.remove('rn-flash'),1800);}
function rn_irFala(i){
  let el=document.getElementById('rnF'+i);
  if(!el){rn_S.fil='tudo';rn_S.q='';const s=document.querySelector('.rn-card .srch input');if(s)s.value='';rn_refreshTrs();el=document.getElementById('rnF'+i);}
  const box=$('#rnTrs');if(!el||!box)return;
  const card=box.closest('.card'),r=card.getBoundingClientRect();
  if(r.top<70||r.top>window.innerHeight*0.5)card.scrollIntoView({behavior:'smooth',block:'start'});
  box.scrollTo({top:Math.max(0,el.offsetTop-12),behavior:'smooth'});
  rn_flash(el);
}
function rn_irTempo(t){rn_irFala(rn_idxAte(t));}
function rn_irItem(id){
  let el=document.getElementById('rnI_'+id);
  if(!el){rn_S.ifil='todos';redraw();el=document.getElementById('rnI_'+id);}
  if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});rn_flash(el);
}

/* processar (só para a demonstração, quando a captura ainda não foi processada) */
function rn_processar(btn){
  aiRun(btn,()=>{const w=ws();if(!w.audio)w.audio=audioExemplo();processarConversa();rn_S.fil='tudo';rn_S.ifil='todos';redraw();
    toast('Conversa processada: revise a transcrição e os candidatos','✓');},1600,'Transcrevendo e encaixando…');
}
/* gerar o diagnóstico e o FCA a partir dos itens revisados (único ponto de chamada de IA desta tela) */
function rn_gerar(btn){
  const w=ws(), aprov=(w.itens||[]).filter(i=>i.tipo==='fca');
  if(!aprov.length){toast('Promova ao menos um item a FCA antes de gerar','⚠');return;}
  const vazio=aprov.find(i=>!String(i.tx||'').trim());
  if(vazio){toast('Há um item de FCA sem texto. Preencha ou exclua antes de gerar','⚠');rn_irItem(vazio.id);return;}
  if(w.fca&&!w.publicado){fc_regen('rn');return;}
  aiRun(btn,()=>{fc_gerar();go('fca');toast('Rascunho do FCA gerado: revise, edite e publique','✓');},1500,'Consolidando com IA…');
}

</script>
<script>
/* ---- 50_fca.js ---- */
/* =========================================================================
   5 · DIAGNÓSTICO E FCA · prefixo fc_
   Consolida os compromissos aprovados na conversa registrada em um FCA
   global (fato, causa, ações, meta). Uma única publicação. Depois de publicado, a gerente
   da agência lê e comenta; o regional ajusta prazo e meta a partir dos comentários.
   ========================================================================= */
const fc_S={ver:'regional',open:null,kind:null,draft:''};
const fc_REG='Marcelo Brião';
/* de qual compromisso da conversa nasce cada ação do FCA de exemplo (índice em FCA.acoes) */
const fc_SRC=['C1','C1','C1','C2','C3'];
/* ideias que a IA tirou da transcrição e que ainda não viraram ação (só na conversa de exemplo de Pelotas) */
const fc_IDEIAS=[
  {k:'i1',t:'04:31',fala:'Se a gente tivesse ligado antes do vencimento, os três teriam renovado.',
   a:'Recontatar os três cooperados PJ que não renovaram (grupo Delta e mais dois) com proposta de retorno das aplicações',q:'Fernanda Rocha'},
  {k:'i2',t:'05:53',fala:'Um deles já tinha comentado que a obra atrasou de qualquer jeito.',
   a:'Confirmar com o cooperado o novo cronograma da obra antes de propor a reprogramação da operação de junho',q:'Fernanda Rocha'}
];
const fc_IC={
  doc:_sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',26),
  lock:_sv('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',26),
  mic:_sv('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',26),
  warn:_sv('<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/>'),
  arch:_sv('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>')
};

/* ---------- utilidades ---------- */
function fc_ok(v){v=String(v==null?'':v).trim();return !!v&&v!=='—'&&v!=='a definir';}
function fc_ini(n){return String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function fc_ag(){return fc_S.ver==='agencia';}
/* quem pode editar o quê: antes de publicar o regional edita tudo; depois, só prazo e meta ('pub'); a agência só lê */
function fc_ed(kind){const w=ws();if(fc_ag())return false;if(!w.publicado)return true;return kind==='pub';}
function fc_in(val,on,o,kind){return fc_ed(kind)?edIn(val,on,o):`<span class="fc-ro ${o&&o.cls&&o.cls.includes('mono')?'mono':''}">${fc_ok(val)?esc(val):'<i>a definir</i>'}</span>`;}
function fc_ta(val,on,o,kind){return fc_ed(kind)?edTa(val,on,o):`<div class="fc-ro">${fc_ok(val)?esc(val):'<i>a definir</i>'}</div>`;}
function fc_pend(w){return (w.fca?w.fca.acoes:[]).filter(a=>!fc_ok(a.q)||!fc_ok(a.p)||!fc_ok(a.meta));}
function fc_coms(sec){return (ws().coment||[]).filter(c=>c.sec===sec);}
function fc_pendCom(w){return (w.coment||[]).filter(c=>c.papel!=='Gerente regional'&&!c.res).length;}
/* data proposta num comentário: a última citada ("até 25/05 … Proponho 27/05" → 27/05/2026) */
function fc_data(tx){const ms=[...String(tx||'').matchAll(/(\d{2})\/(\d{2})(?:\/(\d{4}))?/g)];const m=ms[ms.length-1];return m?`${m[1]}/${m[2]}/${m[3]||'2026'}`:null;}
/* "R$ 2,81 mi sem sinalização…" → valor "R$ 2,81 mi" + complemento */
function fc_val(s){
  s=String(s||'');const m=s.match(/^([−\-+]?(?:R\$\s?)?[\d.,]+(?:\s?(?:mi|mil|%|p\.p\.|σ))?)\s*(.*)$/);
  if(!m)return [s,''];
  return [m[1],m[2].replace(/^\(|\)$/g,'').replace(/\s*\(/g,' · ').replace(/\)/g,'').trim()];
}
/* comentários de ação usam 'acao-<índice em w.fca.acoes>', o mesmo formato do core (COMENT_SEED) e do acompanhamento */
function fc_secA(i){return 'acao-'+i;}
function fc_acaoDe(w,sec){const m=/^acao-(\d+)$/.exec(sec||'');return m&&w.fca?w.fca.acoes[+m[1]]:null;}
function fc_norm(w){(w.coment||[]).forEach(c=>{if(!c.id)c.id=uid('m');});}
function fc_marca(){const w=ws();if(!w.fc_edit){w.fc_edit=true;const el=$('#fcStTxt');if(el)el.innerHTML=fc_stTxt(w);}}

/* gera o FCA (gerarFCA do core) e alinha as ações com o que o regional decidiu na conversa registrada */
function fc_gerar(){
  const w=ws();gerarFCA();fc_tag(w);
  w.rn_dirty=false;w.fc_edit=false;w.fc_ideias={};fc_S.open=null;
  return w.fca;
}
/* liga cada ação ao compromisso de origem e aplica as decisões da conversa registrada.
   Roda uma vez por FCA gerado (também quando o FCA veio direto de gerarFCA()). */
function fc_tag(w){
  const f=w.fca;if(!f||f._tag)return;
  const its=w.itens||[], n0=FCA.acoes.length;
  const porOrig=Object.fromEntries(its.filter(i=>i._orig).map(i=>[i._orig,i]));
  const base=f.acoes.slice(0,n0), extra=f.acoes.slice(n0);
  base.forEach((a,k)=>{const it=porOrig[fc_SRC[k]];a.src=it?it.id:null;a._k=k;
    const o=COMPROMISSOS.find(x=>x.id===fc_SRC[k]);
    if(it&&o){ /* edições do regional no item seguem para a ação correspondente */
      if(fc_ok(it.quem)&&it.quem!==o.quem&&a.q===o.quem)a.q=it.quem;
      if(fc_ok(it.prazo)&&it.prazo!==o.prazo&&a.p===o.prazo)a.p=it.prazo;
      if(fc_SRC.filter(s=>s===o.id).length===1&&it.tx!==o.tx&&String(it.tx||'').trim())a.a=it.tx;
    }});
  /* item rebaixado ou excluído: a ação sai do FCA */
  let acoes=base.filter(a=>{const it=its.find(i=>i.id===a.src);return it&&it.tipo==='fca';});
  /* registro promovido a FCA vira ação */
  its.filter(i=>i.tipo==='fca'&&i._orig&&!fc_SRC.includes(i._orig)).forEach(i=>acoes.push({id:uid('a'),a:i.tx,q:i.quem,p:i.prazo,meta:'',st:'aberta',prog:0,ev:[],src:i.id}));
  /* itens criados pelo regional (o core já os adiciona ao fim) */
  const novos=its.filter(i=>i.tipo==='fca'&&!i._orig);
  extra.forEach((a,k)=>{a.src=novos[k]?novos[k].id:null;});
  acoes=acoes.concat(extra);
  acoes.forEach(a=>{['q','p','meta'].forEach(k=>{if(!fc_ok(a[k]))a[k]='';});});
  f.acoes=acoes;f._tag=true;
}

/* ---------- comentários (estilo Google Docs) ---------- */
function fc_cbtn(sec,compacto){
  const w=ws();if(!w.publicado)return '';
  const n=fc_coms(sec).length;
  if(fc_ag())return `<button type="button" class="cmt-btn" onclick="fc_abre('${sec}')" title="Comentar">${ICON.comment}<span>Comentar</span>${n?`<span class="n">${n}</span>`:''}</button>`;
  return n?`<button type="button" class="cmt-btn" onclick="fc_abre('${sec}')" title="Responder">${ICON.comment}${compacto?'':'<span>Responder</span>'}<span class="n">${n}</span></button>`:'';
}
function fc_cmtHTML(c){
  const rg=c.papel==='Gerente regional';
  let act='';
  if(!fc_ag()&&!rg&&!c.res){
    if(fc_acaoDe(ws(),c.sec)){const d=fc_data(c.tx);if(d)act+=`<button class="btn btn-xs btn-p" onclick="fc_aplicaPrazo('${c.id}','${d}')">${ICON.cal}Usar ${d} como prazo</button>`;}
    if(c.kind==='rebaixar')act+=`<button class="btn btn-xs btn-p" onclick="fc_aceitaRebaixe('${c.id}')">${ICON.down}Aceitar e rebaixar</button><button class="btn btn-xs" onclick="fc_mantem('${c.id}')">Manter como FCA</button>`;
    else act+=`<button class="btn btn-xs" onclick="fc_resolve('${c.id}')">${ICON.check}Resolver</button>`;
  }
  return `<div class="cmt-i ${c.res?'fc-res':''}"><span class="av ${rg?'rg':''}">${fc_ini(c.autor)}</span><div class="bx">
    <div class="who">${esc(c.autor)}<span>${esc(c.papel)} · ${esc(c.quando)}</span>${c.kind==='rebaixar'?'<span class="tag t-amb fc-tg">sugere rebaixar para registro</span>':''}${c.res?'<span class="tag t-grn fc-tg">resolvido</span>':''}</div>
    ${esc(c.tx)}${act?`<div class="fc-cact">${act}</div>`:''}</div></div>`;
}
function fc_inHTML(sec){
  const ag=fc_ag(), quem=ag?casoAg().ger:fc_REG, reb=fc_S.kind==='rebaixar';
  return `<div class="cmt-in fc-cin"><span class="fc-avi ${ag?'':'rg'}">${fc_ini(quem)}</span>
    <textarea class="ed-ta ed-box" rows="2" id="fcCin" placeholder="${reb?'Por que este compromisso deveria ficar como registro?':ag?'Escreva um comentário para o regional':'Responda à agência'}" oninput="autoGrow(this);fc_S.draft=this.value">${esc(fc_S.draft)}</textarea>
    <div class="fc-cin-b"><button class="btn btn-xs" onclick="fc_cancela()">Cancelar</button><button class="btn btn-xs btn-p" onclick="fc_envia('${sec}')">${reb?'Enviar sugestão':ag?'Comentar':'Responder'}</button></div></div>`;
}
function fc_thread(sec){
  const cs=fc_coms(sec), open=fc_S.open===sec&&ws().publicado;
  if(!cs.length&&!open)return '';
  return `<div class="cmt fc-cmt">${cs.map(fc_cmtHTML).join('')}${open?fc_inHTML(sec):''}</div>`;
}
/* cabeçalho de subseção: rótulo + espaço + comentar */
function fc_sh(lb,sec,extra=''){return `<div class="fc-sh"><span class="fc-lb">${lb}</span>${extra}<span class="sp"></span>${sec?fc_cbtn(sec):''}</div>`;}

/* ---------- partes da tela ---------- */
function fc_stTxt(w){
  const f=w.fca, nC=fc_pendCom(w), ger=casoAg().ger;
  return w.publicado
    ?`<span class="sdot" style="background:var(--green2)"></span><span><b>Publicado</b> em ${esc(w.publicadoEm||'')} · visível para ${esc(ger)}, gerente da agência${nC&&!fc_ag()?` · <b class="fc-nc">${nC} comentário${nC>1?'s':''} da agência</b>`:''}</span>`
    :`<span class="sdot" style="background:var(--gold)"></span><span><b>Rascunho</b> gerado pela IA em ${esc(f.criado)}${w.fc_edit?' · editado por você':''} · ainda não visível para a agência</span>`;
}
function fc_stHTML(w){
  return `<div class="fc-st"><span class="mono fc-id">${esc(w.fca.id)}</span><div class="st-line" id="fcStTxt">${fc_stTxt(w)}</div><div class="sp"></div>
    <div class="fc-ver"><span>Ver como</span>${seg([['regional','Gerente regional'],['agencia','Gerente da agência']],fc_S.ver,'fc_ver')}</div></div>`;
}
function fc_topoHTML(w){
  const exp=`<div class="fc-exp"><button type="button" class="btn btn-s" onclick="fc_expTg(event)" aria-haspopup="true">${ICON.export}Exportar${ICON.chev}</button>
    <div class="fc-menu" role="menu"><button type="button" role="menuitem" onclick="fc_exporta('PDF')">${ICON.file}PDF</button><button type="button" role="menuitem" onclick="fc_exporta('Excel')">${ICON.file}Excel (.xlsx)</button></div></div>`;
  return exp+(!fc_ag()&&!w.publicado?aiBtn('Regenerar com IA',"fc_regen('fc')",'btn-s'):'');
}

/* 1 · compromissos aprovados (pequenos, recolhidos) */
function fc_compHTML(w){
  const its=w.itens||[], ap=its.filter(i=>i.tipo==='fca'), rg=its.filter(i=>i.tipo!=='fca'), ag=fc_ag(), pub=w.publicado;
  const linhas=ap.map(i=>{
    const acs=w.fca.acoes.filter(x=>x.src===i.id), sec='item:'+i.id, cs=fc_coms(sec), sug=cs.some(c=>c.kind==='rebaixar'&&!c.res);
    const head=`<span class="fc-ct mono">${i.tempo||'novo'}</span><span class="fc-cn">${esc(i.tema||'Sem tema')}</span>
      <span class="fc-cm">${ICON.user}${esc(fc_ok(i.quem)?i.quem:'sem responsável')}<i></i>${ICON.cal}${esc(fc_ok(i.prazo)?i.prazo:'sem prazo')}</span>
      ${acs.length?`<span class="tag t-gy">${acs.length} ${acs.length>1?'ações':'ação'}</span>`:''}${sug?'<span class="tag t-amb">rebaixe sugerido</span>':''}${cs.length?`<span class="fc-cc">${ICON.comment}${cs.length}</span>`:''}`;
    const body=`<p class="fc-ctx">${esc(i.tx)}</p>
      ${acs.length?`<div class="fc-lb">No FCA</div><ul class="fc-cl">${acs.map(x=>`<li>${esc(x.a)}</li>`).join('')}</ul>`:''}
      ${i.rz?`<div class="fc-rz">${i.rz}</div>`:''}
      ${pub&&ag&&fc_S.open!==sec?`<div class="fc-cact">${fc_cbtn(sec)}${sug?'':`<button class="btn btn-xs" onclick="fc_abre('${sec}','rebaixar')">${ICON.down}Sugerir rebaixar para registro</button>`}</div>`:''}
      ${pub&&!ag&&cs.length?`<div class="fc-cact">${fc_cbtn(sec)}</div>`:''}
      ${fc_thread(sec)}`;
    return acc('fcC_'+i.id,head,body,{cls:'flat fc-c'});
  }).join('');
  const reg=rg.length?acc('fcReg',`<span class="fc-regh">${fc_IC.arch}<span><b>${rg.length}</b> registro${rg.length>1?'s ficam':' fica'} na memória da unidade</span></span>`,
    rg.map(r=>`<div class="fc-ri"><b>${esc(r.tema||'Registro')}</b><span>${esc(r.tx)}</span>${fc_ok(r.prazo)?`<em>${ICON.clock}${esc(r.prazo)}</em>`:''}</div>`).join(''),{cls:'flat fc-c fc-reg'}):'';

      <td>${fc_in(a.p,`fc_setA('${a.id}','p',this.value)`,{ph:'dd/mm/aaaa',cls:'ed-box fc-req mono'},'pub')}</td>

      <td class="fc-ac">${fc_cbtn(sec,true)}${edAll?ib('trash',`fc_delA('${a.id}')`,'Excluir ação','del'):''}</td>

      <span class="tag ${pub?'t-grn':'t-gd'}">${pub?'Publicado':'Rascunho da IA'}</span>
      ${INFO({oque:'O FCA global da visita: fato, causa, ações, meta e indicador. É o resumo do que vai ser feito, como num PDI.',como:'Gerado pela IA a partir dos compromissos aprovados, da transcrição e das suas anotações. Tudo é editável antes de publicar: textos, responsáveis, prazos e metas; dá para excluir e criar ações.',obs:'Depois de publicado, você ainda ajusta prazos e metas. A gerente da agência só lê e comenta.'})}</div>

    <div class="card-b fc-body">

      ${fc_sh(`Ações <span class="fc-cnt">${f.acoes.length}</span>`,'',pend.length&&!ag?`<span class="fc-pd">${fc_IC.warn}${pend.length} sem responsável, prazo ou meta</span>`:'')}
      <div class="fc-tw"><table class="fc-t">
        <colgroup><col style="width:34px"><col><col style="width:16%"><col style="width:118px"><col style="width:21%"><col style="width:${edAll?76:ag&&pub?112:(pub?64:12)}px"></colgroup>

        <div class="fc-f"><span>Indicador vinculado</span><div class="fc-ind">${fc_ed('all')?selCtl(opts,f.indicador,'fc_setInd','','fc-sel'):`<b>${esc(f.indicador)}</b>`}

        <label class="fc-f fc-pz"><span>Prazo final</span>${fc_in(f.prazoFinal,"fc_setF('prazoFinal',this.value)",{ph:'dd/mm/aaaa',cls:'ed-box mono'},'pub')}</label>

   AÇÕES
   ========================================================================= */
function fc_ver(v){fc_S.ver=v;fc_S.open=null;fc_S.draft='';redraw();}
/* edição no lugar: grava sem redesenhar a cada tecla */
function fc_setF(k,v){ws().fca[k]=v;fc_marca();}
function fc_setInd(v){ws().fca.indicador=v;fc_marca();redraw();}
function fc_setA(id,k,v){const w=ws(),a=w.fca.acoes.find(x=>x.id===id);if(!a)return;a[k]=v;if(w.publicado&&(k==='p'||k==='meta'))a._aj=true;fc_marca();}
function fc_setS(k,v){ws().sintese[k]=v;fc_marca();}
function fc_setD(i,k,v){const d=ws().sintese.decisoes[i];if(d){d[k]=v;fc_marca();}}
function fc_addA(){
  const w=ws(),a={id:uid('a'),a:'',q:'',p:'',meta:'',st:'aberta',prog:0,ev:[],src:null};
  w.fca.acoes.push(a);fc_marca();redraw();
  setTimeout(()=>{const el=document.querySelector(`[oninput*="fc_setA('${a.id}','a'"]`);if(el){el.scrollIntoView({block:'center'});el.focus();}},40);
}
let fc_undo=null;
function fc_delA(id){
  const w=ws(),i=w.fca.acoes.findIndex(x=>x.id===id);if(i<0)return;
  const a=w.fca.acoes[i];if(a._ideia&&w.fc_ideias)delete w.fc_ideias[a._ideia];
  fc_undo={tipo:'acao',v:a,i};w.fca.acoes.splice(i,1);fc_marca();redraw();
  toast(`Ação excluída <button class="rn-undo" onclick="fc_desfazer()">Desfazer</button>`,'🗑');
}
function fc_addD(){
  const w=ws();w.sintese.decisoes.push({tx:'',t:''});fc_marca();redraw();
  setTimeout(()=>{const els=$$('.fc-dl .ed-ta');const el=els[els.length-1];if(el)el.focus();},40);
}
function fc_delD(i){
  const w=ws();fc_undo={tipo:'dec',v:w.sintese.decisoes[i],i};w.sintese.decisoes.splice(i,1);fc_marca();redraw();
  toast(`Decisão excluída <button class="rn-undo" onclick="fc_desfazer()">Desfazer</button>`,'🗑');
}
function fc_desfazer(){
  const u=fc_undo,w=ws();if(!u)return;
  const arr=u.tipo==='acao'?w.fca.acoes:w.sintese.decisoes;arr.splice(Math.min(u.i,arr.length),0,u.v);
  if(u.tipo==='acao'&&u.v._ideia){w.fc_ideias=w.fc_ideias||{};w.fc_ideias[u.v._ideia]='add';}
  fc_undo=null;redraw();toast('Desfeito','↺');
}
function fc_addIdeia(k){
  const w=ws(),d=fc_IDEIAS.find(x=>x.k===k);if(!d)return;
  w.fc_ideias=w.fc_ideias||{};w.fc_ideias[k]='add';
  w.fca.acoes.push({id:uid('a'),a:d.a,q:d.q||'',p:'',meta:'',st:'aberta',prog:0,ev:[],src:null,_ideia:k,_t:d.t});
  fc_marca();redraw();toast('Ideia adicionada como ação: defina prazo e meta','✓');
}
function fc_descIdeia(k){const w=ws();w.fc_ideias=w.fc_ideias||{};w.fc_ideias[k]='desc';redraw();toast('Ideia descartada','🗑');}

/* publicar: uma única publicação; a partir dela a agência vê */
function fc_publicar(){
  const w=ws(),f=w.fca,pend=fc_pend(w),ger=casoAg().ger,ap=(w.itens||[]).filter(i=>i.tipo==='fca').length;
  modal(`<div class="mod-h"><h3>Publicar ${esc(f.id)}?</h3><button class="x" onclick="closeModal()" aria-label="Fechar">×</button></div>
    <div class="mod-b fc-mb">
      <p>O FCA fica visível para <b>${esc(ger)}</b>, gerente da agência. Ela lê e comenta, e pode sugerir rebaixar um compromisso para registro. Não edita.</p>
      <div class="fc-ms"><div><span>Compromissos</span><b>${ap}</b></div><div><span>Ações</span><b>${f.acoes.length}</b></div><div><span>Prazo final</span><b class="mono">${esc(f.prazoFinal||'a definir')}</b></div></div>
      <div class="fc-mm"><span>Meta</span>${esc(f.meta||'a definir')}</div>
      ${w.rn_dirty?`<div class="fc-pw">${fc_IC.warn}<span>Os itens da conversa mudaram depois deste rascunho. Para incluir as mudanças, cancele e use <b>Regenerar com IA</b>.</span></div>`:''}
      ${pend.length?`<div class="fc-pw">${fc_IC.warn}<span><b>${pend.length} aç${pend.length===1?'ão':'ões'}</b> sem responsável, prazo ou meta. Dá para publicar e completar depois com a agência.</span></div>`:''}
      <p class="fc-mn">Depois de publicado, você ainda ajusta prazos e metas a partir dos comentários da agência.</p>
    </div>
    <div class="mod-f"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="fc_publicaOk()">${ICON.check}Publicar agora</button></div>`);
}
function fc_publicaOk(){
  const w=ws();publicarFCA();
  /* o comentário semente fala da ação 2 do FCA de exemplo: segue essa ação mesmo que o regional tenha mudado a ordem */
  w.coment=w.coment.filter(c=>{const m=/^acao-(\d+)$/.exec(c.sec);if(!m)return true;
    const ni=w.fca.acoes.findIndex(a=>a._k===+m[1]);if(ni<0)return false;c.sec=fc_secA(ni);return true;});
  fc_norm(w);closeModal();fc_S.ver='regional';fc_S.open=null;redraw();
  toast(`${w.fca.id} publicado: visível para ${casoAg().ger}`,'✓');
}

/* comentários */
function fc_abre(sec,kind){fc_S.open=sec;fc_S.kind=kind||null;fc_S.draft='';
  const m=/^item:(.+)$/.exec(sec);if(m)ACC['fcC_'+m[1]]=true;if(sec==='sintese')ACC.fcSint=true;redraw();}
function fc_cancela(){fc_S.open=null;fc_S.kind=null;fc_S.draft='';redraw();}
function fc_envia(sec){
  const tx=String(fc_S.draft||'').trim();if(!tx){toast('Escreva o comentário antes de enviar','⚠');const t=$('#fcCin');if(t)t.focus();return;}
  const ag=fc_ag(),w=ws();
  w.coment.push({id:uid('m'),sec,kind:fc_S.kind,autor:ag?casoAg().ger:fc_REG,papel:ag?'Gerente da agência':'Gerente regional',quando:'agora',tx});
  const reb=fc_S.kind==='rebaixar';fc_S.open=null;fc_S.kind=null;fc_S.draft='';redraw();
  toast(reb?'Sugestão enviada ao regional':ag?'Comentário enviado ao regional':'Resposta enviada à agência','💬');
}
function fc_resp(c,tx){ws().coment.push({id:uid('m'),sec:c.sec,autor:fc_REG,papel:'Gerente regional',quando:'agora',tx});}
function fc_resolve(id){const c=ws().coment.find(x=>x.id===id);if(!c)return;c.res=true;redraw();toast('Comentário resolvido','✓');}
function fc_aplicaPrazo(id,d){
  const w=ws(),c=w.coment.find(x=>x.id===id);if(!c)return;
  const a=fc_acaoDe(w,c.sec);if(!a)return;
  a.p=d;a._aj=true;c.res=true;fc_resp(c,`Prazo ajustado para ${d}.`);redraw();
  toast(`Prazo ajustado para ${d} · a agência é avisada`,'📅');
}
function fc_aceitaRebaixe(id){
  const w=ws(),c=w.coment.find(x=>x.id===id);if(!c)return;
  const itId=c.sec.slice(5),it=(w.itens||[]).find(x=>x.id===itId);if(!it)return;
  it.tipo='nota';const old=w.fca.acoes.slice(),n=old.filter(a=>a.src===itId).length;
  w.fca.acoes=old.filter(a=>a.src!==itId);c.res=true;
  /* as ações mudaram de posição: os comentários 'acao-<índice>' acompanham a ação; os da ação que saiu vão para o compromisso */
  w.coment.forEach(m=>{const a=fc_acaoDe({fca:{acoes:old}},m.sec);if(!a)return;const ni=w.fca.acoes.indexOf(a);m.sec=ni>=0?fc_secA(ni):c.sec;});
  fc_resp(c,`Rebaixado para registro${n?`: ${n} aç${n===1?'ão saiu':'ões saíram'} do FCA`:''}.`);redraw();
  toast(`“${it.tema}” rebaixado para registro`,'✎');
}
function fc_mantem(id){const c=ws().coment.find(x=>x.id===id);if(!c)return;c.res=true;fc_resp(c,'Mantido como FCA.');redraw();toast('Mantido como FCA','✓');}

</script>
<script>
/* ---- 60_plano.js ---- */
/* =========================================================================
   6 · EXECUÇÃO E ACOMPANHAMENTO  (prefixo pl_)
   Fotografia posterior à reunião: situação em pl_REF, 9 dias depois do FCA.
   Status de cada ação calculado contra pl_REF; ações vêm do FCA publicado
   (ws('PEL').fca, se o regional publicou no fluxo) ou do FCA de exemplo.
   ========================================================================= */
const pl_REF = '27/05/2026';
const pl_REFD = dataBR(pl_REF);
const pl_FCA_DT = '18/05/2026';
const pl_dias  = s=>diasAte(s,pl_REFD);           /* >0: futuro em relação a pl_REF */
const pl_desde = s=>diasDesde(s,pl_REFD);
const pl_d  = s=>String(s||'').slice(0,5);         /* '27/05' */
const pl_dy = s=>{const m=String(s||'').match(/(\d{2}\/\d{2})\/\d{2}(\d{2})/);return m?m[1]+'/'+m[2]:(s||'—');};  /* '27/05/26' */

/* situação de cada ação do FCA de exemplo em 27/05 (pela posição em FCA.acoes) */
const pl_SNAP = [
  {prog:100, feito:'20/05/2026', ev:['lista_vencimentos_PEL_60d.xlsx']},
  {prog:60,  p:'27/05/2026', pAnt:'25/05/2026', pQuando:'19/05', pMotivo:'a pedido da gerente da agência (feriado municipal)', ev:['3 de 5 contatos registrados']},
  {prog:75,  ev:['carteira_redistribuida.pdf']},
  {prog:100, feito:'21/05/2026', ev:['e-mail 19/05 · resposta em 21/05']},
  {prog:25,  ev:[]}
];
/* resposta do regional ao comentário da gerente (ação 2) */
const pl_RESP = {1:[{autor:'Marcelo Brião', papel:'Regional', quando:'19/05 · 10:03', tx:'Combinado. Prazo ajustado para 27/05.', rg:true}]};

/* metas do FCA (resultado esperado): valor na data do FCA, hoje e alvo */
const pl_METAS = [
  {n:'Cobertura captação/crédito', fca:0.97,  hoje:0.98,  alvo:1.05,  f:v=>nf(v,2),             lb:'alvo ≥ 1,05'},
  {n:'Concentração top-10 PJ',     fca:34.2,  hoje:33.4,  alvo:28,    f:v=>nf(v,1)+'%',         lb:'alvo < 28%'},
  {n:'RDC a vencer sem tratativa', fca:2.81,  hoje:0.94,  alvo:0,     f:v=>'R$ '+nf(v,2)+' mi', lb:'alvo zero'},
  {n:'Carteira de crédito',        fca:219.1, hoje:219.6, alvo:219.1, f:v=>'R$ '+nf(v,1)+' mi', lb:'sem redução', manter:true}
];

/* cobertura quinzenal antes do FCA: 01/12/2025 … 15/05/2026 (12 pontos) · usada também no resultado */
const pl_COB_ANTES = [1.16,1.15,1.155,1.16,1.145,1.13,1.11,1.09,1.065,1.04,1.005,0.97];
const pl_LB_ANTES  = ['dez','','jan','','fev','','mar','','abr','','mai',''];

/* FCA de longo prazo em uma agência que já tem outro FCA aberto (mostra como diferenciar) */
const pl_FCA_EXTRA = [
  {id:'FCA-2026-0144', ag:'CAM', tema:'Diversificação da carteira rural · plano safra 2026/27', aberto:'22/04/2026', prazo:'31/03/2027', exec:10, acoes:5, atraso:0}
];

const pl_ST = {src:null, acoes:null, fa:'todas', ord:'agencia', fl:'todos', busca:''};

/* ---------- ações ---------- */
function pl_fcaAtual(){const w=ws('PEL');return (w.publicado&&w.fca)?w.fca:FCA;}
function pl_base(){
  const src=pl_fcaAtual().acoes||[], mesmo=src.length===FCA.acoes.length;
  return src.map((a,i)=>{
    let k=FCA.acoes.findIndex(o=>o.a===a.a);
    if(k<0&&mesmo)k=i;
    const s=k>=0?pl_SNAP[k]:null;
    const o={id:uid('pa'),k,src:a.id||null,a:a.a||'',q:a.q||'—',meta:a.meta||'a definir',aberta:a.aberta||pl_FCA_DT,p:a.p||'—',prog:0,ev:[],feito:null,pAnt:null,coment:[]};
    if(s){
      o.prog=s.prog;o.ev=[...s.ev];o.feito=s.feito||null;
      /* prazo ajustado depois do comentário da agência (aqui ou já na tela do FCA) */
      if(s.p&&(a.p===FCA.acoes[k].p||a.p===s.p)){o.p=s.p;o.pAnt=s.pAnt;o.pQuando=s.pQuando;o.pMotivo=s.pMotivo;}
    }
    return o;
  });
}
function pl_acoes(){
  const src=pl_fcaAtual();
  if(pl_ST.src!==src||!pl_ST.acoes){pl_ST.src=src;pl_ST.acoes=pl_base();}
  return pl_ST.acoes;
}
function pl_status(a){
  if(a.prog>=100)return 'concluida';
  const d=pl_dias(a.p);
  if(d==null)return 'noprazo';
  if(d<0)return 'vencida';
  if(d===0)return 'hoje';
  const tot=diasAte(a.p,dataBR(a.aberta)),dec=pl_desde(a.aberta);
  const esperado=tot>0?dec/tot:0;
  return a.prog/100<esperado-0.2?'risco':'noprazo';
}
const pl_STL={concluida:['Concluída','t-grn'],vencida:['Vencida','t-red'],hoje:['Vence hoje','t-amb'],risco:['Em risco','t-amb'],noprazo:['No prazo','t-gy']};
function pl_exec(){const ac=pl_acoes();return ac.length?Math.round(ac.reduce((s,a)=>s+Math.min(100,a.prog),0)/ac.length):0;}
function pl_vencTag(a){
  const st=pl_status(a),d=pl_dias(a.p);
  if(st==='concluida')return `<span class="tag t-grn">${ICON.check}concluída ${a.feito?pl_d(a.feito):''}</span>`;
  if(d==null)return '<span class="pl-mut">sem prazo</span>';
  if(st==='vencida')return `<span class="tag t-red">vencida há ${-d} d</span>`;
  if(st==='hoje')return '<span class="tag t-amb">vence hoje</span>';
  if(st==='risco')return `<span class="tag t-amb">em risco</span><span class="pl-mut">vence em ${d} d</span>`;
  return `<span class="pl-mut">vence em ${d} d</span>`;
}
function pl_vencTxt(a){
  const st=pl_status(a),d=pl_dias(a.p);
  if(st==='concluida')return a.feito?`concluída em ${pl_d(a.feito)}`:'concluída';
  if(d==null)return 'sem prazo';
  return d<0?`vencida há ${-d} d`:d===0?'vence hoje':`vence em ${d} d`;
}
function pl_abertaTxt(a){
  if(pl_status(a)==='concluida'&&a.feito){const n=diasAte(a.feito,dataBR(a.aberta));return `durou ${n} d`;}
  const n=pl_desde(a.aberta);return n==null?'—':`${n} d`;
}
function pl_cor(st){return st==='vencida'?'var(--red)':(st==='hoje'||st==='risco')?'var(--amber)':'var(--green2)';}
/* comentários da ação: os do FCA publicado (seção 'acao-<índice>' ou 'acao:<id>'), a resposta do regional e os novos */
function pl_coment(i){
  const a=pl_acoes()[i];if(!a)return [];
  const w=ws('PEL'),src=w.publicado&&w.coment&&w.coment.length?w.coment:COMENT_SEED;
  const base=src.filter(c=>(a.k>=0&&c.sec==='acao-'+a.k)||(a.src&&c.sec==='acao:'+a.src)).map(c=>({...c,rg:c.rg||/regional/i.test(c.papel||'')}));
  const resp=a.k===1&&base.length&&!base.some(c=>c.rg)?pl_RESP[1]:[];
  return [...base,...resp,...a.coment];
}
function pl_exigeEv(){return typeof ex_regra==='function'?ex_regra('evidencia'):true;}
function pl_reabre(){return typeof ex_regra==='function'?ex_regra('reabrir'):true;}

/* atualiza a tela sem fechar o drawer (o drawer fica fora de #view) */
function pl_refresh(){
  if(ATUAL!=='plano')return;
  const v=$('#view'),sc=v.scrollTop,wr=v.querySelector('.wrap');
  if(wr)wr.innerHTML=RENDER.plano();
  v.scrollTop=sc;growAll();buildNav();
}
function pl_toggle(i,ev){
  if(ev)ev.stopPropagation();
  const a=pl_acoes()[i];if(!a)return;
  if(a.prog>=100){a.prog=a._ant!=null?a._ant:50;a.feito=null;toast('Ação reaberta','↺');}
  else{
    if(pl_exigeEv()&&!a.ev.length){toast('Anexe uma evidência para concluir a ação','📎');pl_abrir(i);return;}
    a._ant=a.prog;a.prog=100;a.feito=pl_REF;toast('Ação concluída','✓');
  }
  redraw();
}
function pl_set(i,k,v){const a=pl_acoes()[i];if(!a)return;a[k]=v;pl_refresh();}
function pl_prog(i,v){
  const a=pl_acoes()[i];if(!a)return;a.prog=Math.max(0,Math.min(100,+v||0));
  if(a.prog>=100&&!a.feito)a.feito=pl_REF;if(a.prog<100)a.feito=null;
  const lb=document.getElementById('plPg');if(lb)lb.textContent=a.prog+'%';
  const tg=document.getElementById('plSt');if(tg){const [l,c]=pl_STL[pl_status(a)];tg.className='tag '+c;tg.textContent=l;}
  pl_refresh();
}
function pl_evFile(i,inp){
  const a=pl_acoes()[i];if(!a||!inp.files)return;
  [...inp.files].forEach(f=>a.ev.push(f.name));
  pl_refresh();pl_abrir(i);toast('Evidência anexada','📎');
}
function pl_evReg(i){
  const el=document.getElementById('plEvTx'),tx=(el&&el.value||'').trim();
  if(!tx){toast('Descreva a evidência','✎');return;}
  pl_acoes()[i].ev.push(tx);pl_refresh();pl_abrir(i);toast('Evidência registrada','📎');
}
function pl_evDel(i,j){pl_acoes()[i].ev.splice(j,1);pl_refresh();pl_abrir(i);}
function pl_comentar(i){
  const el=document.getElementById('plCm'),tx=(el&&el.value||'').trim();
  if(!tx)return;
  pl_acoes()[i].coment.push({autor:'Marcelo Brião',papel:'Regional',quando:'27/05 · agora',tx,rg:true});
  pl_refresh();pl_abrir(i);toast('Comentário enviado à agência','💬');
}
function pl_ini(n){return String(n||'').split(' ').map(x=>x[0]||'').slice(0,2).join('');}

/* drawer de uma ação: editar, registrar execução, evidências e comentários */
function pl_abrir(i){
  const a=pl_acoes()[i];if(!a)return;
  const st=pl_status(a),[lb,tg]=pl_STL[st],cm=pl_coment(i);
  const body=`
    <div class="dw-sec"><div class="dw-lb">Ação</div>${edTa(a.a,`pl_set(${i},'a',this.value)`,{cls:'ed-box',rows:2})}</div>
    <div class="pl-dwg">
      <div class="dw-sec"><div class="dw-lb">Responsável</div>${edIn(a.q,`pl_set(${i},'q',this.value)`,{cls:'ed-box'})}</div>
      <div class="dw-sec"><div class="dw-lb">Prazo</div>${edIn(a.p,`pl_set(${i},'p',this.value)`,{cls:'ed-box',ph:'dd/mm/aaaa'})}</div>
    </div>
    ${a.pAnt?`<div class="pl-hist">${ICON.clock}<span>Prazo alterado de <b>${pl_d(a.pAnt)}</b> para <b>${pl_d(a.p)}</b> em ${a.pQuando}, ${esc(a.pMotivo)}.</span></div>`:''}
    <div class="dw-sec"><div class="dw-lb">Meta da ação</div>${edIn(a.meta,`pl_set(${i},'meta',this.value)`,{cls:'ed-box'})}</div>
    <div class="dw-sec">
      <div class="dw-lb">Execução <span class="pl-dw-v mono" id="plPg">${a.prog}%</span></div>
      <div class="bar pl-rbar"><i style="width:${Math.min(100,a.prog)}%;background:${pl_cor(pl_status(a))}"></i></div>
      <div class="pl-mut" style="margin-top:6px">A execução não é editada à mão: vem das evidências registradas e da conclusão da ação.</div>
      <div class="st-line" style="margin-top:6px">Aberta em ${pl_d(a.aberta)} · ${pl_vencTxt(a)}</div>
    </div>
    <div class="dw-sec">
      <div class="dw-lb">Evidências</div>
      ${a.ev.length?`<div class="pl-evl">${a.ev.map((e,j)=>`<div class="pl-evi">${ICON.file}<span>${esc(e)}</span>${ib('x',`pl_evDel(${i},${j})`,'Remover evidência','del')}</div>`).join('')}</div>`:'<div class="pl-mut" style="margin-bottom:8px">Nenhuma evidência ainda.</div>'}
      <div class="pl-evn">
        <input id="plEvTx" class="fld" placeholder="Registrar evidência (ex.: 4 de 5 contatos feitos)" onkeydown="if(event.key==='Enter')pl_evReg(${i})">
        <button class="btn btn-s" type="button" onclick="pl_evReg(${i})">Registrar</button>
        <label class="btn btn-s pl-up">${ICON.upload}<span>Anexar</span><input type="file" multiple onchange="pl_evFile(${i},this)"></label>
      </div>
    </div>
    <div class="dw-sec">
      <div class="dw-lb">${ICON.comment} Comentários ${cm.length?`<span class="pl-n">${cm.length}</span>`:''}</div>
      ${cm.map(c=>`<div class="cmt-i"><span class="av ${c.rg?'rg':''}">${esc(pl_ini(c.autor))}</span><div class="bx"><div class="who">${esc(c.autor)}<span>${esc(c.papel)} · ${esc(c.quando)}</span></div>${esc(c.tx)}</div></div>`).join('')||'<div class="pl-mut" style="margin-bottom:8px">Sem comentários.</div>'}
      <div class="cmt-in"><textarea id="plCm" class="fld" rows="2" placeholder="Escrever para a agência…"></textarea><button class="btn btn-s" type="button" onclick="pl_comentar(${i})">Enviar</button></div>
    </div>`;
  const done=st==='concluida';
  const foot=`<button class="btn" type="button" onclick="pl_toggle(${i})">${done?'Reabrir ação':ICON.check+'<span>Marcar como concluída</span>'}</button><button class="btn btn-p" type="button" onclick="redraw()">Salvar</button>`;
  openDrawer(`Ação ${i+1} · ${pl_fcaAtual().id||FCA.id}`,body,foot,{w:520,pre:`<span class="tag ${tg}" id="plSt">${lb}</span>`});
}
function pl_fa(v){pl_ST.fa=v;redraw();}

/* ---------- carteira: todos os FCAs abertos ---------- */
function pl_fcas(){
  const f=pl_fcaAtual(),ac=pl_acoes();
  const pel={id:f.id||FCA.id,ag:'PEL',tema:'Recomposição da cobertura de captação',aberto:pl_FCA_DT,prazo:f.prazoFinal||FCA.prazoFinal,
    exec:pl_exec(),acoes:ac.length,atraso:ac.filter(a=>pl_status(a)==='vencida').length,atual:true};
  const vis=new Set(),out=[];
  [pel,...FCAS_ABERTOS,...pl_FCA_EXTRA].forEach(x=>{if(!vis.has(x.id)){vis.add(x.id);out.push(x);}});
  return out;
}
function pl_horiz(x){
  const t=diasAte(x.prazo,dataBR(x.aberto));
  return t==null?['—','t-gy']:t<=90?['curto prazo','t-gy']:t<=180?['médio prazo','t-bl']:['longo prazo','t-tl'];
}
function pl_ritmo(x){
  const t=diasAte(x.prazo,dataBR(x.aberto)),dec=pl_desde(x.aberto),d=pl_dias(x.prazo);
  if(d!=null&&d<0&&x.exec<100)return 'var(--red)';
  const esp=t>0?Math.min(1,dec/t):0;
  return x.exec/100>=esp-0.1?'var(--green2)':'var(--amber)';
}
function pl_sitTag(x){
  const d=pl_dias(x.prazo);
  if(d==null)return '—';
  if(d<0)return `<span class="tag t-red">vencido há ${-d} d</span>`;
  if(d===0)return '<span class="tag t-amb">vence hoje</span>';
  if(d<=7)return `<span class="tag t-amb">vence em ${d} d</span>`;
  return `<span class="pl-mut">vence em ${d} d</span>`;
}
const pl_FL={todos:'Todos',vencidos:'Vencidos','30d':'Vencem em 30 d',atraso:'Com ação vencida'};
function pl_filtra(lst,fl){
  return lst.filter(x=>{const d=pl_dias(x.prazo);
    if(fl==='vencidos')return d!=null&&d<0;
    if(fl==='30d')return d!=null&&d>=0&&d<=30;
    if(fl==='atraso')return x.atraso>0;
    return true;});
}
function pl_tabela(){
  const q=pl_ST.busca.trim().toLowerCase(),gr=pl_ST.ord==='agencia';
  const l=pl_filtra(pl_fcas(),pl_ST.fl).filter(x=>!q||(AGX[x.ag].n+' '+x.tema+' '+x.id).toLowerCase().includes(q));
  const dd=x=>{const d=pl_dias(x.prazo);return d==null?9999:d;};
  l.sort(gr?(a,b)=>AGX[a.ag].n.localeCompare(AGX[b.ag].n,'pt-BR')||dd(a)-dd(b):(a,b)=>dd(a)-dd(b));

            <div class="rs-l"><b>Regra proposta</b>${edTa(rs_ST.regra,"rs_ST.regra=this.value",{cls:'ed-box',rows:2})}</div>
            ${rs_ST.enviada
              ?`<div class="st-line rs-ok">${ICON.check}<span>Enviada para aprovação em <a href="#" onclick="go('regras');return false">Regras e critérios</a></span></div>`

          `:emptyState(ICON.spark,'Aprendizado do caso','O copiloto compara este FCA com os casos parecidos da rede e propõe uma regra preventiva. Você revisa antes de enviar.',aiBtn('Gerar aprendizado','rs_gerar(this)','solid'))}
        </div>
      </div>

    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="card-h"><h3>Volta ao radar</h3><span class="sub">o ciclo continua</span><div style="flex:1"></div>
      <button class="btn btn-p btn-s" type="button" onclick="go('radar')">↻ Voltar ao radar</button>
      ${INFO('O FCA não termina em si mesmo: Pelotas segue acompanhada enquanto a meta não for atingida, e o próximo caso começa no radar.')}</div>
    <div class="card-b rs-vr">
      <div class="rs-v ok">
        <span class="rs-vi">${ICON.eye}</span>
        <div><b>Pelotas segue em acompanhamento</b><p>${FCA.id} fica aberto até a cobertura chegar a 1,05 (hoje ${nf(cob,2)}). O SIG-2841 fica ligado ao FCA e volta ao radar se a cobertura cair de novo.</p>

      </div>
      <div class="rs-v wn">
        <span class="rs-vi">${ICON.clock}</span>
        <div><b>Lembrete em 17/07</b><p>Produtos por cooperado volta para a pauta de Pelotas, como decidido na reunião.</p></div>
      </div>
      <div class="rs-v ia">
        <span class="rs-vi">${ICON.spark}</span>
        <div><b>O ciclo recomeça em Vacaria</b><p>SIG-2836 tem a mesma assinatura de desvio, 6 semanas antes do ponto de Pelotas. Desta vez, com este FCA no repertório.</p>
          <button class="rs-lk ia" type="button" onclick="rs_radarSig('SIG-2836')">Abrir o sinal no radar →</button></div>
      </div>
    </div>
  </div>

  ${stepnav(prevBtn('plano'),`<button class="btn btn-p" type="button" onclick="go('lideranca')">Visão da liderança →</button>`)}`;
};

</script>
<script>
/* ---- 80_extras.js ---- */
/* =========================================================================
   VISÕES EXTRAS (prefixo ex_): liderança, regras e critérios, arquitetura,
   boas-vindas e alertas do sino
   ========================================================================= */

/* ======================= VISÃO DA LIDERANÇA ======================= */
function ex_fcas(){return typeof pl_fcas==='function'?pl_fcas():FCAS_ABERTOS;}
RENDER.lideranca=()=>{
  const rank=[...AGENCIAS].sort((a,b)=>b.cob-a.cob);
  const fc=ex_fcas(),porAg={};fc.forEach(f=>porAg[f.ag]=(porAg[f.ag]||0)+1);
  const exec=Math.round(fc.reduce((s,f)=>s+f.exec,0)/(fc.length||1));
  const atr=fc.reduce((s,f)=>s+(f.atraso||0),0),agAtr=new Set(fc.filter(f=>f.atraso>0).map(f=>f.ag)).size;
  const cobC=c=>c<1.0?'var(--red)':c<1.05?'var(--amber)':'var(--green2)';
  return `
  <div class="ph">
    <div class="ph-t">

      <h2>Os desvios estão sendo tratados?</h2>
      <div class="ph-s">Visão consolidada para a diretoria: do sinal à ação e se o indicador reage.</div>
    </div>
    <div class="ph-a">
      ${INFO({oque:'A mesma informação do ciclo, em outro nível de detalhe. A diretoria não vê transcrição nem áudio.',obs:'Não substitui o BI: este painel pode ser publicado de volta no Power BI que a liderança já usa.'})}
      <button class="btn btn-s" type="button" onclick="toast('Exportado para o dataset do Power BI','📊')">${ICON.export}<span>Publicar no Power BI</span></button>
    </div>
  </div>

  <div class="grid g5" style="margin-bottom:14px">
    <div class="kpi"><div class="k">Sinais abertos</div><div class="v">${SINAIS.length}</div><div class="d dn">▲ 2 vs. semana passada</div></div>
    <div class="kpi"><div class="k">FCAs em execução</div><div class="v">${fc.length}</div><div class="d fl">em ${Object.keys(porAg).length} agências</div></div>
    <div class="kpi"><div class="k">Execução média</div><div class="v">${exec}<small>%</small></div><div class="d up">▲ 9 p.p. no trimestre</div></div>
    <div class="kpi ${atr?'warn':''}"><div class="k">Ações vencidas</div><div class="v">${atr}</div><div class="d ${atr?'dn':'fl'}">em ${agAtr} agência${agAtr===1?'':'s'}</div></div>
    <div class="kpi"><div class="k">Sinal → ação</div><div class="v">4,2<small>dias</small></div><div class="d up">▼ de 19 dias antes do piloto</div></div>
  </div>

  <div class="grid g2" style="align-items:start;margin-bottom:14px">
    <div class="card">
      <div class="card-h"><h3>Cobertura por agência</h3><span class="sub">captação sobre crédito</span><div style="flex:1"></div>
        ${INFO({oque:'Ranking das 21 agências pela cobertura de captação sobre crédito.',como:'Vermelho abaixo de 1,00 · âmbar abaixo do piso interno de 1,05 · verde no piso ou acima.'})}</div>
      <div class="card-b ex-scr" style="padding:6px 16px 14px;max-height:400px">
        ${rank.map((a,i)=>`
          <div class="lb-row">
            <span class="rk">${i+1}</span>
            <span class="nm">${a.n} <span class="ex-rg">${a.r}</span></span>
            <div class="bw"><div class="bar"><i style="width:${(a.cob/1.3*100).toFixed(0)}%;background:${cobC(a.cob)}"></i></div></div>
            <span class="vv" style="color:${a.cob<1.05?cobC(a.cob):'inherit'}">${nf(a.cob,2)}</span>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h3>Do sinal ao resultado</h3><span class="sub">funil dos últimos 90 dias</span><div style="flex:1"></div>
        ${INFO({oque:'Quantos sinais viraram atuação, conversa registrada, FCA e efeito no indicador.',obs:'37% dos compromissos viram FCA. Se fosse 100%, a ferramenta teria virado burocracia; se fosse 5%, não estaria capturando o que importa.'})}</div>
      <div class="card-b">
        ${[['Sinais gerados',148,'#B4C0C8'],['Sinais que viraram atuação',52,'#003087'],['Reuniões registradas',52,'#018B6A'],['Compromissos capturados',217,'#A79450'],['Convertidos em FCA',81,'#A8322A'],['FCAs com indicador reagindo',54,'#018B6A']].map(([n,v,c])=>`
          <div class="ex-fn">
            <div class="ex-fn-h"><span>${n}</span><b class="mono">${v}</b></div>
            <div class="bar" style="height:9px"><i style="width:${(v/217*100).toFixed(0)}%;background:${c}"></i></div>
          </div>`).join('')}
        <div class="ex-foot"><b>37% dos compromissos viram FCA.</b> Nem toda conversa precisa de plano de ação.</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h3>Situação das 21 agências</h3><div style="flex:1"></div>
      ${INFO({oque:'Indicadores principais, sinais e FCAs abertos por agência.',como:'Captação e crédito em R$ milhões. Cores: vermelho fora do teto ou do piso, âmbar perto do limite.'})}</div>
    <div class="card-b ex-scr" style="padding:0;max-height:420px">
      <table>
        <thead><tr><th>Agência</th><th>Região</th><th class="num">Captação</th><th class="num">Crédito</th><th class="num">Cobertura</th><th class="num">Inad.</th><th class="num">Cooperados</th><th class="num">Sinais</th><th class="num">FCAs</th><th>Estado</th></tr></thead>
        <tbody>
          ${AGENCIAS.map(a=>`<tr>
            <td class="ag-n">${a.n}</td>
            <td class="ag-r">${a.r}</td>
            <td class="num">${nf(a.cap,1)}</td>
            <td class="num">${nf(a.cre,1)}</td>
            <td class="num" style="font-weight:600;color:${a.cob<1.05?cobC(a.cob):'inherit'}">${nf(a.cob,2)}</td>
            <td class="num" style="color:${a.inad>3?'var(--red)':a.inad>2.7?'var(--amber)':'inherit'}">${nf(a.inad,2)}%</td>
            <td class="num">${a.coop.toLocaleString('pt-BR')}</td>
            <td class="num">${a.npi?a.npi:'<span class="ex-mut">—</span>'}</td>
            <td class="num">${porAg[a.id]?porAg[a.id]:'<span class="ex-mut">—</span>'}</td>
            <td><span class="tag ${STTG[a.st]}">${STLB[a.st]}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>

  ${stepnav(prevBtn('resultado'),`<button class="btn" type="button" onclick="go('regras')">Regras e critérios →</button>`)}`;
};

/* ======================= REGRAS E CRITÉRIOS ======================= */
const ex_ST = {
  lim:[
    {n:'Cobertura captação/crédito',          o:'abaixo de', v:'1,05'},
    {n:'Inadimplência >90d',                  o:'acima de',  v:'3,00%'},
    {n:'Queda de captação em 90 dias',        o:'maior que', v:'5,0%'},
    {n:'Concentração top-10 PJ',              o:'acima de',  v:'25,0%'},
    {n:'Desvio estatístico da própria série', o:'acima de',  v:'2,0σ'},
    {n:'Margem de contribuição vs. orçado',   o:'abaixo de', v:'−5,0%'}
  ],
  comport:[
    {k:'atuacao',   n:'Sugerir o que fazer com cada sinal',     d:'o copiloto sugere preparar conversa ou acompanhar o FCA em aberto; quem decide é você', on:true},
    {k:'agencia',   n:'Alertar a agência junto com o regional', d:'o gerente da unidade recebe o mesmo sinal antes da conversa', on:false},
    {k:'reabrir',   n:'Reabrir sinal se a ação atrasar',        d:'o sinal volta ao radar 7 dias depois de uma ação vencida', on:true},
    {k:'audio',     n:'Descartar áudio após transcrição',       d:'o áudio é apagado em 30 dias; a transcrição permanece', on:true},
    {k:'evidencia', n:'Exigir evidência para concluir ação',    d:'não permite marcar como concluída sem anexo ou registro', on:true}
  ],
  crit:[
    ['Vínculo com indicador em desvio','o tema está ligado a um indicador fora do padrão'],
    ['Valor ou risco acima do limiar','impacto financeiro estimado acima de R$ 500 mil'],
    ['Responsável nomeado na conversa','alguém assumiu explicitamente'],
    ['Prazo definido','há uma data, ainda que aproximada'],
    ['Depende de terceiros ou escalada','exige decisão fora da agência']
  ],
  min:3,
  conv:{2:71,3:37,4:18,5:6},
  propostas:[],
  log:[
    {q:'14/05 · 09:12 · M. Brião',     tx:'Limiar de cobertura ajustado de 1,00 para <b>1,05</b>'},
    {q:'06/05 · 16:40 · Núcleo Dados', tx:'Limiar de concentração top-10 PJ ajustado de 30,0% para <b>25,0%</b>'},
    {q:'28/04 · 11:03 · L. Fontoura',  tx:'Descarte de áudio reduzido de 90 para <b>30 dias</b>'}
  ]
};
const ex_AGORA = 'agora · M. Brião';
function ex_regra(k){const r=ex_ST.comport.find(c=>c.k===k);return r?!!r.on:false;}
function ex_log(tx){ex_ST.log.unshift({q:ex_AGORA,tx,novo:true});}
function ex_setLim(i,v){
  const l=ex_ST.lim[i],nv=String(v||'').trim();
  if(!l||!nv||nv===l.v)return;
  ex_log(`${esc(l.n)}: limiar de ${esc(l.v)} para <b>${esc(nv)}</b>`);l.v=nv;
  redraw();toast('Limiar alterado e registrado no log','⚙');
}
function ex_tg(k){
  const r=ex_ST.comport.find(c=>c.k===k);if(!r)return;
  r.on=!r.on;ex_log(`${esc(r.n)}: <b>${r.on?'ligado':'desligado'}</b>`);
  redraw();toast('Configuração alterada e registrada no log','⚙');
}
function ex_min(v){
  v=+v;if(v===ex_ST.min)return;
  ex_log(`Critérios mínimos para propor FCA: de ${ex_ST.min} para <b>${v} de 5</b>`);ex_ST.min=v;
  redraw();toast('Critério alterado e registrado no log','⚙');
}
function ex_proporRegra(tx,de){ex_ST.propostas.push({id:uid('rp'),tx,de});}
function ex_aprovar(id){
  const p=ex_ST.propostas.find(x=>x.id===id);if(!p)return;
  ex_ST.propostas=ex_ST.propostas.filter(x=>x.id!==id);
  ex_ST.comport.push({k:id,n:'Alerta preventivo · carteira PJ sem titular',d:p.tx,on:true,novo:true});
  ex_log(`Regra proposta pelo copiloto aprovada: <b>${esc(p.tx)}</b>`);
  redraw();toast('Regra aprovada e ativada','✓');
}
function ex_descartar(id){
  ex_ST.propostas=ex_ST.propostas.filter(x=>x.id!==id);
  ex_log('Regra proposta pelo copiloto <b>descartada</b>');
  redraw();toast('Regra descartada','✕');
}

RENDER.regras=()=>{
  const pi=Math.round(SCORE_REGRA.pesoImp*100),pu=Math.round(SCORE_REGRA.pesoUrg*100),cv=ex_ST.conv[ex_ST.min];
  return `
  <div class="ph">
    <div class="ph-t">
      <div class="ph-k"><span>Configuração da regional</span><span>toda mudança fica no log</span></div>
      <h2>O copiloto segue as regras da Unicred</h2>
      <div class="ph-s">Limiares de alerta e critério de FCA configuráveis aqui. Pesos de cálculo definidos com a Unicred.</div>
    </div>
    <div class="ph-a">${INFO({oque:'O copiloto não decide sozinho o que é desvio nem o que é material.',obs:'É isso que separa uma camada inteligente de uma caixa-preta.'})}</div>
  </div>

  ${ex_ST.propostas.length?`<div class="card ex-prop">
    <div class="card-h"><h3>Regras propostas pelo copiloto</h3>${IA_TAG}<span class="sub">aguardando aprovação</span><div style="flex:1"></div>
      ${INFO('Regras sugeridas a partir de casos encerrados. Só passam a valer depois de aprovadas por uma pessoa.')}</div>
    <div class="card-b" style="padding:4px 16px 8px">
      ${ex_ST.propostas.map(p=>`<div class="cf-r"><div class="bd"><b>${esc(p.tx)}</b><span>origem: ${esc(p.de)}</span></div>
        <button class="btn btn-s" type="button" onclick="ex_descartar('${p.id}')">Descartar</button><button class="btn btn-p btn-s" type="button" onclick="ex_aprovar('${p.id}')">Aprovar</button></div>`).join('')}
    </div>
  </div>`:''}

  <div class="grid g2" style="align-items:start">
    <div>
      <div class="card">
        <div class="card-h"><h3>Limiares de alerta</h3><span class="sub">quando um número vira sinal</span><div style="flex:1"></div>
          ${INFO({oque:'Regra matemática que transforma um indicador em sinal no radar.',como:'Edite o valor e saia do campo: a mudança vale para a próxima varredura e fica no log.'})}</div>
        <div class="card-b" style="padding:4px 16px 14px">
          ${ex_ST.lim.map((l,i)=>`
            <div class="cf-r">
              <div class="bd"><b>${l.n}</b><span>dispara sinal quando ${l.o} o valor</span></div>
              <input class="num-in" value="${esc(l.v)}" aria-label="Limiar: ${esc(l.n)}" onchange="ex_setLim(${i},this.value)" onkeydown="if(event.key==='Enter')this.blur()">
            </div>`).join('')}
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="card-h"><h3>Comportamento do copiloto</h3><div style="flex:1"></div>
          ${INFO('Ligue ou desligue comportamentos. Cada mudança fica registrada no log.')}</div>
        <div class="card-b" style="padding:4px 16px 14px">
          ${ex_ST.comport.map(c=>`
            <div class="cf-r">
              <div class="bd"><b>${esc(c.n)}${c.novo?' <span class="tag t-tl">nova</span>':''}</b><span>${esc(c.d)}</span></div>
              <button class="sw-t ${c.on?'on':''}" type="button" role="switch" aria-checked="${c.on}" aria-label="${esc(c.n)}" onclick="ex_tg('${c.k}')"></button>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-h"><h3>Como o score do radar é calculado</h3><div style="flex:1"></div>${VALIDAR('Pesos a validar')}
          ${INFO({oque:'Ordem da fila do radar. O score vai de 0 a 100.',obs:'Pesos definidos com a Unicred e mantidos no back-end; não são editáveis nesta tela.'})}</div>
        <div class="card-b">
          <div class="ex-fx"><span>Score</span><i>=</i><b>${pi}%</b><span>impacto</span><i>+</i><b>${pu}%</b><span>urgência</span></div>
          <div class="ex-sc">
            <div class="ex-sc-i"><div class="ex-sc-h"><b>Impacto</b><span class="mono">${pi}%</span></div><p>${SCORE_REGRA.imp}</p></div>
            <div class="ex-sc-i"><div class="ex-sc-h"><b>Urgência</b><span class="mono">${pu}%</span></div><p>${SCORE_REGRA.urg}</p></div>
          </div>
          <div class="ex-ro">${ICON.lock}<span>Somente leitura · pesos definidos com a Unicred e mantidos no back-end</span></div>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="card-h"><h3>Critério de materialidade do FCA</h3><div style="flex:1"></div>${VALIDAR('Critérios a validar')}
          ${INFO({oque:'O que separa um compromisso que vira FCA de uma anotação na memória da unidade.',como:'Um compromisso é proposto como FCA quando atinge o número mínimo de critérios abaixo.',obs:'Pesos definidos com a Unicred e mantidos no back-end.'})}</div>
        <div class="card-b" style="padding:6px 16px 14px">
          ${ex_ST.crit.map(([n,d],i)=>`
            <div class="ex-cr"><span class="ex-cr-n mono">${i+1}</span><div><b>${n}</b><span>${d}</span></div></div>`).join('')}
          <div class="ex-ro" style="margin-top:4px">${ICON.lock}<span>Pesos definidos com a Unicred e mantidos no back-end</span></div>
          <div class="ex-min">
            <div class="bd"><b>Critérios mínimos para propor FCA</b><span>quanto maior, mais conservador o copiloto</span></div>
            ${seg([['2','2'],['3','3'],['4','4'],['5','5']],String(ex_ST.min),'ex_min')}
            <span class="ex-de">de 5</span>
          </div>
          <div class="ex-cv ${ex_ST.min<3?'wn':''}">Com ${ex_ST.min} de 5, cerca de <b>${cv}%</b> dos compromissos viram FCA.${ex_ST.min<3?' É o cenário que a Unicred quer evitar: FCA para toda conversa.':ex_ST.min===3?' Configuração atual da PoC.':' Mais seletivo: alguns compromissos relevantes podem ficar só como registro.'}</div>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="card-h"><h3>Log de alterações</h3><span class="sub">${ex_ST.log.length} registros</span><div style="flex:1"></div>
          ${INFO('Autor, data e valor anterior de cada mudança de configuração.')}</div>
        <div class="card-b ex-scr" style="max-height:280px">
          <div class="tl">
            ${ex_ST.log.map(l=>`<div class="tl-i ${l.novo?'t':'g'}"><div class="dt">${l.q}</div><div class="tx">${l.tx}</div></div>`).join('')}
          </div>
        </div>
      </div>
    </div>
  </div>

  ${stepnav(prevBtn('lideranca'),`<button class="btn" type="button" onclick="go('arquitetura')">Arquitetura e segurança →</button>`)}`;
};

/* ======================= ARQUITETURA ======================= */
RENDER.arquitetura=()=>`
  <div class="ph">
    <div class="ph-t">
      <div class="ph-k"><span>Desenho proposto</span><span>PoC e evolução</span></div>
      <h2>Arquitetura e segurança</h2>
      <div class="ph-s">A PoC não exige integração definitiva e não substitui nada do que a Unicred já tem.</div>
    </div>
    <div class="ph-a">${INFO({oque:'Começar por carga controlada, evoluir para leitura direta das bases e devolver a execução ao painel que a liderança já usa.'})}</div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Arquitetura de referência</h3><span class="sub">o que já existe, o que a PoC constrói, para onde evolui</span><div style="flex:1"></div>

<script>
/* ---- 95_rail.js ---- */
/* ======================= MENU LATERAL: BOLINHA E TRILHO ======================= */
const NAV_KEY='unicred-copiloto-trilho';
const NAV_MQ=window.matchMedia('(max-width:860px)');
function setRail(on,save){
  const app=$('#app'), b=$('#navTg'), t=on?'Expandir menu lateral':'Recolher menu lateral';
  app.classList.toggle('collapsed',on);
  b.setAttribute('aria-expanded',String(!on)); b.setAttribute('aria-label',t); b.title=t+' (Ctrl/⌘ K)';
  navTip(null);
  if(save){try{localStorage.setItem(NAV_KEY,on?'1':'0');}catch(e){}}
}
function toggleNav(){ setRail(!$('#app').classList.contains('collapsed'),true); }
$('#navTg').addEventListener('click',toggleNav);
document.addEventListener('keydown',e=>{
  if(!((e.metaKey||e.ctrlKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='k')) return;
  if(e.ctrlKey&&!e.metaKey&&e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]')) return;  /* Ctrl+K nativo do campo */
  e.preventDefault();
  if(e.repeat||$('#ov').classList.contains('open')) return;
  toggleNav();
});
NAV_MQ.addEventListener('change',e=>{
  let salvo=null; try{salvo=localStorage.getItem(NAV_KEY);}catch(err){}
  setRail(e.matches||salvo==='1',false);
});
/* tooltip do trilho: um só elemento fixo, para não ser cortado pela rolagem da barra */
const _tip=document.createElement('div'); _tip.className='nav-tip'; _tip.setAttribute('role','tooltip');
document.body.appendChild(_tip);
function navTip(btn){
  if(!btn||!$('#app').classList.contains('collapsed')){_tip.classList.remove('show');return;}
  const r=btn.getBoundingClientRect(), et=btn.dataset.et;
  const rail=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail'))||68;  /* largura final, mesmo durante a animação */
  _tip.innerHTML=(et?`<b>${et}</b>`:'')+btn.dataset.label;
  _tip.style.top=(r.top+r.height/2)+'px'; _tip.style.left=(rail+12)+'px';
  _tip.classList.add('show');
}
const _nav=document.querySelector('.nav');
_nav.addEventListener('mouseover',e=>navTip(e.target.closest('.nav-i')));
_nav.addEventListener('mouseleave',()=>navTip(null));
_nav.addEventListener('focusin',e=>navTip(e.target.closest('.nav-i')));
_nav.addEventListener('focusout',()=>navTip(null));
_nav.addEventListener('click',()=>navTip(null));
$('.nav-scroll').addEventListener('scroll',()=>navTip(null));
(function(){
  let salvo=null; try{salvo=localStorage.getItem(NAV_KEY);}catch(e){}
  const app=$('#app'); app.classList.add('no-anim');
  setRail(NAV_MQ.matches||salvo==='1',false);
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.classList.remove('no-anim')));
})();

</script>
