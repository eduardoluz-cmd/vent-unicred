.rx-dx>.rx-dxc:only-child{grid-column:1/-1}
.rx-dxc{background:var(--surf);border:1px solid var(--line2);border-radius:8px;padding:8px 10px 6px}
.rx-ct{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-bottom:2px}
@media(max-width:1100px){.rx-dx{grid-template-columns:1fr}.dre-grp{grid-template-columns:minmax(150px,1fr) 90px 90px 22px}.dre-grp span:nth-child(n+4){display:none}}

/* aderência por trimestre */
.rx-tw{overflow-x:auto}
.rx-ad{width:100%;border-collapse:collapse;font-size:12.5px}
.rx-ad th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.rx-ad th:first-child,.rx-ad td:first-child{text-align:left;font-weight:600;color:var(--ink)}
.rx-ad td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--line2)}
.rx-ad tr.sep td{border-top:6px solid var(--surf)}
.rx-ad th:last-child,.rx-ad td:last-child{border-left:2px dashed var(--line)}
.ad{display:inline-block;min-width:58px;padding:3px 8px;border-radius:5px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
.ad-r{background:#F3C6C1;color:#7E2219}.ad-y{background:#F6E3A1;color:#6B5310}.ad-g{background:#BFE5CF;color:#11603D}.ad-b{background:#C9D8F2;color:#173E83}.ad-g2{background:#D6EFE2;color:#11603D}
.ad-sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ad-sw.ad-r{background:#E9A49C}.ad-sw.ad-y{background:#E9CD6E}.ad-sw.ad-g{background:#8FD3AE}.ad-sw.ad-b{background:#9DB7E6}

/* indicadores (CORE) */
.rx-ig+.rx-ig{margin-top:12px}
.rx-igl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-bottom:6px}
.rx-ii{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.rx-it{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:9px 11px 6px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.rx-it:hover{border-color:var(--green2);box-shadow:var(--sh2)}
.rx-itn{font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column}
.rx-itn small{font-size:10px;color:var(--ink3);font-weight:500}
.rx-it>b{font-family:var(--f-head);font-size:17px}
.rx-itd{font-size:11px;font-weight:600;color:var(--ink3)}
.rx-itd.up{color:var(--green-ink)}.rx-itd.dn{color:var(--red)}
.rx-itd i{font-style:normal;font-weight:500;color:var(--ink3)}
.rx-its svg{width:100%}

/* crédito e captação × planejado, carteira */
.rx-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.rx-g2b{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
@media(max-width:1100px){.rx-g2,.rx-g2b{grid-template-columns:1fr}}
.rx-ct2{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.rx-ct2 th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.rx-ct2 th:first-child,.rx-ct2 td:first-child{text-align:left}
.rx-ct2 td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
.rx-ct2 .dn{color:var(--red)}.rx-ct2 .up{color:var(--green-ink)}
.rx-risk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink2);background:var(--surf2);border-radius:8px;padding:8px 10px}
.rx-risk.on{background:var(--redlt);color:#7E2219}
.rx-risk svg{flex:0 0 auto;margin-top:2px}

/* metas comerciais */
.rx-mh{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.rx-sem{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
.rx-sem div{display:flex;flex-direction:column}
.rx-sem b{font-size:12.5px}.rx-sem small{font-size:11px;color:var(--ink3)}
.rx-sd{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.rx-sd.r{background:#D9534F}.rx-sd.y{background:#E2B63E}.rx-sd.g{background:#3AA57A}
.rx-fc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:6px 10px;border-radius:8px}
.rx-fc b{font-family:var(--f-head);font-size:18px}.rx-fc span{font-size:10.5px;font-weight:600}
.rx-fc.fx-neg{background:#F3C6C1;color:#7E2219}.rx-fc.fx-low{background:#F6D2B4;color:#7A3D0C}.rx-fc.fx-mid{background:#F6E7A8;color:#6B5310}.rx-fc.fx-hi{background:#BFE5CF;color:#11603D}
.rx-mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.rx-m{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.rx-mn{font-size:12px;font-weight:700;color:var(--navy)}
.rx-mgv{display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:end}
.rx-mgv .xg{grid-row:1/3;width:84px;height:46px}
.rx-mgv b{font-family:var(--f-head);font-size:15px}
.rx-mgv small{font-size:10.5px;color:var(--ink3)}
.rx-mr .fx{font-size:11px}
.rx-mq{display:flex;gap:3px}
.rx-mq span{flex:1;text-align:center;font-size:9.5px;font-weight:700;border-radius:3px;padding:2px 0}
.rx-mq .fx-neg{background:#F3C6C1;color:#7E2219}.rx-mq .fx-low{background:#F6D2B4;color:#7A3D0C}.rx-mq .fx-mid{background:#F6E7A8;color:#6B5310}.rx-mq .fx-hi{background:#BFE5CF;color:#11603D}

/* oportunidades */
.rx-op{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 240px;gap:16px;align-items:start}
@media(max-width:1100px){.rx-op{grid-template-columns:1fr}}
.rx-opl{display:flex;flex-direction:column;gap:6px}
.rx-opt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--ink3);padding-bottom:4px;border-bottom:1px solid var(--line2)}
.rx-opt b{font-size:15px;letter-spacing:0;text-transform:none}
.rx-opi{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surf2);border:1px solid var(--line2);border-radius:7px;padding:7px 10px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left}
.rx-opi:hover{border-color:var(--green2)}
.rx-op .up{color:var(--green-ink)}
.rx-opb{background:var(--greenlt);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rx-opb p{font-size:12.5px;color:var(--ink2)}

.xc{position:relative}
.xc-lg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:11px;color:var(--ink2)}

.xc-lg button:hover{background:var(--surf2)}

.fp-auto{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--ialt);color:var(--ia);border:1px solid #CBD6EC}

.fp-dwd div{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink2)}

.fp-g2{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);align-items:start}
@media(max-width:1100px){.fp-rx{grid-template-columns:1fr}}

.fp-g2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:14px;align-items:start}

   v13 · período de/até no Raio X, DRE sem gráfico nas linhas e
   "Dados da agência" como bloco abaixo da pré-pauta e do registro
   ========================================================================= */
/* período */
.rx-sel select{min-width:86px}
.rx-pre{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font:600 11.5px var(--f-body);color:var(--ink2);cursor:pointer}
.rx-pre:hover{border-color:var(--green2);color:var(--green-ink)}
.rx-pre.on{background:var(--greenlt);border-color:#BFE0D6;color:var(--green-ink)}

/* DRE: linha sem cruzamento (não abre) */
.dre-r0{display:grid;grid-template-columns:minmax(200px,1.6fr) 104px 104px 104px 70px minmax(120px,1fr) 22px;gap:10px;align-items:center;padding:9px 16px;font-size:13px;border-bottom:1px solid var(--line2)}
.dre-r0 .dre-n{padding-left:12px;color:var(--ink2)}
.dre-r0.neg .dre-n{font-weight:600;color:var(--ink)}
.dre .dre-x .rx-ct{margin-top:6px}
@media(max-width:900px){.dre-r0{grid-template-columns:minmax(150px,1fr) 90px 90px 22px}.dre-r0 .dre-g,.dre-r0 .dre-p,.dre-r0 .dre-b{display:none}}

/* dados da agência na conversa */
.dp-card{margin-top:14px}
.dp-card .acc{border:0;margin:0;box-shadow:none}
.dp-card .acc-h{padding:12px 16px;display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.dp-t{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-head);font-size:14px;color:var(--navy)}
.dp-t svg{color:var(--green2)}
.dp-s{font-size:12px;color:var(--ink3);flex:1}
.dp-b{padding:2px 16px 14px}
.dp-fr{font-size:13px;line-height:1.5;color:var(--ink);border-left:3px solid var(--gold);padding-left:10px;margin-bottom:12px}
.dp-g3{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:1100px){.dp-g3{grid-template-columns:1fr}}
.dp-sec{min-width:0}
.dp-lb{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.dp-g{display:grid;grid-template-columns:minmax(0,1fr) 60px 84px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.dp-g b{text-align:right}
.dp-g.dp-tt{font-weight:700;border-top:1px dashed var(--line2);margin-top:3px;padding-top:6px}
.dp-g .dn,.dp-i .dn{color:var(--red)}.dp-g .up,.dp-i .up{color:var(--green-ink)}
.dp-i{display:grid;grid-template-columns:minmax(0,1fr) auto 90px;gap:8px;align-items:baseline;font-size:12.5px;padding:3px 0}
.dp-i small{font-size:11px;color:var(--ink3);text-align:right}
.dp-m{display:flex;flex-wrap:wrap;gap:4px}
.dp-m .fx{font-size:11px}
.dp-lk{margin-top:10px;font-size:12px;font-weight:600;color:var(--ia);background:none;border:0;cursor:pointer;padding:0}
.dp-card .acc.flat>.acc-h{padding:12px 16px}
.dp-i{grid-template-columns:minmax(0,1fr) auto 112px}

/* =========================================================================
   v14 · cruzamento do DRE alinhado às colunas Orçado · Realizado · Variação
   ========================================================================= */
.dre .acc>.acc-b:has(.dre-xg){padding:0}
.dre-x.dre-xg{padding:6px 0 12px}
.dre-xg>p,.dre-xg>.rx-ct{padding:0 16px 0 28px}
.dre-xr{display:grid;grid-template-columns:minmax(200px,1.6fr) 104px 104px 104px 70px minmax(120px,1fr) 22px;gap:10px;align-items:center;padding:5px 16px;font-size:12.5px;border-top:1px solid var(--line2)}
.dre-xr .dre-n{padding-left:28px;color:var(--ink2)}
.dre-xr .dre-v,.dre-xr .dre-g{white-space:normal;line-height:1.3}
.dre-xr .dre-g.dn{color:var(--red)}.dre-xr .dre-g.up{color:var(--green-ink)}
@media(max-width:900px){.dre-xr{grid-template-columns:minmax(150px,1fr) 90px 90px 22px}.dre-xr .dre-g,.dre-xr span:nth-child(n+5){display:none}}
</style>

/* -------------------------------------------------------------------------
   Geradores para agências sem dados detalhados na demonstração
   (o fluxo começa de qualquer sinal; Pelotas Lobo é o caso completo)
   ------------------------------------------------------------------------- */
function _seed(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return h;}
/* série de 12 meses que termina em `fim`, variando `var` (fração) ao longo do ano */
function serieSint(fim, varFrac, key){
  const s=_seed(key), out=[];
  for(let i=0;i<12;i++){
    const t=i/11, base=fim*(1-varFrac*(1-t));
    const ruido=Math.sin((s+i*7)*0.9)*Math.abs(fim)*0.006;
    out.push(+(base+ruido).toFixed(fim<10?2:1));
  }
  out[11]=fim; return out;
}

      t:[['Consórcio','R$ 302 mil','R$ 343 mil','−12%',-1],['Adquirência (Unicred Pay)','R$ 188 mil','R$ 210 mil','−10%',-1],['Seguros','R$ 611 mil','R$ 602 mil','+1%',1],['Cartões','R$ 905 mil','R$ 899 mil','+1%',1],['Cobrança e tarifas','R$ 806 mil','R$ 806 mil','0%',0]]},
    captacao:{l:'O volume menor reduziu a despesa, mas o custo médio subiu: os RDCs que saíram eram dos mais baratos.',
      t:[['Volume · captação total','R$ 212,4 mi','R$ 232,0 mi orçado','−8,4%',-1],['Custo médio da captação','99,1% do CDI','98,5% planejado','+0,6 p.p.',-1]]},
    pdd:{l:'Provisão um pouco acima do orçado. A faixa de 15 a 90 dias subiu e merece atenção na próxima MRR.',
      t:[['Atraso até 15 dias','0,41%','0,38% no mês anterior','+0,03 p.p.',0],['Atraso de 15 a 90 dias','1,32%','1,18% no mês anterior','+0,14 p.p.',-1],['Atraso acima de 90 dias','2,61%','teto 3,00%','dentro do teto',0]]},
    adm:{l:'Despesa perto do orçado. Não é aqui que está o problema.',
      t:[['Pessoal (folha)','R$ 3.348 mil','R$ 3.326 mil','+0,7%',0],['Outras despesas administrativas','R$ 1.863 mil','R$ 1.794 mil','+3,8%',-1]]}
  },
  icm:{credito:112,coop:64,dap:58,ziin:83,cobranca:91,consorcio:47,pay:66,visa:72,vida:88,seguros:54,risco:61,prev:39}
};
/* desvios típicos por situação (fração do orçado) e ajustes por agência, para as agências sem caso escrito */
const DRE_DESV = {
  critico:{credito:.004,centr:-.10,ps:-.03,captacao:.01,pdd:.08,adm:.02},
  atencao:{credito:-.02,centr:-.04,ps:-.02,captacao:.01,pdd:.03,adm:.015},
  oportunidade:{credito:.01,centr:.01,ps:-.05,captacao:0,pdd:-.01,adm:.005},
  ok:{credito:.02,centr:.02,ps:.03,captacao:-.01,pdd:-.03,adm:-.01}
};
const DRE_AJ = {
  CAM:{pdd:.38,credito:-.015}, CXS:{credito:-.06}, VAC:{centr:-.09}, BAG:{ps:-.09}, FAR:{ps:-.04,centr:-.02},
  CGR:{credito:-.03}, RGD:{ps:-.05}, JAG:{pdd:.25}
};
const DRE_FRASE = {
  CAM:'O problema é provisão. A PDD está acima do orçado por causa do custeio rural da safra 2025/26, e as rendas suspensas dessas operações também reduzem a receita de crédito.',
  CXS:'O problema é receita de crédito. O volume está no orçado, mas as renegociações de taxa em contratos PJ de grande porte puxaram o preço para baixo.',
  VAC:'O problema é receita. Mesmo padrão de Pelotas Lobo em estágio inicial: a captação não acompanha o crédito e a centralização financeira já está abaixo do orçado.',
  BAG:'O problema é receita de produtos e serviços. A base PF tem pouca penetração de seguros e a receita de P&S está abaixo do orçado.',
  FAR:'O problema é receita. Cooperados PJ com crédito mantêm a folha fora da Unicred, o que reduz P&S e centralização.',
  CGR:'O problema é receita de crédito. A carteira PJ não cresceu antes da alta temporada como nos anos anteriores.',
  RGD:'O problema é receita de produtos e serviços. Os cooperados PF novos seguem sem produto além da conta.',
  JAG:'O problema é provisão. A inadimplência PF está em alta pelo terceiro mês e a PDD já passou do orçado.'
};
const _rnd = (id,k,amp)=>Math.sin(_seed(id+k)*1.37)*amp;
function dreDe(agId){
  const a=AGENCIAS.find(x=>x.id===agId);
  if(agId==='PEL') return DRE_PEL;
  if(a._dre) return a._dre;
  const admC=9.7*(1+_rnd(agId,'admc',.07))+({critico:.5,atencao:.35,oportunidade:.1,ok:0}[a.st]), psC=6.63*(1+_rnd(agId,'psc',.09))*(agId==='BAG'?.8:1);
  const base={credito:a.cre*61.2, centr:a.cap*6.26, ps:(a.cap+a.cre)*psC, captacao:a.cap*39.1, pdd:a.cre*4.6, adm:(a.cap+a.cre)*admC};
  const dv=DRE_DESV[a.st], aj=DRE_AJ[agId]||{}, linhas={};
  Object.keys(base).forEach(k=>{
    /* agência com desvio conhecido: as outras linhas ficam perto do orçado, para o desvio principal aparecer */
    const tem=Object.keys(aj).length, o=Math.round(base[k]), d=aj[k]!=null?aj[k]+_rnd(agId,k,.006):(tem?dv[k]*.25+_rnd(agId,k,.004):dv[k]+_rnd(agId,k,.012));
    linhas[k]={o, r:Math.round(o*(1+d))};
  });
  const den=x=>linhas.credito[x]+linhas.centr[x]+linhas.ps[x]-linhas.captacao[x];
  const efic={o:+(linhas.adm.o/den('o')*100).toFixed(1), r:+(linhas.adm.r/den('r')*100).toFixed(1)};
  const cob={o:Math.round(linhas.ps.o/(linhas.adm.o*.72)*100), r:Math.round(linhas.ps.r/(linhas.adm.r*.72)*100)};
  const lv={critico:64,atencao:72,oportunidade:80,ok:94}[a.st], icm={};
  PRODUTOS.forEach((p,i)=>{let v=Math.round(lv+_rnd(agId,p.k,38));if((a.st==='critico'||a.st==='atencao')&&i%5===_seed(agId)%5)v=-Math.round(8+_seed(agId+p.k)%30);icm[p.k]=v;});
  a._dre={linhas,efic,cob,icm,frase:DRE_FRASE[agId]||null,x:null};
  return a._dre;
}
/* gap de cada linha no resultado (positivo = ajuda o resultado) */
function dreGap(l,lin){return l.s*(lin.r-lin.o);}
function dreRes(d,x){return DRE_LINHAS.reduce((s,l)=>s+l.s*d.linhas[l.k][x],0);}
function icmDe(d){const v=PRODUTOS.map(p=>Math.max(-200,Math.min(p.teto,d.icm[p.k])));return +(v.reduce((s,x)=>s+x,0)/v.length).toFixed(1);}
/* resumo usado no radar e no cabeçalho da agência */
function resumoAg(agId){
  const d=dreDe(agId), o=dreRes(d,'o'), r=dreRes(d,'r');
  const gaps=DRE_LINHAS.map(l=>({...l,g:dreGap(l,d.linhas[l.k]),o:d.linhas[l.k].o})).sort((x,y)=>x.g-y.g);
  return {d, resO:o, resR:r, resPct:o?Math.round(r/o*100):null, resGap:r-o, icm:icmDe(d), efic:d.efic.r, cob:d.cob.r, pior:gaps[0], gaps};
}
const kBRL = v=>{const a=Math.abs(v), s=v<0?'−':'';return a>=1000?`${s}R$ ${nf(a/1000,a>=10000?1:2)} mi`:`${s}R$ ${nf(a,0)} mil`;};
const kSig = v=>(v>0?'+':v<0?'−':'')+kBRL(Math.abs(v)).replace(/^−/,'');

/* conversas anteriores por agência (as que geraram FCA vêm do histórico) */
const CONV_HIST = {
  PEL:[
    {d:'11/04/2026', tema:'Crédito rural e safra', saida:'Ficou como registro, sem FCA', dur:'34 min', resumo:'Conversa de rotina sobre a safra e a carteira rural. A captação não entrou na pauta.'},

    {d:'18/11/2025', tema:'Produtos por cooperado', saida:'FCA-2025-0233 · ficou como registro', dur:'28 min', resumo:'Produtos por cooperado abaixo da meta. Decidiu-se não abrir frente de ação; o tema voltou em 2026.'}
  ]
};
function convHist(agId){
  if(CONV_HIST[agId]) return CONV_HIST[agId];

}

/* sinal → FCA já aberto no mesmo tema (aviso para não duplicar) */
const FCA_DO_SINAL = {'SIG-2839':'FCA-2026-0143','SIG-2834':'FCA-2026-0122','SIG-2830':'FCA-2026-0118','SIG-2825':'FCA-2026-0131','SIG-2822':'FCA-2026-0109','SIG-2828':'FCA-2026-0104','SIG-2819':'FCA-2026-0127'};

/* FCA no formato que a Unicred usa: fatos numerados por tema, cada um com causas; cada causa com ações,
   impacto, o que melhora e status (Novo, Em curso, Intensificar). As ações seguem em FCA.acoes (c = causa). */

FCA.gaps = [
  {v:'−R$ 288 mil', l:'Resultado líquido × orçado (jan–abr)'},

  {v:'−R$ 6,7 mi', l:'Caixa da agência (captação − crédito)'},
  {v:'+6,4% × −8,1%', l:'Crédito × captação em 90 dias'}
];
FCA.fatos = [
  {id:'f1', tema:'Centralização financeira',
   fato:'Centralização financeira R$ 186 mil abaixo do orçado no acumulado jan–abr (−14%). A captação caiu R$ 4,2 mi em 90 dias, 74% em três cooperados PJ, enquanto o crédito cresceu 6,4%: o caixa da agência ficou em −R$ 6,7 mi e a agência perdeu participação na liquidez da cooperativa.',
   causas:[
     {id:'c1', causa:'Vencimentos de RDC da carteira PJ sem acompanhamento desde o afastamento do gerente de relacionamento em 04/03. A carteira foi dividida entre dois gerentes já 38% acima da média de cooperados e ninguém assumiu o calendário.',
      impacto:'R$ 2,81 mi em RDC vencendo em 60 dias. Renovar 75% recupera cerca de R$ 60 mil de centralização no trimestre.',
      melhora:'Zero vencimento de RDC sem tratativa e R$ 4,2 mi de captação recuperados até 31/07.', st:'novo'},
     {id:'c2', causa:'Carteira PJ sem gerente titular: a reposição só seria avaliada pelo RH em junho.',
      impacto:'Estrutural: sem gerente PJ, os vencimentos voltam a ficar sem dono.',

   ]},
  {id:'f2', tema:'Crédito × funding',
   fato:'Carteira de crédito +6,4% em 90 dias, acima do orçado, enquanto a captação caiu 8,1%: o crédito já supera a captação em R$ 6,7 mi. Há duas operações grandes de investimento previstas para junho.',
   causas:[
     {id:'c3', causa:'Originação de crédito sem olhar o funding da agência: as duas operações de junho somam R$ 9,6 mi sem captação correspondente.',
      impacto:'Evita aumentar o gap de funding em R$ 4,8 mi no trimestre.',

];
['c1','c1','c1','c2','c3'].forEach((c,i)=>{if(FCA.acoes[i])FCA.acoes[i].c=c;});

<script>

const nf  = (v,d=0)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});

};

/* ---------- toast, modal, drawer ---------- */

function selCtl(opts,cur,fn,label,cls=''){return `<label class="sel ${cls}">${label?`<span>${label}</span>`:''}<select onchange="${fn}(this.value)">${opts.map(([v,l])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${l}</option>`).join('')}</select></label>`;}

function edIn(val,oninput,o={}){return `<input class="ed-in ${o.cls||''}" value="${esc(val)}" placeholder="${esc(o.ph||'')}" oninput="${oninput}" ${o.attr||''}>`;}
function edTa(val,oninput,o={}){return `<textarea class="ed-ta ${o.cls||''}" rows="${o.rows||2}" placeholder="${esc(o.ph||'')}" oninput="autoGrow(this);${oninput}" ${o.attr||''}>${esc(val)}</textarea>`;}
function autoGrow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function growAll(){$$('#view .ed-ta').forEach(t=>{if(t.offsetParent!==null)autoGrow(t);});}
if(window.ResizeObserver){let _gw=0,_gt=null;new ResizeObserver(es=>{const w=Math.round(es[0].contentRect.width);if(w===_gw)return;_gw=w;clearTimeout(_gt);_gt=setTimeout(growAll,60);}).observe(document.getElementById('view'));}

/* ---------- recolher/expandir (drill down) com estado preservado entre renders ---------- */
const ACC={};
function accToggle(id){
  ACC[id]=!ACC[id];const el=document.getElementById(id);
  if(el){el.classList.toggle('open',!!ACC[id]);const h=el.querySelector('.acc-h');if(h)h.setAttribute('aria-expanded',String(!!ACC[id]));
    if(ACC[id]) el.querySelectorAll('.ed-ta').forEach(autoGrow);}
}
/* acc(id, cabeçalho, corpo, {open, cls}) · o cabeçalho é um botão: não coloque botões dentro dele */
function acc(id,head,body,o={}){
  if(ACC[id]===undefined)ACC[id]=!!o.open;
  return `<div class="acc ${ACC[id]?'open':''} ${o.cls||''}" id="${id}"><button class="acc-h" type="button" aria-expanded="${!!ACC[id]}" onclick="accToggle('${id}')">${head}<span class="chev">${ICON.chev}</span></button><div class="acc-b">${body}</div></div>`;
}
function emptyState(ic,t,d,btns=''){return `<div class="emp"><div class="emp-ic">${ic}</div><b>${t}</b><p>${d}</p>${btns?`<div class="emp-b">${btns}</div>`:''}</div>`;}

/* bandeirinha: pergunta que já apareceu em FCA (outra agência ou a mesma) */
function flagChip(f){
  if(!f)return '';
  const lb=f.tipo==='mesma'?`Já perguntada nesta agência · ${f.fca} · ${f.quando}`:`Já perguntada · ${f.fca} · ${f.ag} · ${f.quando}`;
  return `<span class="flag ${f.tipo}" tabindex="0">${ICON.flag}<span>${lb}</span><span class="tip"><b>${f.tipo==='mesma'?'Reincidência nesta agência':'Pergunta parecida em outra agência'}</b>"${esc(f.original)}"<b>O que aconteceu</b>${esc(f.desfecho)}</span></span>`;
}
function flagDe(q){return q&&q.tx===q.orig?PERG_HIST[q.orig]||null:null;}

/* ---------- gráficos SVG ---------- */
const F_NUM='Roboto, Helvetica Neue, Arial, sans-serif';
function spark(d,w=88,h=26,col='#018B6A'){
  if(!d)return '';
  const mn=Math.min(...d),mx=Math.max(...d),rg=(mx-mn)||1;
  const pts=d.map((v,i)=>[i/(d.length-1)*w,h-2-((v-mn)/rg)*(h-4)]);
  return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
}
/* lineChart(séries, rótulos, {w,h,ref,refLb,dec,min,max,marks:[{i,t}]})
   marks = linhas verticais de marco (ex.: data do FCA), i pode ser fracionário */
function lineChart(series,labels,o={}){
  const W=o.w||660,H=o.h||210,PL=44,PR=14,PT=o.marks?22:14,PB=26,iw=W-PL-PR,ih=H-PT-PB;
  let all=[].concat(...series.map(s=>s.d)); if(o.ref!=null)all.push(o.ref);
  let mn=o.min!=null?o.min:Math.min(...all),mx=o.max!=null?o.max:Math.max(...all);
  const pad=(mx-mn)*0.14||Math.abs(mx)*0.05||1;mn-=pad;mx+=pad;
  const X=i=>PL+i/(labels.length-1)*iw, Y=v=>PT+ih-((v-mn)/(mx-mn))*ih, dec=o.dec!=null?o.dec:2;
  let g='';
  for(let i=0;i<=4;i++){const y=PT+ih*i/4,val=mx-(mx-mn)*i/4;
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#E8ECEF" stroke-width="1"/><text x="${PL-8}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#5C6A80" font-family="${F_NUM}">${nf(val,dec)}</text>`;}
  labels.forEach((l,i)=>{if(labels.length>8&&i%2)return;g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#5C6A80" font-family="${F_NUM}">${l}</text>`;});
  if(o.ref!=null){g+=`<line x1="${PL}" y1="${Y(o.ref)}" x2="${W-PR}" y2="${Y(o.ref)}" stroke="#A8322A" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="${W-PR-2}" y="${Y(o.ref)-5}" text-anchor="end" font-size="9.5" font-weight="600" fill="#A8322A" font-family="${F_NUM}">${o.refLb||'piso'} ${nf(o.ref,dec)}</text>`;}
  (o.marks||[]).forEach(m=>{const x=X(m.i);g+=`<line x1="${x}" y1="${PT-4}" x2="${x}" y2="${PT+ih}" stroke="#A79450" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="${x}" y="${PT-8}" text-anchor="${x>W-90?'end':x<90?'start':'middle'}" font-size="9.5" font-weight="700" fill="#76672B" font-family="${F_NUM}">${m.t}</text>`;});
  series.forEach(s=>{const pts=s.d.map((v,i)=>[X(i),Y(v)]),p=pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
    if(s.fill)g+=`<polygon points="${PL},${PT+ih} ${p} ${W-PR},${PT+ih}" fill="${s.c}" opacity=".08"/>`;
    g+=`<polyline points="${p}" fill="none" stroke="${s.c}" stroke-width="${s.wd||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    pts.forEach((q,i)=>{if(i===pts.length-1||!s.lastOnly)g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===pts.length-1?3.4:2.2}" fill="#fff" stroke="${s.c}" stroke-width="1.8"/>`;});});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">${g}</svg>`;
}
/* gráfico de 12 meses de um indicador (abre ao clicar no indicador) */
function indChart(ind,o={}){
  const ruim=ind.st==='ruim', cor=ruim?'#A8322A':ind.st==='atenc'?'#9A5D08':'#018B6A';
  const lb=ind.refLb||(ind.bom==='baixo'?'teto':/piso/.test(ind.d||'')?'piso':'meta');
  return lineChart([{d:ind.sp,c:cor,fill:true}],o.labels||MESES,{ref:ind.metaV,refLb:lb,dec:ind.dec,h:o.h||170,w:o.w||600,marks:o.marks});
}
function donut(pct,col,size=64,lb=''){
  const r=size/2-6,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E8ECEF" stroke-width="6"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c*pct/100).toFixed(1)} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+1}" text-anchor="middle" font-size="14" font-weight="700" font-family="Lato, Helvetica Neue, Arial, sans-serif" fill="#0B2050">${pct}${lb}</text></svg>`;
}

/* =========================================================================
   NAVEGAÇÃO v8 · organizada por agência
   Visão geral da rede → agência (Raio X · FCAs · Conversas). O ciclo do FCA acontece
   dentro da agência: a conversa tem os passos (pauta, registro, compromissos, FCA) e o
   FCA tem o acompanhamento e o resultado. As telas antigas continuam chamando
   go('pauta'), go('plano')…: navTo() leva cada uma ao lugar novo.
   ========================================================================= */
const VIEWS=[{id:'geral',n:'Visão geral'},{id:'agencia',n:'Agência'}];
const EXTRA=[];
const NAV_IC={
  geral:'<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'
};
const RENDER={}, AFTER={};
const CLOCK0='seg, 18 mai · 08:12';
const NAVBADGE={};
const AG_TABS=[['raiox','Raio X'],['conversas','Conversas'],['fcas','FCAs']];
const CONV_STEPS=[
  {id:'pauta',   n:'Pauta',        entra:'Raio X da agência e a sua leitura dos dados', sai:'blocos e perguntas da conversa'},
  {id:'registro',n:'Registro',     entra:'gravação, transcrição ou só as suas anotações', sai:'conversa transcrita, com as suas notas encaixadas'},
  {id:'revisao', n:'Compromissos', entra:'o que foi dito e combinado na conversa', sai:'o que vira FCA e o que fica como registro'},
  {id:'fca',     n:'FCA',          entra:'compromissos aprovados', sai:'FCA publicado para a agência acompanhar'}
];
/* rótulos das telas antigas nos botões de voltar e avançar */
const OLD_LB={radar:'Visão geral',geral:'Visão geral',radiografia:'Raio X',pauta:'Pauta',captura:'Registro da conversa',reuniao:'Compromissos',fca:'FCA',plano:'Acompanhamento',resultado:'Resultado'};
/* estado: agência aberta, aba, FCA aberto (e a aba dele), conversa aberta (e o passo) */
let NAV={ag:'PEL', tab:'raiox', fca:null, ftab:'fca', conv:false, step:'pauta', pre:false};
let ATUAL='geral', SUB=null;

/* telas antigas → lugar novo */
function navTo(id){
  const ag=CASO.ag, conv=st=>{NAV={...NAV,ag,tab:'conversas',conv:true,step:st,fca:null};if(st==='pauta')NAV.pre=false;return 'agencia';};
  switch(id){
    case 'radar': case 'lideranca': case 'regras': case 'arquitetura': return 'geral';
    case 'radiografia': NAV={...NAV,ag,tab:'raiox',conv:false,fca:null}; return 'agencia';
    case 'pauta': return conv('pauta');
    case 'captura': return conv('registro');
    case 'reuniao': return conv('revisao');
    case 'fca': return conv('fca');
    case 'plano': case 'resultado': {
      const w=ws('PEL'), id0=(w.fca&&w.fca.id)||FCA.id;
      if(CASO.ag!=='PEL') CASO={ag:'PEL',sig:'SIG-2841'};
      NAV={...NAV,ag:'PEL',tab:'fcas',conv:false,fca:id0,ftab:id==='plano'?'acomp':'res'}; return 'agencia';
    }
  }
  return id;
}
/* topo: caminho "Visão geral › agência" e o seletor de agência (ver 14_topo.js) */
function buildNav(){
  const c=$('#crumb');if(!c)return;
  const ag=ATUAL==='agencia'?AGX[NAV.ag]:null;
  c.innerHTML=ag
    ?`<button type="button" class="cr-lk" onclick="go('geral')"><span>← Visão geral</span></button><span class="cr-sep" aria-hidden="true">›</span>
      <button type="button" class="cr-ag" id="crAg" onclick="agp_abre(this)" aria-haspopup="listbox" title="Trocar de agência"><span class="ag-d ${ag.st}" aria-hidden="true"></span><b>${esc(ag.n)}</b>${icon('down',13)}</button>`
    :`<span class="cr-on">Visão geral</span><button type="button" class="cr-ag cr-ag0" id="crAg" onclick="agp_abre(this)" aria-haspopup="listbox"><span>Abrir agência</span>${icon('down',13)}</button>`;
}
function go(id,keepScroll){
  const sc=keepScroll?$('#view').scrollTop:0;
  closeDrawer();
  id=navTo(id);
  if(!RENDER[id]) id='geral';
  ATUAL=id; SUB=null;
  agp_fecha();
  buildNav(); renderCaseChip();
  const fx=id==='agencia'&&NAV.tab==='fcas'&&NAV.fca;
  $('#clock').textContent=fx?(NAV.ftab==='res'?'seg, 29 jun · 09:00':'qua, 27 mai · 09:00'):CLOCK0;
  const vw=$('#view');
  vw.innerHTML=`<div class="wrap">${RENDER[id]()}</div>`;
  vw.style.scrollBehavior='auto'; vw.scrollTop=sc; vw.style.scrollBehavior='';
  growAll();
  if(AFTER[id]) AFTER[id]();
}
function redraw(){go(ATUAL,true);}
function nextBtn(id,txt){return `<button class="btn btn-p" onclick="go('${id}')">${txt||OLD_LB[id]||id} →</button>`;}
function prevBtn(id){return `<button class="btn" onclick="go('${id}')">← ${OLD_LB[id]||id}</button>`;}
function stepnav(l,r){return `<div class="stepnav">${l||'<span></span>'}${r||''}</div>`;}

/* abrir uma agência (aba e, se quiser, o FCA ou a conversa) */
function abrirAgencia(ag,tab,o={}){
  if(CASO.ag!==ag){const s=SINAIS.filter(x=>x.ag===ag).sort((p,q)=>q.sc-p.sc)[0];CASO={ag,sig:s?s.id:null};ws(ag);}
  const troca=NAV.ag!==ag;
  NAV={...NAV,ag,tab:tab||(troca?'raiox':NAV.tab),fca:o.fca||null,ftab:o.ftab||'fca',conv:!!o.conv,step:o.step||(troca?'pauta':NAV.step),pre:false};
  go('agencia');
}
/* passo em que a conversa está */
function convPasso(ag){const w=ws(ag);return w.fca?'fca':w.processado?'revisao':(w.notasSalvas||w.audio)?'registro':'pauta';}
/* "Preparar conversa": registra a decisão sobre o sinal principal e abre a conversa no passo em que ela está */
function prepararConversa(ag,sig){
  ag=ag||CASO.ag;
  const s=sig?SIGX[sig]:SINAIS.filter(x=>x.ag===ag&&(!DEC[x.id]||DEC[x.id].tipo!=='descartar')).sort((p,q)=>q.sc-p.sc)[0];
  if(s&&(!DEC[s.id]||DEC[s.id].tipo==='descartar'))DEC[s.id]={tipo:'preparar',quando:'hoje 08:12'};
  CASO={ag,sig:s?s.id:null};ws(ag);
  NAV={...NAV,ag,tab:'conversas',conv:true,fca:null,step:convPasso(ag),pre:false};
  go('agencia');
}

/* =========================================================================
   CASO ATIVO · a agência aberta é o caso; cada agência tem a sua área de trabalho
   ========================================================================= */
/* decisões sobre os sinais: {tipo:'preparar'|'descartar', motivo, quando} · quem só observa não decide nada */
let DEC={'SIG-2841':{tipo:'preparar',quando:'hoje 07:58'}};
const DEC_LB={preparar:'Em preparação',descartar:'Descartado'};
let CASO={ag:'PEL',sig:'SIG-2841'};
const WS={};
/* área de trabalho do caso (por agência): tudo o que o regional edita fica aqui */
function ws(ag){
  ag=ag||CASO.ag;
  if(!WS[ag])WS[ag]={leitura:'',resumo:'',prepauta:null,pauta:null,notas:{},notaGeral:'',audio:null,notasSalvas:false,
    processado:false,itens:null,fca:null,publicado:false,coment:[],sintese:null};
  return WS[ag];
}
function casoAg(){return AGX[CASO.ag];}
function casoSig(){return SIGX[CASO.sig]||SINAIS.find(s=>s.ag===CASO.ag);}
/* a conversa não tem formato nem horário no protótipo (sem agenda): é sempre "conversa" */
function casoFmtLb(){return 'conversa';}
function setCaso(o){CASO={...CASO,...o};ws(CASO.ag);NAV.ag=CASO.ag;buildNav();}
/* o chip de caso saiu: a agência aberta já é o contexto */
function renderCaseChip(){const el=$('#caseChip');if(el)el.innerHTML='';}
/* áudio de exemplo com o nome do caso ativo (o conteúdo de exemplo é sempre a conversa de Pelotas Lobo) */
function audioExemplo(ag){
  ag=ag||CASO.ag;if(ag==='PEL')return {...AUDIO_EX};
  const slug=AGX[ag].n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  return {...AUDIO_EX,nome:`conversa_${slug}_18-05.m4a`};
}
/* na demonstração, a conversa gravada de exemplo é a de Pelotas Lobo */
const DEMO_OK = ag=>(ag||CASO.ag)==='PEL';
function usarCasoPelotas(){
  const st=NAV.step,cv=NAV.conv,tab=NAV.tab;
  if(!DEC['SIG-2841'])DEC['SIG-2841']={tipo:'preparar',quando:'hoje 08:12'};
  CASO={ag:'PEL',sig:'SIG-2841'};ws('PEL');
  NAV={...NAV,ag:'PEL',tab,conv:cv,step:cv?convPasso('PEL'):st,fca:null};
  go('agencia');toast('Caso de exemplo: Pelotas Lobo','📍');
}
function bannerDemo(texto){
  if(DEMO_OK())return '';
  return `<div class="demo-b">${ICON.eye}<div>${texto||'Na demonstração, a conversa gravada de exemplo é a de Pelotas Lobo. O fluxo é o mesmo para qualquer agência.'}</div><button class="btn btn-s" onclick="usarCasoPelotas()">Usar o caso de Pelotas Lobo</button></div>`;
}
/* cabeçalho das telas dentro da agência: só o título da parte e as ações (a agência já está no topo) */
function casoHead(titulo,acoes=''){
  return `<div class="sub-h"><h3>${titulo}</h3><div class="sp"></div>${acoes?`<div class="ph-a">${acoes}</div>`:''}</div>`;
}

/* =========================================================================
   FUNÇÕES DE IA DO FLUXO (simuladas) · cada uma é disparada por um botão
   ========================================================================= */
/* pré-pauta sugerida: blocos editáveis a partir da radiografia, do histórico de FCAs e da leitura do regional */
function sugerirPrePauta(ag){
  ag=ag||CASO.ag;const w=ws(ag);
  const base=ag==='PEL'?PAUTA.map(b=>({k:b.k,t:b.t,ctx:b.ctx,min:b.min,origem:b.origem,porque:PORQUE_BLOCO[b.k]||''}))
    :prePautaPadrao(ag).map(b=>({...b,porque:b.origem.startsWith('sinal')?b.origem:'estrutura padrão'}));
  if(!(w.leitura||'').trim()) base.forEach(b=>{if(b.k==='cobertura')b.porque='sinal SIG-2841: a queda se concentra em acompanhamento de vencimentos';});
  w.prepauta=base.map(b=>({id:uid('b'),...b}));
  const fa=FCAS_ABERTOS.filter(f=>f.ag===ag);
  w.resumo=RESUMO_IA[ag]||`${AGX[ag].n}: ${SINAIS.filter(s=>s.ag===ag).map(s=>s.t.toLowerCase()).join('; ')||'sem sinal ativo no momento'}. ${fa.length?`Em execução na unidade: ${fa.map(f=>`${f.id} (${f.tema.toLowerCase()}, ${f.exec}% executado, prazo ${f.prazo.slice(0,5)})`).join('; ')}.`:'Sem FCA em aberto na unidade.'}`;
  return w.prepauta;
}
/* gera as perguntas da pauta a partir da pré-pauta confirmada */
function gerarPauta(ag){
  ag=ag||CASO.ag;const w=ws(ag);
  if(!w.prepauta)sugerirPrePauta(ag);
  w.pauta=w.prepauta.map((b,i)=>{
    const orig=ag==='PEL'&&b.k?PAUTA.find(p=>p.k===b.k):null;
    const qs=(orig?orig.qs:perguntasPadrao(b)).map(q=>({id:uid('q'),tx:q,orig:q}));
    return {id:b.id,k:b.k,n:i+1,t:b.t,ctx:b.ctx,min:b.min,origem:b.origem,qs};
  });
  return w.pauta;
}
/* momento da transcrição em que a IA encaixa uma anotação do regional */
const ANCORA_BLOCO={abertura:'00:31',cobertura:'01:58',rdc:'03:09',credito:'05:18',produtos:'06:24',fechamento:'06:52'};
function ancoraDe(q,bloco){const ex=NOTAS_EX[q.orig];return (ex&&q.tx===q.orig)?ex.t:(bloco&&ANCORA_BLOCO[bloco.k])||'07:08';}
/* processa áudio + anotações: transcrição, encaixe das notas e candidatos a FCA */
function processarConversa(ag,force){
  ag=ag||CASO.ag;const w=ws(ag);
  w.processado=true;
  if(!w.itens||force) w.itens=DEMO_OK(ag)?COMPROMISSOS.map(c=>({...c,id:uid('c'),_orig:c.id})):[];
  return w;
}
/* lista das anotações do regional com a âncora na transcrição */
function notasAncoradas(ag){
  const w=ws(ag);const out=[];
  (w.pauta||[]).forEach(b=>b.qs.forEach(q=>{const tx=(w.notas[q.id]||'').trim();if(tx)out.push({tx,q:q.tx,bloco:b.t,t:ancoraDe(q,b)});}));
  if((w.notaGeral||'').trim())out.push({tx:w.notaGeral.trim(),q:null,bloco:'Anotação geral',t:NOTA_GERAL_EX.t});
  return out;
}
/* gera o FCA estruturado a partir dos itens aprovados na conversa registrada */
function gerarFCA(ag){
  ag=ag||CASO.ag;const w=ws(ag);
  const aprov=(w.itens||[]).filter(i=>i.tipo==='fca');
  const f=clone(FCA);
  f.acoes=f.acoes.map(a=>({...a,id:uid('a'),st:'aberta',prog:0,ev:[]}));
  /* itens criados pelo regional que não estavam na proposta viram ações novas */
  aprov.filter(i=>!i._orig).forEach(i=>f.acoes.push({id:uid('a'),a:i.tx,q:i.quem||'—',p:i.prazo||'—',meta:'a definir',st:'aberta',prog:0,ev:[]}));
  f.itens=aprov.map(i=>i.id);
  w.fca=f;w.sintese=clone(SINTESE);w.publicado=false;w.coment=[];
  return f;
}
function publicarFCA(ag){
  ag=ag||CASO.ag;const w=ws(ag);
  w.publicado=true;w.publicadoEm='18/05/2026 · 15:04';
  if(!w.coment||!w.coment.length) w.coment=COMENT_SEED.map(c=>({...c,id:uid('m')}));
  return w;
}

</script>
<script>
/* ---- 10_radar.js ---- */
/* =========================================================================
   1 · RADAR E PRIORIZAÇÃO (módulo rd) · v4
   Três coisas na mesma tela: a fila de sinais (oportunidades de novos FCAs,
   pelo score), a matriz visual e os FCAs em aberto da rede.
   Decisão por sinal: "Preparar conversa" (vira o caso ativo das etapas 2 a 5)
   ou "Descartar" com motivo. Quem só observa não precisa decidir nada.
   ========================================================================= */

/* ---------- constantes do módulo ---------- */
const rd_QD   = {agir:'Agir agora', planejar:'Planejar', rapido:'Resolver rápido', monitorar:'Monitorar'};
const rd_LIM  = {imp:6.5, urg:5.8};              /* limiares dos quadrantes (índices 0 a 10) */
const rd_DOM  = {x:[1,11], y:[3,11]};            /* faixa visível dos eixos da matriz */
const rd_AGORA = '08:12';
const rd_SIT  = {pend:'Sem decisão', prep:'Em preparação', desc:'Descartado'};
const rd_MOTIVOS = ['Sem materialidade','Já tratado em FCA','Dado inconsistente','Outro'];
const rd_PORTE_OPT = {pequena:'Até R$ 50 mi', media:'R$ 50 a 150 mi', grande:'Acima de R$ 150 mi'};
const rd_TEMA_CURTO = {captacao:'Captação', risco:'Inadimplência', credito:'Crédito', relacionamento:'Relacionamento', resultado:'Margem'};
const rd_LIMITE = 6;   /* linhas da fila visíveis antes de "Mostrar mais" */
const rd_ETAPA = {radiografia:'Radiografia', pauta:'Pauta', captura:'Captura', reuniao:'Conversa registrada', fca:'Diagnóstico e FCA'};

/* sugestão do copiloto por sinal: preparar conversa agora ou acompanhar o que já está em execução */
const rd_SUG = {
  'SIG-2841':{f:'preparar', tx:'queda concentrada em 3 cooperados PJ e carteira sem gerente: vale conversar já'},
  'SIG-2839':{f:'preparar', tx:'mesmo tema do FCA-2026-0143, que tem ação atrasada: revisar o plano na conversa em vez de abrir outro'},
  'SIG-2836':{f:'preparar', tx:'mesmo padrão de Pelotas Lobo em estágio inicial: tratar cedo'},
  'SIG-2834':{f:'preparar', tx:'o FCA-2026-0122 de onboarding vence em 2 dias com ação atrasada: tratar junto'},
  'SIG-2830':{f:'aguardar', tx:'o FCA-2026-0118 de seguros PF está em execução (35%): acompanhar antes de abrir frente nova'},
  'SIG-2828':{f:'preparar', tx:'janela sazonal em 3 semanas e o FCA-2026-0104 de hotelaria vence em 11 dias'},
  'SIG-2825':{f:'aguardar', tx:'o FCA-2026-0131 já trata margem PJ: cobrar a ação atrasada antes de agir de novo'},
  'SIG-2822':{f:'aguardar', tx:'sem marco crítico e o FCA-2026-0109 de folha PJ está em execução'},
  'SIG-2819':{f:'aguardar', tx:'o FCA-2026-0127 de cobrança PF está em 95%: esperar o efeito antes de agir'}
};
const rd_SUG_LB = {preparar:'preparar conversa', aguardar:'acompanhar o FCA em aberto'};

/* ---------- estado do módulo (sobrevive ao redraw) ---------- */
const rd_F0 = ()=>({q:'', per:'30', reg:'', ag:'', crit:[], quad:'', porte:'', tema:'', cart:'', sit:''});
let rd_F  = rd_F0();
let rd_ST = {mais:false, todos:false, desc:null, descMot:'Sem materialidade', descObs:'', fcf:'todos', flashSig:null};
let rd_PREP = null;   /* drawer "Preparar conversa" aberto */
let rd_qT = null;

/* ---------- helpers ---------- */
function rd_norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function rd_rs(v){
  if(v<1) return 'R$ '+nf(Math.round(v*1000))+' mil';
  const dec=Math.min(2,Math.max(1,((String(v).split('.')[1])||'').length));
  return 'R$ '+nf(v,dec)+' mi';
}
function rd_kmoney(v){return v>=1000?`R$ ${nf(v/1000,2)}<small>bi</small>`:`R$ ${nf(v,1)}<small>mi</small>`;}
function rd_scCol(st){return st==='critico'?'var(--red)':st==='atencao'?'var(--amber)':st==='oportunidade'?'var(--ia)':'var(--green-ink)';}
function rd_quad(s){return s.imp>=rd_LIM.imp?(s.urg>=rd_LIM.urg?'agir':'planejar'):(s.urg>=rd_LIM.urg?'rapido':'monitorar');}
function rd_sug(s){return rd_SUG[s.id]||{f:s.sc>=55?'preparar':'aguardar',tx:'com base no score e no histórico da agência'};}
function rd_isCaso(s){return !!CASO&&(CASO.sig===s.id||(!CASO.sig&&CASO.ag===s.ag));}
function rd_sit(s){
  if(rd_isCaso(s)) return 'prep';
  const d=DEC[s.id]; if(!d) return 'pend';
  return d.tipo==='descartar'?'desc':'prep';
}
/* a agência já tem trabalho de preparação feito (para "Retomar" em vez de "Iniciar") */
function rd_temProg(ag){const w=WS[ag];return !!(w&&(w.prepauta||w.pauta||w.notasSalvas||w.audio||w.processado||w.fca||(w.leitura||'').trim()));}
function rd_proxEtapa(ag){const w=ws(ag);return w.fca?'fca':w.processado?'reuniao':(w.notasSalvas||w.audio)?'captura':w.pauta?'pauta':'radiografia';}
function rd_late(n){return `<span class="rd-late">${n} ${n>1?'ações atrasadas':'ação atrasada'}</span>`;}
function rd_vcls(f){const d=diasAte(f.prazo);return d<0||d<=7?'hi':d<=15?'md':'';}

/* FCAs em aberto: os da rede + o de Pelotas Lobo, se foi publicado nesta sessão */
function rd_fcasRede(){
  const l=[...FCAS_ABERTOS];
  const w=WS.PEL;
  if(w&&w.publicado&&w.fca&&!l.some(f=>f.id===w.fca.id))
    l.unshift({id:w.fca.id, ag:'PEL', tema:'Recomposição da captação', aberto:'18/05/2026', prazo:w.fca.prazoFinal||'31/07/2026', exec:0, acoes:(w.fca.acoes||[]).length, atraso:0, novo:true});
  return l;
}
function rd_fcasDe(ag){return rd_fcasRede().filter(f=>f.ag===ag).sort((a,b)=>diasAte(a.prazo)-diasAte(b.prazo));}

/* ---------- filtros ---------- */
function rd_agOk(a){const f=rd_F;return (!f.reg||a.r===f.reg)&&(!f.ag||a.id===f.ag)&&(!f.porte||PORTE(a.cre)===f.porte);}
function rd_qOk(s){
  const q=rd_norm(rd_F.q).trim(); if(!q) return true;
  const a=AGX[s.ag], h=rd_norm([s.t,s.m,s.id,a.n,a.r,TEMAS[s.tema],s.carteira,a.ger].join(' '));
  return q.split(/\s+/).every(t=>h.includes(t));
}
function rd_sigOk(s,o={}){
  const f=rd_F;
  if(!rd_agOk(AGX[s.ag])) return false;
  if(s.periodo>+f.per) return false;
  if(!o.noCrit&&f.crit.length&&!f.crit.includes(s.st)) return false;
  if(f.tema&&s.tema!==f.tema) return false;
  if(f.cart&&s.carteira!==f.cart) return false;
  if(f.sit&&rd_sit(s)!==f.sit) return false;
  if(!o.noQuad&&f.quad&&rd_quad(s)!==f.quad) return false;
  return rd_qOk(s);
}
function rd_sigFoco(){const f=rd_F;return !!(f.q.trim()||f.per!=='30'||f.crit.length||f.tema||f.cart||f.sit||f.quad);}
function rd_nAtivos(){const f=rd_F;return [f.q.trim(),f.per!=='30',f.reg,f.ag,f.crit.length,f.quad,f.porte,f.tema,f.cart,f.sit].filter(Boolean).length;}
/* a fila é sempre pelo score; descartados vão para o fim */
function rd_lista(){
  return SINAIS.filter(s=>rd_sigOk(s)).sort((a,b)=>(rd_sit(a)==='desc')-(rd_sit(b)==='desc')||b.sc-a.sc);
}

/* ações dos filtros */
function rd_set(k,v){rd_F[k]=v;if(k==='reg'&&v&&rd_F.ag&&AGX[rd_F.ag].r!==v)rd_F.ag='';redraw();}
function rd_per(v){rd_F.per=v;redraw();}
function rd_cart(v){rd_F.cart=v;redraw();}
function rd_crit(k){const c=rd_F.crit;rd_F.crit=c.includes(k)?c.filter(x=>x!==k):[...c,k];redraw();}
function rd_setQuad(q){rd_F.quad=rd_F.quad===q?'':q;redraw();}
function rd_mais(){rd_ST.mais=!rd_ST.mais;redraw();}
function rd_todos(){rd_ST.todos=!rd_ST.todos;redraw();}
function rd_fcf(v){rd_ST.fcf=v;const el=document.getElementById('rd-fcb');if(el)el.innerHTML=rd_fcasBody();const h=document.getElementById('rd-fch');if(h)h.innerHTML=rd_fcasHead();}
function rd_limpar(){rd_F=rd_F0();redraw();toast('Filtros limpos','↺');}
/* busca: atualiza só as regiões dependentes, sem tirar o foco do campo */
function rd_q(v){rd_F.q=v;clearTimeout(rd_qT);rd_qT=setTimeout(rd_patch,140);}
function rd_patch(){
  const set=(id,h)=>{const el=document.getElementById(id);if(el)el.innerHTML=h;};
  set('rd-fc',rd_fcount()); set('rd-ql',rd_queue()); set('rd-qs',rd_qsub()); set('rd-chips',rd_chips());
  set('rd-mx',rd_mtxIn()); set('rd-mxl',rd_mtxLeg()); set('rd-hx',rd_grid()); set('rd-hs',rd_hsub());
}

/* =========================================================================
   RENDER
   ========================================================================= */

  const novos=SINAIS.filter(s=>s.novo).length, aguard=SINAIS.filter(s=>rd_sit(s)==='pend').length;
  const pi=Math.round(SCORE_REGRA.pesoImp*100), pu=Math.round(SCORE_REGRA.pesoUrg*100);
  return `
  <div class="rd-agent">

    <span class="it">varredura de hoje 06:00</span>
    <span class="it">${AGENCIAS.length} agências</span>

  </div>

  ${rd_fbar()}

  <div class="rd-kp" id="rd-kp">${rd_kpis()}</div>

  <div class="rd-main">
    <div class="rd-left">
      <div class="card rd-qc">
        <div class="card-h"><h3>Sinais e score</h3><span class="sub" id="rd-qs">${rd_qsub()}</span><div style="flex:1"></div>
          <span class="rd-srg"><span class="rd-sr">ordenados pelo score</span>${VALIDAR('Pesos a validar')}</span>
          ${INFO({oque:'Cada sinal é uma oportunidade de novo FCA. Se fizer sentido conversar com a agência, clique em Preparar conversa: o sinal vira o caso das etapas 2 a 5. Se não fizer, descarte com o motivo. Quem só quer observar não precisa fazer nada: o sinal fica na fila com o score atualizado a cada varredura.',como:`Score de 0 a 100 que combina o valor em jogo no desvio (peso ${pi}%) e o prazo até o próximo marco (peso ${pu}%).`,obs:'Os pesos são uma proposta a validar com a Unicred.'})}</div>
        <div class="rd-ql" id="rd-ql">${rd_queue()}</div>
      </div>
    </div>

    <div class="rd-side">
      <div class="card">
        <div class="card-h"><h3>Matriz de priorização</h3><span class="sub">impacto × urgência</span><div style="flex:1"></div>
          ${INFO({oque:'Cada ponto é um sinal da fila, posicionado pelo valor em jogo (impacto) e pelo prazo do próximo marco (urgência).',como:'Clique num quadrante para filtrar a fila; clique num ponto para abrir o sinal.'})}</div>
        <div class="card-b rd-mxb">
          <div class="rd-mx" id="rd-mx">${rd_mtxIn()}</div>
          <div class="rd-mxl" id="rd-mxl">${rd_mtxLeg()}</div>
        </div>
      </div>

      <div class="card rd-fcc" id="rd-fcas">
        <div class="card-h"><h3>FCAs em aberto</h3><span class="sub" id="rd-fch">${rd_fcasHead()}</span><div style="flex:1"></div>
          ${INFO({oque:'Planos de ação em execução na rede, do que vence antes ao que vence depois. Antes de abrir um caso novo, veja o que já está sendo tratado na agência.',como:'% executado = ações concluídas com evidência. Ação atrasada = prazo vencido sem evidência.'})}</div>
        <div class="rd-fct">${seg([['todos','Todos'],['vence','Vencem em 15 d'],['atraso','Com ação atrasada']],rd_ST.fcf,'rd_fcf')}</div>
        <div class="rd-fl" id="rd-fcb">${rd_fcasBody()}</div>
        <button type="button" class="rd-fcall" onclick="go('plano')">Ver o acompanhamento detalhado →</button>
      </div>
    </div>
  </div>

  ${acc('rdAgs',`<span class="rd-agh"><b>As ${AGENCIAS.length} agências, hoje</b><span class="rd-hsub" id="rd-hs">${rd_hsub()}</span></span>`,`<div class="rd-hx" id="rd-hx">${rd_grid()}</div>`,{cls:'rd-agc'})}

AFTER.radar=()=>{
  if(rd_ST.desc){const el=document.querySelector('#rdq-'+rd_ST.desc+' select');if(el)el.focus({preventScroll:true});}
  rd_ST.flashSig=null;
};
NAVBADGE.radar=()=>SINAIS.filter(s=>s.novo&&rd_sit(s)==='pend').length;

/* ---------- barra de filtros ---------- */
function rd_fbar(){
  const f=rd_F, nSec=[f.quad,f.porte,f.tema,f.cart,f.sit].filter(Boolean).length;
  const opt=(v,l,cur)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${l}</option>`;
  const agOpts=['Sul','Nordeste'].filter(r=>!f.reg||r===f.reg).map(r=>`<optgroup label="Região ${r}">${AGENCIAS.filter(a=>a.r===r).slice().sort((x,y)=>x.n.localeCompare(y.n,'pt-BR')).map(a=>opt(a.id,a.n,f.ag)).join('')}</optgroup>`).join('');
  const sel=(k,aria,opts,lb)=>`<label class="sel ${f[k]?'on':''}">${lb?`<span>${lb}</span>`:''}<select aria-label="${aria}" onchange="rd_set('${k}',this.value)">${opts}</select></label>`;
  return `<div class="fbar rd-fb">
    <div class="fbar-r">
      ${searchCtl('Buscar agência ou sinal','rd_q',f.q)}
      ${seg([['1','Hoje'],['7','7 dias'],['30','30 dias']],f.per,'rd_per')}
      ${sel('reg','Região',opt('','Todas as regiões',f.reg)+opt('Sul','Região Sul',f.reg)+opt('Nordeste','Região Nordeste',f.reg))}
      ${sel('ag','Agência',opt('','Todas as agências',f.ag)+agOpts)}
      <span class="vsep"></span>
      <div class="rd-chips" id="rd-chips" role="group" aria-label="Criticidade">${rd_chips()}</div>
      <button type="button" class="rd-more ${rd_ST.mais?'open':''} ${nSec?'on':''}" onclick="rd_mais()" aria-expanded="${rd_ST.mais}">${ICON.filter}<span>Mais filtros</span>${nSec?`<span class="n">${nSec}</span>`:''}${ICON.chev}</button>
      <span class="rd-fc" id="rd-fc">${rd_fcount()}</span>
    </div>
    ${rd_ST.mais?`<div class="fbar-r rd-fb2">
      ${sel('quad','Quadrante da matriz',opt('','Todos',f.quad)+Object.entries(rd_QD).map(([k,l])=>opt(k,l,f.quad)).join(''),'Quadrante')}
      ${sel('porte','Porte da carteira',opt('','Todos',f.porte)+Object.entries(rd_PORTE_OPT).map(([k,l])=>opt(k,l,f.porte)).join(''),'Porte da carteira')}
      ${sel('tema','Tema',opt('','Todos',f.tema)+Object.entries(rd_TEMA_CURTO).map(([k,l])=>opt(k,l,f.tema)).join(''),'Tema')}
      <span class="rd-fl-lb">Carteira</span>${seg([['','Todas'],['PF','PF'],['PJ','PJ'],['Rural','Rural']],f.cart,'rd_cart')}
      ${sel('sit','Situação',opt('','Todas',f.sit)+Object.entries(rd_SIT).map(([k,l])=>opt(k,l,f.sit)).join(''),'Situação')}
    </div>`:''}
  </div>`;
}
function rd_chips(){
  const critN=k=>SINAIS.filter(s=>s.st===k&&rd_sigOk(s,{noCrit:true})).length;
  return ['critico','atencao','oportunidade'].map(k=>fchip(`${STLB[k]}<span class="rd-cn">${critN(k)}</span>`,rd_F.crit.includes(k),`rd_crit('${k}')`,k)).join('');
}
function rd_fcount(){
  return rd_nAtivos()?`<button type="button" class="lnk" onclick="rd_limpar()">Limpar filtros</button>`:'';
}

/* ---------- KPIs da rede (recalculam para região / agência / porte) ---------- */
function rd_kpis(){
  const ags=AGENCIAS.filter(rd_agOk), all=ags.length===AGENCIAS.length;
  if(!ags.length) return `<div class="rd-kp-e">Nenhuma agência com esses filtros.</div>`;
  const sum=k=>ags.reduce((s,a)=>s+a[k],0), cap=sum('cap'), cre=sum('cre');
  const totCap=AGENCIAS.reduce((s,a)=>s+a.cap,0), totCre=AGENCIAS.reduce((s,a)=>s+a.cre,0);
  const cob=cap/cre, inad=ags.reduce((s,a)=>s+a.inad*a.cre,0)/cre;
  const abaixo=ags.filter(a=>a.cob<1.05).length, acima=ags.filter(a=>a.inad>3).length, crit=ags.filter(a=>a.st==='critico').length;
  const ids=ags.map(a=>a.id), fc=rd_fcasRede().filter(f=>ids.includes(f.ag)), atr=fc.filter(f=>f.atraso).length;
  const critOn=rd_F.crit.length===1&&rd_F.crit[0]==='critico';
  return `
    <div class="kpi"><div class="k">Captação total</div><div class="v">${rd_kmoney(cap)}</div><div class="d ${all?'dn':'fl'}">${all?'▼ 1,8% no trimestre':`${nf(cap/totCap*100,0)}% da rede`}</div></div>
    <div class="kpi"><div class="k">Carteira de crédito</div><div class="v">${rd_kmoney(cre)}</div><div class="d ${all?'up':'fl'}">${all?'▲ 4,7% no trimestre':`${nf(cre/totCre*100,0)}% da rede`}</div></div>
    <div class="kpi ${cob<1.05?'alert':''}"><div class="k">Captação ÷ crédito ${INFO('Captação total ÷ carteira de crédito das agências no filtro. Piso interno: 1,05.')}</div><div class="v">${nf(cob,2)}</div><div class="d ${abaixo?'dn':'up'}">piso 1,05 · ${abaixo} abaixo</div></div>
    <div class="kpi ${inad>2.5?'warn':''}"><div class="k">Inadimplência >90d ${INFO('Saldo vencido há mais de 90 dias ÷ carteira, ponderado pela carteira de cada agência. Teto interno: 3,00%.')}</div><div class="v">${nf(inad,2)}<small>%</small></div><div class="d ${acima?'dn':'fl'}">teto 3,00% · ${acima} acima</div></div>
    <button type="button" class="kpi ${crit?'alert':''} ${critOn?'on':''}" onclick="rd_crit('critico')" title="Filtrar sinais críticos"><div class="k">Em desvio crítico</div><div class="v">${crit}<small>/ ${ags.length}</small></div><div class="d ${all?'dn':'fl'}">${all?'▲ 1 vs. semana passada':'agências no filtro'}</div></button>
    <button type="button" class="kpi ${atr?'warn':''}" onclick="rd_irFcas()" title="Ver os FCAs em aberto"><div class="k">FCAs em aberto</div><div class="v">${fc.length}</div><div class="d ${atr?'dn':'fl'}">${atr} com ação atrasada</div></button>`;
}
function rd_irFcas(){const el=document.getElementById('rd-fcas');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('rd-flash');void el.offsetWidth;el.classList.add('rd-flash');}}

/* ---------- caso em preparação ---------- */
function rd_continuar(){go(rd_proxEtapa(CASO.ag));}
function rd_caseStrip(){
  const a=casoAg(); if(!a) return '';
  const s=casoSig(), w=ws(a.id), prox=rd_proxEtapa(a.id);
  const st=[['radiografia','2','Radiografia',!!w.prepauta],['pauta','3','Pauta',!!w.pauta],['captura','4a','Captura',!!(w.notasSalvas||w.audio)],['reuniao','4b','Conversa registrada',!!w.processado],['fca','5','FCA',!!w.fca]];
  return `<div class="rd-case">
    <div class="rd-case-k"><i></i><b>Caso em preparação</b><span>para trocar, prepare outro sinal da fila</span></div>
    <div class="rd-case-n"><b>${esc(a.n)}</b><span>${s?s.id+' · ':''}próxima etapa: ${rd_ETAPA[prox]}</span></div>
    <div class="rd-case-a"><button type="button" class="btn btn-p" onclick="rd_continuar()">Continuar preparação →</button></div>
    <div class="rd-case-st" role="group" aria-label="Etapas do caso">${st.map(([id,n,l,ok])=>`<button type="button" class="${ok?'ok':''}" onclick="go('${id}')"><i>${ok?'✓':n}</i>${l}</button>`).join('')}</div>
  </div>`;
}

/* ---------- fila de sinais ---------- */
function rd_qsub(){
  const l=SINAIS.filter(s=>rd_sigOk(s)), p=l.filter(s=>rd_sit(s)==='pend').length;
  return `<b>${l.length}</b> ${l.length===1?'sinal':'sinais'} · <b>${p}</b> sem decisão`;
}
function rd_queue(){
  const l=rd_lista();
  if(!l.length) return `<div style="padding:16px">${emptyState('🔎','Nenhum sinal com esses filtros','Ajuste os filtros ou limpe para ver a fila completa.',`<button class="btn btn-s" onclick="rd_limpar()">Limpar filtros</button>`)}</div>`;
  /* fila longa: mostra as primeiras linhas e o resto sob "Mostrar mais" (o caso ativo nunca fica escondido) */
  const corta=l.length>rd_LIMITE+1&&!rd_ST.todos;
  let vis=corta?l.slice(0,rd_LIMITE):l;
  if(corta){const c=l.find(s=>rd_isCaso(s));if(c&&!vis.includes(c))vis=[...vis.slice(0,rd_LIMITE-1),c];}
  const resto=l.filter(s=>!vis.includes(s)), rp=resto.filter(s=>rd_sit(s)==='pend').length;

/* ---------- matriz ---------- */
const rd_X=v=>Math.max(3,Math.min(97,(v-rd_DOM.x[0])/(rd_DOM.x[1]-rd_DOM.x[0])*100));
const rd_Y=v=>Math.max(4,Math.min(96,(v-rd_DOM.y[0])/(rd_DOM.y[1]-rd_DOM.y[0])*100));
/* afasta pontos sobrepostos sem tirá-los do quadrante (posição exata no title do ponto) */
function rd_pos(list){
  const W=320,H=210,R=28,lx=rd_X(rd_LIM.urg)*W/100,ly=rd_Y(rd_LIM.imp)*H/100;
  const p=list.map(s=>({s,x:rd_X(s.urg)*W/100,y:rd_Y(s.imp)*H/100,dir:s.urg>=rd_LIM.urg,cima:s.imp>=rd_LIM.imp}));
  for(let it=0;it<60;it++){
    let mv=false;
    for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){
      const a=p[i],b=p[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d>=R)continue;
      if(d<.01){dx=1;dy=1;d=Math.SQRT2;}
      const m=(R-d)/2+.3,ux=dx/d,uy=dy/d;a.x-=ux*m;a.y-=uy*m;b.x+=ux*m;b.y+=uy*m;mv=true;
    }
    p.forEach(o=>{
      o.x=Math.max(14,Math.min(W-14,o.dir?Math.max(lx+3,o.x):Math.min(lx-3,o.x)));
      o.y=Math.max(14,Math.min(H-14,o.cima?Math.max(ly+3,o.y):Math.min(ly-3,o.y)));
    });
    if(!mv)break;
  }
  return Object.fromEntries(p.map(o=>[o.s.id,{x:o.x/W*100,y:o.y/H*100}]));
}
function rd_mtxIn(){

  const l=SINAIS.filter(s=>rd_sigOk(s,{noQuad:true})).sort((a,b)=>a.sc-b.sc), ps=rd_pos(l);

  openDrawer(`Agência ${esc(a.n)}`,body,foot,{w:520,pre:`<span class="tag ${STTG[a.st]}">${STLB[a.st]}</span>`});
}

/* ---------- Preparar conversa: confirmar o caso e disparar o fluxo ---------- */
function rd_prep(ag,sig){
  const sigs=sig?[sig]:SINAIS.filter(s=>s.ag===ag&&rd_sit(s)!=='desc').map(s=>s.id);
  rd_PREP={ag,sigs};
  rd_prepDraw();
}
function rd_prepSig(id,on){if(!rd_PREP)return;const l=rd_PREP.sigs.filter(x=>x!==id);rd_PREP.sigs=on?[...l,id]:l;}
function rd_prepDraw(){
  const P=rd_PREP, a=AGX[P.ag], isC=CASO.ag===P.ag;
  const sigs=SINAIS.filter(s=>s.ag===P.ag&&(rd_sit(s)!=='desc'||P.sigs.includes(s.id)));
  const fc=rd_fcasDe(P.ag);
  const body=`
    <div class="rd-pa">
      <div class="nm"><b>${esc(a.n)}</b><span>Região ${a.r} · gerente ${esc(a.ger)} · ${a.coop.toLocaleString('pt-BR')} cooperados</span></div>
      <span class="tag ${STTG[a.st]}">${STLB[a.st]}</span>
    </div>
    <div class="dw-sec"><div class="dw-lb">FCAs em aberto na agência</div>${fc.length?`${fc.map(rd_fcaCard).join('')}<div class="rd-fcnote">${ICON.eye}<span>Veja se o tema já não está sendo tratado. Se estiver, a conversa pode revisar esse FCA em vez de abrir outro.</span></div>`:`<div class="rd-none">Nenhum FCA em aberto: o caso começa do zero.</div>`}</div>
    <div class="dw-sec"><div class="dw-lb">Sinais da conversa</div>
      ${sigs.length?sigs.map(s=>`<label class="rd-sigck"><input type="checkbox" ${P.sigs.includes(s.id)?'checked':''} onchange="rd_prepSig('${s.id}',this.checked)"><span class="tx"><b>${s.t}</b><span>${s.id} · score ${s.sc}</span></span><span class="tag ${STTG[s.st]}">${STLB[s.st]}</span></label>`).join('')
        :`<div class="rd-none">Sem sinal ativo: a conversa entra como conversa de rotina.</div>`}
    </div>
    <div class="dw-sec"><div class="dw-lb">O que acontece ao confirmar</div>
      <ul class="rd-what">
        <li>${ICON.play}<span>${esc(a.n)} vira o <b>caso ativo</b>: radiografia, pauta, captura, conversa registrada e FCA trabalham sobre ele.</span></li>
        <li>${ICON.check}<span>A decisão fica registrada no sinal (em preparação).</span></li>
        ${!isC?`<li>${ICON.clock}<span>O caso atual (${esc(casoAg().n)}) continua salvo, com o que já foi feito. Você retoma pela fila.</span></li>`:''}
      </ul></div>`;
  const foot=`<button class="btn" onclick="closeDrawer()">Cancelar</button>
    <button class="btn btn-p" onclick="rd_prepOk()">${isC?'Continuar preparação →':'Iniciar preparação →'}</button>`;
  openDrawer(`Preparar conversa · ${esc(a.n)}`,body,foot,{w:540,pre:`<span class="rd-dwic">${ICON.play}</span>`});
}
function rd_prepOk(){
  const P=rd_PREP; if(!P) return;
  const a=AGX[P.ag];
  P.sigs.forEach(s=>{if(!DEC[s]||DEC[s].tipo==='descartar')DEC[s]={tipo:'preparar',quando:'hoje '+rd_AGORA};});
  setCaso({ag:P.ag,sig:P.sigs[0]||null});
  rd_PREP=null; rd_ST.desc=null;
  closeDrawer();
  go(rd_proxEtapa(P.ag));
  toast(`${a.n} em preparação`,'📍');
}

</script>
<script>
/* ---- 12_geral.js ---- */
/* =========================================================================
   VISÃO GERAL DA REDE (v8)
   Compara as 18 agências pelo DRE × orçado, pelo ICM e pelos índices, com as
   faixas de cor da Unicred. Ao lado: matriz dos sinais e FCAs em aberto.
   Clicar numa agência abre a página dela (Raio X · FCAs · Conversas).
   ========================================================================= */
const gv_OT = [
  {k:'score', n:'Score',              h:'Score do copiloto'},
  {k:'res',   n:'Resultado × orçado', h:'Resultado líquido realizado ÷ orçado'},
  {k:'icm',   n:'ICM',                h:'Índice de cumprimento de metas'},
  {k:'efic',  n:'Eficiência',         h:'Quanto menor, melhor · ideal até 55%'},
  {k:'cob',   n:'Cobertura',          h:'Receita de P&S ÷ folha · ideal acima de 80%'},
  {k:'inad',  n:'Inadimplência',      h:'Atraso acima de 90 dias · teto 3,00%'}
];
let gv_ST = {ot:'score', fca:false};

function gv_val(a,k){
  const R=resumoAg(a.id);
  return {score:a.sc, res:R.resPct, icm:R.icm, efic:R.efic, cob:R.cob, inad:a.inad}[k];
}
/* situação de cada índice frente à referência: ok, atencao ou ruim */
function gv_stIdx(k,v){
  if(k==='efic') return v<=IDX_REF.efic?'ok':v<=IDX_REF.efic+4?'atencao':'ruim';
  if(k==='cob')  return v>=IDX_REF.cob?'ok':v>=IDX_REF.cob-10?'atencao':'ruim';
  if(k==='inad') return v<=2.7?'ok':v<=3?'atencao':'ruim';
  return '';
}
function gv_ok(a){
  const f=rd_F, q=rd_norm(f.q).trim();
  if(!rd_agOk(a)) return false;
  if(f.crit.length&&!f.crit.includes(a.st)) return false;
  if(gv_ST.fca&&!rd_fcasDe(a.id).length) return false;
  if(q&&!q.split(/\s+/).every(t=>rd_norm(a.n+' '+a.ger+' '+a.r).includes(t))) return false;
  return true;
}
function gv_lista(){
  const o=gv_OT.find(x=>x.k===gv_ST.ot), baixo=gv_ST.ot==='efic'||gv_ST.ot==='inad';
  const desc=gv_ST.ot==='score'||baixo;  /* score: maior primeiro; efic/inad: pior (maior) primeiro; o resto: pior (menor) primeiro */
  return AGENCIAS.filter(gv_ok).sort((a,b)=>{const va=gv_val(a,o.k),vb=gv_val(b,o.k);return desc?vb-va:va-vb;});
}

/* ---------- filtros ---------- */
function gv_fbar(){
  const f=rd_F;
  return `<div class="fbar gv-fb"><div class="fbar-r">
    <span id="gvSrch">${searchCtl('Buscar agência','gv_q',f.q)}</span>
    ${seg([['','Todas'],['Sul','Regional Sul'],['Nordeste','Regional Nordeste']],f.reg,'gv_reg')}
    <span class="sp"></span>
    <span class="fcount"><b id="gvN">${AGENCIAS.filter(gv_ok).length}</b> de ${AGENCIAS.length} agências</span>
  </div></div>`;
}
function gv_reg(v){rd_F.reg=v;redraw();}
let gv_qT=null;
function gv_q(v){rd_F.q=v;clearTimeout(gv_qT);gv_qT=setTimeout(()=>{
  const t=document.getElementById('gvTab');if(t)t.innerHTML=gv_tabela();
  const n=document.getElementById('gvN');if(n)n.textContent=AGENCIAS.filter(gv_ok).length;
  const m=document.getElementById('rd-mx');if(m)m.innerHTML=rd_mtxIn();
  const k=document.getElementById('gvKp');if(k)k.innerHTML=gv_kpis();
},140);}
function gv_limpar(){rd_F=rd_F0();gv_ST.fca=false;redraw();toast('Filtros limpos','↺');}
function gv_ot(k){gv_ST.ot=k;redraw();}

/* ---------- KPIs da rede ---------- */
function gv_kpis(){
  const ags=AGENCIAS.filter(gv_ok);
  if(!ags.length) return `<div class="rd-kp-e">Nenhuma agência com esses filtros.</div>`;
  const Rs=ags.map(a=>resumoAg(a.id)), o=Rs.reduce((s,r)=>s+r.resO,0), r=Rs.reduce((s,x)=>s+x.resR,0);
  const icm=Rs.reduce((s,x)=>s+x.icm,0)/Rs.length, ef=Rs.reduce((s,x)=>s+x.efic,0)/Rs.length, cb=Rs.reduce((s,x)=>s+x.cob,0)/Rs.length;
  const abaixo=Rs.filter(x=>x.resPct<100).length, efR=Rs.filter(x=>x.efic>IDX_REF.efic).length, cbR=Rs.filter(x=>x.cob<IDX_REF.cob).length;
  const pct=o?Math.round(r/o*100):0;
  return `
    <div class="kpi"><div class="k">Resultado × orçado ${INFO(`Resultado líquido realizado ÷ orçado no acumulado ${DRE_PER}, somando as agências do filtro.`)}</div><div class="v">${pct}<small>%</small></div><div class="d ${r<o?'dn':'up'}">${kSig(r-o)} · ${abaixo} abaixo</div></div>
    <div class="kpi"><div class="k">ICM médio ${INFO('Índice de cumprimento de metas: média do atingimento das metas comerciais, com o teto de cada produto.')}</div><div class="v">${nf(icm,1)}<small>%</small></div><div class="d fl"><span class="fx-sw ${faixa(icm)}"></span>${FAIXAS.find(x=>x[0]===faixa(icm))[1]}</div></div>
    <div class="kpi ${ef>IDX_REF.efic?'warn':''}"><div class="k">Eficiência média ${INFO('Despesas administrativas ÷ receita total, já descontado o custo de captação. Quanto menor, melhor. Ideal: até 55%.')}</div><div class="v">${nf(ef,1)}<small>%</small></div><div class="d ${efR?'dn':'fl'}">ideal até 55% · ${efR} acima</div></div>
    <div class="kpi ${cb<IDX_REF.cob?'warn':''}"><div class="k">Cobertura média ${INFO('Receita de produtos e serviços ÷ despesa com folha. Quanto maior, melhor. Ideal: acima de 80%.')}</div><div class="v">${nf(cb,0)}<small>%</small></div><div class="d ${cbR?'dn':'fl'}">ideal acima de 80% · ${cbR} abaixo</div></div>`;
}

/* ---------- tabela de comparação ---------- */
function gv_cel(a,k,R){
  if(k==='res'){const p=R.resPct;return `<td class="gv-c"><span class="fx ${faixa(p)}">${p}%</span><small class="${R.resGap<0?'dn':'up'}">${kSig(R.resGap)}</small></td>`;}
  if(k==='icm') return `<td class="gv-c"><span class="fx ${faixa(R.icm)}">${nf(R.icm,1)}%</span></td>`;
  if(k==='efic'||k==='cob'||k==='inad'){
    const v=k==='efic'?R.efic:k==='cob'?R.cob:a.inad, t=k==='efic'?nf(v,1)+'%':k==='cob'?nf(v,0)+'%':nf(v,2)+'%';
    return `<td class="gv-c"><span class="gv-ix ${gv_stIdx(k,v)}">${t}</span></td>`;
  }
  return '';
}
const gv_CURTO={credito:'Receita de crédito',centr:'Centralização',ps:'Produtos e serviços',captacao:'Despesa de captação',pdd:'Provisões',adm:'Despesas adm.'};
function gv_tabela(){
  const L=gv_lista();
  if(!L.length) return `<div class="rd-none" style="padding:16px">Nenhuma agência com esses filtros.</div>`;
  const ot=gv_ST.ot, H={score:'Score',res:'Resultado<br>× orçado',icm:'ICM',efic:'Eficiência',cob:'Cobertura',inad:'Inadim-<br>plência'};
  return `<table class="gv-t"><thead><tr>
      <th>Agência · maior desvio no DRE</th>${gv_OT.map(o=>`<th class="gv-so ${ot===o.k?'on':''}" title="Ordenar por ${esc(o.n.toLowerCase())} · ${esc(o.h)}" onclick="gv_ot('${o.k}')">${H[o.k]}</th>`).join('')}<th>FCAs</th>
    </tr></thead><tbody>
    ${L.map(a=>{
      const R=resumoAg(a.id), fc=rd_fcasDe(a.id), w=WS[a.id], prep=rd_temProg(a.id)&&!(w&&w.publicado);
      const pg=prep?'<em>conversa em preparação</em>':R.pior.g<0?`${gv_CURTO[R.pior.k]} <span class="dn">${kSig(R.pior.g)}</span>`:'sem linha abaixo do orçado';
      return `<tr onclick="abrirAgencia('${a.id}')" tabindex="0" onkeydown="if(event.key==='Enter')abrirAgencia('${a.id}')" title="${esc(a.n)} · Regional ${a.r} · gerente ${esc(a.ger)}">
        <td class="gv-ag"><span class="ag-d ${a.st}"></span><span class="gv-n"><b>${esc(a.n)}</b><small>${pg}</small></span></td>
        <td class="gv-c"><span class="gv-sc" style="--w:${a.sc}%;--c:${rd_scCol(a.st)}"><b class="mono">${a.sc}</b><i></i></span></td>
        ${['res','icm','efic','cob','inad'].map(k=>gv_cel(a,k,R)).join('')}
        <td class="gv-c">${fc.length?`<span class="gv-fc">${ICON.flag}${fc.length}${fc.some(f=>f.atraso)?'<i title="com ação atrasada"></i>':''}</span>`:'<span class="mut">—</span>'}</td>
      </tr>`;}).join('')}
    </tbody></table>`;
}

RENDER.geral=()=>`
  ${gv_fbar()}
  <div class="rd-kp gv-kp" id="gvKp">${gv_kpis()}</div>

  <div class="rd-main gv-main">
    <div class="rd-left">
      <div class="card">
        <div class="card-h"><h3>Agências</h3><span class="sub">DRE ${DRE_PER} · clique para abrir</span><div style="flex:1"></div>
          ${INFO({oque:'As agências lado a lado, pelos indicadores que a gestão regional usa: resultado contra o orçado, ICM, eficiência, cobertura e inadimplência.',como:`Resultado × orçado e ICM usam as faixas de cor da Unicred, sempre contra o orçado ou a meta. Eficiência, cobertura e inadimplência ficam em vermelho quando passam da referência. Clique no nome de uma coluna para ordenar.`})}</div>
        <div class="gv-tw" id="gvTab">${gv_tabela()}</div>
        <div class="gv-lg">${FAIXAS.map(([c,l])=>`<span><i class="fx-sw ${c}"></i>${l}</span>`).join('')}<span class="sp"></span><span><i class="gv-ix-sw ruim"></i>fora da referência</span></div>
      </div>
    </div>

    <div class="rd-side">
      <div class="card">
        <div class="card-h"><h3>Sinais</h3><span class="sub">impacto × urgência</span><div style="flex:1"></div>
          ${INFO({oque:'Cada ponto é um desvio que pode virar conversa e FCA.',como:'Posição pelo valor em jogo (impacto) e pelo prazo do próximo marco (urgência). Clique num ponto para ver o sinal.'})}</div>
        <div class="card-b rd-mxb">
          <div class="rd-mx" id="rd-mx">${rd_mtxIn()}</div>
        </div>
      </div>

      <div class="card rd-fcc" id="rd-fcas">
        <div class="card-h"><h3>FCAs em aberto</h3><span class="sub" id="rd-fch">${rd_fcasFil().filter(f=>gv_ok(AGX[f.ag])).length}</span><div style="flex:1"></div>
          ${INFO({oque:'Planos de ação em execução na rede, do que vence antes ao que vence depois.',como:'Clique para abrir os FCAs da agência.'})}</div>
        <div class="rd-fl" id="rd-fcb">${rd_fcasBody()}</div>
      </div>
    </div>
  </div>`;

/* ---------- o radar antigo agora leva para a página da agência ---------- */
function rd_agDw(id){abrirAgencia(id,'raiox');}
function rd_prep(ag,sig){closeDrawer();prepararConversa(ag,sig);}
function rd_iniciar(id){const s=SIGX[id];if(!s)return;closeDrawer();prepararConversa(s.ag,id);toast(`Conversa com ${AGX[s.ag].n} em preparação`,'📍');}
function rd_continuar(){prepararConversa(CASO.ag);}
function rd_fcasRede(){
  const l=[...FCAS_ABERTOS], w=WS.PEL;
  if(w&&w.publicado&&w.fca&&!l.some(f=>f.id===w.fca.id))
    l.unshift({id:w.fca.id, ag:'PEL', tema:'Recomposição da captação e da centralização financeira', aberto:'18/05/2026', prazo:w.fca.prazoFinal||'31/07/2026', exec:0, acoes:(w.fca.acoes||[]).length, atraso:0, novo:true});
  return l;
}
function rd_fcasBody(){
  const l=rd_fcasFil().filter(f=>gv_ok(AGX[f.ag]));
  if(!l.length) return `<div class="rd-none" style="padding:14px 16px">${rd_ST.fcf==='todos'?'Nenhum FCA em aberto nas agências do filtro.':'Nenhum FCA nessa situação.'}</div>`;
  return l.map(f=>{
    const pel=f.ag==='PEL'&&f.novo;
    return `<button type="button" class="rd-fr" onclick="abrirAgencia('${f.ag}','fcas'${pel?`,{fca:'${f.id}'}`:''})">
    <div class="l1"><span class="mono id">${f.id}</span><b>${esc(AGX[f.ag].n)}</b>${pel?'<span class="tag t-grn">publicado hoje</span>':''}<span class="rd-v ${rd_vcls(f)}">${prazoTxt(f.prazo)}</span></div>
    <div class="l2"><span class="tm">${esc(f.tema)}</span><span class="bar"><i style="width:${f.exec}%"></i></span><span class="pc mono">${f.exec}%</span></div>
    ${f.atraso?`<div class="l3">${rd_late(f.atraso)}</div>`:''}</button>`;
  }).join('');
}
function rd_fcf(v){rd_ST.fcf=v;const el=document.getElementById('rd-fcb');if(el)el.innerHTML=rd_fcasBody();}
function rd_set(k,v){rd_F[k]=v;redraw();}
function rd_decBox(s,sit,d){
  if(sit==='pend') return '';
  if(sit==='prep') return `<div class="rd-dbox"><span class="rd-stt prep">${ICON.play}<span>Conversa em preparação · passo: ${CONV_STEPS.find(x=>x.id===convPasso(s.ag)).n}</span></span><span>O que já foi feito fica salvo na página da agência.</span></div>`;
  return `<div class="rd-dbox"><span class="rd-stt desc">${ICON.x}<span>Descartado</span></span><span>Motivo: ${esc(d.motivo||'—')} · registrado ${d.quando||'hoje'} no histórico do sinal.</span></div>`;
}
/* abrir a agência não é decidir: o sinal só fica "em preparação" quando alguém clica em Preparar conversa */
function rd_isCaso(s){return false;}

</script>
<script>
/* ---- 13_agencia.js ---- */
/* =========================================================================
   PÁGINA DA AGÊNCIA (v8)
   Cada agência é um "projeto": Raio X (DRE × orçado, cruzamentos, metas e
   indicadores), FCAs (em aberto e encerrados; o FCA abre com acompanhamento e
   resultado) e Conversas (preparar, registrar, revisar compromissos e gerar o FCA).
   As telas antigas (pauta, captura, reunião, FCA, plano, resultado) são reaproveitadas
   dentro das abas.
   ========================================================================= */
const ag_tabSet=t=>{NAV={...NAV,tab:t,fca:null,conv:false,pre:false};redraw();};
function ag_convAbre(st){NAV={...NAV,tab:'conversas',conv:true,fca:null,step:st||convPasso(NAV.ag),pre:false};go('agencia');}
function ag_convFecha(){NAV={...NAV,conv:false,pre:false};go('agencia');}
function ag_step(st){NAV={...NAV,step:st,pre:false};go('agencia');}
function ag_fcaAbre(id,ft){NAV={...NAV,tab:'fcas',fca:id,ftab:ft||'fca',conv:false};go('agencia');}
function ag_fcaFecha(){NAV={...NAV,fca:null};go('agencia');}
function ag_ftab(t){NAV.ftab=t;go('agencia');}
function ag_prePauta(){NAV.pre=true;redraw();}
/* remove a navegação de rodapé das telas antigas (aqui a navegação é a das abas e dos passos) */
function ag_semNav(h){const i=h.lastIndexOf('<div class="stepnav">');return i>=0?h.slice(0,i):h;}
const pct1=v=>(v>0?'+':v<0?'−':'')+nf(Math.abs(v),1)+'%';

/* ---------- cabeçalho ---------- */
function ag_proximo(a,R,w){
  const sig=SINAIS.filter(s=>s.ag===a.id&&rd_sit(s)!=='desc').sort((p,q)=>q.sc-p.sc)[0];
  const dup=sig&&FCA_DO_SINAL[sig.id]?rd_fcasDe(a.id).find(f=>f.id===FCA_DO_SINAL[sig.id]):null;
  if(w.publicado&&w.fca) return {cls:'ok',ic:ICON.check,t:`<b>${w.fca.id} publicado.</b> ${w.fca.acoes.length} ações até ${w.fca.prazoFinal}.`,b:`<button class="btn btn-p btn-s" onclick="ag_fcaAbre('${w.fca.id}','acomp')">Acompanhar o FCA →</button>`};
  if(rd_temProg(a.id)){const st=CONV_STEPS.find(x=>x.id===convPasso(a.id));return {cls:'prep',ic:ICON.play,t:`<b>Conversa em preparação</b> · ${st.n}`,b:`<button class="btn btn-p btn-s" onclick="prepararConversa('${a.id}')">Continuar a conversa →</button>`};}
  if(dup) return {cls:'dup',ic:ICON.flag,t:`<b>Já existe FCA em aberto neste tema:</b> ${dup.id} · ${esc(dup.tema)}. Revise antes de abrir outro.`,b:`<button class="btn btn-s" onclick="pl_fcaDw('${dup.id}')">Ver o ${dup.id}</button><button class="btn btn-p btn-s" onclick="prepararConversa('${a.id}')">Preparar conversa</button>`};
  const g=R.pior;
  if(g.g<0) return {cls:'ia',ic:ICON.spark,t:`<b>${esc(g.n)}</b> ${kBRL(Math.abs(g.g))} ${g.s>0?'abaixo':'acima'} do orçado (${pct1(g.g/g.o*100*(g.s>0?1:-1))})`,b:`<button class="btn btn-p btn-s" onclick="prepararConversa('${a.id}')">Preparar conversa →</button>`};
  return {cls:'ok',ic:ICON.check,t:'<b>Sem desvio no DRE</b> · todas as linhas no orçado ou acima',b:`<button class="btn btn-s" onclick="prepararConversa('${a.id}')">Preparar conversa</button>`};
}
function ag_head(a,R,w){
  const px=ag_proximo(a,R,w), lista=!(NAV.tab==='conversas'&&NAV.conv)&&!(NAV.tab==='fcas'&&NAV.fca);
  return `<div class="ag-h">
    <div class="ag-ht">
      <div class="ph-k"><span>Regional ${a.r}</span><span>gerente ${esc(a.ger)}</span></div>
      <h2>${esc(a.n)}</h2>

/* cruzamentos gerados para as agências sem caso escrito à mão */
function ag_x(a,k,d){
  if(d.x&&d.x[k]) return d.x[k];
  const L=d.linhas[k], g=L.r/L.o-1, rd=(t)=>Math.sin(_seed(a.id+k+t)*1.9);
  const p=(v,dc=1)=>(v>0?'+':v<0?'−':'')+nf(Math.abs(v*100),dc)+'%', cor=v=>v>0.002?1:v<-0.002?-1:0;
  if(k==='credito'){const v=g*.55+rd('v')*.01, pr=g-v, tx=1.74*(1+pr);
    const t=[['Volume · carteira de crédito',`R$ ${nf(a.cre,1)} mi`,`R$ ${nf(a.cre/(1+v),1)} mi orçado`,p(v),cor(v)],['Preço · taxa média da carteira',`${nf(tx,2)}% a.m.`,'1,74% planejada',`${pr<0?'−':'+'}${nf(Math.abs(tx-1.74),2)} p.p.`,cor(pr)]];
    if(a.id==='CAM')t.push(['Rendas suspensas (operações em atraso)','R$ 96 mil','não reconhecidas no período','−R$ 96 mil',-1]);
    return {l:g<-.005?(Math.abs(pr)>Math.abs(v)?'O preço explica a maior parte do gap: a taxa média está abaixo do planejado.':'O volume explica a maior parte do gap: a carteira está abaixo do orçado.'):'Receita de crédito no orçado ou acima.',t};}
  if(k==='centr'){const cx=a.cap-a.cre;return {l:g<-.01?'Captação crescendo menos que o crédito reduz o caixa e a participação da agência na liquidez da cooperativa.':'Centralização perto do orçado.',
    t:[['Caixa da agência (captação − crédito)',`${cx<0?'−':''}R$ ${nf(Math.abs(cx),1)} mi`,'',g<0?'abaixo do orçado':'no orçado',cor(g)],['Participação na liquidez da cooperativa',`${nf(a.cap/AGENCIAS.reduce((s,x)=>s+x.cap,0)*100,1)}%`,'',p(g),cor(g)]]};}
  if(k==='ps'){const P=[['Consórcio',.12],['Adquirência (Unicred Pay)',.07],['Seguros',.22],['Cartões',.32],['Cobrança e tarifas',.27]];let ar=0,ao=0;
    const t=P.map(([n,sh],i)=>{let o=Math.round(L.o*sh),r=Math.round(o*(1+g+rd(n)*.05));if(i===P.length-1){o=L.o-ao;r=L.r-ar;}ao+=o;ar+=r;const dv=r/o-1;return [n,`R$ ${nf(r,0)} mil`,`R$ ${nf(o,0)} mil`,p(dv,0),cor(dv)];});
    return {l:g<-.01?'A receita de P&S está abaixo do orçado; os produtos em vermelho puxam para baixo.':g<0?'P&S perto do orçado; os produtos em vermelho estão abaixo.':'P&S no orçado ou acima.',t};}
  if(k==='captacao'){const v=-(g*.8+rd('c')*.01);return {l:g>.01?'O custo da captação subiu acima do planejado.':'Despesa de captação perto do orçado.',
    t:[['Volume · captação total',`R$ ${nf(a.cap,1)} mi`,`R$ ${nf(a.cap/(1+v),1)} mi orçado`,p(v),cor(v)],['Custo médio da captação',`${nf(98.6+g*40,1)}% do CDI`,'98,6% planejado',`${g>0?'+':'−'}${nf(Math.abs(g*40),1)} p.p.`,-cor(g)]]};}
  if(k==='pdd') return {l:g>.05?'Provisão acima do orçado: a inadimplência está subindo nas faixas de atraso.':'Provisão perto do orçado.',
    t:[['Atraso até 15 dias',`${nf(a.inad*.16,2)}%`,'','',0],['Atraso de 15 a 90 dias',`${nf(a.inad*.5,2)}%`,'',g>.05?'em alta':'estável',g>.05?-1:0],['Atraso acima de 90 dias',`${nf(a.inad,2)}%`,'teto 3,00%',a.inad>3?'acima do teto':'dentro do teto',a.inad>3?-1:0]]};
  const fo=Math.round(L.o*.72),fr=Math.round(L.r*.72);
  return {l:g>.015?'Despesa administrativa acima do orçado.':'Despesa perto do orçado. Não é aqui que está o problema.',
    t:[['Pessoal (folha)',`R$ ${nf(fr,0)} mil`,`R$ ${nf(fo,0)} mil`,p(fr/fo-1),-cor(fr/fo-1)],['Outras despesas administrativas',`R$ ${nf(L.r-fr,0)} mil`,`R$ ${nf(L.o-fo,0)} mil`,p((L.r-fr)/(L.o-fo)-1),-cor((L.r-fr)/(L.o-fo)-1)]]};
}
