<script>
/* ---- 62_fcapage.js ---- */
/* =========================================================================
   PÁGINA DO FCA PUBLICADO (v11)
   Uma tela só no lugar das abas FCA · Acompanhamento · Resultado.
   O conteúdo do FCA fica só para leitura depois de publicado; o que muda é a
   execução: marcar a ação como concluída e anexar a evidência.
   A data da situação (27/05 ou 29/06) é só da demonstração.
   ========================================================================= */
const fp_DATAS=[['acomp','27/05'],['res','29/06']];
function fp_res(){return NAV.ftab==='res';}
function fp_refD(){return dataBR(fp_res()?'29/06/2026':pl_REF);}

/* em 29/06 as cinco ações já estão concluídas */
const fp_FEITO29=[
  {feito:'20/05/2026'},
  {feito:'28/05/2026', ev:['5 de 5 contatos registrados']},
  {feito:'24/06/2026', ev:['carteira_redistribuida.pdf','R$ 1,4 mi renovados em 24/06']},
  {feito:'21/05/2026'},
  {feito:'05/06/2026', ev:['2 operações reprogramadas para julho e agosto']}
];
/* ações com meta numérica acompanhadas pelo dado da base (pela posição no FCA de exemplo):
   valor no dia e data em que a meta foi atingida; atingiu, conclui sozinha */
const fp_DADO={
  1:{fonte:'RDC renovados dos 5 maiores vencimentos', alvo:2.1, s:{acomp:[1.26,null], res:[2.1,'28/05/2026']}},
  2:{fonte:'RDC renovados na carteira da Juliana',    alvo:0.7, s:{acomp:[0.7,'26/05/2026'], res:[0.7,'26/05/2026']}},
  4:{fonte:'Operações de investimento reprogramadas', alvo:4.8, s:{acomp:[1.2,null], res:[4.8,'05/06/2026']}}
};
const fp_mi=v=>`R$ ${nf(v,v<10?2:1)} mi`;
function fp_acoes(){
  const t=fp_res()?'res':'acomp';
  return pl_acoes().map((a,i)=>{
    const o={...a,ev:[...a.ev]}, D=fp_DADO[a.k];
    if(D){
      const [v,dt]=D.s[t];
      o.dado={...D,v,dt}; o.prog=Math.min(100,Math.round(v/D.alvo*100));
      if(dt){o.prog=100;o.feito=dt;o.auto=true;const e=`Base de ${pl_d(dt)}: ${fp_mi(v)}`;if(!o.ev.includes(e))o.ev.push(e);}
      return o;
    }
    if(t==='res'){const x=fp_FEITO29[i]||{};o.prog=100;o.feito=a.feito||x.feito||'24/06/2026';(x.ev||[]).forEach(e=>{if(!o.ev.includes(e))o.ev.push(e);});}
    return o;
  });
}
function fp_status(a){
  if(a.prog>=100) return 'concluida';
  const ref=fp_refD(), d=diasAte(a.p,ref);
  if(d==null) return 'noprazo';
  if(d<0) return 'vencida';
  if(d===0) return 'hoje';
  const tot=diasAte(a.p,dataBR(a.aberta)), dec=diasDesde(a.aberta,ref);
  return tot>0&&a.prog/100<dec/tot-0.2?'risco':'noprazo';
}
function fp_situ(a){
  const st=fp_status(a), d=diasAte(a.p,fp_refD());
  if(st==='concluida') return `<span class="tag t-grn">${ICON.check}${a.auto?'pelo dado':'concluída'} ${a.feito?pl_d(a.feito):''}</span>`;
  if(st==='vencida') return `<span class="tag t-red">vencida há ${-d} d</span>`;
  if(st==='hoje') return '<span class="tag t-amb">vence hoje</span>';
  if(st==='risco') return `<span class="tag t-amb">em risco · ${d} d</span>`;
  return d==null?'<span class="mut">sem prazo</span>':`<span class="mut">vence em ${d} d</span>`;
}
/* status da causa no formato da Unicred, calculado pela execução das ações */
function fp_stCausa(acs){
  const sts=acs.map(fp_status);
  if(sts.some(s=>s==='vencida'||s==='risco'||s==='hoje')) return 'intensificar';
  if(acs.some(a=>a.prog>0)) return 'curso';
  return 'novo';
}
/* metas do FCA: valor na data do FCA, na data da situação e alvo */
function fp_metas(){
  const t=fp_res()?'res':'acomp', {M}=rxDe('PEL'), ce=Math.round(M.centr.r[RX_I.abr26]/M.centr.o[RX_I.abr26]*100);
  return [
    {n:'Captação (RDC + LCI + LF)', fca:212.4, hoje:{acomp:213.1,res:222.9}[t], alvo:216.6, f:v=>`R$ ${nf(v,1)} mi`, lb:'recuperar os R$ 4,2 mi'},
    {n:'Centralização financeira × orçado', fca:ce, hoje:{acomp:ce,res:95}[t], alvo:100, f:v=>nf(v,0)+'%', lb:t==='acomp'?'no mês · maio fecha no início de junho':'no mês · último fechamento: maio'},
    {n:'RDC a vencer sem tratativa', fca:2.81, hoje:{acomp:0.94,res:0}[t], alvo:0, f:v=>`R$ ${nf(v,2)} mi`, lb:'alvo zero'},
    {n:'Carteira de crédito', fca:219.1, hoje:{acomp:219.6,res:218.4}[t], alvo:219.1, f:v=>`R$ ${nf(v,1)} mi`, lb:'sem redução', manter:true}
  ];
}
/* saldos quinzenais de Pelotas Lobo antes e depois do FCA (18/05) */
const fp_Q={
  lb:['dez','','jan','','fev','','mar','','abr','','mai','15/05'],
  cap:[226.1,225.4,224.9,224.0,222.6,221.6,220.2,218.4,216.9,215.0,213.6,212.4],
  cre:[196.8,197.5,193.9,195.0,196.1,198.3,200.4,203.5,206.7,212.8,216.4,219.1],
  pos:{acomp:{lb:['27/05'],cap:[213.1],cre:[219.6]}, res:{lb:['01/06','15/06','29/06'],cap:[215.8,219.6,222.9],cre:[219.9,219.0,218.4]}}
};
/* raio X pós-FCA: os indicadores dos fatos do FCA, antes e depois da publicação */
function fp_raiox(){
  const t=fp_res()?'res':'acomp', P=fp_Q.pos[t], lb=[...fp_Q.lb,...P.lb], cap=[...fp_Q.cap,...P.cap], cre=[...fp_Q.cre,...P.cre];
  const cx=cap.map((v,i)=>+(v-cre[i]).toFixed(1)), mk=[{i:11.2,t:'FCA 18/05'}];
  const {M}=rxDe('PEL'), ms=['dez/25','jan/26','fev/26','mar/26','abr/26','mai/26'], i0=RX_I.dez25;
  const co=[...M.centr.o.slice(i0,RX_I.abr26+1),336], cr=[...M.centr.r.slice(i0,RX_I.abr26+1),t==='res'?319:null];
  const card=(h,sub,info,body)=>`<div class="card"><div class="card-h"><h3>${h}</h3><span class="sub">${sub}</span><div style="flex:1"></div>${INFO(info)}</div><div class="card-b">${body}</div></div>`;
  return [
    card('Captação × crédito','saldo quinzenal · R$ mi',{oque:'As duas curvas que formam o caixa da agência, antes e depois do FCA.',como:'Clique na legenda para esconder uma das curvas.'},
      xChart('fp-cc',[{n:'Captação (RDC + LCI + LF)',d:cap,c:'#018B6A',wd:2.2},{n:'Carteira de crédito',d:cre,c:'#003087'}],lb,{h:200,dec:0,marks:mk})),
    card('Caixa da agência','captação − crédito · R$ mi',{oque:'Quanto a agência captou e não emprestou. Negativo: empresta mais do que capta e perde participação na liquidez da cooperativa.'},
      xChart('fp-cx',[{n:'Caixa da agência',d:cx,c:'#A8322A',fill:1,wd:2.2}],lb,{h:200,dec:1,marks:mk,ref:0,refLb:'captação = crédito'})),
    card('Centralização financeira','mensal · orçado × realizado · R$ mil',{oque:'A linha do DRE que originou o FCA.',como:t==='acomp'?'O DRE fecha mês a mês: maio só fecha no início de junho.':'Maio já fechado: 95% do orçado.'},
      xChart('fp-ce',[{n:'Realizado',d:cr,c:'#018B6A',wd:2.2},{n:'Orçado',d:co,c:'#003087',dash:1}],ms,{h:200,dec:0,marks:[{i:4.6,t:'FCA 18/05'}]}))
  ];
}

/* ---------- tela ---------- */
function fp_page(a,w){
  SUB='fcapage';
  const f=w.fca; fc_causas(f);
  const ac=fp_acoes(), ref=fp_res()?'29/06':'27/05';
  const sts=ac.map(fp_status), nOk=sts.filter(s=>s==='concluida').length;
  const nv=sts.filter(s=>s==='vencida').length, nh=sts.filter(s=>s==='hoje').length, nr=sts.filter(s=>s==='risco').length, aten=nv+nh+nr;
  const exec=ac.length?Math.round(ac.reduce((s,x)=>s+Math.min(100,x.prog),0)/ac.length):0;
  const M=fp_metas(), m0=M[0], rxF=fp_raiox(), fim=f.prazoFinal||FCA.prazoFinal, dFim=diasAte(fim,fp_refD());
  const gaps=(f.gaps||FCA.gaps||[]).map(g=>`<span class="fp-gap"><b class="mono">${esc(g.v)}</b>${esc(g.l)}</span>`).join('');
  const acao=x=>{
    const i=f.acoes.indexOf(x), p=ac[i]; if(!p) return '';
    const st=sts[i], done=st==='concluida', D=p.dado;
    return `<div class="fp-a ${done?'done':''} ${st==='vencida'?'late':''} ${D?'auto':''}" onclick="fp_abrir(${i})" tabindex="0" onkeydown="if(event.key==='Enter')fp_abrir(${i})">
      ${D?`<span class="fp-auto ${done?'on':''}" title="Acompanhada pelo dado da base: conclui sozinha quando atingir a meta">${done?ICON.check:icon('chart',13)}</span>`
        :`<button type="button" class="pl-ck ${done?'on':''}" ${fp_res()?'disabled':''} onclick="fp_toggle(${i},event)" aria-label="${done?'Reabrir':'Concluir'} ação ${i+1}">${done?ICON.check:''}</button>`}
      <div class="fp-ab">
        <div class="fp-at"><span class="fp-n mono">${i+1}</span>${esc(p.a)}</div>
        <div class="fp-am"><span>meta: <b>${esc(p.meta)}</b></span>${D?`<span class="fp-dd">pelo dado: <b class="mono">${fp_mi(D.v)}</b> de ${fp_mi(D.alvo)}</span>`:''}${p.ev.map(e=>`<span class="evd">${ICON.file}${esc(e)}</span>`).join('')}${!done&&!fp_res()&&!D?`<button type="button" class="fp-ev" onclick="event.stopPropagation();fp_abrir(${i})">${ICON.upload}anexar evidência</button>`:''}</div>
      </div>
      <div class="fp-q">${esc(p.q)}</div>
      <div class="fp-p mono">${pl_d(p.p)}</div>
      <div class="fp-s">${fp_situ(p)}</div>
      <div class="fp-x"><span class="bar"><i style="width:${Math.min(100,p.prog)}%;background:${pl_cor(st)}"></i></span><span class="mono">${p.prog}%</span></div>
    </div>`;
  };
  const fatos=f.fatos.map((F,n)=>`<div class="fp-f">
      <div class="fp-fh"><span class="fc-fn mono">${n+1}</span><b>${esc(F.tema||'Fato '+(n+1))}</b></div>
      <p class="fp-fx">${esc(F.fato)}</p>
      ${F.causas.map(C=>{
        const acs=f.acoes.filter(x=>x.c===C.id), [stl,stc]=FCA_ST[fp_stCausa(acs.map(x=>ac[f.acoes.indexOf(x)]).filter(Boolean))];
        return `<div class="fp-c">
          <div class="fp-ch">
            <div><span class="fp-lb">Causa</span><p>${esc(C.causa||'a definir')}</p></div>
            <div><span class="fp-lb">O que melhora</span><p>${esc(C.melhora||'a definir')}</p></div>
            <span class="tag ${stc}" title="Calculado pela execução das ações">${stl}</span>
          </div>
          <div class="fp-al">${acs.map(acao).join('')||'<div class="mut fp-0">Nenhuma ação para esta causa.</div>'}</div>
        </div>`;}).join('')}
    </div>`).join('');
  const metas=M.map(m=>{
    const ok=m.manter?m.hoje>=m.alvo*0.99:null, pct=m.manter?0:Math.max(0,Math.min(100,Math.round((m.hoje-m.fca)/(m.alvo-m.fca)*100)));
    return `<div class="pl-mt">
      <div class="pl-mt-n"><b>${m.n}</b><span>${m.lb}</span></div>
      <div class="pl-mt-v mono"><span>${m.f(m.fca)}</span><i>→</i><b>${m.f(m.hoje)}</b></div>
      <div class="pl-mt-b">${m.manter?`<span class="tag ${ok?'t-grn':'t-red'}">${ok?'preservada':'abaixo'}</span>`:`<div class="bar"><i style="width:${pct}%"></i></div><span class="mono">${pct}%</span>`}</div>
    </div>`;}).join('');
  return `<div class="fp">
    <div class="fp-h">
      <div class="fp-ht">
        <button type="button" class="ag-back" onclick="ag_fcaFecha()">← FCAs de ${esc(a.n)}</button>
        <div class="fp-tt"><span class="mono fp-id">${f.id}</span><h3>Recomposição da captação e da centralização financeira</h3><span class="tag t-amb">Em execução</span></div>
        <div class="fp-mt"><span>${esc(f.horizonte||FCA.horizonte)}</span><span>publicado em 18/05</span><span>revisão: ${esc(f.revisao||FCA.revisao)}</span></div>
      </div>
      <div class="fp-ha">
        <div class="fp-dt"><span>Situação em</span>${seg(fp_DATAS,fp_res()?'res':'acomp','ag_ftab')}</div>
        <button class="btn btn-s" type="button" onclick="toast('${f.id} exportado em PDF','⤓')">${ICON.export}<span>Exportar</span></button>
      </div>
    </div>
    <div class="fp-obj"><div><span class="fp-lb">Objetivo</span><p>${esc(f.meta||FCA.meta)}</p></div><div class="fp-gaps"><span class="fp-lb">Por que este FCA</span>${gaps}</div></div>

    <div class="grid g4 fp-kp">
      <div class="kpi"><div class="k">Execução do plano</div><div class="v">${exec}<small>%</small></div><div class="d fl">${nOk} de ${ac.length} ações concluídas${ac.some(x=>x.auto)?` · ${ac.filter(x=>x.auto).length} pelo dado`:''}</div></div>
      <div class="kpi ${aten?'alert':''}"><div class="k">Pedem atenção</div><div class="v">${aten}</div><div class="d ${aten?'dn':'fl'}">${[nv&&`${nv} vencida${nv>1?'s':''}`,nh&&`${nh} vence hoje`,nr&&`${nr} em risco`].filter(Boolean).join(' · ')||'nenhuma ação fora do prazo'}</div></div>
      <div class="kpi"><div class="k">Captação em ${ref}</div><div class="v">${m0.f(m0.hoje)}</div><div class="d ${m0.hoje>m0.fca?'up':'fl'}">${m0.f(m0.fca)} no FCA · meta ${m0.f(m0.alvo)}${m0.hoje>=m0.alvo?' · atingida':''}</div></div>
      <div class="kpi"><div class="k">Prazo do FCA</div><div class="v">${dFim}<small>dias</small></div><div class="d fl">até ${pl_d(fim)}</div></div>
    </div>

    <div class="card fp-cb">
      <div class="card-h"><h3>O que foi combinado</h3><span class="sub">${fp_res()?'situação em 29/06':'marque a ação concluída e anexe a evidência'}</span><div style="flex:1"></div>
        ${INFO({oque:'O FCA publicado: cada fato com as suas causas e as ações que corrigem cada causa.',como:'O texto do FCA não muda depois de publicado. Muda a execução. Ação com meta numérica é acompanhada pelo dado da base e conclui sozinha quando atinge a meta; as outras são concluídas com uma evidência. O status da causa (Novo, Em curso, Intensificar) é calculado pela execução das ações.'})}</div>
      <div class="fp-hd"><span></span><span>Ação</span><span>Responsável</span><span>Prazo</span><span>Situação</span><span>Execução</span></div>
      <div class="card-b fp-body">${fatos}</div>
    </div>

    <div class="fp-sec"><h4>Raio X do FCA</h4><span>os indicadores que originaram o FCA, antes e depois de 18/05</span></div>
    <div class="grid fp-g2">
      ${rxF[0]}
      <div class="card">
        <div class="card-h"><h3>Metas do FCA</h3><span class="sub">no FCA → ${ref}</span></div>
        <div class="card-b" style="padding:4px 16px 10px">${metas}</div>
      </div>
    </div>
    <div class="grid fp-g2b">${rxF[1]}${rxF[2]}</div>
  </div>`;
}

/* ---------- execução: concluir e anexar evidência ---------- */
let fp_dw=null;
function fp_refresh(){
  if(SUB!=='fcapage') return;
  const v=$('#view'), sc=v.scrollTop, wr=v.querySelector('.wrap');
  if(wr) wr.innerHTML=RENDER.agencia();
  v.scrollTop=sc; buildNav();
  if(fp_dw!=null) fp_abrir(fp_dw);
}
function fp_toggle(i,ev){
  if(ev) ev.stopPropagation();
  if(fp_res()) return;
  const a=pl_acoes()[i]; if(!a) return;
  if(fp_DADO[a.k]){toast('Esta ação conclui sozinha quando o dado atingir a meta',icon('chart',14));return;}
  if(a.prog>=100){a.prog=a._ant!=null?a._ant:50;a.feito=null;toast('Ação reaberta','↺');}
